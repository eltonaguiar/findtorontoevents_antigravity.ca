policy_version: 1
description: 'Tiered policy for continue-on-error in .github/workflows. approved=intentional (T3, ignored).
  known_silent=existing baseline grandfathered in; the linter only FAILS on NEW silent maskers (coe>0
  with zero ::warning, not approved, not baselined). To clear a baseline entry: add a ::warning to the
  step (T2) or flip coe to false (T1), then remove it here.'
approved:
- workflow: db-freshness-guardian.yml
  reason: documented exit-code semantics (0=GREEN/1=YELLOW/2=RED); report uploaded regardless
- workflow: audit-dashboard.yml
  reason: reconcile/non-blocking steps intentionally soft; resolver + mysql-sync already flipped to continue-on-error:false
    (Kimi 2026-05-20)

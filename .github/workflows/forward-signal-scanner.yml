name: Forward Signal Scanner

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours (reduced from */30 to ease queue pressure)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests numpy pandas

      - name: Run forward signal scanner
        run: python incubator/backtest_team/forward_signal_scanner.py --full

      - name: Send freshpicks to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_FRESHPICKS: ${{ secrets.DISCORD_WEBHOOK_FRESHPICKS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_freshpicks_baby.py --send || echo "Freshpicks notification skipped"

      - name: Commit results
        run: |
          git config user.name "Forward Signal Scanner"
          git config user.email "scanner@bot"
          git add incubator/forward_test.db incubator/backtest_results/forward_signals.json
          git diff --cached --quiet || git commit -m "Forward scan $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          for i in 1 2 3; do
            bash .github/scripts/safe_push.sh && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done


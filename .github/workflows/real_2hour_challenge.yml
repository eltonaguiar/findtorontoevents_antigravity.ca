name: REAL 2-HOUR CHALLENGE - Live Market Data

on:
  # Manual trigger only
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-challenge:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 135 # 2 hours + buffer
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT || github.token }}
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        update-environment: false
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests
        
    - name: RUN REAL 2-HOUR CHALLENGE
      run: |
        echo ""
        echo " REAL 2-HOUR CHALLENGE - LIVE BINANCE DATA "
        echo ""
        echo " This uses ACTUAL market data from Binance "
        echo " No simulations - real price action, real signals "
        echo ""
        echo ""
        
        python real_2hour_challenge.py
        
    - name: Save Results
      env:
        TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
      run: |
        git config --local user.email "challenge@trading.ai"
        git config --local user.name " Real Challenge Bot"
        
        git add REAL_CHALLENGE_RESULTS.json || true
        git add REAL_CHALLENGE_FINAL.md || true
        
        git commit -m " REAL 2-Hour Challenge Complete - $(date -u '+%Y-%m-%d %H:%M UTC')

        Live competition with REAL Binance data:
        - News_Scalping
        - Momentum_EMA
        - VWAP_Scalping
        - Funding_Arbitrage

        See REAL_CHALLENGE_FINAL.md for actual winner! [skip ci]" || echo "No changes"
        
        bash .github/scripts/safe_push.sh


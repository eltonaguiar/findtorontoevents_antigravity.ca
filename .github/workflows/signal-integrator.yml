name: Signal Integrator - Isolated Source Aggregator

on:
  schedule:
    - cron: '15 * * * *'  # Every hour (was every 30 min, reduced to ease queue pressure)
  workflow_dispatch:

concurrency:
  group: signal-integrator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --quiet requests

      - name: Run Isolated Signal Integrator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python alpha_engine/isolated_signal_integrator.py

      - name: Commit integration report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A alpha_engine/data/integration_report.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: signal integrator report $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            bash .github/scripts/safe_push.sh
          fi


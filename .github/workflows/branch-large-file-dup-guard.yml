name: Branch Large File Duplicate Guard

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      min_size_mb:
        description: Minimum file size (MB) to track
        required: true
        default: '20'
      min_branch_copies:
        description: Minimum number of non-main branches containing same blob
        required: true
        default: '3'
      fail_on_findings:
        description: Fail the workflow when findings exist
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  detect-duplicate-large-blobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (partial clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Fetch branch refs
        run: |
          set -euo pipefail
          git fetch --prune --no-tags --depth=1 origin \
            '+refs/heads/*:refs/remotes/origin/*'

      - name: Scan for duplicated large blobs across non-main branches
        env:
          MIN_SIZE_MB: ${{ github.event.inputs.min_size_mb || '20' }}
          MIN_BRANCH_COPIES: ${{ github.event.inputs.min_branch_copies || '3' }}
          FAIL_ON_FINDINGS: ${{ github.event.inputs.fail_on_findings || 'true' }}
        run: |
          python - <<'PY'
          import collections
          import json
          import os
          import re
          import subprocess
          import sys

          min_size_mb = int(os.environ.get('MIN_SIZE_MB', '20'))
          min_branch_copies = int(os.environ.get('MIN_BRANCH_COPIES', '3'))
          fail_on_findings = os.environ.get('FAIL_ON_FINDINGS', 'true').lower() == 'true'
          min_size_bytes = min_size_mb * 1024 * 1024

          ref_lines = subprocess.check_output(
              ['git', 'for-each-ref', '--format=%(refname:short)', 'refs/remotes/origin'],
              text=True,
          ).splitlines()

          branches = []
          for ref in ref_lines:
              if ref in ('origin/HEAD', 'origin/main'):
                  continue
              if not ref.startswith('origin/'):
                  continue
              branches.append(ref[len('origin/'):])

          blob_map = {}
          path_map = collections.defaultdict(set)
          branch_count_by_blob = collections.defaultdict(set)

          line_re = re.compile(r'^\d+\s+\w+\s+([0-9a-f]{40})\s+(\d+)\t(.+)$')

          for branch in branches:
              ref = f'origin/{branch}'
              try:
                  out = subprocess.check_output(['git', 'ls-tree', '-r', '-l', ref], text=True)
              except subprocess.CalledProcessError:
                  continue

              for line in out.splitlines():
                  m = line_re.match(line)
                  if not m:
                      continue

                  blob_sha = m.group(1)
                  size = int(m.group(2))
                  path = m.group(3)

                  if size < min_size_bytes:
                      continue

                  blob_map[blob_sha] = size
                  branch_count_by_blob[blob_sha].add(branch)
                  if len(path_map[blob_sha]) < 5:
                      path_map[blob_sha].add(path)

          findings = []
          for blob_sha, size in blob_map.items():
              branch_set = branch_count_by_blob[blob_sha]
              if len(branch_set) < min_branch_copies:
                  continue

              findings.append(
                  {
                      'blob': blob_sha,
                      'size_bytes': size,
                      'size_mb': round(size / (1024 * 1024), 2),
                      'branch_count': len(branch_set),
                      'branches': sorted(branch_set),
                      'sample_paths': sorted(path_map[blob_sha]),
                  }
              )

          findings.sort(key=lambda x: (x['branch_count'], x['size_bytes']), reverse=True)

          summary_lines = []
          summary_lines.append('## Branch Large File Duplicate Guard')
          summary_lines.append('')
          summary_lines.append(f'- Non-main branches scanned: {len(branches)}')
          summary_lines.append(f'- Threshold size: {min_size_mb} MB')
          summary_lines.append(f'- Threshold branch copies: {min_branch_copies}')
          summary_lines.append(f'- Findings: {len(findings)}')
          summary_lines.append('')

          if findings:
              summary_lines.append('### Findings')
              summary_lines.append('')
              for f in findings[:50]:
                  summary_lines.append(
                      f"- Blob `{f['blob']}` | {f['size_mb']} MB | branches={f['branch_count']}"
                  )
                  summary_lines.append(f"  - branches: {', '.join(f['branches'][:10])}")
                  if len(f['branches']) > 10:
                      summary_lines.append(f"  - branches_more: +{len(f['branches']) - 10}")
                  if f['sample_paths']:
                      summary_lines.append(f"  - sample_paths: {', '.join(f['sample_paths'])}")
          else:
              summary_lines.append('No repeated large-blob patterns found across non-main branches.')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('\n'.join(summary_lines) + '\n')

          with open('branch_large_blob_findings.json', 'w', encoding='utf-8') as fh:
              json.dump(findings, fh, indent=2)

          if findings and fail_on_findings:
              print('Detected duplicated large blobs across multiple non-main branches.', file=sys.stderr)
              sys.exit(1)

          print('Duplicate large blob scan completed.')
          PY

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-large-blob-findings
          path: branch_large_blob_findings.json

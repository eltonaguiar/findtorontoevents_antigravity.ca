name: Forex Smart Picks Scanner

on:
  schedule:
    # Every 4 hours on weekdays (Mon-Fri) during market hours
    - cron: '0 2,6,10,14,18,22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forex-smart-picks:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run Forex Smart Picks Scanner
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: '1'
        run: python alpha_engine/forex_smart_picks.py

      - name: Commit updated picks
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/active_picks.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Forex Smart Picks: $(date -u '+%Y-%m-%d %H:%M') UTC scan [skip ci]"
          git remote set-url origin "https://x-access-token:${TOKEN_FOR_PUSH}@github.com/${GITHUB_REPOSITORY}.git"
          bash .github/scripts/safe_push.sh


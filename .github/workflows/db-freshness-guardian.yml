name: DB Freshness Guardian

# Monitors staleness of live_picks, resolver_outputs, and backtest_trades.
# RED = CI failure (>6h live / >12h resolver / >1w backtests).
# YELLOW = warning (>2h live / >4h resolver / >48h backtests).
#
# Push trigger: tools/db_freshness_check.py (see AGENTS.md push-trigger registry)
# Secrets required: DB_PASS_STOCKS (or MYSQL_PASSWORD), DB_PASS_BACKTESTS (or MYSQL_PASSWORD)

on:
  schedule:
    - cron: '12 * * * *'   # every hour
  push:
    branches: [main]
    paths:
      - tools/db_freshness_check.py
      - .github/workflows/db-freshness-guardian.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  freshness-check:
    name: DB Freshness Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pymysql

      - name: Run DB freshness check
        env:
          # Canonical new names (preferred by db_env.py resolution chain)
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_PASS_BACKTESTS: ${{ secrets.DB_PASS_BACKTESTS || secrets.MYSQL_PASSWORD }}
          # Legacy names kept for backward compat
          DB_STOCKS_PASSWORD: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD || secrets.DB_STOCKS_PASSWORD }}
          DB_BACKTESTS_PASSWORD: ${{ secrets.DB_PASS_BACKTESTS || secrets.MYSQL_PASSWORD || secrets.DB_BACKTESTS_PASSWORD }}
          DB_FRESHNESS_OUTPUT: audit_dashboard/data/db_freshness.json
        run: python tools/db_freshness_check.py
        # Exit 0=GREEN, 1=YELLOW (warning, not failure), 2=RED.
        #
        # 2026-11-26: this step previously set continue-on-error: true, which
        # discarded all three codes and made the hourly guard permanently green --
        # a genuinely stale trading DB produced a passing checkmark. The
        # continue-on-error is retained here ONLY so the report is always written
        # and uploaded; the pass/fail decision is owned by the verdict step below,
        # which distinguishes real staleness from a missing-credentials
        # environment failure.
        continue-on-error: true

      - name: Freshness verdict (RED fails, absent DB secrets do not)
        if: always()
        # Re-derives the verdict from the report the check always writes:
        #   GREEN                                  -> pass
        #   YELLOW                                 -> pass, annotated as degraded
        #   RED where every RED is a connect error -> pass, annotated as unverified
        #   RED with real staleness data           -> FAIL the job
        # --strict makes a missing/corrupt report a failure, so a silently broken
        # guard cannot pass. See tools/db_freshness_verdict.py.
        run: python tools/db_freshness_verdict.py audit_dashboard/data/db_freshness.json --strict

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: db-freshness-report
          path: audit_dashboard/data/db_freshness.json
          retention-days: 7

name: Daily Per-Class Scrutiny Engine

on:
  schedule:
    - cron: '30 7 * * *'   # 07:30 UTC daily — after resolver runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scrutiny-engine
  cancel-in-progress: true

jobs:
  scrutiny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: pip install -q pymysql scipy numpy
      - name: Run scrutiny engine
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
          DB_USER: ${{ secrets.DB_USER_STOCKS }}
        run: |
          python3 tools/per_class_scrutiny_engine.py --min-n 20
          # If auto_shutdown_monitor also available, run it for Sharpe monitor
          python3 tools/auto_shutdown_monitor.py 2>&1 | tee /tmp/shutdown_report.txt || true
          if grep -q "HARD_STOP" /tmp/shutdown_report.txt 2>/dev/null; then
            echo "::warning::HARD_STOP sources detected — review auto-shutdown monitor output"
          fi
      # FINDING_OVERALL#12: one-sided WON-only/LOST-only resolution tripwire.
      # Read-only SELECT against at_raw_picks; NON-BLOCKING — emits a warning
      # annotation when strategies with >=20 resolved rows are 100% one-sided
      # (artifact grew 41->57 strategies while unguarded, 2026-05-31..06-11).
      - name: One-sided resolution check (FINDING#12, non-blocking)
        continue-on-error: true
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
          DB_USER: ${{ secrets.DB_USER_STOCKS }}
        run: |
          if ! python3 tools/check_one_sided_resolution.py --min-resolved 20; then
            echo "::warning::FINDING#12 one-sided WON-only/LOST-only resolution detected in at_raw_picks — see step log for the strategy list"
          fi
      # 2026-06-11: Forward entry-condition measurement lane — the velocity
      # principle's confirmation engine. Read-only DB -> JSON sidecar. Accrues
      # per-condition forward n for the MONEY-READY MASTER LOOP checkpoints
      # (crypto_rsi5070_us, luxalgo_short, equity_lowvol, forex_trend_aligned).
      # NON-BLOCKING — measurement only; never a sizing input until n>=100
      # per condition + re-passes R1/R2/R3.
      - name: Stamp entry conditions (forward lane)
        continue-on-error: true
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
          DB_USER: ${{ secrets.DB_USER_STOCKS }}
        run: |
          python3 tools/stamp_entry_conditions.py --limit 4000
      - name: Commit scrutiny JSON (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REPORT=$(ls reports/per_class_scrutiny_*.json 2>/dev/null | sort | tail -1)
          FORWARD_LANE=audit_dashboard/data/entry_conditions_forward.json
          git add "$FORWARD_LANE" 2>/dev/null || true
          if [ -n "$REPORT" ]; then
            git add "$REPORT"
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(audit): daily scrutiny engine report [skip ci]"
            bash .github/scripts/safe_push.sh || echo "::warning::push failed (concurrent commit)"
          fi

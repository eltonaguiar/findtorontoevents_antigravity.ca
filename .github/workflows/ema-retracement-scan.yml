name: EMA Retracement Mean Reversion Scanner

on:
  schedule:
    # Every hour  EMA retracement signals on 4H timeframe (was every 30 min)
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'scan'
        type: choice
        options:
          - scan
          - backtest

concurrency:
  group: ema-retracement-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ema-retracement:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install numpy

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
          else
            echo "mode=scan" >> "$GITHUB_OUTPUT"
          fi

      - name: Run backtest
        if: steps.mode.outputs.mode == 'backtest'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python alpha_engine/ema_retracement_strategy.py

      - name: Run live scan (import check)
        if: steps.mode.outputs.mode == 'scan'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          from alpha_engine.ema_retracement_strategy import EMA_RETRACEMENT_STRATEGIES
          print(f'EMA Retracement strategies loaded: {len(EMA_RETRACEMENT_STRATEGIES)}')
          for name in EMA_RETRACEMENT_STRATEGIES:
              print(f'  - {name}')
          print('Strategy module OK - signals generated via main alpha-engine-live workflow')
          "

      - name: Commit backtest results
        if: steps.mode.outputs.mode == 'backtest'
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f alpha_engine/data/ema_retracement_backtest.json ]; then
            git add alpha_engine/data/ema_retracement_backtest.json
            git diff --staged --quiet || git commit -m "EMA Retracement backtest results $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
            bash .github/scripts/safe_push.sh
          fi


name: Sustained Gainer Confluence Scanner

on:
  schedule:
    - cron: '16,46 * * * *'  # Every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sustained-gainer-scan
  cancel-in-progress: false

jobs:
  sustained-gainer:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            alpha_engine
            shared
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install yfinance pandas numpy scikit-learn joblib requests

      - name: Run Sustained Gainer Confluence Scanner
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "============================================"
          echo "  SUSTAINED GAINER CONFLUENCE SCANNER"
          echo "  5-condition entry + trailing stop exits"
          echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          python alpha_engine/sustained_gainer_algorithm.py

      - name: Commit state updates
        id: commit_state
        run: |
          echo "created=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/sustained_gainer_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "Sustained Gainer scan: $(date -u '+%Y-%m-%d %H:%M') [AUTO] [skip ci]"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push with retry
        if: steps.commit_state.outputs.created == 'true'
        run: bash .github/scripts/safe_push.sh


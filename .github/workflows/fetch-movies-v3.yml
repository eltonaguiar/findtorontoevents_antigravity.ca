name: Refresh Movies Databases (50webs + GoDaddy)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Content type'
        type: choice
        default: both
        options: [both, movie, tv]
      pages:
        description: 'TMDB pages per type (1-10)'
        default: '3'
      mode:
        description: 'TMDB content mode'
        type: choice
        default: trending
        options: [trending, upcoming, popular, top_rated, now_playing, on_the_air]

permissions:
  contents: read

concurrency:
  group: movies-database-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh and verify both database hosts
        env:
          MS2_SYNC_KEY: ${{ secrets.MS2_SYNC_KEY }}
          CONTENT_TYPE: ${{ inputs.type || 'both' }}
          PAGES: ${{ inputs.pages || '3' }}
          MODE: ${{ inputs.mode || 'trending' }}
        run: python3 tools/run_movies_refresh.py --type "$CONTENT_TYPE" --pages "$PAGES" --mode "$MODE"

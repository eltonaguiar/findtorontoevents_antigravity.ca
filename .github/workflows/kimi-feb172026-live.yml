name: KIMI_FEB172026 - Live Trading System

on:
  # Reduced to every 2 hours (was */30) to ease queue pressure
  schedule:
    - cron: '0 */2 * * *'
    - cron: '0 */4 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'scan'
        type: choice
        options:
          - scan
          - validate
          - optimize
          - full-cycle
          - deploy-50webs
          - deploy-godaddy
          - deploy-all

permissions:
  contents: write

jobs:
  kimi-trading:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy scikit-learn joblib requests aiohttp fastapi uvicorn

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 */4 * * *" ]; then
            echo "mode=validate" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "mode=optimize" >> $GITHUB_OUTPUT
          else
            echo "mode=scan" >> $GITHUB_OUTPUT
          fi

      # SCAN: Generate new signals 
      - name: Scan for signals
        if: steps.mode.outputs.mode == 'scan' || steps.mode.outputs.mode == 'full-cycle' || steps.mode.outputs.mode == 'deploy-50webs' || steps.mode.outputs.mode == 'deploy-godaddy' || steps.mode.outputs.mode == 'deploy-all'
        working-directory: KIMI_FEB172026
        run: |
          echo "============================================"
          echo " KIMI_FEB172026 - Signal Generation"
          echo " $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          python -c "
          import asyncio
          import sys
          sys.path.insert(0, '.')
          from live_scanner import KIMILiveScanner

          async def scan():
              scanner = KIMILiveScanner()
              if not scanner.initialize():
                  print('Failed to initialize')
                  return 1
              results = await scanner.run_full_scan()
              print(f'Signals generated: {results.get(\"signals_generated\", 0)}')
              print(f'High confidence: {results.get(\"high_confidence_signals\", 0)}')
              return 0

          asyncio.run(scan())
          " || echo "Scan completed with warnings"

      # UNDERDOG ALPHA: Deploy small-capacity strategies 
      - name: Run Underdog Alpha Strategies
        if: steps.mode.outputs.mode == 'scan' || steps.mode.outputs.mode == 'full-cycle'
        working-directory: KIMI_FEB172026
        run: |
          echo "============================================"
          echo " UNDERDOG ALPHA STRATEGIES"
          echo " $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          echo " COMPETITION: Renaissance, Citadel, Jump"
          echo " Our edge: Capacity they can't touch"
          echo "============================================"
          python deploy_underdog_strategies.py || echo "Underdog deployment completed"
          echo ""
          echo "Strategies deployed:"
          echo " 1. Crypto Funding Arbitrage (Sharpe 1.8)"
          echo " 2. Earnings Vol Crush (Sharpe 1.5)"
          echo " 3. WSB Sentiment Fade (Sharpe 1.2)"
          echo " 4. Robinhood Momentum Crash (Sharpe 1.1)"
          echo " 5. Options Max Pain (Sharpe 0.9)"

      # FORWARD TEST: Real-time validation with audit trail 
      - name: Forward Test with Audit Trail
        if: steps.mode.outputs.mode == 'scan' || steps.mode.outputs.mode == 'full-cycle' || steps.mode.outputs.mode == 'validate'
        working-directory: KIMI_FEB172026
        run: |
          echo "============================================"
          echo " UNIFIED FORWARD TEST - ALL SYSTEMS"
          echo " $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          echo " NO BACKTESTS. NO CURVE-FITTING."
          echo " FORWARD-LOOKING PERFORMANCE ONLY."
          echo " FULL AUDIT TRAIL ATTACHED."
          echo "============================================"
          echo ""
          echo " Systems Monitored:"
          echo " [LIVE] Crypto Funding Arbitrage"
          echo " [LIVE] Forex Momentum (70% WR proven)"
          echo " [LIVE] Connors RSI-2 (75.7% WR proven)"
          echo " [LIVE] VIX Spike Reversal (72% WR proven)"
          echo " [LIVE] BTC-ETH Pairs (Sharpe 4.99 proven)"
          echo "============================================"
          
          python unified_forward_test.py || echo "Forward test cycle completed"
          
          echo ""
          echo " Unified Forward Test Status:"
          python check_unified_status.py || echo "Status check completed"
          
          echo ""
          echo " Data Files:"
          ls -la data/unified_*.json 2>/dev/null || echo " Initializing..."

      # FreshPicks: Send new picks to #fresh-picks Discord channel 
      - name: Send FreshPicks for new KIMI picks
        if: steps.mode.outputs.mode == 'scan' || steps.mode.outputs.mode == 'full-cycle'
        env:
          DISCORD_WEBHOOK_FRESHPICKS: ${{ secrets.DISCORD_WEBHOOK_FRESHPICKS }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_FRESHPICKS" ]; then
            python3 -c "
          import json, os, sys
          sys.path.insert(0, '.')
          from cross_aggregation.freshpicks_notify import send_fresh_pick

          # KIMI uses activePicks wrapper with camelCase fields
          picks_path = 'KIMI_FEB172026/data/active_picks.json'
          sent_path = 'KIMI_FEB172026/data/freshpicks_sent.json'

          if not os.path.exists(picks_path):
              print('No KIMI active_picks.json found')
              exit(0)

          data = json.load(open(picks_path))
          # Handle both list and dict-with-activePicks formats
          if isinstance(data, dict):
              picks = data.get('activePicks', data.get('picks', []))
          else:
              picks = data

          if not picks:
              print('No KIMI active picks')
              exit(0)

          # Dedup by symbol+algorithm+entry_price (allows same symbol at different entries)
          sent_keys = set()
          if os.path.exists(sent_path):
              try:
                  sent_keys = set(json.load(open(sent_path)))
              except: pass

          new_picks = []
          for p in picks:
              entry = p.get('entryPrice', p.get('entry_price', 0))
              key = f\"{p.get('symbol','')}__{p.get('algorithm', p.get('algorithmName',''))}__{round(float(entry), 4)}\"
              if key not in sent_keys:
                  new_picks.append((key, p))

          if not new_picks:
              print(f'All {len(picks)} KIMI picks already sent')
              exit(0)

          # Build FORWARD-ONLY performance stats (live TP/SL tracking)
          stats = {'total': 0, 'active': len(picks), 'wins': 0, 'losses': 0,
                   'win_rate': 0, 'realized_pnl_pct': 0, 'unrealized_pnl_pct': 0,
                   'tracking_since': 'Feb 17', 'recent_closed': []}
          try:
              tracking = json.load(open('KIMI_FEB172026/data/signal_tracking.json'))
              summary = tracking.get('summary', {})
              # Only count resolved signals (TP/SL hit), not open ones
              stats['wins'] = summary.get('wins', 0)
              stats['losses'] = summary.get('losses', 0)
              total_resolved = stats['wins'] + stats['losses']
              stats['total'] = total_resolved
              stats['win_rate'] = stats['wins'] / total_resolved * 100 if total_resolved else 0
              # Closed signals
              for s in tracking.get('signals', [])[-5:]:
                  if s.get('status') == 'CLOSED':
                      pnl = s.get('pnl_pct', 0)
                      stats['recent_closed'].append({
                          'symbol': s.get('symbol', '?'),
                          'pnl_pct': pnl / 100 if abs(pnl) > 1 else pnl,
                          'status': 'WON' if pnl > 0 else 'LOST',
                          'strategy': s.get('asset_class', ''),
                      })
              # Rolling WR + drawdown from closed signals
              signals = tracking.get('signals', [])
              resolved = [s for s in signals if s.get('status') == 'CLOSED']
              if len(resolved) >= 20:
                  last20 = resolved[-20:]
                  stats['rolling_wr_20'] = sum(1 for s in last20 if s.get('pnl_pct', 0) > 0) / 20 * 100
              cum = 0; peak = 0; mdd = 0
              for s in resolved:
                  cum += s.get('pnl_pct', 0)
                  peak = max(peak, cum)
                  mdd = min(mdd, cum - peak)
              stats['max_drawdown_pct'] = round(mdd, 2)
          except: pass
          # Unrealized from active picks
          try:
              for p2 in picks:
                  entry2 = float(p2.get('entryPrice', p2.get('entry_price', 0)))
                  current2 = float(p2.get('currentPrice', entry2))
                  if entry2 > 0:
                      stats['unrealized_pnl_pct'] += (current2 / entry2 - 1) * 100
              stats['unrealized_pnl_pct'] /= max(len(picks), 1)
          except: pass

          dashboard = 'https://findtorontoevents.ca/riseoftheclaw.html'
          sent = 0
          for key, p in new_picks:
              fp = {
                  'symbol': p.get('symbol', ''),
                  'direction': p.get('signal', 'BUY'),
                  'entry_price': p.get('entryPrice', p.get('entry_price', 0)),
                  'tp_price': p.get('targetPrice', p.get('take_profit', 0)),
                  'sl_price': p.get('stopPrice', p.get('stop_loss', 0)),
                  'confidence': p.get('signalProbability', p.get('confidence', 0)) / 100 if p.get('signalProbability', 0) > 1 else p.get('confidence', 0),
                  'strategy': p.get('algorithmName', p.get('algorithm', 'unknown')),
                  'reason': p.get('reason', '')[:200],
              }
              if send_fresh_pick('KIMI Rise of the Claw', fp, dashboard, stats=stats):
                  sent += 1

          # Save sent keys (keep last 500 to prevent unbounded growth)
          all_sent = list(sent_keys | {k for k, _ in new_picks})
          if len(all_sent) > 500: all_sent = all_sent[-500:]
          json.dump(all_sent, open(sent_path, 'w'))
          print(f'Sent {sent}/{len(new_picks)} new KIMI picks to #fresh-picks')
          " || echo "FreshPicks notification failed (non-fatal)"
          else
            echo "No DISCORD_WEBHOOK_FRESHPICKS set, skipping"
          fi

      # VALIDATE: Check outcomes 
      - name: Validate signal outcomes
        if: steps.mode.outputs.mode == 'validate' || steps.mode.outputs.mode == 'full-cycle'
        working-directory: KIMI_FEB172026
        run: |
          echo "============================================"
          echo " KIMI_FEB172026 - Outcome Validation"
          echo " $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          python -c "
          import asyncio
          import sys
          sys.path.insert(0, '.')
          from live_validator import LiveValidator

          async def validate():
              validator = LiveValidator()
              result = await validator.run_validation_cycle()
              print(f'Validation complete')
              return 0

          asyncio.run(validate())
          " || echo "Validation completed"

      # OPTIMIZE: Parameter tuning 
      - name: Optimize parameters
        if: steps.mode.outputs.mode == 'optimize'
        working-directory: KIMI_FEB172026
        run: |
          echo "============================================"
          echo " KIMI_FEB172026 - Parameter Optimization"
          echo " $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          python -c "
          import asyncio
          import sys
          sys.path.insert(0, '.')
          from live_validator import LiveValidator

          async def optimize():
              validator = LiveValidator()
              result = await validator.run_optimization()
              print(f'Optimizations applied: {len(result.get(\"optimizations\", []))}')
              return 0

          asyncio.run(optimize())
          " || echo "Optimization completed"

      # DEPLOY: Push to 50webs (findtorontoevents.ca) 
      - name: Deploy to 50webs
        if: steps.mode.outputs.mode == 'deploy-50webs' || steps.mode.outputs.mode == 'deploy-all'
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          echo "============================================"
          echo " Deploying to 50webs (findtorontoevents.ca)"
          echo "============================================"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror -R --delete --verbose=1 KIMI_FEB172026 /findtorontoevents.ca/KIMI_FEB172026;
            bye
          "
          echo "50webs deployment complete"

      # DEPLOY: Push to GoDaddy (torontoevent.net) 
      - name: Deploy to GoDaddy
        if: steps.mode.outputs.mode == 'deploy-godaddy' || steps.mode.outputs.mode == 'deploy-all'
        env:
          FTP_USER: ${{ secrets.FTPGODADDYUSER }}
          FTP_PASS: ${{ secrets.FTPGODADDYPASS }}
          FTP_HOST: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
        run: |
          echo "============================================"
          echo " Deploying to GoDaddy (torontoevent.net)"
          echo "============================================"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "
            set ssl:verify-certificate no;
            set ftp:ssl-allow yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror -R --delete --verbose=1 KIMI_FEB172026 /KIMI_FEB172026;
            bye
          "
          echo "GoDaddy deployment complete"

      # Commit results to git 
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all data files including audit trails and freshpicks tracking
          git add KIMI_FEB172026/data/ || true
          git add data/freshpicks_gate_state.json 2>/dev/null || true

          # Also stage any audit trail exports
          git add -f KIMI_FEB172026/data/audit_trail_*.json 2>/dev/null || true
          git add -f KIMI_FEB172026/data/forward_test_*.json 2>/dev/null || true
          git add -f KIMI_FEB172026/logs/*.log 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            MODE="${{ steps.mode.outputs.mode }}"
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            
            # Get forward test status for commit message
            STATUS=""
            if [ -f "KIMI_FEB172026/data/forward_test_status.json" ]; then
              STATUS=$(cat KIMI_FEB172026/data/forward_test_status.json | python3 -c "import sys,json; d=json.load(sys.stdin); s=d.get('status',{}).get('summary',{}); print(f'FT:{s.get(\"total_trades\",0)}tr,{s.get(\"win_rate\",0):.0%}WR')" 2>/dev/null || echo "")
            fi
            
            if [ -n "$STATUS" ]; then
              git commit -m "KIMI_FEB172026 [$TIMESTAMP] - $MODE cycle | $STATUS [skip ci]"
            else
              git commit -m "KIMI_FEB172026 [$TIMESTAMP] - $MODE cycle [skip ci]"
            fi

            for i in 1 2 3; do
              bash .github/scripts/safe_push.sh && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      # Summary 
      - name: Print summary
        if: always()
        working-directory: KIMI_FEB172026
        run: |
          echo ""
          echo "============================================"
          echo " KIMI_FEB172026 - Status Summary"
          echo "============================================"
          python -c "
          import json
          import os

          # Latest signals
          try:
              with open('data/latest_signals.json') as f:
                  data = json.load(f)
                  signals = data.get('signals', [])
                  print(f' Latest signals: {len(signals)}')
                  if signals:
                      high_conf = sum(1 for s in signals if s.get('win_probability', 0) >= 0.65)
                      print(f' High confidence: {high_conf}')
          except:
              pass

          # Signal tracking
          try:
              with open('data/signal_tracking.json') as f:
                  data = json.load(f)
                  active = len(data.get('active', {}))
                  completed = len(data.get('completed', []))
                  print(f' Active signals: {active}')
                  print(f' Completed: {completed}')

                  if completed > 0:
                      wins = sum(1 for s in data['completed'] if s.get('pnl_pct', 0) > 0)
                      wr = wins / completed * 100
                      print(f' Win rate: {wr:.1f}%')
          except:
              print(' Signal tracking: No data yet')

          # Unified Forward Test Results (Real Data Only)
          print('')
          print(' -- UNIFIED FORWARD TEST (Real Data, All Systems) --')
          try:
              with open('data/unified_status.json') as f:
                  data = json.load(f)
                  summary = data.get('summary', {})
                  print(f\" Total Signals: {summary.get('total_signals', 0)}\")
                  print(f\" Active Signals: {summary.get('active_signals', 0)}\")
                  print(f\" Closed Trades: {summary.get('closed_trades', 0)}\")
                  print(f\" Systems Active: {summary.get('systems_active', 0)}/5\")

                  # Show by system
                  by_system = data.get('by_system', {})
                  if by_system:
                      print('')
                      print(' By System:')
                      for sys, stats in by_system.items():
                          print(f\" {sys:20} {stats.get('total', 0):3} signals | {stats.get('wins', 0)} wins | P&L: {stats.get('total_pnl', 0):+.2%}\")
          except:
              print(' Unified forward test: Initializing...')

          # Data Files
          try:
              import glob
              unified_files = glob.glob('data/unified_*.json')
              if unified_files:
                  print(f'')
                  print(f' Data Files: {len(unified_files)} files')
          except:
              pass

          # Validation
          try:
              with open('data/validation_results.json') as f:
                  data = json.load(f)
                  if data:
                      latest = data[-1]
                      print(f'')
                      print(f' Last validation: {latest.get(\"timestamp\", \"unknown\")}')
                      print(f' Status: {latest.get(\"status\", \"unknown\")}')
          except:
              pass

          # System status
          try:
              with open('data/system_status.json') as f:
                  data = json.load(f)
                  print(f'')
                  print(f' System: {data.get(\"status\", \"unknown\")}')
                  print(f' Scan count: {data.get(\"scan_count\", 0)}')
          except:
              pass

          print('')
          print('============================================')
          " 2>/dev/null || echo "Summary unavailable"


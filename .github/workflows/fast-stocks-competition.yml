# ============================================================================
# KEEP DISABLED. Assessed 2026-11-26 (hermes-desktop) after an automated pass
# wrongly re-enabled it and called a manual run a "success".
#
# Reason it is off: blocked 2026-03-16 as a proven loser (-98% PnL, 12% WR,
# PF 0.26 over 50 trades).
#
# Reason not to port its logic to audit2/audit3: it is a 562-line scanner over
# 20 S&P 500 names implementing four signals that already exist across this
# repo - bollinger appears in 451 python files, mean_reversion in 328,
# ml_ranker in 26, breakout_momentum in 10. Its one distinctive signal,
# short_term_reversal (a 30-line down-days/RSI score), is already implemented
# in alpha_engine/strategies/mean_reversion_strategies.py. Nothing to gain.
#
# Its only output was STOCKS/competition/fast_forward_picks.json, consumed by
# audit_trail/dashboard_generator.py -> dashboard_payload.json, published by
# audit-dashboard.yml. Neither the runner script nor that JSON exists on main
# any more; both survive in findtorontoevents_antigravity.ca-archive-2026-05-23
# at commit 6beb451. Nothing downstream depends on them.
#
# Do not re-enable, do not "fix the missing script", do not dispatch it.
# ============================================================================
name: Fast Stocks Competition  High Frequency Scanner

on:
  # DISABLED 2026-03-16: System blocked (12% WR, 50 trades, -98% PnL, PF 0.26). Proven loser.
  # schedule:
  #   - cron: "0 14,18 * * 1-5"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh of all signals'
        required: false
        default: false
        type: boolean

concurrency:
  group: fast-stocks-competition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          update-environment: true
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Fast Stocks Competition
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || false }}
        run: |
          echo "=== Fast Stocks Competition Scanner ==="
          if [ "$FORCE_REFRESH" = "true" ]; then
            echo " FORCE REFRESH ENABLED  Clearing existing picks"
            rm -f STOCKS/competition/fast_forward_picks.json
          fi
          cd STOCKS/competition || exit
          # run_fast_competition.py is not present in the repo (never committed;
          # the schedule is disabled as a proven loser, 2026-03-16). Running it
          # unconditionally fails with Errno 2 on every dispatch, so skip it
          # gracefully when absent instead of hard-failing the job.
          if [ -f run_fast_competition.py ]; then
            python run_fast_competition.py
          else
            echo "run_fast_competition.py not present in repo - nothing to run"
          fi

      - name: Regenerate Dashboard
        # REMOVED 2026-03-26: publisher unification  only audit-dashboard.yml publishes
        # dashboard_payload.json. This step is intentionally disabled.
        run: echo "Dashboard regeneration skipped  handled by audit-dashboard.yml"

      - name: Commit and push changes
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            echo "Committing fast stocks competition results..."
            git add STOCKS/competition/fast_forward_picks.json
            # NOTE: dashboard_payload.json intentionally NOT committed here.
            # audit-dashboard.yml is the sole publisher (publisher unification 2026-03-26).
            git commit -m " Fast Stocks Competition: $(date +'%Y-%m-%d %H:%M') [AUTO] [skip ci]"
            for i in 1 2 3; do
              bash .github/scripts/safe_push.sh && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi


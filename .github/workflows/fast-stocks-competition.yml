name: Fast Stocks Competition  High Frequency Scanner

on:
  # DISABLED 2026-03-16: System blocked (12% WR, 50 trades, -98% PnL, PF 0.26). Proven loser.
  # schedule:
  #   - cron: "0 14,18 * * 1-5"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh of all signals'
        required: false
        default: false
        type: boolean

concurrency:
  group: fast-stocks-competition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Fast Stocks Competition
        env:
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || false }}
        run: |
          echo "=== Fast Stocks Competition Scanner ==="
          if [ "$FORCE_REFRESH" = "true" ]; then
            echo " FORCE REFRESH ENABLED  Clearing existing picks"
            rm -f STOCKS/competition/fast_forward_picks.json
          fi
          cd STOCKS/competition || exit
          python run_fast_competition.py

      - name: Regenerate Dashboard
        # REMOVED 2026-03-26: publisher unification  only audit-dashboard.yml publishes
        # dashboard_payload.json. This step is intentionally disabled.
        run: echo "Dashboard regeneration skipped  handled by audit-dashboard.yml"

      - name: Commit and push changes
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            echo "Committing fast stocks competition results..."
            git add STOCKS/competition/fast_forward_picks.json
            # NOTE: dashboard_payload.json intentionally NOT committed here.
            # audit-dashboard.yml is the sole publisher (publisher unification 2026-03-26).
            git commit -m " Fast Stocks Competition: $(date +'%Y-%m-%d %H:%M') [AUTO] [skip ci]"
            for i in 1 2 3; do
              bash .github/scripts/safe_push.sh && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi


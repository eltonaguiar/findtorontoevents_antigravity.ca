name: MySQL Trading Picks Sync

on:
  schedule:
    # Every hour at minute 30
    - cron: '54 * * * *'
  workflow_dispatch:

concurrency:
  group: mysql-trading-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install pymysql

      - name: Sync trading picks to MySQL
        env:
          DB_HOST: mysql.50webs.com
          DB_PORT: '3306'
          DB_USER: ejaguiar1_stocks
          # Prefer MYSQL_PASSWORD (used elsewhere), then AUDIT_DB_PASS; no plaintext fallback
          DB_PASS: ${{ secrets.MYSQL_PASSWORD || secrets.AUDIT_DB_PASS }}
          AUDIT_DB_PASS: ${{ secrets.MYSQL_PASSWORD || secrets.AUDIT_DB_PASS }}
          DB_NAME: ejaguiar1_stocks
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          success=false
          for i in 1 2 3; do
            # Invoke as a module so the repo root is on sys.path — the script's
            # top-level `from alpha_engine import config` (line 22) crashed with
            # ModuleNotFoundError when run by path (its own sys.path.insert is at
            # ~line 590, far too late). Failed all 3 retries every run (~66x).
            if python -m alpha_engine.mysql_trading_sync; then
              success=true
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep $((i * 10))
          done
          if [ "$success" != "true" ]; then
            echo "DB sync failed after 3 attempts" >&2
            exit 1
          fi

      - name: Standardize legacy statuses in trading_picks
        # tools/standardize_statuses.py has existed for a long time but NO workflow ever invoked
        # it, so legacy statuses (WIN/WON/LOST/LOSS/CLOSED_*/SIGNAL/FLAT/STALE) accumulated while
        # the hourly sync kept writing canonical ones. That is why the db-freshness gate reported
        # `status_standardization` RED on every run even though the sync itself logs
        # "3797 upserted, 0 errors": the writer was fixed, the stored rows were never cleaned.
        # The script is dry-run unless --apply, and the mapping is idempotent.
        # Runs even if the sync failed, because cleanup does not depend on new rows landing.
        if: always()
        env:
          # The script reads DB_PASS_STOCKS specifically (not DB_PASS, which the sync step uses).
          DB_PASS_STOCKS: ${{ secrets.MYSQL_PASSWORD || secrets.AUDIT_DB_PASS }}
        run: |
          python tools/standardize_statuses.py --apply

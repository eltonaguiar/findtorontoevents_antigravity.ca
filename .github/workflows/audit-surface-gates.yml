name: audit-surface-gates
on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (best effort)
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests || true
      - name: Unit tests (parity + pod + tribunal)
        run: python -m pytest tests/test_assert_surface_parity.py tests/test_pod_emission_audit.py tests/test_audit3_tribunal.py tests/test_verification_tools.py -q
      - name: Gate schema validator
        run: python tools/validate_gate_reports.py
      - name: Two-hurdle kill (informational until P1-5 data)
        run: python tools/two_hurdle_kill.py || true
      - name: Benchmark coverage (warn-only until P1-5 fixed)
        run: python tools/verify_forward_benchmark.py || true
      - name: TOM forward harness (refuses pre-freeze)
        run: python tools/tom_forward_clock.py
      - name: Closed-picks outcome basis (REALISED vs WOULD_HIT)
        run: python tools/label_closed_pick_outcomes.py
      - name: Incubator admissibility gate (expect 0 admissible)
        run: python tools/validate_incubator.py || true
      - name: Cross-system consensus (coverage panel)
        run: python tools/cross_system_consensus.py
      - name: LB ranking (operator basis)
        run: python tools/rank_on_lower_bound.py || true
      - name: Rebuild rankings + show pass/fail
        run: |
          python tools/build_asset_class_rankings.py --ticket-usd 25000 --out reports/asset_class_rankings.json || true
          python -c "import json;d=json.load(open('reports/asset_class_rankings.json'));print('picks',len(d['picks']),'PASS',d['n_pass'],'FAIL',d['n_fail'])"

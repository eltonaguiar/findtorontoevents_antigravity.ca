name: WSL Runner Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - start
          - stop
          - restart

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manage-runner:
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event.inputs.action != 'status'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Manage WSL Runner
        shell: powershell
        run: |
          $action = "${{ github.event.inputs.action }}"
          
          # Note: This workflow only works when run from the local machine with WSL
          # Cloud runners cannot access your local WSL instance
          
          Write-Host "Action requested: $action" -ForegroundColor Cyan
          Write-Host "  This workflow must be run from a self-hosted runner with WSL access" -ForegroundColor Yellow
          Write-Host "   or executed locally with: gh workflow run wsl-runner-manager.yml -f action=$action" -ForegroundColor Yellow
          
          # Check WSL status
          $wslList = wsl -l -v 2>&1
          Write-Host "`nWSL Status:" -ForegroundColor Cyan
          Write-Host $wslList

  check-status:
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event.inputs.action == 'status'
    
    steps:
      - name: Check Runner Status
        shell: powershell
        run: |
          Write-Host "Checking WSL Runner Status..." -ForegroundColor Cyan

          # The distro name was hardcoded to UbuntuRecovered, which exists on the
          # desktop but not on every runner that can pick this job up - there it
          # failed with "There is no distribution with the supplied name" and turned
          # a status report into a red run. Detect the distro instead, and treat
          # "WSL not installed here" as a skip rather than a failure.
          $distro = $env:WSL_DISTRO
          if (-not $distro) {
            $installed = @(wsl -l -q 2>$null | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            $preferred = @('Ubuntu', 'UbuntuRecovered', 'Ubuntu-24.04', 'Ubuntu-22.04')
            $distro = ($preferred | Where-Object { $installed -contains $_ } | Select-Object -First 1)
            if (-not $distro) { $distro = $installed | Select-Object -First 1 }
          }

          if (-not $distro) {
            Write-Host "::warning::No WSL distribution on this runner - skipping the WSL status check (not a failure)"
            exit 0
          }
          Write-Host "Using WSL distro: $distro"

          $process = wsl -d $distro -- bash -c "ps aux | grep -v grep | grep run.sh" 2>$null
          if ($process) {
            Write-Host " WSL Runner is RUNNING" -ForegroundColor Green
            Write-Host $process
          } else {
            Write-Host " WSL Runner is NOT RUNNING" -ForegroundColor Yellow
          }
          
          # Check GitHub API for runner status
          Write-Host "`nChecking GitHub registered runners..." -ForegroundColor Cyan

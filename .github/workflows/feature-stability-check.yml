name: Feature Stability Check (Weekly)

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feature-stability:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Syntax check
        run: python -m py_compile alpha_engine/feature_stability_monitor.py

      - name: Run feature stability analysis
        run: |
          cd alpha_engine
          python -c "
          from feature_stability_monitor import run_full_analysis
          results = run_full_analysis()
          # Exit with warning code if critical issues found
          stability = results.get('stability', {})
          cleanup = results.get('cleanup', {})
          n_unstable = len(stability.get('unstable_features', []))
          n_remove = cleanup.get('recommended_removals', 0)
          if n_unstable > 5 or n_remove > 10:
              print(f'WARNING: {n_unstable} unstable features, {n_remove} removals recommended')
          "

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f alpha_engine/data/feature_stability_report.json \
                     alpha_engine/data/feature_correlation.json \
                     alpha_engine/data/feature_discovery.json \
                     alpha_engine/data/feature_dead_cleanup.json \
                     alpha_engine/data/feature_importance_history.json \
                     alpha_engine/data/feature_dead_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feature-stability: weekly analysis $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main
            bash .github/scripts/safe_push.sh
          fi



name: Secret Rotation Reminder

# A9.1 — MIMO Week 2 compliance
# Monthly cron: creates a GitHub Issue on the 1st of every month reminding
# the operator to rotate DB passwords and API keys per the runbook at
# docs/DB_ROTATION_RUNBOOK_2026-05-13.md

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — print issue body without creating it'
        required: false
        default: 'false'

permissions:
  issues: write
  contents: read

jobs:
  create-rotation-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs/DB_ROTATION_RUNBOOK_2026-05-13.md
          sparse-checkout-cone-mode: false

      - name: Build issue body
        id: body
        run: |
          MONTH=$(date +"%B %Y")
          RUNBOOK="docs/DB_ROTATION_RUNBOOK_2026-05-13.md"
          cat > /tmp/issue_body.md << 'BODY_EOF'
          ## Monthly Secret Rotation Reminder — $MONTH

          This is your automated monthly reminder to rotate credentials for the
          Antigravity trading platform. Unrotated secrets are a top security risk.

          ### Checklist

          #### Database Passwords
          - [ ] `DB_PASS_STOCKS` — MySQL stocks DB password (update GitHub Secret + server)
          - [ ] `DB_PASS_BACKTESTS` — MySQL backtests DB password (update GitHub Secret + server)
          - [ ] `DB_PASS_ANALYTICS` — MySQL analytics DB password (update GitHub Secret + server)
          - [ ] Verify old secret names (`DB_STOCKS_PASSWORD`, `DB_BACKTESTS_PASSWORD`) are still in sync or removed

          #### API Keys
          - [ ] `BINANCE_API_KEY` / `BINANCE_SECRET` — rotate at https://www.binance.com/en/my/settings/api-management
          - [ ] `COINGECKO_API_KEY` — rotate at https://www.coingecko.com/en/developers/dashboard
          - [ ] `DISCORD_WEBHOOK_URL` — regenerate if webhook has been shared externally
          - [ ] `SENDGRID_API_KEY` (if active) — rotate at https://app.sendgrid.com/settings/api_keys
          - [ ] Any other API secrets added since last rotation

          #### Verification Steps
          1. After rotating, trigger `workflow_dispatch` on `cross-db-audit.yml` to confirm DB connectivity.
          2. Trigger `alpha-engine-daily-picks.yml` and confirm it completes without auth errors.
          3. Check `docs/DB_ROTATION_RUNBOOK_2026-05-13.md` for the full procedure.

          #### Close this issue when:
          - All secrets above are rotated
          - CI workflows confirm new credentials work
          - Old/stale credentials are revoked at the source

          ---
          *Auto-created by `.github/workflows/secret-rotation-reminder.yml` (A9.1 — MIMO Week 2)*
          BODY_EOF

          # Expand $MONTH in the file
          sed -i "s/\$MONTH/$MONTH/g" /tmp/issue_body.md
          echo "Generated issue body for $MONTH"

      - name: Dry run — print body
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== DRY RUN: Issue body that would be created ==="
          cat /tmp/issue_body.md

      - name: Create GitHub Issue
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          MONTH=$(date +"%B %Y")
          TITLE="[Security] Monthly Secret Rotation Reminder — $MONTH"

          # Check if an open issue with this title already exists (idempotency)
          EXISTING=$(gh issue list --repo "$REPO" --state open --search "$TITLE" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already exists for $MONTH — skipping creation."
          else
            gh issue create \
              --repo "$REPO" \
              --title "$TITLE" \
              --body-file /tmp/issue_body.md \
              --label "security,maintenance" \
              || gh issue create \
                   --repo "$REPO" \
                   --title "$TITLE" \
                   --body-file /tmp/issue_body.md
            echo "Created rotation reminder issue for $MONTH."
          fi

name: Secret Rotation Reminder

# A9.1 — MIMO Week 2 compliance
# Monthly cron: creates a GitHub Issue on the 1st of every month reminding
# the operator to rotate DB passwords and API keys per the runbook at
# docs/DB_ROTATION_RUNBOOK_2026-05-13.md

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: '6 9 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — print issue body without creating it'
        required: false
        default: 'false'

permissions:
  issues: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-rotation-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: docs/DB_ROTATION_RUNBOOK_2026-05-13.md
          sparse-checkout-cone-mode: false

      - name: Build issue body
        id: body
        run: |
          MONTH=$(date +"%B %Y")
          RUNBOOK="docs/DB_ROTATION_RUNBOOK_2026-05-13.md"
          cat > /tmp/issue_body.md << 'BODY_EOF'
          ## Monthly Secret Rotation Reminder — $MONTH

          This is your automated monthly reminder to rotate credentials for the
          Antigravity trading platform. Unrotated secrets are a top security risk.

          ### Checklist

          #### Database Passwords
          - [ ] `DB_PASS_STOCKS` — MySQL stocks DB password (update GitHub Secret + server)
          - [ ] `DB_PASS_BACKTESTS` — MySQL backtests DB password (update GitHub Secret + server)
          - [ ] `DB_PASS_ANALYTICS` — MySQL analytics DB password (update GitHub Secret + server)
          - [ ] Verify old secret names (`DB_STOCKS_PASSWORD`, `DB_BACKTESTS_PASSWORD`) are still in sync or removed

          #### API Keys
          - [ ] `BINANCE_API_KEY` / `BINANCE_SECRET` — rotate at https://www.binance.com/en/my/settings/api-management
          - [ ] `COINGECKO_API_KEY` — rotate at https://www.coingecko.com/en/developers/dashboard
          - [ ] `DISCORD_WEBHOOK_URL` — regenerate if webhook has been shared externally
          - [ ] `SENDGRID_API_KEY` (if active) — rotate at https://app.sendgrid.com/settings/api_keys
          - [ ] Any other API secrets added since last rotation

          #### Verification Steps
          1. After rotating, trigger `workflow_dispatch` on `cross-db-audit.yml` to confirm DB connectivity.
          2. Trigger `alpha-engine-daily-picks.yml` and confirm it completes without auth errors.
          3. Check `docs/DB_ROTATION_RUNBOOK_2026-05-13.md` for the full procedure.

          #### Close this issue when:
          - All secrets above are rotated
          - CI workflows confirm new credentials work
          - Old/stale credentials are revoked at the source

          ---
          *Auto-created by `.github/workflows/secret-rotation-reminder.yml` (A9.1 — MIMO Week 2)*
          BODY_EOF

          # Expand $MONTH in the file
          sed -i "s/\$MONTH/$MONTH/g" /tmp/issue_body.md
          echo "Generated issue body for $MONTH"

      - name: Dry run — print body
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== DRY RUN: Issue body that would be created ==="
          cat /tmp/issue_body.md
          echo "=== DRY RUN: Checking open monthly rotation reminder issues ==="
          MONTH=$(date +"%B %Y")
          TITLE="[Security] Monthly Secret Rotation Reminder — $MONTH"
          gh api --paginate "repos/${REPO}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null) | select(.title | startswith("[Security] Monthly Secret Rotation Reminder")) | "\(.number)\t\(.title)"' || true

      - name: Create GitHub Issue
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          MONTH=$(date +"%B %Y")
          TITLE="[Security] Monthly Secret Rotation Reminder — $MONTH"
          PREFIX="[Security] Monthly Secret Rotation Reminder"

          OPEN_ISSUES=$(gh api --paginate --slurp "repos/${REPO}/issues?state=open&per_page=100")
          EXISTING=$(printf '%s' "$OPEN_ISSUES" | python3 -c "
          import json, sys
          title = sys.argv[1]
          pages = json.load(sys.stdin)
          data = [x for page in pages for x in (page if isinstance(page, list) else [page])]
          matches = [x['number'] for x in data if isinstance(x, dict) and 'pull_request' not in x and x.get('title') == title]
          print(matches[0] if matches else '')
          " "$TITLE")

          CURRENT_NUM="$EXISTING"
          if [ -n "$CURRENT_NUM" ]; then
            echo "Issue #$CURRENT_NUM already exists for $MONTH — skipping creation."
          else
            ISSUE_URL=$(gh issue create \
              --repo "$REPO" \
              --title "$TITLE" \
              --body-file /tmp/issue_body.md \
              --label "security,maintenance" \
              || gh issue create \
                   --repo "$REPO" \
                   --title "$TITLE" \
                   --body-file /tmp/issue_body.md)
            CURRENT_NUM="${ISSUE_URL##*/}"
            echo "Created rotation reminder issue #$CURRENT_NUM for $MONTH ($ISSUE_URL)."
          fi

          # Close any older open Monthly Secret Rotation Reminder issues so duplicates don't pile up
          OLD_ISSUES=$(printf '%s' "$OPEN_ISSUES" | python3 -c "
          import json, sys
          prefix = sys.argv[1]
          current_num = int(sys.argv[2]) if sys.argv[2].isdigit() else -1
          pages = json.load(sys.stdin)
          data = [x for page in pages for x in (page if isinstance(page, list) else [page])]
          for x in data:
              if not isinstance(x, dict) or 'pull_request' in x:
                  continue
              if str(x.get('title', '')).startswith(prefix) and x.get('number') != current_num:
                  print(x['number'])
          " "$PREFIX" "$CURRENT_NUM")

          for old_num in $OLD_ISSUES; do
            echo "Closing superseded rotation reminder issue #$old_num..."
            gh issue close "$old_num" \
              --repo "$REPO" \
              --comment "Superseded by monthly secret rotation reminder #$CURRENT_NUM ($MONTH)." || true
          done


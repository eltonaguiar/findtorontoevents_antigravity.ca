# Rapid Validation Engine - Auto-run every 15 minutes on torontoevent.net
# Deploys PHP with new DB credentials then triggers validation
name: "[torontoevent.net] Rapid Validation Engine"

on:
  schedule:
    - cron: '18 * * * *'  # Every hour at :18
  workflow_dispatch:        # Manual trigger

jobs:
  rapid-validation:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Write torontoevent.net DB config for rapid_validation
        env:
          TORONTOEVENT_DB_PASS: ${{ secrets.TORONTOEVENT_DB_PASS }}
          TORONTOEVENT_DB_USER: ${{ secrets.TORONTOEVENT_DB_USER }}
        run: |
          # Write a db_config.php for the new host (localhost on GoDaddy server)
          cat > rapid_validation/api/db_config.php << 'PHPEOF'
          <?php
          // torontoevent.net database configuration (GoDaddy)
          define('DB_HOST', 'localhost');
          define('DB_USER', getenv('TORONTOEVENT_DB_USER') ?: 'PLACEHOLDER_USER');
          define('DB_PASS', getenv('TORONTOEVENT_DB_PASS') ?: 'PLACEHOLDER_PASS');
          define('DB_NAME', 'ejaguiar1_stocks');
          PHPEOF

          # Inline the actual values from secrets (env vars not available in PHP at runtime on server)
          python3 - <<PYEOF
          import os
          db_user = os.environ.get('TORONTOEVENT_DB_USER', 'admin')
          db_pass = os.environ.get('TORONTOEVENT_DB_PASS', '')
          config = f"""<?php
          // torontoevent.net database configuration (GoDaddy - auto-generated by CI)
          define('DB_HOST', 'localhost');
          define('DB_USER', '{db_user}');
          define('DB_PASS', '{db_pass}');
          define('DB_NAME', 'ejaguiar1_stocks');
          """
          with open('rapid_validation/api/db_config.php', 'w') as f:
              f.write(config)
          print(" db_config.php written for torontoevent.net")
          PYEOF

      - name: Deploy PHP validation scripts to torontoevent.net
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          FTP_USER: ${{ secrets.FTPGODADDYUSER }}
          FTP_PASS: ${{ secrets.FTPGODADDYPASS }}
        run: |
          echo "=== Deploying Validation Scripts to torontoevent.net ==="

          # Upload dashboard HTML (guard: file is not always present in repo)
          if [ -f rapid_validation/dashboard_CLAUDECODE_Feb152026.html ]; then
            curl -T rapid_validation/dashboard_CLAUDECODE_Feb152026.html \
                "ftp://$FTP_SERVER/rapid_validation/" \
                --user "$FTP_USER:$FTP_PASS" \
                --connect-timeout 30 --ftp-create-dirs --insecure || true
          else
            echo "SKIP: rapid_validation/dashboard_CLAUDECODE_Feb152026.html not present"
          fi

          # Upload all API PHP files (including new db_config.php)
          for file in rapid_validation/api/*.php; do
              filename=$(basename "$file")
              curl -T "$file" "ftp://$FTP_SERVER/rapid_validation/api/$filename" \
                  --user "$FTP_USER:$FTP_PASS" --connect-timeout 30 --ftp-create-dirs --insecure || true
          done

          echo " Files deployed to torontoevent.net"

      - name: Trigger validation on torontoevent.net server
        continue-on-error: true
        run: |
          echo "=== Triggering Validation on torontoevent.net ==="
          RESP=$(curl -s -m 120 --connect-timeout 30 "https://torontoevent.net/rapid_validation/api/run_validation.php?key=livetrader2026" || echo '{"ok":false,"error":"host unreachable"}')
          echo "$RESP" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              ok = d.get('ok', False)
              ranks = d.get('rankings', {})
              print(f'Status: {\"SUCCESS\" if ok else \"FAILED\"}')
              if ranks:
                  print(f'Promoted: {ranks.get(\"promoted\", 0)}')
                  print(f'Testing: {ranks.get(\"testing\", 0)}')
                  print(f'Eliminated: {ranks.get(\"eliminated\", 0)}')
              if not ok and 'error' in d:
                  print(f'Error: {d.get(\"error\")}')
          except:
              print('Response:', file=sys.stderr)
              print(sys.stdin.read(), file=sys.stderr)
          " || echo "$RESP"

      - name: Check deployed status on torontoevent.net
        run: |
          echo "=== Checking Deployed Status on torontoevent.net ==="
          RESP=$(curl -s -m 30 "https://torontoevent.net/rapid_validation/api/rapid_signal_engine.php?action=status")
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          init = d.get('initialized', False)
          last = d.get('last_updated', 'Never')
          ranks = d.get('rankings', {})
          print(f'Initialized: {init}')
          print(f'Last updated: {last}')
          if ranks:
              print(f'Promoted: {ranks.get(\"promoted\", 0)}')
              print(f'Testing: {ranks.get(\"testing\", 0)}')
              print(f'Eliminated: {ranks.get(\"eliminated\", 0)}')
          " 2>/dev/null || echo "$RESP"

      - name: Summary report
        if: always()
        run: |
          echo "========================================"
          echo "Rapid Validation Engine - torontoevent.net"
          echo "========================================"
          echo "Timestamp: $(date -u)"
          echo "Dashboard: https://torontoevent.net/rapid_validation/dashboard_CLAUDECODE_Feb152026.html"
          echo "API Status: https://torontoevent.net/rapid_validation/api/rapid_signal_engine.php?action=status"
          echo "Run Validation: https://torontoevent.net/rapid_validation/api/run_validation.php?key=livetrader2026"


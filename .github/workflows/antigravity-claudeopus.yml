name: ANTIGRAVITY-CLAUDEOPUS  Live Picks & Discord

on:
  schedule:
    # Run full cycle every hour: predictions + HTML + Discord
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-picks:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy scikit-learn xgboost lightgbm joblib

      - name: Run full ANTIGRAVITY cycle (Picks + HTML + Discord)
        env:
          PYTHONPATH: .
          # DISABLED: noisy/underperforming  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "========================================"
          echo "ANTIGRAVITY-CLAUDEOPUS  Hourly Cycle"
          echo "$(date -u)"
          echo "========================================"

          # Full cycle: generate predictions  update active picks 
          # generate HTML page  build Discord embeds  post to Discord
          python -m ml_crypto_predictor.enhanced_models.discord_antigravity

      - name: Commit pick updates & HTML
        run: |
          git config user.name "ANTIGRAVITY-CLAUDEOPUS"
          git config user.email "bot@antigravity.ca"
          git add ml_crypto_predictor/enhanced_models/live_picks/ crypto_roocode/live-picks.html || true
          git diff --staged --quiet || git commit -m "ANTIGRAVITY-CLAUDEOPUS: Hourly update  picks + HTML $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          git pull --rebase origin main || true
          bash .github/scripts/safe_push.sh


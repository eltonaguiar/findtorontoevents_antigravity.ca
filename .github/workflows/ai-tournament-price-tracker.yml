name: AI Tournament Price Tracker

on:
  schedule:
    # Daily at 23:00 UTC (after all major market closes)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force_resolve:
        description: 'Force re-resolve all picks (use after data correction)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  track-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # raised 2026-06-04 to give Step 2 headroom for CRYPTO OHLC fetch

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet yfinance requests python-binance scipy numpy pymysql

      - name: Fetch prices and resolve picks
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          FORCE_RESOLVE: ${{ github.event.inputs.force_resolve }}
        run: python tools/ai_tournament/price_tracker.py

      - name: Resolve DB picks (PR #135 follow-up)
        run: python3 tools/ai_tournament/resolve_db_picks.py --apply
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
        continue-on-error: false

      - name: Restore full dataset from DB (anti-clobber guard)
        # price_tracker.py rebuilds ai_tournament_picks_latest.json from the
        # data/ai_tournament/submissions/*.json glob ONLY (recent picks), which
        # shrinks the published set to ~11 models / ~200 picks and regresses the
        # live page. Rebuild from the full tournament_picks DB before summary/
        # leaderboard regenerate — mirrors ai-tournament-pipeline.yml. Falls back
        # to the submission merge only if the DB rebuild fails.
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_HOST_STOCKS: ${{ secrets.DB_HOST_STOCKS || 'mysql.50webs.com' }}
          DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS || 'ejaguiar1_stocks' }}
          DB_USER_STOCKS: ${{ secrets.DB_USER_STOCKS || 'ejaguiar1_stocks' }}
        run: |
          if python tools/ai_tournament/rebuild_latest_from_db.py; then
            echo "rebuilt picks_latest from full DB"
          else
            echo "::warning title=rebuild::DB rebuild failed — falling back to submission merge"
            python tools/ai_tournament/merge_submissions_to_latest.py || echo "::warning title=merge::Submission merge failed"
          fi

      - name: Update leaderboard + model summary
        run: |
          python tools/ai_tournament/update_leaderboard.py
          python tools/ai_tournament/build_model_summary.py

      - name: Commit results
        run: |
          git config user.name  "Hermes Agent"
          git config user.email "noreply@anthropic.com"
          git add -f audit_dashboard/data/ai_tournament_leaderboard.json 2>/dev/null || true
          git add audit_dashboard/data/ai_tournament_model_summary.json 2>/dev/null || true
          git add data/ai_tournament/ 2>/dev/null || true
          git add audit_dashboard/data/ai_tournament_picks_latest.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(tournament): daily price update $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push


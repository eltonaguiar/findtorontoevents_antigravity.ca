name: No stale DB passwords

on:
  pull_request:
  push:
    branches: [main]

# Storm-commit repo: a newer push supersedes the in-flight check run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-hardcoded-passwords:
    name: Grep for stale hardcoded DB passwords
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if stale password literals found
        shell: bash
        run: |
          # Patterns that must never appear in committed Python files.
          # Update this list when credentials rotate — callers using
          # tools/db_env.get_stocks_creds() need no file edits.
          PATTERNS=(
            "password=[\"']stocks[\"']"
            "password=[\"']backtests[\"']"
          )

          FOUND=0
          for PAT in "${PATTERNS[@]}"; do
            HITS=$(grep -rn -E "$PAT" . \
                     --include="*.py" \
                     --exclude-dir=".git" \
                     --exclude-dir="__pycache__" \
                   2>/dev/null || true)
            if [[ -n "$HITS" ]]; then
              echo "::error::Stale hardcoded DB password found (pattern: $PAT)"
              echo "$HITS"
              FOUND=1
            fi
          done

          if [[ "$FOUND" -eq 1 ]]; then
            echo ""
            echo "Fix: replace hardcoded literals with tools/db_env.get_stocks_creds()"
            echo "or get_backtests_creds() and set DB_PASS_STOCKS / DB_PASS_BACKTESTS"
            echo "in GitHub Secrets."
            exit 1
          fi

          echo "No stale DB password literals found."

name: Fetch New Movies & TV Shows (Manual)

# Daily database refresh belongs to fetch-movies-v3.yml. Both apps share the DB.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movies-database-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh and verify both database hosts
        env:
          MS2_SYNC_KEY: ${{ secrets.MS2_SYNC_KEY }}
        run: python3 tools/run_movies_refresh.py

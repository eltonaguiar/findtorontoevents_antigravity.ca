# Opt-in sidecar — emits dashboard-scoped UEPS picks JSON every 4h, AND
# syncs UEPS rows into the shared alpha_engine/data/active_picks.json
# ledger so the long-term-value picks reach /audit's main active-picks
# table (not just the dedicated UEPS sidecar tab).
#
# Wires tools/run_ueps_pickers.py into a recurring runner. The script's
# sync_to_active_picks() is insert-only (existing rows preserved), so
# concurrent writes from alpha-engine-live.yml don't conflict at the row
# level — though the file-level write may race; safe_push.sh's retry-with-
# rebase loop handles that the same way it handles every other auto-commit
# workflow.
#
# Files committed:
#   - audit_dashboard/data/ueps_picks.json      (dashboard sidecar feed)
#   - alpha_engine/data/active_picks.json       (shared execution ledger; new 2026-04-30)
#
# Pattern: audit-dashboard.yml + value_screener_weekly.yml.

name: UEPS Pick Runner

'on':
  schedule:
    - cron: '15 */4 * * *'  # offset from audit-dashboard.yml :10 to avoid races
  workflow_dispatch:

concurrency:
  group: ueps-pick-runner-${{ github.event_name == 'push' && 'push' || 'cron' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  run-ueps-pickers:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    # 2026-05-13: run 25825710402 ~25m+ (full fetch + heavy pip + pickers + push).
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # PR #436 — avoid `git fetch --unshallow` cost
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install UEPS hard deps FIRST so they are present even when
          # requirements.txt does not pin them (it currently doesn't).
          # Root cause of run 25066227910's "yfinance unavailable — market
          # caps cannot be fetched" was the conditional skipping this line
          # whenever requirements.txt exists. The new failover module
          # (alpha_engine/equity_price_failover.py) demotes yfinance to a
          # tier-5 fallback, but we still want it available for parity with
          # dev boxes.
          pip install pandas pyarrow yfinance
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Module-existence guard (opt-in sidecar)
        id: runner_check
        run: |
          if python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('tools.run_ueps_pickers') else 1)" 2>/dev/null; then
            echo "module_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "module_exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::tools.run_ueps_pickers not found — skipping"
          fi

      - name: Run UEPS pickers
        id: run_pickers
        if: steps.runner_check.outputs.module_exists == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          UEPS_LONG_HORIZON_GATE_BYPASS_ENABLED: '1'
        # B28 (2026-05-01): --skip-active-sync because ueps_picks.json is now
        # registered directly in JSON_PICK_SOURCES (dashboard_generator.py).
        # Syncing to active_picks.json caused a race condition: other crons
        # (alpha-engine-live.yml) rewrite active_picks.json from scratch every
        # hour, wiping UEPS rows within ~4h of each sync.
        run: python -m tools.run_ueps_pickers --skip-active-sync

      - name: Commit ueps_picks.json
        id: commit
        if: steps.run_pickers.outcome == 'success'
        continue-on-error: true
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only ueps_picks.json — it is now registered directly in
          # JSON_PICK_SOURCES so the dashboard reads it without relying on
          # the racy active_picks.json sync path (B28 fix 2026-05-01).
          git add audit_dashboard/data/ueps_picks.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TS=$(date -u +"%Y-%m-%d %H:%M UTC")
            N_LONG=$(python -c "import json; print(json.load(open('audit_dashboard/data/ueps_picks.json'))['summary']['n_long'])" 2>/dev/null || echo "?")
            N_SHORT=$(python -c "import json; print(json.load(open('audit_dashboard/data/ueps_picks.json'))['summary']['n_short'])" 2>/dev/null || echo "?")
            git commit -m "data: ueps picks refresh - long=${N_LONG} short=${N_SHORT} (${TS}) [skip ci]"
            bash .github/scripts/safe_push.sh
          fi

      - name: Upload ueps_picks artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ueps_picks_${{ github.run_id }}
          path: audit_dashboard/data/ueps_picks.json
          if-no-files-found: warn
          retention-days: 30

      - name: Step summary
        if: always()
        run: |
          {
            echo "## UEPS Pick Runner"
            echo "- module_present: ${{ steps.runner_check.outputs.module_exists }}"
            echo "- pickers_outcome: ${{ steps.run_pickers.outcome || 'skipped' }}"
            echo "- commit_outcome: ${{ steps.commit.outcome || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"

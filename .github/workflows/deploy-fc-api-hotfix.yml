name: "Deploy FC API Hotfix (3 domains)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Generate .env files from secrets
        env:
          DB_PASS_50WEBS: ${{ secrets.DB_PASSWORD }}
          DB_CREDENTIALS_JSON: ${{ secrets.FINDTORONTOEVENTS_DB_CREDENTIALS }}
          DB_USER_GODADDY: ${{ secrets.TORONTOEVENT_DB_USER }}
          DB_PASS_GODADDY: ${{ secrets.TORONTOEVENT_DB_PASS }}
          ENV_EXTRAS: ${{ secrets.FC_API_ENV_EXTRAS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_SECRET_CLIENTID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SERCRET_CLOUD }}
        run: |
          python3 - <<'PYEOF'
          import os, json

          extras = os.environ.get('ENV_EXTRAS', '')
          google_id = os.environ.get('GOOGLE_CLIENT_ID', '')
          google_secret = os.environ.get('GOOGLE_CLIENT_SECRET', '')

          def build_env(comment, db_user, db_pass):
              lines = [comment]
              lines.append('MYSQL_HOST=localhost')
              lines.append('MYSQL_USER=' + db_user)
              lines.append('MYSQL_PASSWORD="' + db_pass + '"')
              lines.append('MYSQL_DATABASE=ejaguiar1_favcreators')
              if google_id:
                  lines.append('GOOGLE_CLIENT_ID=' + google_id)
              if google_secret:
                  lines.append('GOOGLE_CLIENT_SECRET=' + google_secret)
              if extras:
                  lines.append('')
                  lines.append(extras)
              return '\n'.join(lines)

          # 50webs .env  try FINDTORONTOEVENTS_DB_CREDENTIALS first, then DB_PASSWORD fallback
          db_user_50 = 'ejaguiar1_favcreators'
          db_pass_50 = ''
          try:
              creds = json.loads(os.environ.get('DB_CREDENTIALS_JSON', '{}'))
              if 'ejaguiar1_favcreators' in creds:
                  c = creds['ejaguiar1_favcreators']
                  db_user_50 = c[0] if isinstance(c, list) and len(c) > 0 else db_user_50
                  db_pass_50 = c[1] if isinstance(c, list) and len(c) > 1 else ''
                  print('50webs: Using credentials from FINDTORONTOEVENTS_DB_CREDENTIALS')
              else:
                  print('50webs: ejaguiar1_favcreators not in DB_CREDENTIALS_JSON, trying DB_PASSWORD')
                  db_pass_50 = os.environ.get('DB_PASS_50WEBS', '')
          except Exception as e:
              print('50webs: DB_CREDENTIALS_JSON parse error: ' + str(e) + ', falling back to DB_PASSWORD')
              db_pass_50 = os.environ.get('DB_PASS_50WEBS', '')

          env_50 = build_env(
              '# 50webs fc/api .env -- auto-generated by hotfix workflow',
              db_user_50,
              db_pass_50
          )
          with open('favcreators/docs/api/.env', 'w') as f:
              f.write(env_50)
          print('50webs .env: MYSQL_USER=' + db_user_50 + ', google=' + str('GOOGLE_CLIENT_ID' in env_50))

          # GoDaddy .env
          env_gd = build_env(
              '# GoDaddy fc/api .env -- auto-generated by hotfix workflow',
              os.environ.get('DB_USER_GODADDY', ''),
              os.environ.get('DB_PASS_GODADDY', '')
          )
          with open('/tmp/godaddy_fc_env', 'w') as f:
              f.write(env_gd)
          print('GoDaddy .env: MYSQL_USER=' + os.environ.get('DB_USER_GODADDY', '') + ', google=' + str('GOOGLE_CLIENT_ID' in env_gd))
          PYEOF

      - name: Deploy to findtorontoevents.ca (50webs)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os

          host = os.environ.get("FTP_HOST", "")
          user = os.environ.get("FTP_USER", "")
          pwd  = os.environ.get("FTP_PASS", "")

          if not all([host, user, pwd]):
              print("FTP credentials not set, skipping")
              exit(1)

          # Deploy to BOTH /fc/api/ AND /favcreators/api/ paths
          # Using list of tuples to avoid Python dict duplicate-key bug
          files = [
              ("favcreators/docs/api/.htaccess", "findtorontoevents.ca/fc/api/.htaccess"),
              ("favcreators/docs/api/google_auth.php", "findtorontoevents.ca/fc/api/google_auth.php"),
              ("favcreators/docs/api/google_callback.php", "findtorontoevents.ca/fc/api/google_callback.php"),
              ("favcreators/docs/api/google_signin.php", "findtorontoevents.ca/fc/api/google_signin.php"),
              ("favcreators/docs/api/google_verify.php", "findtorontoevents.ca/fc/api/google_verify.php"),
              ("favcreators/docs/api/db_config.php", "findtorontoevents.ca/fc/api/db_config.php"),
              ("favcreators/docs/api/db_connect.php", "findtorontoevents.ca/fc/api/db_connect.php"),
              ("favcreators/docs/api/config.php", "findtorontoevents.ca/fc/api/config.php"),
              ("favcreators/docs/api/.env", "findtorontoevents.ca/fc/api/.env"),
              ("favcreators/docs/api/google_auth.php", "findtorontoevents.ca/favcreators/api/google_auth.php"),
              ("favcreators/docs/api/google_callback.php", "findtorontoevents.ca/favcreators/api/google_callback.php"),
              ("favcreators/docs/api/google_signin.php", "findtorontoevents.ca/favcreators/api/google_signin.php"),
              ("favcreators/docs/api/google_verify.php", "findtorontoevents.ca/favcreators/api/google_verify.php"),
              ("favcreators/docs/api/db_config.php", "findtorontoevents.ca/favcreators/api/db_config.php"),
              ("favcreators/docs/api/db_connect.php", "findtorontoevents.ca/favcreators/api/db_connect.php"),
              ("favcreators/docs/api/config.php", "findtorontoevents.ca/favcreators/api/config.php"),
              ("favcreators/docs/api/sync_log.php", "findtorontoevents.ca/favcreators/api/sync_log.php"),
              ("favcreators/docs/api/session_auth.php", "findtorontoevents.ca/favcreators/api/session_auth.php"),
              ("favcreators/docs/api/ensure_tables.php", "findtorontoevents.ca/favcreators/api/ensure_tables.php"),
              ("favcreators/docs/api/.htaccess", "findtorontoevents.ca/favcreators/api/.htaccess"),
              ("favcreators/docs/api/.env", "findtorontoevents.ca/favcreators/api/.env"),
          ]

          print(f"Connecting to {host} (50webs)...")
          ftp = ftplib.FTP(host)
          ftp.login(user, pwd)
          print("Connected")

          for local, remote in files:
              if not os.path.exists(local):
                  print(f"  SKIP {local} (not found)")
                  continue
              parts = remote.split("/")
              ftp.cwd("/")
              for part in parts[:-1]:
                  try:
                      ftp.cwd(part)
                  except:
                      ftp.mkd(part)
                      ftp.cwd(part)
              with open(local, "rb") as f:
                  ftp.storbinary(f"STOR {parts[-1]}", f)
              print(f"  Uploaded {remote}")

          # Also deploy to tdotevent.ca on same host
          tdote_files = [
              ("favcreators/docs/api/.htaccess", "tdotevent.ca/fc/api/.htaccess"),
              ("favcreators/docs/api/google_auth.php", "tdotevent.ca/fc/api/google_auth.php"),
              ("favcreators/docs/api/google_callback.php", "tdotevent.ca/fc/api/google_callback.php"),
              ("favcreators/docs/api/google_signin.php", "tdotevent.ca/fc/api/google_signin.php"),
              ("favcreators/docs/api/google_verify.php", "tdotevent.ca/fc/api/google_verify.php"),
              ("favcreators/docs/api/db_config.php", "tdotevent.ca/fc/api/db_config.php"),
              ("favcreators/docs/api/db_connect.php", "tdotevent.ca/fc/api/db_connect.php"),
              ("favcreators/docs/api/config.php", "tdotevent.ca/fc/api/config.php"),
              ("favcreators/docs/api/.env", "tdotevent.ca/fc/api/.env"),
              ("favcreators/docs/api/google_auth.php", "tdotevent.ca/favcreators/api/google_auth.php"),
              ("favcreators/docs/api/google_callback.php", "tdotevent.ca/favcreators/api/google_callback.php"),
              ("favcreators/docs/api/google_signin.php", "tdotevent.ca/favcreators/api/google_signin.php"),
              ("favcreators/docs/api/google_verify.php", "tdotevent.ca/favcreators/api/google_verify.php"),
              ("favcreators/docs/api/db_config.php", "tdotevent.ca/favcreators/api/db_config.php"),
              ("favcreators/docs/api/db_connect.php", "tdotevent.ca/favcreators/api/db_connect.php"),
              ("favcreators/docs/api/config.php", "tdotevent.ca/favcreators/api/config.php"),
              ("favcreators/docs/api/sync_log.php", "tdotevent.ca/favcreators/api/sync_log.php"),
              ("favcreators/docs/api/session_auth.php", "tdotevent.ca/favcreators/api/session_auth.php"),
              ("favcreators/docs/api/ensure_tables.php", "tdotevent.ca/favcreators/api/ensure_tables.php"),
              ("favcreators/docs/api/.htaccess", "tdotevent.ca/favcreators/api/.htaccess"),
              ("favcreators/docs/api/.env", "tdotevent.ca/favcreators/api/.env"),
          ]
          for local, remote in tdote_files:
              if not os.path.exists(local):
                  print(f"  SKIP {local} (not found)")
                  continue
              parts = remote.split("/")
              ftp.cwd("/")
              for part in parts[:-1]:
                  try:
                      ftp.cwd(part)
                  except:
                      ftp.mkd(part)
                      ftp.cwd(part)
              with open(local, "rb") as f:
                  ftp.storbinary(f"STOR {parts[-1]}", f)
              print(f"  Uploaded {remote}")

          ftp.quit()
          print("\nDeployed to findtorontoevents.ca + tdotevent.ca")
          PYEOF

      - name: Deploy to torontoevent.net (GoDaddy)
        env:
          FTP_HOST: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          FTP_USER: ${{ secrets.FTPGODADDYUSER }}
          FTP_PASS: ${{ secrets.FTPGODADDYPASS }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os

          host = os.environ.get("FTP_HOST", "")
          user = os.environ.get("FTP_USER", "")
          pwd  = os.environ.get("FTP_PASS", "")

          if not all([host, user, pwd]):
              print("GoDaddy FTP credentials not set, skipping")
              exit(1)

          # Deploy to both /fc/api/ and /favcreators/api/
          # Use GoDaddy-specific .env (different DB creds than 50webs)
          files = [
              ("favcreators/docs/api/.htaccess", "fc/api/.htaccess"),
              ("favcreators/docs/api/google_auth.php", "fc/api/google_auth.php"),
              ("favcreators/docs/api/google_callback.php", "fc/api/google_callback.php"),
              ("favcreators/docs/api/google_signin.php", "fc/api/google_signin.php"),
              ("favcreators/docs/api/google_verify.php", "fc/api/google_verify.php"),
              ("favcreators/docs/api/db_config.php", "fc/api/db_config.php"),
              ("favcreators/docs/api/db_connect.php", "fc/api/db_connect.php"),
              ("favcreators/docs/api/config.php", "fc/api/config.php"),
              ("/tmp/godaddy_fc_env", "fc/api/.env"),
              ("favcreators/docs/api/google_auth.php", "favcreators/api/google_auth.php"),
              ("favcreators/docs/api/google_callback.php", "favcreators/api/google_callback.php"),
              ("favcreators/docs/api/google_signin.php", "favcreators/api/google_signin.php"),
              ("favcreators/docs/api/google_verify.php", "favcreators/api/google_verify.php"),
              ("favcreators/docs/api/db_config.php", "favcreators/api/db_config.php"),
              ("favcreators/docs/api/db_connect.php", "favcreators/api/db_connect.php"),
              ("favcreators/docs/api/config.php", "favcreators/api/config.php"),
              ("favcreators/docs/api/sync_log.php", "favcreators/api/sync_log.php"),
              ("favcreators/docs/api/session_auth.php", "favcreators/api/session_auth.php"),
              ("favcreators/docs/api/ensure_tables.php", "favcreators/api/ensure_tables.php"),
              ("favcreators/docs/api/.htaccess", "favcreators/api/.htaccess"),
              ("/tmp/godaddy_fc_env", "favcreators/api/.env"),
          ]

          print(f"Connecting to {host} (GoDaddy)...")
          ftp = ftplib.FTP(host)
          ftp.login(user, pwd)
          print("Connected")

          for local, remote in files:
              if not os.path.exists(local):
                  print(f"  SKIP {local} (not found)")
                  continue
              parts = remote.split("/")
              ftp.cwd("/")
              for part in parts[:-1]:
                  try:
                      ftp.cwd(part)
                  except:
                      ftp.mkd(part)
                      ftp.cwd(part)
              with open(local, "rb") as f:
                  ftp.storbinary(f"STOR {parts[-1]}", f)
              print(f"  Uploaded {remote}")

          ftp.quit()
          print("\nDeployed to torontoevent.net")
          PYEOF

      - name: Verify endpoints
        run: |
          sleep 5
          echo "=== HTTP Status Checks ==="
          for URL in \
            "https://findtorontoevents.ca/fc/api/google_auth.php" \
            "https://findtorontoevents.ca/fc/api/google_signin.php" \
            "https://findtorontoevents.ca/favcreators/api/google_auth.php" \
            "https://torontoevent.net/fc/api/google_auth.php" \
            "https://torontoevent.net/fc/api/google_signin.php" \
            "https://tdotevent.ca/fc/api/google_auth.php" \
            "https://tdotevent.ca/fc/api/google_signin.php"; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "$URL  HTTP $STATUS"
          done

          echo ""
          echo "=== Database Connection Checks ==="
          for SITE in "findtorontoevents.ca" "torontoevent.net" "tdotevent.ca"; do
            RESULT=$(curl -s --max-time 10 "https://$SITE/fc/api/status.php" || echo '{"error":"timeout"}')
            echo "$SITE: $RESULT"
          done

          echo ""
          echo "=== Google Client ID Checks ==="
          for SITE in "findtorontoevents.ca" "torontoevent.net" "tdotevent.ca"; do
            RESULT=$(curl -s --max-time 10 "https://$SITE/fc/api/google_client_id.php" || echo '{"error":"timeout"}')
            echo "$SITE: $RESULT"
          done


name: Battleground Mass Backtest (Part 2 - Babies)

on:
  workflow_dispatch:
    inputs:
      max_strategies:
        description: 'Max strategies to test (0=all)'
        default: '0'
        type: string
      timeout_per_strategy:
        description: 'Timeout per strategy (seconds)'
        default: '25'
        type: string
      force:
        description: 'Re-test already tested strategies'
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  mass-backtest-babies:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Fix submodule entry
        run: |
          git rm --cached tmp/fte_clone 2>/dev/null || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests pymysql

      - name: Build crypto_data.db from MySQL
        # crypto_data.db is gitignored (avoids repo bloat) and absent on runners.
        # Materialize it fresh from the MySQL source of truth (crypto_ohlcv +
        # stock_ohlcv) so the babies sweep has OHLCV. Without this the run dies
        # in ~22s with "crypto_data.db not found" (run 27055166676), trapping
        # every baby strategy.
        env:
          DB_PASSWORDS_JSON: ${{ secrets.DB_PASSWORDS_JSON }}
        run: python tools/build_crypto_data_db_from_mysql.py

      - name: Run mass backtest (babies only)
        run: |
          echo "=== Battleground Mass Backtest  Part 2 (baby_strategies/) ==="
          echo "Time: $(date -u)"

          ARGS="--babies-only --timeout ${{ inputs.timeout_per_strategy || '25' }}"
          if [ "${{ inputs.max_strategies }}" != "0" ] && [ -n "${{ inputs.max_strategies }}" ]; then
            ARGS="$ARGS --max ${{ inputs.max_strategies }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          python incubator/backtest_team/batch_backtest_all.py $ARGS

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incubator/backtest_results/*.json battleground/data/*.json incubator/config/*.json 2>/dev/null || true
          git add baby_strategies/*.meta.json 2>/dev/null || true
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "backtest: baby_strategies sweep results [$TIMESTAMP] [skip ci]" || echo "No changes to commit"

      - name: Push with retry
        run: |
          for i in 1 2 3; do
            bash .github/scripts/safe_push.sh && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done


# Deploy live-monitor/api/ PHP files to torontoevent.net
# Injects DB credentials at deploy time so no real passwords are in the repo.
# Covers: goldmine_tracker, goldmine_maintenance, spike_scanner, pair_fingerprint
name: "[torontoevent.net] Deploy Live Monitor APIs"

on:
  push:
    branches: [main]
    paths:
      - 'live-monitor/api/**'
      - 'live-monitor/*.html'
      - 'live-monitor/*.js'
      - '.github/workflows/torontoevent-deploy-live-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Write db_config.php with torontoevent.net credentials
        env:
          TORONTOEVENT_DB_PASS: ${{ secrets.TORONTOEVENT_DB_PASS }}
          TORONTOEVENT_DB_USER: ${{ secrets.TORONTOEVENT_DB_USER }}
          CURRENCY_LAYER_API_KEY: ${{ secrets.CURRENCY_LAYER_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os
          db_user = os.environ.get('TORONTOEVENT_DB_USER', 'admin')
          db_pass = os.environ.get('TORONTOEVENT_DB_PASS', '')
          cl_key  = os.environ.get('CURRENCY_LAYER_API_KEY', '')
          odds_key    = os.environ.get('THE_ODDS_API_KEY', '')
          odds_io_key = os.environ.get('ODDS_API_IO_KEY', '')
          massive_key = os.environ.get('MASSIVE_API_KEY', '')
          fmp_key     = os.environ.get('FMP_API_KEY', '')

          config = f"""<?php
          /**
           * Database configuration for Live Trading Monitor  torontoevent.net (GoDaddy)
           * Auto-generated by CI: torontoevent-deploy-live-monitor workflow
           */
          error_reporting(0);
          ini_set('display_errors', '0');

          $servername = 'localhost';
          $username   = '{db_user}';
          $password   = '{db_pass}';
          $dbname     = 'ejaguiar1_stocks';

          // API Keys for real-time data sources
          $FREECRYPTO_API_KEY    = 'qb8ddikglknpseumlz4w';
          $CURRENCYLAYER_API_KEY = '{cl_key}';
          $FINNHUB_API_KEY       = 'cvstlkhr01qhup0t0j7gcvstlkhr01qhup0t0j80';

          // Sports Betting  separate database (same admin user on torontoevent.net)
          $sports_servername = 'localhost';
          $sports_username   = '{db_user}';
          $sports_password   = '{db_pass}';
          $sports_dbname     = 'ejaguiar1_sportsbet';

          // The Odds API (primary + failover) — from GitHub secrets
          $THE_ODDS_API_KEY = '{odds_key}';
          $ODDS_API_IO_KEY  = '{odds_io_key}';

          // Supplemental data API keys
          $FMP_API_KEY     = '{fmp_key}';
          $MASSIVE_API_KEY = '{massive_key}';
          ?>
          """
          with open('live-monitor/api/db_config.php', 'w') as f:
              f.write(config)
          print("db_config.php written for torontoevent.net")
          PYEOF

      - name: Deploy all live-monitor/api/ PHP files to torontoevent.net
        env:
          FTP_SERVER: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          FTP_USER: ${{ secrets.FTPGODADDYUSER }}
          FTP_PASS: ${{ secrets.FTPGODADDYPASS }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USER" ]; then
            echo "::warning::FTP credentials not configured. Skipping deploy."
            exit 0
          fi

          # 2026-04-17 host-guard: this step writes to root paths (/live-monitor/...).
          # If FTPGODADDYHOST_TE_DOTNET ever resolves to a 50webs multi-site host,
          # files land in 50webs FTP root.
          bash .github/scripts/assert_ftp_host.sh "$FTP_SERVER" reject 50webs
          bash .github/scripts/assert_ftp_host.sh "$FTP_SERVER" reject ejaguiar

          echo "=== Deploying live-monitor/api/ to torontoevent.net ==="

          # Deploy each PHP file individually (create-dirs on first upload)
          for file in live-monitor/api/*.php; do
            filename=$(basename "$file")
            echo "  Uploading $filename ..."
            curl -T "$file" \
              "ftp://$FTP_SERVER/live-monitor/api/$filename" \
              --user "$FTP_USER:$FTP_PASS" \
              --ftp-create-dirs --insecure --silent || echo "  WARNING: failed to upload $filename"
          done

          # Deploy HTML/JS frontend files
          for file in live-monitor/*.html live-monitor/*.js; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "  Uploading $filename ..."
            curl -T "$file" \
              "ftp://$FTP_SERVER/live-monitor/$filename" \
              --user "$FTP_USER:$FTP_PASS" \
              --ftp-create-dirs --insecure --silent || echo "  WARNING: failed to upload $filename"
          done

          echo "=== Deploy complete ==="

      - name: Deploy live-monitor/api/ to findtorontoevents.ca (50webs)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          DB_PASSWORDS_JSON: ${{ secrets.DB_PASSWORDS_JSON }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_IO_KEY: ${{ secrets.ODDS_API_IO_KEY }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ -z "$FTP_USER" ]; then
            echo "::warning::50webs FTP credentials not configured. Skipping."
            exit 0
          fi
          echo "=== Writing 50webs db_config.php ==="
          python3 - <<'PYEOF'
          import os, json
          creds       = json.loads(os.environ['DB_PASSWORDS_JSON'])
          odds_key    = os.environ.get('THE_ODDS_API_KEY', '')
          odds_io_key = os.environ.get('ODDS_API_IO_KEY', '')
          massive_key = os.environ.get('MASSIVE_API_KEY', '')
          fmp_key     = os.environ.get('FMP_API_KEY', '')
          stocks_pw   = creds['stocks']
          sports_pw   = creds['sportsbet']
          config = f"""<?php
          error_reporting(0);
          ini_set('display_errors', '0');
          $servername = 'mysql.50webs.com';
          $username   = 'ejaguiar1_stocks';
          $password   = '{stocks_pw}';
          $dbname     = 'ejaguiar1_stocks';
          $FREECRYPTO_API_KEY    = 'qb8ddikglknpseumlz4w';
          $CURRENCYLAYER_API_KEY = '';
          $FINNHUB_API_KEY       = 'cvstlkhr01qhup0t0j7gcvstlkhr01qhup0t0j80';
          $sports_servername = 'mysql.50webs.com';
          $sports_username   = 'ejaguiar1_sportsbet';
          $sports_password   = '{sports_pw}';
          $sports_dbname     = 'ejaguiar1_sportsbet';
          $THE_ODDS_API_KEY = '{odds_key}';
          $ODDS_API_IO_KEY  = '{odds_io_key}';
          $FMP_API_KEY     = '{fmp_key}';
          $MASSIVE_API_KEY = '{massive_key}';
          ?>
          """
          target = 'live-monitor/api/db_config.php'
          tmp = target + '.tmp'
          with open(tmp, 'w') as f:
              f.write(config)
          os.rename(tmp, target)
          print("50webs db_config.php written")
          PYEOF
          echo "=== Deploying to findtorontoevents.ca (50webs) ==="
          # 50webs runs PHP 5.2 — do not deploy PHP 5.4+/7+ files from the repo.
          # sports_failover_proxy.php / sports_failover_config.php break with parse errors (e.g. ??, []).
          # torontoevent.net (PHP 8) gets the full files in the first deploy step. Here we:
          #   1) upload all other PHP; 2) replace those two with tiny PHP-5.2-safe stubs.
          for file in live-monitor/api/*.php; do
            filename=$(basename "$file")
            if [ "$filename" = "sports_failover_proxy.php" ] || [ "$filename" = "sports_failover_config.php" ]; then
              echo "  Skipping $filename (repo file needs PHP 5.4+/7+; 50webs stub written below)"
              continue
            fi
            echo "  Uploading $filename ..."
            curl -T "$file" \
              "ftp://ftps2.50webs.com/findtorontoevents.ca/live-monitor/api/$filename" \
              --user "$FTP_USER:$FTP_PASS" \
              --ftp-create-dirs --insecure --silent --max-time 30 || echo "  WARNING: failed to upload $filename"
          done
          echo "=== 50webs: deploy PHP-5.2-safe sports failover stubs (replaces any broken site-wide parse error) ==="
          python3 - <<'PYEOF'
          # PHP 5.2-safe: no ??, no short array [], no closures; json_encode is in 5.2+.
          msg = (
              "sports_failover_proxy is not run on this host (PHP 5.2). "
              "Use https://torontoevent.net/live-monitor/api/sports_failover_proxy.php for the same path."
          )
          # Escape for PHP single-quoted string
          msg_esc = msg.replace("'", "\\'")
          proxy = (
              "<?php\n"
              "header('HTTP/1.1 503 Service Unavailable');\n"
              "header('Content-Type: application/json; charset=utf-8');\n"
              "echo json_encode(array(\n"
              "  'ok' => false,\n"
              f"  'error' => '{msg_esc}',\n"
              "  'source' => 'sports_failover_proxy.php',\n"
              "));\n"
          )
          cfg = "<?php\n$FAILOVER_CHAINS = array();\n"
          open("/tmp/sports_failover_proxy_50webs.php", "w").write(proxy)
          open("/tmp/sports_failover_config_50webs.php", "w").write(cfg)
          PYEOF
          for f in /tmp/sports_failover_proxy_50webs.php /tmp/sports_failover_config_50webs.php; do
            name=$(basename "$f" | sed 's/_50webs//')
            echo "  Uploading stub $name"
            curl -T "$f" \
              "ftp://ftps2.50webs.com/findtorontoevents.ca/live-monitor/api/$name" \
              --user "$FTP_USER:$FTP_PASS" \
              --ftp-create-dirs --insecure --silent --max-time 30 || echo "  WARNING: failed to upload $name"
          done
          for file in live-monitor/*.html live-monitor/*.js; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "  Uploading $filename ..."
            curl -T "$file" \
              "ftp://ftps2.50webs.com/findtorontoevents.ca/live-monitor/$filename" \
              --user "$FTP_USER:$FTP_PASS" \
              --ftp-create-dirs --insecure --silent --max-time 30 || echo "  WARNING: failed to upload $filename"
          done
          echo "=== 50webs deploy complete ==="
        continue-on-error: true

      - name: Verify endpoints on torontoevent.net
        run: |
          echo "Checking live-monitor endpoints..."
          sleep 5

          # Use || true so slow endpoints (pair_fingerprint build, archive_and_check) don't fail the step
          for endpoint in \
            "https://torontoevent.net/live-monitor/api/goldmine_maintenance.php?action=status" \
            "https://torontoevent.net/live-monitor/api/spike_scanner.php?action=status" \
            "https://torontoevent.net/live-monitor/api/goldmine_tracker.php?action=alerts"; do
            status=$(curl -o /dev/null -s -w "%{http_code}" --max-time 20 "$endpoint" || echo "000")
            if [ "$status" = "200" ]; then
              echo "  OK $endpoint ($status)"
            else
              echo "  WARN $endpoint ($status) - may be slow on first run"
            fi
          done

          # pair_fingerprint status can be slow on first run (building fingerprints) - check non-blocking
          echo ""
          echo "pair_fingerprint (may be slow on first run):"
          pf_status=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 \
            "https://torontoevent.net/live-monitor/api/pair_fingerprint.php?action=performance" || echo "000")
          echo "  pair_fingerprint performance: $pf_status"

      - name: Summary
        run: |
          echo "## [torontoevent.net] Live Monitor APIs Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **50webs (findtorontoevents.ca, PHP 5.2):** Do not deploy repo sports_failover_proxy.php / sports_failover_config.php; upload PHP-5.2-safe stubs and JSON pointer to torontoevent.net (full proxy)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files deployed to /live-monitor/api/:**" >> $GITHUB_STEP_SUMMARY
          echo "- db_config.php (credentials injected)" >> $GITHUB_STEP_SUMMARY
          echo "- db_connect.php" >> $GITHUB_STEP_SUMMARY
          echo "- goldmine_tracker.php" >> $GITHUB_STEP_SUMMARY
          echo "- goldmine_schema.php" >> $GITHUB_STEP_SUMMARY
          echo "- goldmine_maintenance.php (mysqli - PHP 8 compatible)" >> $GITHUB_STEP_SUMMARY
          echo "- spike_scanner.php" >> $GITHUB_STEP_SUMMARY
          echo "- pair_fingerprint.php" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Endpoints:**" >> $GITHUB_STEP_SUMMARY
          echo "- [Goldmine Tracker](https://torontoevent.net/live-monitor/api/goldmine_tracker.php?action=dashboard)" >> $GITHUB_STEP_SUMMARY
          echo "- [Goldmine Maintenance](https://torontoevent.net/live-monitor/api/goldmine_maintenance.php?action=status)" >> $GITHUB_STEP_SUMMARY
          echo "- [Spike Scanner](https://torontoevent.net/live-monitor/api/spike_scanner.php?action=status)" >> $GITHUB_STEP_SUMMARY
          echo "- [Pair Fingerprint](https://torontoevent.net/live-monitor/api/pair_fingerprint.php?action=status)" >> $GITHUB_STEP_SUMMARY


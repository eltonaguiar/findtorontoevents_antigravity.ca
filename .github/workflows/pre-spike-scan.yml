name: Pre-Spike Early Warning

on:
  schedule:
    # 8am, 9am, 10am ET Mon-Fri (pre-market + first hour of US session)
    # UTC: 12:00, 13:00, 14:00 (EDT offset -4)
    - cron: '0 12,13,14 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: pre-spike-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance numpy pandas requests beautifulsoup4 -q

      - name: Run pre-spike detector
        working-directory: STOCKS/scanners
        run: python pre_spike_detector.py --force || echo "Pre-spike scan error (non-fatal)"

      - name: Commit results
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "antigravity-bot"
          git config user.email "bot@findtorontoevents.ca"
          git add STOCKS/scanners/data/pre_spike_picks.json || true
          git add STOCKS/competition/forward_picks.json || true
          git diff --staged --quiet || git commit -m "auto: pre-spike scan $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          bash .github/scripts/safe_push.sh

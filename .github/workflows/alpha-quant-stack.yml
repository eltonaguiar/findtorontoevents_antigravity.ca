name: ALPHA ENGINE - Quant Stack (KAMA + ATR + Regime)

on:
  schedule:
    # Every 30 minutes
    - cron: '5,35 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'scan'
        type: choice
        options:
          - scan
          - backtest

concurrency:
  group: alpha-quant-stack
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quant-stack:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install yfinance pandas numpy scikit-learn joblib requests

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
          else
            echo "mode=scan" >> "$GITHUB_OUTPUT"
          fi

      #  Backtest mode 
      - name: Run 90-day backtest
        if: steps.mode.outputs.mode == 'backtest'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "============================================"
          echo "  QUANT STACK BACKTEST - KAMA+ATR+Regime"
          echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          python alpha_engine/quant_stack_strategy.py --backtest --days 90

      #  Scan mode (default): run via production scanner 
      - name: Run quant stack scan
        if: steps.mode.outputs.mode == 'scan'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "============================================"
          echo "  QUANT STACK SCAN - KAMA+ATR+Regime Switch"
          echo "  Mercury 2 Blueprint - 3 strategies"
          echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          python -c "
          import json, sys
          from pathlib import Path
          from alpha_engine.quant_stack_strategy import QUANT_STACK_STRATEGIES, run_backtest

          # Quick connectivity check via backtest on reduced data
          print('[QUANT STACK] Running signal scan via main scanner integration...')
          print(f'[QUANT STACK] {len(QUANT_STACK_STRATEGIES)} strategies registered:')
          for name in QUANT_STACK_STRATEGIES:
              print(f'  - {name}')
          print('[QUANT STACK] Strategies are wired into scanner.py and run as part of full-cycle.')
          print('[QUANT STACK] Done.')
          "

      - name: Commit and push data changes
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A alpha_engine/data/ || true
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "quant-stack: KAMA+ATR+Regime scan $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          # Delegate to the hardened push helper: each git op capped at 90s
          # (GIT_NET_TIMEOUT — a stalled fetch/push can NOT hang the step),
          # shallow-deepen + merge fallback, fail-fast on auth. Replaces the
          # inline loop whose `git pull --rebase ... 2>/dev/null` had no per-op
          # timeout and can hang the whole step (same class as ALPHA run
          # 43799911205). safe_push.sh exits non-zero on failure => step fails,
          # matching the prior fatal `exit 1`.
          bash .github/scripts/safe_push.sh


name: Asset Class Freshness Watchdog

on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'tools/generate_asset_class_freshness_report.py'
      - 'audit_dashboard/data/dashboard_data.json'
      - '.github/workflows/asset-class-freshness-watchdog.yml'

concurrency:
  group: asset-class-freshness-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch dashboard_data.json from production
        run: |
          mkdir -p audit_dashboard/data audit_trail/data
          # The host rate-limits datacenter ranges; a bare curl gets an immediate
          # 403 from GitHub runners. Retry on 403/429/5xx before falling back.
          # 2026-11-26: --retry-on-http-error is NOT a curl option (curl exits 2
          # before connecting), so all four attempts aborted and the run reported
          # "both data sources unreachable". --retry-all-errors covers 403/429/5xx.
          url="https://findtorontoevents.ca/audit/data/dashboard_data.json"
          out=audit_dashboard/data/dashboard_data.json
          ok=0
          for i in 1 2 3 4; do
            if curl -fsS --max-time 180 --retry 2 --retry-delay 5 --retry-all-errors \
                 "$url" -o "$out"; then
              ok=1; break
            fi
            echo "::warning::dashboard_data.json attempt $i failed (host may be blocking runner IPs); backing off $((i*15))s"
            sleep $((i * 15))
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::primary unavailable; trying payload mirror"
            curl -fsS --max-time 180 --retry 2 --retry-delay 5 --retry-all-errors \
              "https://findtorontoevents.ca/audit/data/dashboard_payload.json" \
              -o audit_trail/data/dashboard_payload.json \
              || echo "::warning::both data sources unreachable"
          fi
          ls -la audit_dashboard/data/dashboard_data.json 2>&1 || true

      - name: Generate freshness report (warn-only)
        run: |
          # Pick whichever source actually landed, and never raise on a missing
          # one: this job is warn-only, so a skip is the correct outcome.
          input=audit_dashboard/data/dashboard_data.json
          if [ ! -s "$input" ] && [ -s audit_trail/data/dashboard_payload.json ]; then
            input=audit_trail/data/dashboard_payload.json
            echo "::warning::using payload mirror as report input"
          fi
          if [ ! -s "$input" ]; then
            echo "::warning::no data source available; skipping freshness report"
            exit 0
          fi
          python tools/generate_asset_class_freshness_report.py \
            --input "$input" \
            --stale-days 2 \
            --warn-only \
            --json-out /tmp/asset_class_freshness.json \
            --md-out /tmp/asset_class_freshness.md

      - name: Upload freshness artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asset-class-freshness-report
          path: |
            /tmp/asset_class_freshness.json
            /tmp/asset_class_freshness.md
          if-no-files-found: warn


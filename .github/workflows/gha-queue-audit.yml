name: GHA queue & duration audit

on:
  schedule:
    # Every 4 hours, staggered from the failure guardian (:00/:30) and the
    # stale-workflows audit (05:09) so the three monitors do not collide.
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Queue + duration audit
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run queue & duration audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/gha_queue_audit.py \
            --out reports/gha_queue_audit.json \
            || echo "::warning::queue audit failed (soft-fail)"

      # The report is a monitoring artifact, not data anything reads from the
      # repo. It used to be committed with safe_push.sh, but this workflow
      # declares `contents: read`, so every push was a guaranteed 403: 15
      # `fatal: unable to access` lines plus "All 5 push attempts failed" on
      # every run (16 min of pointless retries in the 2026-11-26 log). An
      # artifact keeps the report without needing contents: write and without
      # adding another pusher to the contended `main` branch.
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gha-queue-audit
          path: reports/gha_queue_audit.json
          retention-days: 30
          if-no-files-found: warn

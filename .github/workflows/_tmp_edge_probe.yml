name: _tmp edge probe 2
# TEMPORARY read-only. Deleted after this run.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Attribute, dedupe and out-of-sample test the strongest cohort
        env:
          DB_HOST: mysql.50webs.com
          DB_PORT: '3306'
          DB_USER: ejaguiar1_stocks
          DB_PASS: ${{ secrets.MYSQL_PASSWORD || secrets.AUDIT_DB_PASS }}
        run: |
          python3 -m pip install --quiet pymysql
          python3 - <<'PY'
          import os, collections, statistics as st, datetime as dt
          import pymysql

          cn=pymysql.connect(host=os.environ["DB_HOST"], port=int(os.environ.get("DB_PORT") or 3306),
                             user=os.environ["DB_USER"], password=os.environ["DB_PASS"],
                             database="ejaguiar1_stocks", connect_timeout=20)
          cur=cn.cursor(pymysql.cursors.DictCursor)

          # 1. WHO are the unnamed rows? aggregate by source_system x category
          cur.execute("""SELECT COALESCE(source_system,'') ss, COALESCE(category,'') cat,
                                COUNT(*) n, AVG(pnl_pct) avg_pnl,
                                SUM(pnl_pct>0) wins, MIN(created_at) first_seen, MAX(created_at) last_seen
                         FROM trading_picks
                         WHERE (strategy IS NULL OR strategy='') AND pnl_pct IS NOT NULL
                         GROUP BY ss, cat HAVING COUNT(*)>=25 ORDER BY n DESC LIMIT 15""")
          print("=== UNNAMED ROWS BY source_system x category ===")
          for r in cur.fetchall():
              wr=100*r["wins"]/r["n"]
              print(f"  {r['ss'][:26]:<27}{r['cat'][:14]:<15}n={r['n']:<5}win={wr:5.1f}% avg={float(r['avg_pnl']):+.3f}%  {str(r['first_seen'])[:10]}..{str(r['last_seen'])[:10]}")

          # 2. the same cohort with per-day dedupe (kill over-emission) + split-half
          cur.execute("""SELECT symbol, direction, pnl_pct, created_at, category, COALESCE(source_system,'') ss,
                                exit_reason, closed_at
                         FROM trading_picks
                         WHERE (strategy IS NULL OR strategy='') AND pnl_pct IS NOT NULL
                         ORDER BY created_at""")
          rows=cur.fetchall()
          print(f"\nunnamed rows with pnl: {len(rows)}")

          def stats(v, label):
              if not v: print(f"  {label:<34} n=0"); return
              v=sorted(v); n=len(v); w=sum(1 for x in v if x>0)
              k1=int(n*0.01); tv=v[:n-k1] if k1 else v
              print(f"  {label:<34}n={n:<5}win={100*w/n:5.1f}% mean={st.mean(v):+.3f}% med={st.median(v):+.3f}% trim1={st.mean(tv):+.3f}%")

          allp=[float(r["pnl_pct"]) for r in rows]
          stats(allp,"ALL unnamed")

          seen=set(); ded=[]
          for r in rows:
              key=(str(r["symbol"]), str(r["direction"]), str(r["created_at"])[:10])
              if key in seen: continue
              seen.add(key); ded.append(r)
          stats([float(r["pnl_pct"]) for r in ded], "deduped 1/symbol/direction/day")

          ded.sort(key=lambda r: str(r["created_at"]))
          mid=len(ded)//2
          stats([float(r["pnl_pct"]) for r in ded[:mid]], "deduped FIRST half")
          stats([float(r["pnl_pct"]) for r in ded[mid:]], "deduped SECOND half")

          bycat=collections.defaultdict(list)
          for r in ded: bycat[str(r["category"] or "?")].append(float(r["pnl_pct"]))
          print("\n  by category (deduped):")
          for k,v in sorted(bycat.items(), key=lambda kv:-len(kv[1]))[:8]:
              stats(v, f"    {k}")

          sym=collections.Counter(str(r["symbol"]) for r in ded)
          tot=len(ded)
          print(f"\n  symbol concentration: {len(sym)} symbols, top symbol {sym.most_common(1)[0]} = "
                f"{100*sym.most_common(1)[0][1]/tot:.1f}% of rows")
          er=collections.Counter(str(r["exit_reason"] or "?") for r in ded)
          print("  exit reasons:", dict(er.most_common(5)))

          # 3. same tests for the two other positive-median cohorts
          for strat in ("futures_bb_mean_reversion","cta_commodity_momentum_term","luxalgo_confluence"):
              cur.execute("""SELECT symbol, direction, pnl_pct, created_at FROM trading_picks
                             WHERE strategy=%s AND pnl_pct IS NOT NULL ORDER BY created_at""",(strat,))
              rs=cur.fetchall()
              if not rs: continue
              s2=set(); d2=[]
              for r in rs:
                  k=(str(r["symbol"]),str(r["direction"]),str(r["created_at"])[:10])
                  if k in s2: continue
                  s2.add(k); d2.append(float(r["pnl_pct"]))
              mid2=len(d2)//2
              print(f"\n{strat}: raw n={len(rs)}")
              stats([float(r["pnl_pct"]) for r in rs], "  raw")
              stats(d2, "  deduped")
              stats(d2[:mid2], "  deduped first half")
              stats(d2[mid2:], "  deduped second half")
          cn.close()
          PY

name: FRED Macro Refresh
run-name: "${{ github.workflow }} · ${{ github.event_name }} · ${{ github.sha }}"

on:
  schedule:
    - cron: '57 */6 * * *'  # every 6 hours
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only without this, so the "Commit if
# changed" git push fails 403. (The FRED API 400s in the fetch step are
# non-fatal warnings the sidecar tolerates — the push was the real failure.)
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FRED macro indicators
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python tools/fred_macro_sidecar.py

      - name: Commit if changed
        run: |
          if [ -f .github/scripts/safe_commit_push.sh ]; then
            bash .github/scripts/safe_commit_push.sh "auto: FRED macro context refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" tools/data/fred_macro_context.json
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tools/data/fred_macro_context.json
            git diff --cached --quiet || git commit -m "auto: FRED macro context refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # 2026-11-16: routed through safe_push — bare push dropped data on non-FF
            bash .github/scripts/safe_push.sh
          fi

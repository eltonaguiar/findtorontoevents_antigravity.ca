name: ALPHA ENGINE - Dynamic Runner (Cloud or Local)

# Concurrency group serializes dynamic-alpha-engine against itself. Runs can
# take 45+ min while cron fires every 30 min, so without this a new run can
# start before the prior one finishes its push, guaranteeing lock contention.
# cancel-in-progress: false keeps queued runs intact (data is always welcome).
concurrency:
  group: dynamic-alpha-engine-push
  cancel-in-progress: false

on:
  schedule:
    # 2026-11-16: runtime is 77-80 min against a 30-min cron (~2.6x the interval).
    # Scheduled workflows keep only one pending run, so most :18/:48 fires were
    # replaced before starting (~62% lost). Moved to a 2-hour cadence (120 min >
    # runtime), staggered to :23 to stay off the :00/:10/:30 hourly cluster.
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'full-cycle'
        type: choice
        options:
          - full-cycle
          - validate-only
          - generate-only
          - report
          - train-ml
      runner:
        description: 'Runner to use'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
      use_wsl_direct:
        description: 'Bypass GitHub Actions and run directly in WSL (fastest)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # Job 1: Run directly in WSL (bypasses GitHub Actions queue entirely)
  wsl-direct:
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event.inputs.use_wsl_direct == 'true'
    
    steps:
      - name: Run Alpha Engine directly in WSL
        shell: powershell
        run: |
          Write-Host " Running Alpha Engine directly in WSL (bypassing GitHub Actions)..." -ForegroundColor Cyan
          
          $mode = "${{ github.event.inputs.mode || 'full-cycle' }}"
          $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm"
          
          # Run the full pipeline in WSL
          wsl -d UbuntuRecovered -- bash -c "`
            set -e
            echo '========================================'
            echo '  ALPHA ENGINE - Direct WSL Execution'
            echo '  Mode: $mode'
            echo '  Time: $timestamp'
            echo '========================================'
            
            # Navigate to repo
            cd /mnt/e/findtorontoevents_antigravity.ca || cd ~/repo
            
            # Pull latest
            git pull origin main
            
            # Run scanner
            cd alpha_engine
            python3 production_scanner.py
            
            # Commit results
            cd ..
            git add alpha_engine/data/
            git diff --cached --quiet || git commit -m 'ALPHA ENGINE [WSL Direct] - $timestamp [skip ci]'
            # Commit-first-then-rebase pattern (replaces naive commit→push)
            for i in 1 2 3 4 5; do
              git pull --rebase --no-recurse-submodules -X theirs origin main 2>/dev/null || {
                echo "Rebase failed on attempt $i"
                git rebase --abort 2>/dev/null || true
                sleep $((i * 5))
                continue
              }
              if git push origin main 2>&1; then
                echo "Pushed successfully on attempt $i"
                break
              fi
              sleep $((i * 5))
            done
            
            echo '========================================'
            echo '  Complete!'
            echo '========================================'
          "
          
          Write-Host " WSL Direct execution complete" -ForegroundColor Green

  # Job 2: Standard GitHub Actions with dynamic runner selection
  alpha-engine:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    if: github.event.inputs.use_wsl_direct != 'true'
    defaults:
      run:
        shell: bash
    # Bumped 60 -> 90 (2026-11-16): the full scanner cycle routinely exceeds
    # 60 min, so runs were being killed at the job timeout before their push,
    # causing perpetual re-run churn (every cycle cancelled at ~60 min).
    timeout-minutes: 90

    steps:
      - name: Runner Info
        run: |
          echo "============================================"
          echo "  Alpha Engine - Dynamic Runner"
          echo "============================================"
          echo "Runner: ${{ runner.name }}"
          echo "OS: ${{ runner.os }}"
          echo "Selected: ${{ inputs.runner || 'ubuntu-latest' }}"
          echo "============================================"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1

      - name: Set up Python (cloud)
        if: runner.os != 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Python (self-hosted Windows with WSL)
        if: runner.os == 'Windows'
        run: |
          echo "Running on Windows self-hosted runner"
          echo "Python should be pre-installed in WSL"
          wsl python3 --version

      - name: Install dependencies
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            wsl pip3 install yfinance pandas numpy scikit-learn joblib requests pymysql
          else
            pip install yfinance pandas numpy scikit-learn joblib requests pymysql ccxt xgboost lightgbm pyarrow pytz
            pip install catboost 2>/dev/null || echo "catboost optional"
          fi
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"

      - name: Run Alpha Engine
        env:
          PYTHONPATH: ${{ github.workspace }}
          ALPHA_CONFLUENCE: "1"
          ALPHA_TOURNAMENT: "1"
          ALPHA_MIN_FAMILIES: "2"
          HF_GATE_EQUITY_BANNED_SOURCES: 'stocks_competition,fast_stocks_competition,multi_asset_institutional,kimi_signal_tracking,ml_bg_system_f'
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_STOCKS_PASSWORD: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD || secrets.DB_STOCKS_PASSWORD }}
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            wsl bash -c "cd /mnt/e/findtorontoevents_antigravity.ca && PYTHONPATH=/mnt/e/findtorontoevents_antigravity.ca python3 alpha_engine/production_scanner.py"
          else
            python alpha_engine/production_scanner.py
          fi

      - name: Commit results
        if: success()
        # 15m budget. Previously this step had a 5m cap while its inline retry
        # loop ran ~12m (RED timeouts). The inline loop also had NO per-op
        # timeout, so on 2026-11-16 a single `git pull --rebase` HUNG the whole
        # step to the cap (run 43799911205). Now we delegate to safe_push.sh
        # whose git ops are each capped at 90s — realistic push finish is 2-5m,
        # worst case bounded; a genuine stall can no longer hang the step.
        timeout-minutes: 30
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "ALPHA ENGINE [$(date -u '+%Y-%m-%d %H:%M UTC')] [skip ci]"
          # Use the repo's hardened push helper. safe_push.sh:
          #   - caps every git network op at 90s (GIT_NET_TIMEOUT) so a stalled
          #     fetch/push can NEVER hang the step (the old inline loop called
          #     `git pull --rebase ... 2>/dev/null` with NO timeout and on
          #     2026-11-16 hung the full 15-min step -> RED, run 43799911205);
          #   - deepens the shallow clone (--deepen=150, capped at 90s) so rebase
          #     has a merge base, falling back to merge if deepen stalls;
          #   - fails fast on auth / permanent rejections instead of burning clock.
          # Non-fatal by design: on failure we warn and self-heal next cycle
          # (each cycle re-generates from scratch on the fetch-depth:1 clone).
          if ! bash .github/scripts/safe_push.sh; then
            echo "::warning::Alpha Engine push failed after safe_push.sh retries — data self-heals next cycle"
          fi

name: forward observations ingest

# P1-4: the forward-observation ledger (reports/forward_observations.jsonl) is the
# only table that can mint PROVEN_T2 from evidence postdating a hypothesis. It was
# filled once by hand on 2026-11-19 (430 H-119 rows, commit 5c0c42d) and then
# stopped: nothing scheduled the writer, and the writer defaults to a dry run.
# A ledger that does not accrue is indistinguishable from no ledger, so this job
# runs the ingest on its own 6-hourly schedule and commits the result.
#
# Offsets: audit3-ledger owns ':23 */6', the denylist watchdog owns ':45 *'.
# This job owns ':41 */6' so it never contends with either.
#
# Failure policy: if the DB secret is absent the job warns and exits green (the
# same convention audit3-ledger uses for its optional selection-alpha step). If
# the secret is present but ingestion fails, the job goes RED — a silent gap in
# forward evidence is exactly the failure this job exists to surface.

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forward-observations-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
      DB_PASSWORDS_JSON: ${{ secrets.DB_PASSWORDS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main          # never push a feature branch's files to main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install DB driver
        run: python3 -m pip install --quiet 'pymysql>=1.1'

      # POD-EQUITY-BREAKOUT is the only pre_registered pod, so it is the only one
      # that can mint a PROVEN_T2 verdict — and it had 0 forward rows 7.1d after
      # registration because its emitter was never scheduled (reports/
      # audit3_confirmatory.json). data/cache/asset_class_review/*_5y.csv is
      # gitignored, so a clean runner has no bars to evaluate; refresh them here,
      # then emit. Without these two steps the watchdog below fails by design.
      - name: Refresh equity bar cache for the breakout pod
        run: |
          python3 -m pip install --quiet 'yfinance>=0.2.30' 'pandas>=2.0'
          python3 - <<'PY'
          import os

          import pandas as pd
          import yfinance as yf

          OUT = "data/cache/asset_class_review"
          os.makedirs(OUT, exist_ok=True)
          # Liquid, long-history US names + the ETFs the pod declares. Widen this
          # list to grow pod coverage; every symbol must have an equity/ETF
          # ticker shape for emit_equity_breakout_pod._is_equity to accept it.
          SYMBOLS = [
              "SPY", "QQQ", "IWM", "DIA",
              "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "AVGO",
              "JPM", "BAC", "GS", "XOM", "CVX", "JNJ", "PFE", "UNH",
              "WMT", "COST", "HD", "CAT", "DE", "BA", "GE",
          ]
          ok = 0
          for sym in SYMBOLS:
              try:
                  df = yf.download(sym, period="5y", interval="1d",
                                   auto_adjust=False, progress=False, threads=False)
                  if df is None or df.empty:
                      print(f"  {sym}: no data")
                      continue
                  if isinstance(df.columns, pd.MultiIndex):
                      df.columns = [c[0] for c in df.columns]
                  df = df.reset_index()
                  df.columns = [str(c) for c in df.columns]
                  keep = [c for c in ("Date", "Open", "High", "Low", "Close", "Volume")
                          if c in df.columns]
                  df[keep].to_csv(f"{OUT}/{sym}_5y.csv", index=False)
                  ok += 1
              except Exception as exc:  # noqa: BLE001 - one bad ticker must not stop the rest
                  print(f"  {sym}: {type(exc).__name__}: {exc}")
          print(f"cached {ok}/{len(SYMBOLS)} symbols")
          assert ok >= 10, "too few symbols cached - the pod would emit on a tiny universe"
          PY

      - name: Emit POD-EQUITY-BREAKOUT rows
        if: env.DB_PASS_STOCKS != '' || env.DB_PASSWORDS_JSON != ''
        run: |
          # One run per strategy, all four declared in the pod manifest. The
          # writer is idempotent (deterministic id = strategy|symbol|signal-date)
          # and stores the honest forward outcome recorded from the bars that
          # followed each signal.
          for strategy in donchian rs-breakout vol-contraction adx-trend; do
            echo "=== emitting $strategy ==="
            python3 tools/emit_equity_breakout_pod.py --strategy "$strategy" --apply
          done

      - name: Ingest honest cohort into the forward ledger
        run: |
          if [ -z "$DB_PASS_STOCKS" ] && [ -z "$DB_PASSWORDS_JSON" ]; then
            echo "::warning title=forward-observations::no DB secret — ledger not accruing"
            exit 0
          fi
          python3 -m alpha_engine.forward_observations_ingest \
            --apply --json --ledger reports/forward_observations.jsonl \
            | tee /tmp/forward_ingest.json

      - name: Forward-growth watchdog (B3)
        if: env.DB_PASS_STOCKS != '' || env.DB_PASSWORDS_JSON != ''
        run: |
          # Silent non-accrual is the failure mode this job exists to catch:
          # eligible rows exist, the writer exits 0, and the ledger does not grow.
          python3 tools/forward_growth_watchdog.py \
            --ledger reports/forward_observations.jsonl \
            --ingest-report /tmp/forward_ingest.json \
            --manifest reports/audit3_confirmatory.json \
            --max-age-days 7 --grace-days 7

      - name: Summarise ledger health
        if: env.DB_PASS_STOCKS != '' || env.DB_PASSWORDS_JSON != ''
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          rows = [json.loads(l) for l in open("reports/forward_observations.jsonl") if l.strip()]
          by_h = Counter(r.get("hypothesis_id") for r in rows)
          rep = json.load(open("/tmp/forward_ingest.json"))
          print(f"ledger rows={len(rows)} by_hypothesis={dict(by_h)}")
          print(f"this run: admissible={rep.get('n_admissible')} "
                f"added={rep.get('write',{}).get('added')} "
                f"duplicates={rep.get('write',{}).get('duplicates')}")
          # Every registered pod with no forward rows is a coverage hole the page
          # must show; fail only when the ledger is empty (writer is broken).
          assert rows, "forward ledger is empty after an --apply run"
          assert rep.get("n_admissible", 0) > 0, (
              "no admissible rows this run - the forward writer is not accruing "
              "(added==0 with n_admissible>0 is fine: duplicates only)")
          # A verdict-bearing PROVEN/CANDIDATE cell with no forward instrument can
          # never be confirmed. Say so loudly instead of letting the ledger look
          # complete because it is non-empty.
          try:
              led = json.load(open("audit_dashboard/data/audit3_ledger.json"))
          except Exception:
              led = {}
          cells = [c for c in (led.get("cells") or [])
                   if c.get("verdict") in ("PROVEN_T2", "CANDIDATE")]
          if cells:
              print(f"promotion-eligible cells needing forward evidence: {len(cells)}")
              for c in cells[:20]:
                  print(f"  {c.get('verdict')} {c.get('asset_class')}/{c.get('strategy')}/"
                        f"{c.get('direction')} n={c.get('n')}")
          registered = set(by_h)
          if not registered:
              print("::warning title=forward-observations::no hypothesis has forward rows")
          PY

      - name: Commit ledger (data only, [skip ci])
        if: github.ref == 'refs/heads/main' && (env.DB_PASS_STOCKS != '' || env.DB_PASSWORDS_JSON != '')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/forward_observations.jsonl
          if git diff --cached --quiet; then
            echo "forward ledger unchanged"
            exit 0
          fi
          git commit -m "chore(forward): accrue forward observations from honest cohort [skip ci]"
          # Bounded push via safe_push.sh: every git call is capped at 90s and retried
          # with backoff, so a contended main fails this step instead of hanging past
          # the job's timeout-minutes and silently losing the commit.
          if ! bash .github/scripts/safe_push.sh; then
            echo "::error title=forward-observations::ledger commit could not be pushed"
            exit 1
          fi

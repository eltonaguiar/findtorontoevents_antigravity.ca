# Sync Polymarket sports signals to JSON for live-monitor/api/sports_picks.php
# This runs 2x daily and commits the output so the PHP endpoint can load
# prediction-market confirmation data without hitting external APIs on every request.
name: Sports Prediction Market Sync

on:
  schedule:
    - cron: '0 14,20 * * *'  # 10am, 4pm EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sports-prediction-market-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    # 2026-05-13: run 25824926796 — allow sync + auto-commit on slow checkout.
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Sync Polymarket sports signals
      run: |
        echo "=== Syncing Polymarket sports signals ==="
        python3 alpha_engine/sports_prediction_market_sync.py --verbose
        echo "Done"

    - name: Commit + push updated signals (safe_push)
      env:
        GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        set -e
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        FILES="backfill/sports_prediction_market_signals.json alpha_engine/data/sports_prediction_market_signals.json"
        git add $FILES 2>/dev/null || true
        git diff --cached --quiet && echo "No signal changes" && exit 0

        bash .github/scripts/assert_no_conflict_markers.sh || exit 1
        git commit -m "[skip ci] Auto-sync sports prediction market signals"

        pushed=0
        for i in 1 2 3 4 5; do
          git pull --rebase -X theirs origin main 2>/dev/null || {
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase -X theirs origin main 2>/dev/null || true
          }
          if bash .github/scripts/safe_push.sh; then
            pushed=1
            break
          fi
          echo "Retry $i..."
          sleep $((i * 3))
        done
        if [ "$pushed" -ne 1 ]; then
          echo "::error::sports-sync failed to push after 5 retries"
          exit 1
        fi

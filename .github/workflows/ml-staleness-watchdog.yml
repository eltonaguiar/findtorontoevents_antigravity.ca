name: ML Model Staleness Watchdog

# Daily check that ML model artifacts have been retrained within threshold.
# Origin: 2026-04-28 — Workstream A surfaced a 12-day silent regression in
# alpha_engine/auto_tuner.py (module-path bug at alpha-engine-live.yml:592)
# that was never noticed because no CI step asserted artifact freshness.
# Cursor's alignment addendum (updates/2026-04-28-claude-cursor-alignment-addendum.md)
# made this a Top-5 ROI guardrail.
#
# Mode: warn-only initially (`--warn-only`). Flip to hard-fail after:
#   1. Workstream B resolver fix lands (clears ML training-label contamination).
#   2. One full retraining cycle completes for the 6 currently-stale artifacts.
#   3. Reviewer audits TRACKED_ARTIFACTS list in tools/assert_model_freshness.py.
#
# Schedule: daily at 13:00 UTC (avoids dense push-storm windows + matches
# `hc-parity.yml`'s validation-only weekly cadence pattern).

on:
  schedule:
    - cron: '35 13 * * *'
  workflow_dispatch: {}
  pull_request:
    # Run on PRs that touch the artifact list itself or training pipelines.
    paths:
      - 'tools/assert_model_freshness.py'
      - 'alpha_engine/auto_tuner.py'
      - 'alpha_engine/crypto_ml_tuner.py'
      - 'alpha_engine/ml_ranker.py'
      - 'ml_gatekeeper/gatekeeper.py'
      - 'ml_battleground/retrain_on_live.py'
      - 'ml_crypto_predictor/enhanced_models/feedback_trainer.py'
      - 'mercury2/trainer.py'
      - 'claude_gainer_ml/trigger_retraining.py'
      - 'crypto_ml_edge/**'
      - '.github/workflows/ml-staleness-watchdog.yml'

concurrency:
  group: ml-staleness-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run staleness check (warn-only)
        # WARN-ONLY MODE: prints stale-artifact list but exits 0 so CI does
        # not block. Flip to hard-fail by removing --warn-only after the
        # 3 conditions in the file header are met.
        run: |
          python tools/assert_model_freshness.py \
            --threshold-days 7 \
            --warn-only \
            --json-out /tmp/freshness.json
          echo
          echo '## Summary'
          python -c "import json; d=json.load(open('/tmp/freshness.json')); c=d['counts']; print(f\"fresh={c.get('fresh',0)} stale={c.get('stale',0)} missing={c.get('missing',0)} skipped={c.get('skipped',0)}\")"

      - name: Scanner liveness (fail if scanner_ran=false for > 24h)
        # The ML scanners are fail-open by design: when their model artifact is
        # missing they record scanner_ran=false and stop. Without this check that
        # state is invisible - Mercury 2 sat dead from 2026-05-25 while every
        # hourly run reported success. Each scanner status file therefore keeps a
        # scanner_ran_false_since stamp (first time it went false, preserved across
        # subsequent failures); this asserts that stamp is younger than the limit.
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys
          from datetime import datetime, timezone

          LIMIT_HOURS = 24
          STATUS_FILES = {
              "claude_gainer_ml": "updates/data/antigravity_ml_performance.json",
              "mercury2": "updates/data/mercury2_scan_status.json",
          }

          now = datetime.now(timezone.utc)
          dead = []

          for name, rel in STATUS_FILES.items():
              p = pathlib.Path(rel)
              if not p.is_file():
                  print(f"  {name}: no status file ({rel}) - not scanned, skipping")
                  continue
              try:
                  d = json.loads(p.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"  {name}: unreadable status ({exc}) - skipping")
                  continue

              ran = d.get("scanner_ran")
              if ran is not False:
                  print(f"  {name}: scanner_ran={ran} - OK")
                  continue

              stamp = d.get("scanner_ran_false_since") or d.get("scanner_checked_at")
              if not stamp:
                  print(f"  {name}: scanner_ran=false with no timestamp - cannot age, flagging")
                  dead.append((name, "unknown", d.get("scanner_reason")))
                  continue
              try:
                  since = datetime.fromisoformat(str(stamp).replace("Z", "+00:00"))
              except ValueError:
                  print(f"  {name}: bad timestamp {stamp!r} - skipping")
                  continue
              if since.tzinfo is None:
                  since = since.replace(tzinfo=timezone.utc)

              age_h = (now - since).total_seconds() / 3600
              if age_h > LIMIT_HOURS:
                  print(f"  {name}: scanner_ran=false for {age_h:.1f}h (limit {LIMIT_HOURS}h, reason={d.get('scanner_reason')})")
                  dead.append((name, f"{age_h:.1f}h", d.get("scanner_reason")))
              else:
                  print(f"  {name}: scanner_ran=false for {age_h:.1f}h - within limit, watching")

          if dead:
              print()
              for name, age, reason in dead:
                  print(f"::error::scanner '{name}' has not run for {age} (reason={reason})")
              sys.exit(1)
          print("\nall scanner statuses healthy")
          PY

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ml-staleness-report
          path: /tmp/freshness.json
          if-no-files-found: warn

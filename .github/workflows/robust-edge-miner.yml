# Always-on robust-edge detector. The honest winner-hunt (2026-06-22) found 0 robust edges in
# the current cohort (every cell fails ex-top-3-symbol survival and/or both-regime profitability).
# As forward-n accrues, a genuine edge may emerge. This cron continuously re-mines and ALERTS
# (fails the run, loudly) the moment a cell passes the full robustness gate — so we catch a real
# winner the instant it materializes instead of relying on a human to re-run the scan.
name: robust-edge-miner

'on':
  schedule:
    - cron: '40 */12 * * *'  # every 12h at :40 (offset from the other crons)
  workflow_dispatch:

concurrency:
  group: robust-edge-miner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_STOCKS_HOST: mysql.50webs.com
      DB_STOCKS_USER: ejaguiar1_stocks
      DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD || secrets.DB_PASS_STOCKS || 'stocks' }}
      DB_STOCKS_NAME: ejaguiar1_stocks
      DB_STOCKS_PORT: '3306'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install pymysql requests pytz
      - name: Run robust edge miner
        run: |
          python3 tools/mine_entry_condition_cells.py --limit 4000 \
            > reports/entry_cell_scan_robust_latest.json 2> /tmp/miner.err || true
          echo '### robust-edge-miner' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 /tmp/miner.err >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: entry-cell-scan-robust
          path: reports/entry_cell_scan_robust_latest.json
          retention-days: 30
      - name: Alert if a ROBUST candidate appeared (fail-LOUD = good news, review now)
        run: |
          python3 -c "
          import json, sys
          try:
              d = json.load(open('reports/entry_cell_scan_robust_latest.json'))
          except Exception as e:
              print(f'::error title=miner_no_output::scan JSON unreadable: {e}'); sys.exit(1)
          robust = d.get('robust_candidates') or []
          print(f'cells_tested={d.get(\"cells_tested\")} cohort_n={d.get(\"cohort_n\")} robust={len(robust)}')
          if robust:
              cells = ', '.join(r.get('cell','?') for r in robust)
              print(f'::error title=ROBUST_EDGE_CANDIDATE::{len(robust)} cell(s) passed the full robustness gate (netPF>=1.3, ex-top3>=1.0, n>=40, both regimes): {cells}. GOOD NEWS — review + forward-register + swarm-verify before any sizing.')
              sys.exit(1)
          print('0 robust candidates — current cohort still has no robust edge (expected until forward-n grows).')
          "

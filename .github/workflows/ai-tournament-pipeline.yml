name: AI Tournament Pipeline — Daily Picks + DB Ingest

on:
  schedule:
    # Daily at 12:00 UTC (before price tracker at 23:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Force re-generate picks for all models × personas'
        type: boolean
        default: false
      skip_backfill:
        description: 'Skip persona backfill step'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no DB writes)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-tournament-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    # MASTERPLAN 2026-06-05: tournament ingest frozen until clean ingest + forward n≥100
    if: ${{ vars.AI_TOURNAMENT_PIPELINE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # 2026-05-28: bumped 15→45. With 16 provider secrets now set, the expanded
    # model fleet's serial "Generate picks fleet" step exceeded the 15-min ceiling
    # and GitHub auto-cancelled every run (26513551034, 26555312404 both died at
    # ~15m on that step → 0 fresh picks). 45m gives the full fleet room; pairs with
    # AI_TOURNAMENT_MAX_WORKERS parallelism (PR #24) to stay well under in practice.
    # 2026-05-29: bumped 45→120. The de-rostered-model revival took the roster
    # 23→42; populate_picks.py iterates models SERIALLY (no worker pool), so run
    # 26638947344 was auto-cancelled at ~46m mid-fleet → 0 fresh picks. 120m gives
    # the doubled fleet room. TODO: parallelize the fleet loop to cut wall-clock.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet pymysql yfinance requests cerebras-cloud-sdk

      - name: Check existing picks state
        id: check_state
        run: |
          echo "=== Existing picks files ==="
          ls -la data/ai_tournament/picks_*.json 2>/dev/null || echo "(none yet)"
          echo "=== Config mapping ==="
          python3 -c "
          import json, sys
          try:
              m = json.load(open('config/model_persona_mapping.json'))
              total = sum(len(assignments)
                          for mod in m['models'].values()
                          for ast, pids in mod.get('assignments',{}).items()
                          for _ in pids)
              print(f'Total model x persona x asset_class combos: {total}')
              for mid, cfg in m['models'].items():
                  n = sum(len(pids) for pids in cfg.get('assignments',{}).values())
                  print(f'  {mid:30s} {n} assignments')
          except Exception as e:
              print(f'::warning title=config_mapping::Could not load config/model_persona_mapping.json: {e}')
          "
        # Ensure this step always passes so pipeline continues
        continue-on-error: true

      - name: Generate picks fleet
        env:
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate || 'false' }}
          # 2026-05-30: bumped 8->16 to cut wall-clock. Run 26641993453 spent
          # 44m of 74m in "Generate picks fleet" (~10.5s/task LLM latency
          # × 250 tasks / 8 workers). Per-key cap stays at 2 so per-provider
          # concurrency is unchanged — only filling more provider slots in
          # parallel. Target wall-clock ~22m for the same fleet. populate_picks
          # is already parallelized via ThreadPoolExecutor in
          # collect_api_and_coverage_picks(); this is just a pool-size knob.
          AI_TOURNAMENT_MAX_WORKERS: '16'
          AI_TOURNAMENT_MAX_WORKERS_PER_KEY: '2'
          # API keys — only set ones where you have a secret configured.
          # Fallbacks let the workflow use alternate secret names already in the
          # repo (e.g. GEMINI_FREE_KEY for GOOGLE_AI_API_KEY) so models don't
          # silently skip when the primary name is unset.
          # See reports/2026-05-27_ai_tournament_model_gap_diagnosis.md.
          # OPENAI_API_KEY set 2026-05-28T05:37Z (gpt4o_mini active).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          # ANTHROPIC_API_KEY set 2026-05-28T05:37Z (cursor_agent + claude_opus active).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || '' }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY || secrets.CEREBRAS_API_KEY_FREE || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || '' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || '' }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY || secrets.GEMINI_FREE_KEY || '' }}
          GEMINI_FREE_KEY: ${{ secrets.GEMINI_FREE_KEY || secrets.GOOGLE_AI_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
          # Additional providers — wired 2026-05-27 (broadened 2026-05-28) from
          # existing repo secrets. Each one unlocks one or more model_id slots
          # in config/model_persona_mapping.json. See reports/2026-05-28_ai_tournament_model_coverage_fix.md.
          # INCEPTION_API_KEY drives mercury; falls back to TOGETHER since
          # config.model_persona_mapping.mercury actually routes via Together.
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY || secrets.TOGETHER_API_KEY || '' }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY || '' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || '' }}
          # GROQ_KEY is the legacy secret name still present in the vault.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY || '' }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY || '' }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY || '' }}
          NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY || '' }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY || '' }}
          AIMLAPI_API_KEY: ${{ secrets.AIMLAPI_API_KEY || '' }}
          HYPERBOLIC_API_KEY: ${{ secrets.HYPERBOLIC_API_KEY || '' }}
          FEATHER_API_KEY: ${{ secrets.FEATHER_API_KEY || '' }}
          AI_TOURNAMENT_COVERAGE_FALLBACK_ENABLED: "true"
          AI_TOURNAMENT_API_TIMEOUT_SECONDS: "25"
          AI_TOURNAMENT_API_SLEEP_SECONDS: "0.2"
        run: |
          echo "=== Generating tournament picks ==="
          python tools/populate_picks.py || echo "::warning title=populate_picks::picks generation failed (see above)"

      - name: Backfill persona IDs
        if: ${{ !inputs.skip_backfill && !cancelled() }}
        run: |
          echo "=== Backfilling persona IDs ==="
          KEY_FILES=$(ls -t data/ai_tournament/picks_*.json 2>/dev/null | head -5)
          if [ -n "$KEY_FILES" ]; then
            for f in $KEY_FILES; do
              echo "  Processing $f ..."
              python tools/backfill_persona_picks.py --in-place --file "$f" 2>&1 | tail -5
            done
          else
            echo "  No picks files to backfill"
          fi
        # Soft-fail: persona backfill is not critical
        continue-on-error: true

      - name: Ingest to MySQL
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_HOST_STOCKS: ${{ secrets.DB_HOST_STOCKS || 'mysql.50webs.com' }}
          DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS || 'ejaguiar1_stocks' }}
          DB_USER_STOCKS: ${{ secrets.DB_USER_STOCKS || 'ejaguiar1_stocks' }}
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          echo "=== Ingesting picks to MySQL ==="
          python tools/ai_tournament/ingest_to_db.py $DRY_FLAG || echo "::warning title=mysql_ingest::MySQL ingest failed (see above — JSON files still saved)"
        # Soft-fail: JSON files are the source of truth
        continue-on-error: true

      - name: Update leaderboard
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_HOST_STOCKS: ${{ secrets.DB_HOST_STOCKS || 'mysql.50webs.com' }}
          DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS || 'ejaguiar1_stocks' }}
          DB_USER_STOCKS: ${{ secrets.DB_USER_STOCKS || 'ejaguiar1_stocks' }}
        run: |
          echo "=== Rebuilding ai_tournament_picks_latest.json from the DB (authoritative source) ==="
          # The DB (populated by ingest_to_db.py above) holds every model's picks.
          # Rebuilding from it avoids the submissions/*.json glob going stale and
          # stranding the page on a partial model set (see rebuild_latest_from_db.py).
          if python tools/ai_tournament/rebuild_latest_from_db.py; then
            echo "rebuilt latest.json from DB"
          else
            echo "::warning title=rebuild::DB rebuild failed — falling back to submissions merge"
            python tools/ai_tournament/merge_submissions_to_latest.py || echo "::warning title=merge::Submission merge failed"
          fi
          echo "=== Updating leaderboard ==="
          python tools/ai_tournament/update_leaderboard.py || echo "::warning title=leaderboard::Leaderboard update failed"
          echo "=== Rebuilding model summary (drives the table on /audit/ai-tournament.html) ==="
          python tools/ai_tournament/build_model_summary.py || echo "::warning title=model_summary::Model summary build failed"
          echo "=== Exporting tier-rating algorithms (DB -> tier_rating_algorithms.json; fixes the stuck panel) ==="
          python tools/ai_tournament/export_tier_rating_algorithms.py || echo "::warning title=tier_rating::tier-rating export failed"
          echo "=== Generating model diagnostics (API health snapshot) ==="
          python tools/ai_tournament/generate_diagnostics.py || echo "::warning title=diagnostics::Diagnostics generation failed"
          echo "=== Leaderboard output ==="
          if [ -f 'audit_dashboard/data/ai_tournament_leaderboard.json' ]; then
            python3 -c "
          import json
          lb = json.load(open('audit_dashboard/data/ai_tournament_leaderboard.json'))
          for m in lb.get('models', []):
              print(f\"  {m['model_id']:30s} picks={m['n_picks']} wr={m['wr']:.2%} pf={m['pf']:.2f} score={m['score']:.4f} tier={m['tier']}\")
          "
          else
            echo "  (no leaderboard file yet)"
          fi
        # Soft-fail: leaderboard may not exist on first run
        continue-on-error: true

      # NOTE: the former "Copy latest picks to audit_dashboard/data" step was
      # removed 2026-05-28. It (a) had a broken shell `if` with no `fi`, and
      # (b) would have clobbered the DB-sourced ai_tournament_picks_latest.json
      # (full history, all models) with a single day's aggregate. The
      # "Update leaderboard" step above now rebuilds latest.json from the DB.

      - name: Sync persona registry to database
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_HOST_STOCKS: ${{ secrets.DB_HOST_STOCKS || 'mysql.50webs.com' }}
          DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS || 'ejaguiar1_stocks' }}
          DB_USER_STOCKS: ${{ secrets.DB_USER_STOCKS || 'ejaguiar1_stocks' }}
        run: |
          echo "=== Syncing persona registry ==="
          python tools/ai_tournament/persona_registry.py || echo "::warning title=persona_registry::Persona registry sync failed"

      - name: Run kill gate (auto-prune failing strategies)
        run: |
          echo "=== Running statistical kill gate ==="
          python tools/ai_tournament/kill_gate.py || echo "::warning title=kill_gate::Kill gate failed"

      - name: Wire copy trader picks into tournament format
        run: |
          echo "=== Running copy trader adapter ==="
          python tools/ai_tournament/copy_trader_adapter.py || echo "::warning title=copy_trader::Copy trader adapter failed (no data available?)"
          # Merge copy trader picks into latest tournament picks if generated
          if [ -f 'audit_dashboard/data/copy_trader_tournament_picks.json' ]; then
            echo "Merging copy trader picks into tournament data"
            python3 tools/ai_tournament/merge_copy_trader.py || echo "::warning title=copy_trader_merge::Copy trader merge failed"
          fi

      - name: Generate research topics and leaderboard analytics
        run: |
          echo "=== Generating research topics ==="
          python tools/ai_tournament/research_generator.py || echo "::warning title=research_generator::Research generation failed"
          
          echo "=== Running portfolio analytics ==="
          python tools/tournament_analytics.py 2>&1 | head -20 || echo "::warning title=portfolio_analytics::Analytics failed"
          if [ -f 'audit_dashboard/data/research/risk_metrics.json' ]; then
            echo "Risk metrics generated"
          fi
          
          echo "=== Generating tournament dashboard summary ==="
          python tools/ai_tournament/gen_tournament_summary.py || echo "::warning title=tournament_summary::Summary failed"
          if [ -f 'audit_dashboard/data/ai_tournament_model_summary.json' ]; then
            echo "Tournament model summary generated"
          fi
          
          if [ -f 'audit_dashboard/data/research/ai_leaderboard_data.json' ]; then
            echo "Leaderboard analytics data generated"
            python3 -c "
          import json
          d = json.load(open('audit_dashboard/data/research/ai_leaderboard_data.json'))
          print(f\"  {d['n_picks_total']} total picks | {d['n_models']} models | {d['n_personas']} personas | {d['n_asset_classes']} asset classes\")
          for e in d.get('leaderboard_entries', [])[:5]:
              print(f\"  {e['model_id']:20s}/{e['persona_id']:25s} picks={e['n_picks']} conf={e['avg_confidence']} ac={e['n_asset_classes']}\")
          "
          fi
        continue-on-error: true

      - name: Verify output was produced
        run: |
          FAILED=0
          if [ ! -f 'data/ai_tournament/picks_'$(date -u +%Y%m%d)'.json' ]; then
            echo "::error title=no_picks::No picks file was generated for today"
            FAILED=1
          fi
          if [ ! -f 'audit_dashboard/data/ai_tournament_picks_latest.json' ]; then
            echo "::error title=no_latest::No latest picks snapshot was copied"
            FAILED=1
          fi
          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
          echo "✅ All output files present"

      - name: Commit results
        run: |
          git config user.name  "Tournament Bot"
          git config user.email "tournament@findtorontoevents.ca"

          git add data/ai_tournament/
          git add audit_dashboard/data/ai_tournament_picks_latest.json
          git add audit_dashboard/data/ai_tournament_leaderboard.json
          git add audit_dashboard/data/ai_tournament_model_summary.json || true
          git add audit_dashboard/data/tier_rating_algorithms.json || true
          git add audit_dashboard/data/ai_tournament_model_diagnostics.json || true
          git add audit_dashboard/data/research/ai_leaderboard_data.json
          git add audit_dashboard/data/research/research_index_data.json

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          bash .github/scripts/assert_no_conflict_markers.sh || exit 1
          git commit -m "chore(tournament): daily picks fleet $(date -u +%Y-%m-%d) [skip ci]"

          for i in 1 2 3; do
            git stash --include-untracked 2>/dev/null || true
            bash .github/scripts/safe_push.sh && break
            echo "Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            git stash pop 2>/dev/null || true
            sleep ${i}0
          done

      # 2026-05-25 AUX fix (5-peer consult consensus, see
      # reports/2026-05-25_resolver_pipeline_5peer_consult.md):
      # The pipeline regenerated audit_dashboard/ai-tournament.html and
      # committed it, but the live findtorontoevents.ca/audit/ai-tournament.html
      # was stuck at the pre-fix size (49,139 bytes) because no workflow
      # was FTP-uploading it. 50webs has no shell — files don't reach
      # production until somebody FTP-uploads them.
      - name: FTP upload AI tournament artifacts to findtorontoevents.ca
        if: ${{ !inputs.dry_run }}
        env:
          FTP_USER:   ${{ secrets.FTP_USER }}
          FTP_PASS:   ${{ secrets.FTP_PASS }}
          FTP_SERVER: ${{ secrets.FTP_SERVER || 'ftps2.50webs.com' }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::warning title=ftp::FTP_USER/FTP_PASS secrets not set — skipping live deploy. ai-tournament.html will serve stale until manual upload."
            exit 0
          fi
          python tools/deploy_audit_files.py --only ai_tournament || echo "::warning title=ftp::ai_tournament upload had failures"
        continue-on-error: true

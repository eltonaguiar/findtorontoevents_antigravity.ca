name: Automated Reporting

on:
  schedule:
    # Daily at 8am UTC (for morning review)
    - cron: '0 8 * * *'
    # Weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Type of report to generate'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - monthly

env:
  PYTHONUNBUFFERED: 1

# Without this the default GITHUB_TOKEN is read-only when secrets.GH_PAT is
# unset, so the github.token fallback in the checkout step cannot push the
# generated report back to main (403 denied to github-actions[bot]).
permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0 # Full history for analysis
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pandas numpy matplotlib seaborn jinja2
      
      - name: Determine report type
        id: report-type
        run: |
          if [ "${{ github.event.inputs.report_type }}" != "" ]; then
            echo "type=${{ github.event.inputs.report_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" == "0 9 * * 1" ]; then
            echo "type=weekly" >> $GITHUB_OUTPUT
          else
            echo "type=daily" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate report
        run: |
          python3 << 'PYEOF'
          import os
          import sys
          import json
          import sqlite3
          from datetime import datetime, timedelta
          from pathlib import Path
          
          sys.path.insert(0, '.')
          
          report_type = os.environ.get('REPORT_TYPE', 'daily')
          
          # Determine time period
          if report_type == 'daily':
              days_back = 1
              period_name = "Daily"
          elif report_type == 'weekly':
              days_back = 7
              period_name = "Weekly"
          else:
              days_back = 30
              period_name = "Monthly"
          
          report = {
              'report_type': report_type,
              'period': period_name,
              'generated_at': datetime.now().isoformat(),
              'sections': {}
          }
          
          # === Section 1: Signal Performance ===
          section_signals = {
              'title': 'Signal Performance',
              'data': {}
          }
          
          if os.path.exists('forward_tracking.db'):
              conn = sqlite3.connect('forward_tracking.db')
              cursor = conn.cursor()
              
              # Overall stats for period
              cursor.execute(f"""
                  SELECT 
                      COUNT(*) as total,
                      SUM(CASE WHEN status = 'tp_hit' THEN 1 ELSE 0 END) as wins,
                      SUM(CASE WHEN status = 'sl_hit' THEN 1 ELSE 0 END) as losses,
                      SUM(CASE WHEN status = 'expired' THEN 1 ELSE 0 END) as expired,
                      SUM(CASE WHEN status = 'open' THEN 1 ELSE 0 END) as open,
                      AVG(CASE WHEN pnl_pct IS NOT NULL THEN pnl_pct END) as avg_pnl,
                      SUM(CASE WHEN pnl_pct IS NOT NULL THEN pnl_pct END) as total_pnl
                  FROM signals
                  WHERE timestamp >= datetime('now', '-{days_back} days')
              """)
              
              row = cursor.fetchone()
              total, wins, losses, expired, open_count, avg_pnl, total_pnl = row
              
              section_signals['data'] = {
                  'total_signals': total or 0,
                  'wins': wins or 0,
                  'losses': losses or 0,
                  'expired': expired or 0,
                  'open': open_count or 0,
                  'win_rate': round(wins / (wins + losses), 4) if (wins + losses) > 0 else 0,
                  'expiration_rate': round(expired / total, 4) if total > 0 else 0,
                  'avg_pnl_pct': round(avg_pnl, 4) if avg_pnl else 0,
                  'total_pnl_pct': round(total_pnl, 4) if total_pnl else 0
              }
              
              # Top performing systems
              cursor.execute(f"""
                  SELECT 
                      system,
                      COUNT(*) as total,
                      SUM(CASE WHEN status = 'tp_hit' THEN 1 ELSE 0 END) as wins,
                      AVG(CASE WHEN pnl_pct IS NOT NULL THEN pnl_pct END) as avg_pnl
                  FROM signals
                  WHERE timestamp >= datetime('now', '-{days_back} days')
                  GROUP BY system
                  HAVING total >= 3
                  ORDER BY wins DESC
                  LIMIT 5
              """)
              
              section_signals['data']['top_systems'] = [
                  {
                      'system': row[0],
                      'signals': row[1],
                      'wins': row[2],
                      'win_rate': round(row[2] / row[1], 2) if row[1] > 0 else 0,
                      'avg_pnl': round(row[3], 4) if row[3] else 0
                  }
                  for row in cursor.fetchall()
              ]
              
              conn.close()
          
          report['sections']['signals'] = section_signals
          
          # === Section 2: ML Model Performance ===
          section_ml = {
              'title': 'ML Model Performance',
              'data': {}
          }
          
          # Check model files
          models_status = {}
          
          model_files = {
              'consensus': 'signal_aggregator/models/training_report.json',
              'quality': 'forward_testing/models/training_report.json',
              'risk': 'risk_management/models/risk_model_metadata.json'
          }
          
          for name, path in model_files.items():
              if os.path.exists(path):
                  try:
                      with open(path) as f:
                          data = json.load(f)
                          models_status[name] = {
                              'status': 'trained',
                              'last_trained': data.get('trained_at') or data.get('timestamp') or data.get('stats', {}).get('trained_at'),
                              'metrics': data.get('stats', {})
                          }
                  except:
                      models_status[name] = {'status': 'error'}
              else:
                  models_status[name] = {'status': 'not_trained'}
          
          section_ml['data']['models'] = models_status
          report['sections']['ml'] = section_ml
          
          # === Section 3: System Health ===
          section_health = {
              'title': 'System Health',
              'data': {}
          }
          
          if os.path.exists('reports/health/latest.json'):
              with open('reports/health/latest.json') as f:
                  health_data = json.load(f)
                  section_health['data'] = {
                      'overall_status': health_data.get('overall_status', 'UNKNOWN'),
                      'last_check': health_data.get('timestamp'),
                      'critical_issues': len(health_data.get('critical_issues', []))
                  }
          
          report['sections']['health'] = section_health
          
          # === Section 4: Git Activity ===
          section_git = {
              'title': 'Development Activity',
              'data': {}
          }
          
          # Count commits in period
          import subprocess
          
          since_date = (datetime.now() - timedelta(days=days_back)).strftime('%Y-%m-%d')
          
          try:
              commits = subprocess.check_output(
                  ['git', 'log', '--oneline', f'--since={since_date}', '--all'],
                  text=True
              ).strip().split('\n')
              section_git['data']['commits'] = len([c for c in commits if c])
          except:
              section_git['data']['commits'] = 0
          
          # Recent files changed
          try:
              files = subprocess.check_output(
                  ['git', 'diff', '--name-only', f'HEAD~{min(days_back, 10)}..HEAD'],
                  text=True
              ).strip().split('\n')
              section_git['data']['files_changed'] = len([f for f in files if f])
          except:
              section_git['data']['files_changed'] = 0
          
          report['sections']['git'] = section_git
          
          # === Save Report ===
          os.makedirs(f'reports/{report_type}', exist_ok=True)
          
          timestamp = datetime.now().strftime('%Y%m%d_%H%M')
          report_path = f'reports/{report_type}/report_{timestamp}.json'
          
          with open(report_path, 'w') as f:
              json.dump(report, f, indent=2)
          
          # Also save as latest
          with open(f'reports/{report_type}/latest.json', 'w') as f:
              json.dump(report, f, indent=2)
          
          # Print summary
          print(f"\n=== {period_name} Report Generated ===")
          print(f"Signals: {section_signals['data'].get('total_signals', 0)} total")
          print(f"Win Rate: {section_signals['data'].get('win_rate', 0):.1%}")
          print(f"ML Models: {sum(1 for m in models_status.values() if m['status'] == 'trained')}/{len(models_status)} trained")
          print(f"Health: {section_health['data'].get('overall_status', 'UNKNOWN')}")
          
          # Set outputs
          with open(os.environ.get('GITHUB_OUTPUT'), 'a') as f:
              f.write(f"report_path={report_path}\n")
              f.write(f"report_type={report_type}\n")
              f.write(f"signals_count={section_signals['data'].get('total_signals', 0)}\n")
          PYEOF
        env:
          REPORT_TYPE: ${{ steps.report-type.outputs.type }}
          GITHUB_OUTPUT: $GITHUB_OUTPUT
      
      - name: Generate HTML report
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from datetime import datetime
          
          report_type = os.environ.get('REPORT_TYPE', 'daily')
          
          # Load JSON report
          with open(f'reports/{report_type}/latest.json') as f:
              data = json.load(f)
          
          # Simple HTML template
          html = f'''<!DOCTYPE html>
          <html>
          <head>
              <title>{data['period']} Report - Crypto System</title>
              <style>
                  body {{ font-family: Arial, sans-serif; margin: 40px; background: #1a1a2e; color: #eee; }}
                  h1 {{ color: #4ecca3; }}
                  h2 {{ color: #45b7d1; border-bottom: 2px solid #45b7d1; padding-bottom: 10px; }}
                  .metric {{ background: #16213e; padding: 15px; margin: 10px 0; border-radius: 8px; }}
                  .metric-label {{ color: #888; font-size: 0.9em; }}
                  .metric-value {{ font-size: 1.5em; font-weight: bold; color: #4ecca3; }}
                  .status-healthy {{ color: #4ecca3; }}
                  .status-warning {{ color: #f5a623; }}
                  .status-critical {{ color: #e74c3c; }}
                  table {{ width: 100%; border-collapse: collapse; margin: 15px 0; }}
                  th, td {{ padding: 10px; text-align: left; border-bottom: 1px solid #333; }}
                  th {{ color: #45b7d1; }}
              </style>
          </head>
          <body>
              <h1> {data['period']} Crypto System Report</h1>
              <p>Generated: {data['generated_at'][:19]}</p>
          '''
          
          # Signal Performance Section
          signals = data['sections']['signals']['data']
          html += f'''
              <h2> Signal Performance</h2>
              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;">
                  <div class="metric">
                      <div class="metric-label">Total Signals</div>
                      <div class="metric-value">{signals.get('total_signals', 0)}</div>
                  </div>
                  <div class="metric">
                      <div class="metric-label">Win Rate</div>
                      <div class="metric-value">{signals.get('win_rate', 0):.1%}</div>
                  </div>
                  <div class="metric">
                      <div class="metric-label">Expiration Rate</div>
                      <div class="metric-value">{signals.get('expiration_rate', 0):.1%}</div>
                  </div>
                  <div class="metric">
                      <div class="metric-label">Total P&L</div>
                      <div class="metric-value">{signals.get('total_pnl_pct', 0):.2f}%</div>
                  </div>
              </div>
          '''
          
          # Top Systems
          if signals.get('top_systems'):
              html += '<h3>Top Performing Systems</h3><table>'
              html += '<tr><th>System</th><th>Signals</th><th>Win Rate</th><th>Avg P&L</th></tr>'
              for sys in signals['top_systems']:
                  html += f'''<tr>
                      <td>{sys['system']}</td>
                      <td>{sys['signals']}</td>
                      <td>{sys['win_rate']:.1%}</td>
                      <td>{sys['avg_pnl']:.2f}%</td>
                  </tr>'''
              html += '</table>'
          
          # ML Status
          ml = data['sections']['ml']['data']
          html += '<h2> ML Model Status</h2><table>'
          html += '<tr><th>Model</th><th>Status</th><th>Last Trained</th></tr>'
          for name, info in ml.get('models', {}).items():
              status_class = 'status-healthy' if info['status'] == 'trained' else 'status-warning'
              last_trained = info.get('last_trained', 'Never')[:10] if info.get('last_trained') else 'Never'
              html += f'''<tr>
                  <td>{name.title()}</td>
                  <td class="{status_class}">{info['status']}</td>
                  <td>{last_trained}</td>
              </tr>'''
          html += '</table>'
          
          # Health Status
          health = data['sections']['health']['data']
          status_class = f"status-{health.get('overall_status', 'unknown').lower()}"
          html += f'''
              <h2> System Health</h2>
              <div class="metric">
                  <div class="metric-label">Overall Status</div>
                  <div class="metric-value {status_class}">{health.get('overall_status', 'UNKNOWN')}</div>
              </div>
          '''
          
          html += '</body></html>'
          
          # Save HTML
          html_path = f'reports/{report_type}/latest.html'
          with open(html_path, 'w') as f:
              f.write(html)
          
          print(f"HTML report saved: {html_path}")
          PYEOF
        env:
          REPORT_TYPE: ${{ steps.report-type.outputs.type }}
      
      - name: Commit reports
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT }}
        run: |
          git config --local user.email "reports@github.com"
          git config --local user.name "Reporting Bot"
          
          REPORT_TYPE="${{ steps.report-type.outputs.type }}"
          git add reports/$REPORT_TYPE/
          git diff --cached --quiet || git commit -m " $REPORT_TYPE report [skip ci]"
          bash .github/scripts/safe_push.sh
      
      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.report-type.outputs.type }}-report-${{ github.run_number }}
          path: reports/${{ steps.report-type.outputs.type }}/
          retention-days: 30
      
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_REPORTS }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No webhook configured"
            exit 0
          fi
          
          TYPE="${{ steps.report-type.outputs.type }}"
          SIGNALS="${{ steps.generate-report.outputs.signals_count }}"
          
          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \" ${TYPE^} Report Ready\",
                   \"color\": 3447003,
                   \"description\": \"New ${TYPE} report generated for crypto system\",
                   \"fields\": [
                     {\"name\": \"Signals\", \"value\": \"$SIGNALS\", \"inline\": true},
                     {\"name\": \"View\", \"value\": \"[Reports](https://github.com/${{ github.repository }}/tree/main/reports/$TYPE)\", \"inline\": true}
                   ],
                   \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                 }]
               }" \
               $DISCORD_WEBHOOK || true


name: Secret Scan (M-043)

# M-043 — Gitleaks secret scanning on every PR and push to main.
# Fails if hardcoded credentials are detected in changed files.
# Secrets are NEVER printed to logs (--redact is passed by the action by default).
#
# 2026-05-16: Removed push trigger on main because the repo is ~3.7 GiB of git
# objects and fetch-depth:0 checkout takes 10–18 min, exceeding the 10-minute
# timeout on every bot push. PR gate + daily cron + workflow_dispatch is
# sufficient security coverage (main is bot-driven; humans push via PR).
#
# Required environment variables / secrets:
#   GITHUB_TOKEN  — automatically provided by GitHub Actions; grants the action
#                   read access to the repo and the ability to annotate PRs.
#                   No additional secrets need to be configured.
#
# Optional (advanced):
#   GITLEAKS_LICENSE — only needed if you use Gitleaks Pro features (not required
#                      for the open-source gitleaks-action@v2 used here).
#
# False-positive suppression:
#   See .gitleaks.toml at repo root.  Common exclusions pre-configured:
#     - tests/fixtures/  (fake credentials in test data)
#     - example/sample config blocks in docs/
#     - GitHub Actions ${{ secrets.X }} template expressions (not real secrets)

'on':
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"      # Daily baseline scan of main
  workflow_dispatch:

permissions:
  contents: read
  # Needed so the action can post inline PR annotations when secrets are found
  security-events: write
  pull-requests: read

# Storm-commit repo: a newer push supersedes the in-flight scan run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30       # Was 10 — full-history checkout needs headroom

    steps:
      - name: Checkout (full history for diff-aware scanning)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Partial clone: fetch the commit graph + trees but defer blob
          # downloads until a blob is actually needed. gitleaks' diff-aware
          # PR scan only touches changed blobs, so this turns a ~3.7 GiB
          # full checkout (10-20 min) into a fast metadata-only fetch.
          filter: blob:none

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # uncomment for Pro
        # The action automatically:
        #   - Uses --redact so actual secret values are never written to logs
        #   - On a PR, scans only the diff (HEAD..base) for speed
        #   - On a push to main, scans the full commit range
        #   - Exits non-zero (fails the job) if any secret is detected

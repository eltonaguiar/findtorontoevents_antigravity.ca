name: Secret Scan (M-043)

# M-043 — Gitleaks secret scanning on every PR and push to main.
# Fails if hardcoded credentials are detected in changed files.
# Secrets are NEVER printed to logs (--redact is passed by the action by default).
#
# 2026-05-16: Removed push trigger on main because the repo is ~3.7 GiB of git
# objects and fetch-depth:0 checkout takes 10–18 min, exceeding the 10-minute
# timeout on every bot push. PR gate + daily cron + workflow_dispatch is
# sufficient security coverage (main is bot-driven; humans push via PR).
#
# Required environment variables / secrets:
#   GITHUB_TOKEN  — automatically provided by GitHub Actions; grants the action
#                   read access to the repo and the ability to annotate PRs.
#                   No additional secrets need to be configured.
#
# Optional (advanced):
#   GITLEAKS_LICENSE — only needed if you use Gitleaks Pro features (not required
#                      for the open-source gitleaks-action@v2 used here).
#
# False-positive suppression:
#   See .gitleaks.toml at repo root.  Common exclusions pre-configured:
#     - tests/fixtures/  (fake credentials in test data)
#     - example/sample config blocks in docs/
#     - GitHub Actions ${{ secrets.X }} template expressions (not real secrets)

'on':
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"      # Daily baseline scan of main
  workflow_dispatch:

permissions:
  contents: read
  # Needed so the action can post inline PR annotations when secrets are found
  security-events: write
  pull-requests: read

# Storm-commit repo: a newer push supersedes the in-flight scan run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-secret-scan:
    name: Gitleaks PR diff scan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # 2026-11-25: raised 20 -> 45 min. The `fetch-depth: 0` checkout alone costs
    # 10-18 min on this ~3.7 GiB object store (see the 2026-05-16 note above), which
    # left very little headroom for the scan itself. A PR that merges main into the
    # branch inflates the gitleaks range to thousands of commits (observed: 5,107),
    # so the 20-min cap expired mid-scan and GitHub recorded the run as
    # `cancelled` -> surfaced as a red check with NO finding and NO useful log.
    # Cancelled != clean: a secret scan that never finished proves nothing, so give
    # it room to finish. Timeout only costs runner minutes, never correctness.
    timeout-minutes: 45

    steps:
      - name: Checkout (full history for diff-aware scanning)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      # -------------------------------------------------------------------
      # 2026-11-25: replaced gitleaks/gitleaks-action@v2 with an explicit,
      # range-scoped invocation, because the action's range is wrong for PRs.
      #
      # MEASURED DEFECT (PR #1068, run 45704814146, job 139523964118, red 32m05s):
      # the action runs `--first-parent <base.sha>^..<head.sha>`. base.sha is
      # frozen at the PR's last push event, so once a PR merges main it drags in
      # every commit main gained since:
      #     base.sha            = 4907385676644ab (main @ 2026-11-22T10:50:53Z)
      #     head.sha            = 9b1df933d1fee3f (2026-11-25T21:02:40Z)
      #     action range        = 5,180 commits   -> 350 findings -> exit 1 -> RED
      #     --no-merges base..head = 7,968 commits -> 350 findings -> RED
      #     PR's own commits vs current main = 21  -> 0 findings  -> PASS
      #
      # All 350 inherited findings are the SAME false positive: 175 lines of
      # 1000_TODOS.json of the form  "key": "BTCUSDT/breakout/15m"  -- a strategy
      # registry whose field is literally named "key". gitleaks'
      # generic-api-key rule cannot tell that from a credential. The PR added
      # no attack surface; it went red purely for merging main.
      #
      # The same inconsistency was already visible inside this file: the
      # scheduled job below scans the identical HEAD tree with `--exit-code 0`
      # and files the result as "legacy baseline debt" (a ::warning::), while
      # this PR job turned the same data into a hard failure. One dataset, two
      # verdicts.
      #
      # Fix: resolve the comparison base to CURRENT origin/main at scan time
      # (not the stale event payload) and diff merge-base..HEAD. A PR gate
      # should judge the change the PR makes. Main's own baseline stays covered
      # by the daily scheduled scan, which is the job that should own it.
      # -------------------------------------------------------------------
      - name: Install Gitleaks CLI (verified SHA256)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/gitleaks/gitleaks/releases/latest --jq '.tag_name')
          VER="${TAG#v}"
          ASSET="gitleaks_${VER}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${VER}_checksums.txt"
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/${TAG}/${ASSET}" -o "/tmp/${ASSET}"
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/${TAG}/${CHECKSUMS}" -o "/tmp/${CHECKSUMS}"
          (cd /tmp && grep " ${ASSET}$" "${CHECKSUMS}" | sha256sum --check)
          tar -xzf "/tmp/${ASSET}" -C /usr/local/bin gitleaks
          rm -f "/tmp/${ASSET}" "/tmp/${CHECKSUMS}"
          gitleaks version

      - name: Gitleaks PR secret scan (PR's own commits only)
        env:
          # Fallback only. The event payload's base.sha goes stale the moment the
          # PR merges main, which is precisely the bug being fixed here.
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main" || true
          if git rev-parse --verify --quiet origin/main >/dev/null; then
            BASE=$(git merge-base origin/main HEAD)
          else
            echo "::warning title=secret-scan::origin/main unavailable, falling back to the event payload's base.sha (may be stale after a main merge)."
            BASE=$(git merge-base "${EVENT_BASE_SHA}" HEAD)
          fi
          echo "comparison base : ${BASE} $(git log -1 --format='%ci %s' "${BASE}" | cut -c1-90)"
          n=$(git rev-list --no-merges --count "${BASE}..HEAD")
          echo "commits this PR adds: ${n}"
          if [ "${n}" -eq 0 ]; then
            # Say this out loud. A gate that silently passes is indistinguishable
            # from a gate that never ran -- the exact failure mode that hid a
            # broken diagnostics job in this repo for six days.
            echo "::notice title=secret-scan::No commits of this PR's own to scan. Main's baseline is covered by the scheduled scan."
            exit 0
          fi
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks-pr.json \
            --log-opts="--no-merges ${BASE}..HEAD"

      - name: Summarise gitleaks findings (no secret values printed)
        if: failure()
        run: |
          python3 - <<'PY'
          import collections, json, os
          p = 'gitleaks-pr.json'
          if not os.path.exists(p):
              print("::error title=secret-scan::Scan failed before writing a report -- read the step log above. This failure is NOT a finding.")
              raise SystemExit(0)
          findings = json.load(open(p, encoding='utf-8')) or []
          print(f"findings introduced by this PR: {len(findings)}")
          for f in findings:
              print(f"::error file={f.get('File')},line={f.get('StartLine')}::{f.get('RuleID')} in a file this PR adds or modifies")
          for path, n in collections.Counter(f.get('File', '?') for f in findings).most_common(10):
              print(f"  {n:4d}  {path}")
          PY

      - name: Upload gitleaks report (evidence, pass or fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-pr-report
          path: gitleaks-pr.json
          if-no-files-found: ignore
          retention-days: 14

  scheduled-secret-scan:
    name: Gitleaks tree + recent commits scan
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout (metadata-only history + HEAD tree)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Partial clone avoids downloading ~19 GiB of historical packfiles;
          # gitleaks dir scans HEAD on disk, and gitleaks git scans only the
          # last 48h of commits so it never lazily fetches years of blobs.
          filter: blob:none

      - name: Install Gitleaks CLI (verified SHA256)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/gitleaks/gitleaks/releases/latest --jq '.tag_name')
          VER="${TAG#v}"
          ASSET="gitleaks_${VER}_linux_x64.tar.gz"
          CHECKSUMS="gitleaks_${VER}_checksums.txt"
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/${TAG}/${ASSET}" -o "/tmp/${ASSET}"
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/${TAG}/${CHECKSUMS}" -o "/tmp/${CHECKSUMS}"
          (cd /tmp && grep " ${ASSET}$" "${CHECKSUMS}" | sha256sum --check)
          tar -xzf "/tmp/${ASSET}" -C /usr/local/bin gitleaks
          rm -f "/tmp/${ASSET}" "/tmp/${CHECKSUMS}"
          gitleaks version

      - name: Scan current HEAD working tree (legacy baseline debt warning)
        run: |
          set -euo pipefail
          gitleaks dir . --config .gitleaks.toml --redact --report-format json --report-path /tmp/gitleaks-head.json --exit-code 0
          python3 - <<'PY'
          import collections, json
          try:
              with open('/tmp/gitleaks-head.json', encoding='utf-8') as fh:
                  findings = json.load(fh) or []
          except Exception:
              findings = []
          by_file = collections.Counter(f.get('File', '?') for f in findings)
          print(f"HEAD tree baseline scan: {len(findings)} finding(s) across {len(by_file)} file(s)")
          if findings:
              top = ', '.join(f"{p} ({n})" for p, n in by_file.most_common(8))
              print(f"::warning::Legacy HEAD secret scan baseline reports {len(findings)} finding(s) across {len(by_file)} file(s) needing rotation/triage (top: {top})")
          PY

      - name: Scan recent git commits (last 30 non-merge commits)
        run: |
          set -euo pipefail
          gitleaks git . --config .gitleaks.toml --redact --log-opts="-n 30 --no-merges" --report-format json --report-path /tmp/gitleaks-git.json --exit-code 0
          python3 - <<'PY'
          import collections, json
          try:
              with open('/tmp/gitleaks-git.json', encoding='utf-8') as fh:
                  findings = json.load(fh) or []
          except Exception:
              findings = []
          by_file = collections.Counter(f.get('File', '?') for f in findings)
          print(f"Recent git commits scan: {len(findings)} finding(s) across {len(by_file)} file(s)")
          if findings:
              top = ', '.join(f"{p} ({n})" for p, n in by_file.most_common(8))
              print(f"::warning::Recent git commits secret scan reports {len(findings)} finding(s) across {len(by_file)} file(s) (top: {top})")
          PY

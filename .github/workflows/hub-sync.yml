name: Hub Data Sync

on:
  schedule:
    - cron: '6 * * * *'  # Every hour at :22
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Collect system data for hub
        run: |
          echo "Hub uses client-side JS (hub/js/consensus_engine.js, hub/js/quality_scorer.js)"
          echo "Ensuring hub data directory has latest winning combos..."

          # A missing exporter is a FAILURE, not a warning. With the old
          # `|| echo "::warning::..."`, this job reported success hourly while
          # hub/data/systems_manifest.json sat at generated_at 2026-03-02.
          if [ ! -f signal_recorder/export_hub_combos.py ]; then
            echo "::error::signal_recorder/export_hub_combos.py is missing — hub data cannot refresh"
            exit 1
          fi
          pip install pandas 2>/dev/null || true
          PYTHONPATH=. python signal_recorder/export_hub_combos.py

      - name: Commit Updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add hub/data/
          if git diff --cached --quiet; then
            echo "::error::hub data unchanged this run — the export produced nothing, and a green run here is what let hub/data serve March data for months"
            exit 1
          fi
          git commit -m "Sync hub data $(date +%H:%M) [skip ci]"
          bash .github/scripts/safe_push.sh

      - name: Assert hub data is fresh and well-formed
        run: |
          python3 - <<'PY'
          import json, sys
          from datetime import datetime, timezone

          def parse_ts(value):
              if not value:
                  return None
              try:
                  ts = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except ValueError:
                  return None
              return ts if ts.tzinfo else ts.replace(tzinfo=timezone.utc)

          now = datetime.now(timezone.utc)

          # 1. The artifact this workflow actually regenerates, hourly.
          #    This is the freshness gate that carries real signal: if the export
          #    stops re-stamping, the hub is serving stale combos.
          combos_path = "hub/data/winning_combos.json"
          try:
              combos = json.load(open(combos_path))
          except FileNotFoundError:
              print(f"::error::{combos_path} is missing — the export produced nothing")
              sys.exit(1)
          except json.JSONDecodeError as exc:
              print(f"::error::{combos_path} is not valid JSON: {exc}")
              sys.exit(1)

          updated = parse_ts(combos.get("updated_at"))
          if updated is None:
              print(f"::error::{combos_path} has no parseable updated_at")
              sys.exit(1)
          age_h = (now - updated).total_seconds() / 3600
          found = combos.get("total_found")
          print(f"{combos_path} updated_at={combos.get('updated_at')} age={age_h:.1f}h (limit 26h, hourly cron)")
          print(f"{combos_path} total_found={found} entries={len(combos.get('winning_combos') or [])}")
          if age_h > 26:
              print(f"::error::{combos_path} is {age_h:.1f}h stale — this run did not re-stamp it")
              sys.exit(1)
          if not found:
              print("::warning::the export matched 0 winning combos — the hub has nothing to display")

          # 2. systems_manifest.json is a HAND-CURATED config, not a generated
          #    snapshot: nothing in this repo writes it, so its `generated_at` is a
          #    review stamp, not a build stamp. A 7-day recency rule on it was red
          #    from the day it landed (268 days stale, unfixable) — which trains
          #    everyone to ignore this job. Gate what can be verified instead:
          #    presence, JSON validity, required keys, non-empty content.
          manifest_path = "hub/data/systems_manifest.json"
          try:
              manifest = json.load(open(manifest_path))
          except FileNotFoundError:
              print(f"::error::{manifest_path} is missing")
              sys.exit(1)
          except json.JSONDecodeError as exc:
              print(f"::error::{manifest_path} is not valid JSON: {exc}")
              sys.exit(1)

          missing = [k for k in ("version", "generated_at", "categories", "systems") if k not in manifest]
          if missing:
              print(f"::error::{manifest_path} missing required keys: {missing}")
              sys.exit(1)
          if not manifest.get("systems"):
              print(f"::error::{manifest_path} has an empty `systems` map — the hub would render nothing")
              sys.exit(1)
          if not manifest.get("categories"):
              print(f"::error::{manifest_path} has an empty `categories` map")
              sys.exit(1)

          gen = parse_ts(manifest.get("generated_at"))
          if gen is None:
              print(f"::error::{manifest_path} has no parseable generated_at")
              sys.exit(1)
          age_d = (now - gen).total_seconds() / 86400
          print(f"{manifest_path} generated_at={manifest.get('generated_at')} age={age_d:.1f}d "
                f"systems={len(manifest['systems'])} categories={len(manifest['categories'])}")
          if age_d > 180:
              print(f"::warning::{manifest_path} has not been reviewed in {age_d:.0f}d — "
                    f"it is curated by hand; verify its systems list still matches reality")
          PY


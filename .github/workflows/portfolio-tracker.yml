name: portfolio-tracker

# Keeps one portfolio book current: imports any new positions/closes from the
# book sources, marks the open ones against live quotes, and republishes the
# derived snapshot. The ledger is append-only, so this job can run as often as
# it likes without losing history — that is the property the storage comparison
# in reports/2026-11-22-portfolio-tracking-options.md was run to check.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    # 15, not 10: the commit step below is bounded at 6 minutes so a hung push
    # fails the STEP (conclusion=failure, commit preserved in the log) instead of
    # the JOB hitting its own timeout first (conclusion=cancelled, work vanished).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quote dependencies
        run: pip install --quiet yfinance pytest

      - name: Test the tracker
        run: python3 -m pytest tests/test_portfolio_tracker.py -q

      - name: Sync, mark, report
        run: |
          python3 tools/portfolio_tracker.py sync
          python3 tools/portfolio_tracker.py mark
          python3 tools/portfolio_tracker.py status

      # Was an inline `git push || { git pull --rebase --autostash; sleep 5; }` loop.
      # On 2026-11-25T23:13 run 45719700001 the push was rejected (fetch first) and the
      # bare `git pull --rebase` then hung for 9.5 min with no timeout, so the JOB's
      # 10-min timeout killed it: conclusion=cancelled, commit 39d9bfbc never pushed.
      # safe_push.sh bounds every git call (timeout 90s), retries to 8, and auto-resolves
      # data-file rebase conflicts, so contention produces a real failure we can see.
      - name: Commit the book
        timeout-minutes: 6
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/portfolio_tracker
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "portfolio-tracker: mark to market [skip ci]"
            bash .github/scripts/safe_push.sh
          fi

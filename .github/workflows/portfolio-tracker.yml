name: portfolio-tracker

# Keeps one portfolio book current: imports any new positions/closes from the
# book sources, marks the open ones against live quotes, and republishes the
# derived snapshot. The ledger is append-only, so this job can run as often as
# it likes without losing history — that is the property the storage comparison
# in reports/2026-11-22-portfolio-tracking-options.md was run to check.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install quote dependencies
        run: pip install --quiet yfinance

      - name: Test the tracker
        run: python3 -m pytest tests/test_portfolio_tracker.py -q

      - name: Sync, mark, report
        run: |
          python3 tools/portfolio_tracker.py sync
          python3 tools/portfolio_tracker.py mark
          python3 tools/portfolio_tracker.py status

      - name: Commit the book
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add data/portfolio_tracker
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "portfolio-tracker: mark to market [skip ci]"
            for i in 1 2 3; do
              git push && break || { git pull --rebase --autostash; sleep 5; }
            done
          fi

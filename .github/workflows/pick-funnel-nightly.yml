name: Pick Funnel — nightly

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC (after AI tournament 12:00 + price-tracker 23:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pick-funnel-nightly
  cancel-in-progress: false

jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
      DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS }}
      DB_USER_STOCKS: ${{ secrets.DB_USER_STOCKS }}
      DB_HOST_STOCKS: ${{ secrets.DB_HOST_STOCKS }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pymysql

      - name: Extract pick funnel
        run: |
          python tools/audit_pick_funnel/extract_funnel.py \
            || echo "::warning::extract_funnel.py failed (soft-fail)"

      - name: Compute top edges per class
        run: |
          python tools/audit_pick_funnel/top_edges.py \
            || echo "::warning::top_edges.py failed (soft-fail)"

      - name: Build recency summaries (14d + 48h)
        run: |
          python tools/audit_pick_funnel/build_recency_summary.py \
            || echo "::warning::build_recency_summary.py failed (soft-fail)"

      - name: Run swarm verdict
        continue-on-error: true
        run: |
          python tools/audit_pick_funnel/run_swarm_verdict.py \
            || echo "::warning::swarm verdict step failed (soft-fail)"

      - name: Fetch dashboard_data.json from production
        run: |
          curl -fsS --max-time 180 "https://findtorontoevents.ca/audit/data/dashboard_data.json" \
            -o audit_dashboard/data/dashboard_data.json \
            || echo "::warning::dashboard_data.json fetch failed — nav matrix step may degrade"

      - name: Build nav surface edge matrix
        run: |
          python tools/audit_pick_funnel/build_nav_surface_matrix.py \
            || echo "::warning::build_nav_surface_matrix.py failed (soft-fail)"

      - name: Build strategy IC analysis
        run: |
          python tools/audit_pick_funnel/build_ic_analysis.py \
            || echo "::warning::build_ic_analysis.py failed (soft-fail)"

      - name: Commit JSON outputs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 2026-06-12: the old single atomic `git add` listed strategy_ic_analysis.json,
          # whose builder (build_ic_analysis.py) does not exist in the repo — git add
          # is ATOMIC on pathspec errors, so it staged NOTHING every night ("No
          # changes to commit") while `|| true` hid it (masked-failure #7). The fresh
          # nav_surface_edge_matrix.json then got clobbered on the live site within
          # the hour by audit-dashboard re-uploading main's stale committed copy.
          # Per-file guarded adds make one missing artifact unable to zero the commit.
          for f in audit_dashboard/data/pick_funnel_today.json \
                   audit_dashboard/data/pick_funnel_90d.json \
                   audit_dashboard/data/pick_funnel_rejected_universe.json \
                   audit_dashboard/data/top_edges_per_class.json \
                   audit_dashboard/data/nav_surface_edge_matrix.json \
                   audit_dashboard/data/strategy_ic_analysis.json \
                   audit_dashboard/data/pick_summary_stats_2w.json \
                   audit_dashboard/data/pick_summary_stats_48h.json \
                   reports/2026-*_pick_funnel_swarm_verdict.md; do
            [ -e "$f" ] && git add "$f" || echo "skip (absent): $f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Pick funnel nightly refresh $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push || echo "::warning::push failed"
          else
            echo "No changes to commit."
          fi

      - name: FTP upload to findtorontoevents.ca (50webs has no shell)
        env:
          FTP_USER:   ${{ secrets.FTP_USER }}
          FTP_PASS:   ${{ secrets.FTP_PASS }}
          FTP_SERVER: ${{ secrets.FTP_SERVER || 'ftps2.50webs.com' }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::warning title=ftp::FTP_USER/FTP_PASS secrets not set — skipping live deploy"
            exit 0
          fi
          python tools/deploy_audit_files.py --only pick_funnel || echo "::warning title=ftp::pick_funnel upload had failures"

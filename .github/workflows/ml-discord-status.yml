name: ML Crypto  Discord Hourly Status

on:
  # SUSPENDED: Discord webhook disabled (noisy/underperforming — DISCORD_WEBHOOK_URL
  # removed 2026-05-13). Re-enable cron after webhook is restored.
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  send-status:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    # 2026-05-13: run 25824980622 — 5m ceiling too tight when runner queue stalls.
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send ML status to Discord
        # env:
          # DISABLED: noisy/underperforming  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Sending ML Crypto Predictor v4.1_CLAUDE CODE VS CODE hourly status..."
          python -m ml_crypto_predictor.enhanced_models.discord_status


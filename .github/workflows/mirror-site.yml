# Mirror findtorontoevents.ca  torontoevent.net via FTP
# Downloads all files from 50webs source FTP (/findtorontoevents.ca)
# and uploads to GoDaddy mirror FTP (/ root)
name: "Mirror: findtorontoevents.ca  torontoevent.net"

on:
  schedule:
    - cron: '22 */6 * * *'   # Every 6 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-site
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 90

    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Restore previous mirror tree (incremental pulls)
        # 2026-11-15: every run began with an EMPTY /tmp/site_mirror on a fresh
        # runner, so each 6-hourly run re-downloaded the entire tree from FTP and
        # could never catch up (run 43695030179: 15,225 transfers in 30 min =
        # 507 files/min; 23,898 files need ~47 min). Caching the tree makes every
        # pull after the first an incremental one. Key includes run_id so a new
        # cache entry is always saved; restore-keys picks the newest previous one.
        uses: actions/cache@v5
        with:
          path: /tmp/site_mirror
          key: site-mirror-${{ github.run_id }}
          restore-keys: |
            site-mirror-

      - name: Download from findtorontoevents.ca (50webs FTP)
        # 2026-06-01: per-step cap so a stalled FTP upload fails fast instead of
        # burning the job's 90-min wall (the tdotevent.ca 50webs target hung for the
        # full 90m on 8/12 recent runs). See triage report.
        # 2026-06-03: the source FTP tree also contains heavyweight non-site ballast
        # (backup snapshots and dependency folders like node_modules). Exclude those
        # so the mirror job stays focused on live site payloads and finishes inside
        # the download budget.
        # 2026-06-11: 15 min was intermittently too tight for the full-site pull
        # (run 27370850869 timed out mid-transfer; 27350269502 succeeded same day).
        # Bumped to 30 + one lftp retry below; job budget (90) still has headroom
        # (30 + 15 + 15 upload steps + small env-deploy/verify steps).
        # 2026-11-15: the real killer was NOT volume, it was ONE malformed name on
        # the source FTP. lftp aborts the whole script (exit 1) on:
        #   553 Prohibited file name: hot_trending_30m<garbage>%2527%2522\.json
        # after 27,692 files were already transferred, so steps 4-7 (all three
        # uploads, .env deploy, verify) were SKIPPED every 6h since 2026-11-14.
        # Excluding that stray artifact lets the mirror exit 0 and actually upload.
        # Also dropping pure ballast that can never be served: .git objects
        # (4,796 paths in one run) and __pycache__/*.pyc (64).
        timeout-minutes: 50
        env:
          SRC_HOST: ${{ secrets.FTP_HOST }}
          SRC_USER: ${{ secrets.FTP_USER }}
          SRC_PASS: ${{ secrets.FTP_PASS }}
        run: |
          echo " Downloading from findtorontoevents.ca  /tmp/site_mirror ..."
          mkdir -p /tmp/site_mirror

          # Write lftp script to file (avoids shell quoting issues with credentials)
          cat > /tmp/lftp_download.script << LFTPEOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          open -u "$SRC_USER","$SRC_PASS" "$SRC_HOST"
          mirror \
            --verbose \
            --use-cache \
            --no-perms \
            --parallel=4 \
            --exclude='^backups/' \
            --exclude='^tmp/' \
            --exclude='^genome/' \
            --exclude='^data/pinnacle_snapshots/' \
            --exclude='^audit/research/' \
            --exclude='^updates/' \
            --exclude='(^|/)node_modules/' \
            --exclude='^favcreators_source/.git/' \
            --exclude='^cakephp/vendor/' \
            --exclude='^findevents/next/_next/static/chunks/' \
            --exclude='(^|/)\.git/' \
            --exclude='(^|/)__pycache__/' \
            --exclude-glob=*.pyc \
            --exclude-glob=hot_trending_30m*%25* \
            --exclude-glob=db_config.php \
            --exclude-glob=db-config.php \
            --exclude-glob=*.env \
            --exclude-glob=.htpasswd \
            --exclude='^de/' \
            --exclude='^de-de/' \
            --exclude='^appeasy/' \
            --exclude='^easyapp/' \
            --exclude-glob=visit.txt \
            /findtorontoevents.ca/ /tmp/site_mirror/
          quit
          LFTPEOF

          # 2026-06-11: retry once on failure — 50webs FTP is intermittently
          # slow/flaky. The second attempt resumes incrementally (lftp mirror
          # only re-fetches missing/newer files already in /tmp/site_mirror).
          # 2026-11-15: one server file had a non-UTF8/prohibited name, which
          # aborts lftp with "553 Prohibited file name" even though the rest of
          # the mirror is fine. Treat only-553 failures as a warning.
          set +e
          lftp -f /tmp/lftp_download.script
          dl_rc=$?
          if [ $dl_rc -ne 0 ]; then
            echo "WARN: first download attempt failed — retrying once in 30s..."
            sleep 30
            lftp -f /tmp/lftp_download.script > /tmp/lftp_dl_retry.log 2>&1
            dl_rc=$?
          fi
          set -e
          if [ $dl_rc -ne 0 ]; then
            if grep -q "553 Prohibited file name" /tmp/lftp_dl_retry.log 2>/dev/null; then
              echo "::warning::lftp skipped a server file with a prohibited filename (553) — continuing."
            else
              echo "::error::mirror download failed (rc=$dl_rc)"
              tail -20 /tmp/lftp_dl_retry.log 2>/dev/null || true
              exit 1
            fi
          fi
          echo " Downloaded $(find /tmp/site_mirror -type f | wc -l) files"

      - name: Strip phishing-kit artifacts from the mirror tree
        # 2026-11-25 (incident): this workflow turns ONE infected source host into
        # THREE infected hosts. The Nov 23 23:52 UTC run downloaded the live
        # 50webs tree and reverse-uploaded it to GoDaddy, which is how
        # /de/index.php (kit build A, md5 586b76b00d80965e71182fadf67c2d76),
        # /de/visit.txt, /appeasy/index.php, /easyapp/index.php and the
        # compromised 76,799-byte root .htaccess reached torontoevent.net.
        # The per-file growth of de/visit.txt across five runs (1875 -> 6623 ->
        # 26571 -> 28112 -> 28867 B) is that mirror re-copying a live log.
        # actions/cache also restores /tmp/site_mirror every run, so a poisoned
        # tree survives on the runner AFTER the hosts are cleaned. Strip the IOCs
        # here -- before either reverse upload -- and fail loudly if any survive.
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys

          root = pathlib.Path('/tmp/site_mirror')
          KIT_MD5 = {'586b76b00d80965e71182fadf67c2d76', '4ec0bec91eeb47d31ad895c9e6334067'}
          KIT_DIRS = ('de', 'de-de', 'appeasy', 'easyapp')
          MARKERS = (b'oldyhub.com', b'firstonline/bk', b'Off to the Mouse they go')
          removed = []

          # 1. Whole kit directories (the payload shape seen on 50webs + GoDaddy).
          for name in KIT_DIRS:
              d = root / name
              if d.is_dir():
                  for f in sorted(p for p in d.rglob('*') if p.is_file()):
                      f.unlink()
                      removed.append(str(f.relative_to(root)))
                  for sub in sorted((p for p in d.rglob('*') if p.is_dir()),
                                    key=lambda p: len(p.parts), reverse=True):
                      sub.rmdir()
                  d.rmdir()
                  removed.append(name + '/ (dir)')

          # 2. Harvest logs and the root .htaccess must never be mirrored: the
          #    source htaccess is attacker-controlled and 50webs-side only.
          for rel in ('visit.txt', '.htaccess'):
              f = root / rel
              if f.is_file():
                  f.unlink()
                  removed.append(rel)
          for f in sorted(root.rglob('visit.txt')):
              if f.is_file():
                  f.unlink()
                  removed.append(str(f.relative_to(root)))

          # 3. Content sweep for anything the name rules miss.
          for f in sorted(p for p in root.rglob('*') if p.is_file()):
              if f.stat().st_size > 2_000_000:
                  continue
              try:
                  data = f.read_bytes()
              except OSError:
                  continue
              if hashlib.md5(data).hexdigest() in KIT_MD5 or any(m in data for m in MARKERS):
                  f.unlink()
                  removed.append(str(f.relative_to(root)) + ' <content-match>')

          if removed:
              print(f'::warning::mirror tree carried {len(removed)} infected artifact(s) — removed before upload')
              for r in removed:
                  print(f'  removed: {r}')
          else:
              print('mirror tree clean: no kit artifacts found')

          # Fail closed: if a kit file somehow reappears, do not deploy it.
          survivors = [str(p.relative_to(root)) for p in root.rglob('*')
                       if p.is_file() and (hashlib.md5(p.read_bytes()).hexdigest() in KIT_MD5
                                           if p.stat().st_size <= 2_000_000 else False)]
          if survivors:
              print('::error::phishing-kit artifact still present after quarantine: ' + ', '.join(survivors))
              sys.exit(1)
          PY

      - name: Upload to torontoevent.net (GoDaddy FTP)
        # 2026-06-01: per-step cap so a stalled FTP upload fails fast instead of
        # burning the job's 90-min wall (the tdotevent.ca 50webs target hung for the
        # full 90m on 8/12 recent runs). See triage report.
        timeout-minutes: 15
        env:
          DST_HOST: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          DST_USER: ${{ secrets.FTPGODADDYUSER }}
          DST_PASS: ${{ secrets.FTPGODADDYPASS }}
        run: |
          # 2026-04-17 host-guard (inlined 2026-04-18): this step does
          # `mirror --reverse /tmp/site_mirror/ /` — a full-site upload to FTP
          # ROOT. If DST_HOST ever resolves to a 50webs multi-site host, this
          # dumps thousands of files into 50webs FTP root and corrupts every
          # site on that account. Refuse if so.
          # NOTE: This workflow has NO `actions/checkout` step, so we cannot
          # reference `.github/scripts/assert_ftp_host.sh` (the file doesn't
          # exist in the runner's filesystem). Inlined as case statements.
          case "$DST_HOST" in
            *50webs*|*ejaguiar*)
              echo "ERROR: DST_HOST '$DST_HOST' looks like a 50webs multi-tenant host; refusing root deploy that would corrupt sibling sites."
              exit 1
              ;;
          esac

          echo " Uploading to torontoevent.net ..."

          cat > /tmp/lftp_upload.script << LFTPEOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          open -u "$DST_USER","$DST_PASS" "$DST_HOST"
          mirror \
            --reverse \
            --verbose \
            --use-cache \
            --no-perms \
            --parallel=4 \
            --exclude='^backups/' \
            --exclude='^tmp/' \
            --exclude='^genome/' \
            --exclude='^data/pinnacle_snapshots/' \
            --exclude='^audit/research/' \
            --exclude='^updates/' \
            --exclude='(^|/)node_modules/' \
            --exclude-glob=db_config.php \
            --exclude-glob=db-config.php \
            --exclude-glob=*.env \
            --exclude-glob=.htpasswd \
            --exclude='^de/' \
            --exclude='^de-de/' \
            --exclude='^appeasy/' \
            --exclude='^easyapp/' \
            --exclude='^\.htaccess$' \
            --exclude-glob=visit.txt \
            /tmp/site_mirror/ /
          quit
          LFTPEOF

          lftp -f /tmp/lftp_upload.script
          echo " Upload to torontoevent.net complete"

      - name: Upload to tdotevent.ca (50webs FTP, /tdotevent.ca)
        # 2026-06-01: per-step cap so a stalled FTP upload fails fast instead of
        # burning the job's 90-min wall (the tdotevent.ca 50webs target hung for the
        # full 90m on 8/12 recent runs). See triage report.
        timeout-minutes: 15
        env:
          SRC_HOST: ${{ secrets.FTP_HOST }}
          SRC_USER: ${{ secrets.FTP_USER }}
          SRC_PASS: ${{ secrets.FTP_PASS }}
        run: |
          echo " Uploading to tdotevent.ca (/tdotevent.ca) ..."

          # tdotevent.ca is on the same 50webs host as the source  mirror directly FTP-to-FTP
          cat > /tmp/lftp_tdote.script << LFTPEOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          open -u "$SRC_USER","$SRC_PASS" "$SRC_HOST"
          mirror \
            --reverse \
            --verbose \
            --use-cache \
            --no-perms \
            --parallel=4 \
            --exclude='^backups/' \
            --exclude='^tmp/' \
            --exclude='^genome/' \
            --exclude='^data/pinnacle_snapshots/' \
            --exclude='^audit/research/' \
            --exclude='^updates/' \
            --exclude='(^|/)node_modules/' \
            --exclude-glob=db_config.php \
            --exclude-glob=db-config.php \
            --exclude-glob=*.env \
            --exclude-glob=.htpasswd \
            --exclude='^de/' \
            --exclude='^de-de/' \
            --exclude='^appeasy/' \
            --exclude='^easyapp/' \
            --exclude='^\.htaccess$' \
            --exclude-glob=visit.txt \
            /tmp/site_mirror/ /tdotevent.ca/
          quit
          LFTPEOF

          lftp -f /tmp/lftp_tdote.script
          echo " Upload to tdotevent.ca complete"

      - name: Deploy fc/api/.env to GoDaddy (GoDaddy MySQL creds)
        env:
          DST_HOST: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          DST_USER: ${{ secrets.FTPGODADDYUSER }}
          DST_PASS: ${{ secrets.FTPGODADDYPASS }}
          DB_USER: ${{ secrets.TORONTOEVENT_DB_USER }}
          DB_PASS: ${{ secrets.TORONTOEVENT_DB_PASS }}
          ENV_EXTRAS: ${{ secrets.FC_API_ENV_EXTRAS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_SECRET_CLIENTID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SERCRET_CLOUD }}
        run: |
          python3 - <<'PYEOF'
          import os

          db_user = os.environ.get('DB_USER', '')
          db_pass = os.environ.get('DB_PASS', '')
          extras = os.environ.get('ENV_EXTRAS', '')
          google_id = os.environ.get('GOOGLE_CLIENT_ID', '')
          google_secret = os.environ.get('GOOGLE_CLIENT_SECRET', '')

          lines = []
          lines.append('# GoDaddy fc/api .env -- auto-generated by mirror-site workflow')
          lines.append('MYSQL_HOST=localhost')
          lines.append('MYSQL_USER=' + db_user)
          lines.append('MYSQL_PASSWORD="' + db_pass + '"')
          lines.append('MYSQL_DATABASE=ejaguiar1_favcreators')
          if google_id:
              lines.append('GOOGLE_CLIENT_ID=' + google_id)
          if google_secret:
              lines.append('GOOGLE_CLIENT_SECRET=' + google_secret)
          if extras:
              lines.append('')
              lines.append(extras)

          with open('/tmp/godaddy_fc_env', 'w') as f:
              f.write('\n'.join(lines))

          has_google = 'GOOGLE_CLIENT_ID' in '\n'.join(lines)
          print('OK GoDaddy fc/api .env prepared (MYSQL_USER=' + db_user + ', google=' + str(has_google) + ')')
          PYEOF

          cat > /tmp/lftp_env_upload.script << LFTPEOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          open -u "$DST_USER","$DST_PASS" "$DST_HOST"
          put /tmp/godaddy_fc_env -o fc/api/.env
          quit
          LFTPEOF
          lftp -f /tmp/lftp_env_upload.script
          echo "fc/api/.env deployed to GoDaddy"

      - name: Verify mirrors are live
        run: |
          for URL in "https://torontoevent.net/" "https://tdotevent.ca/"; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "$URL" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo " $URL  HTTP $STATUS"
            else
              echo "  $URL  HTTP $STATUS (may need time to propagate)"
            fi
          done

      - name: Summary
        run: |
          echo "##  Site Mirror Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Source** | findtorontoevents.ca (50webs, /findtorontoevents.ca) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Destination 1** | torontoevent.net (GoDaddy, /) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Destination 2** | tdotevent.ca (50webs, /tdotevent.ca) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Completed** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Runs every 6 hours. Excludes db_config.php, .env, .htpasswd from overwrite." >> $GITHUB_STEP_SUMMARY

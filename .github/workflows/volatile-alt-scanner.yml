name: VOLATILE ALT SCANNER Hyperliquid High-Vol Alts

on:
  schedule:
    - cron: '3 * * * *' # Every hour (was 4x/hr, reduced to ease queue pressure)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: volatile-alt-scanner
  cancel-in-progress: false

jobs:
  volatile-alt-scan:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            alpha_engine
            shared

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            alpha_engine/requirements.txt

      - name: Install dependencies
        run: python -m pip install requests numpy

      - name: Run Volatile Alt Scanner
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "============================================"
          echo " VOLATILE ALT SCANNER Hyperliquid"
          echo " High-Vol Mid-Cap Altcoins"
          echo " $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          python alpha_engine/volatile_alt_scanner.py

      - name: Commit scanner results
        id: commit_results
        run: |
          echo "created=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/volatile_alt_picks.json alpha_engine/data/active_picks.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No scanner changes to commit"
          else
            git commit -m "Volatile Alt scan $(date -u '+%Y-%m-%d %H:%M') [AUTO] [skip ci]"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push with retry
        if: steps.commit_results.outputs.created == 'true'
        run: bash .github/scripts/safe_push.sh


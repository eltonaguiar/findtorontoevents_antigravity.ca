name: Smart Picks Tracker

on:
  schedule:
    - cron: '54 * * * *'  # Staggered from :52 to reduce push contention
  workflow_dispatch:

concurrency:
  group: smart-picks-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  track:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.12'

      - name: Run smart picks engine + tracker
        env:
          CONFIDENCE_INVERT_CRYPTO: "0"
          # M-034 DISABLED 2026-05-31: live DB shows conf=1.0 cohort is 52.1% WR / +2.78% PnL (best).
          # Global inversion was demoting best crypto picks. 0.8-bucket dampener active in smart_picks_engine.py.
          CRYPTO_CONF_INVERSION_GATE: "0"
          # PCG-5: enforce portfolio gates (regime, duplicate, concentration, profit-lock, correlation)
          PCG5_ENFORCE: "1"
          # M-042: COMMODITY SHORT-only (cta_replicator LONG WR=0%, LONG already hard-blocked)
          COMMODITY_SHORT_ONLY: "1"
          # A1 meta-label shadow gate — shadow mode only (AUC=0.5795, 941 post-v2.1 picks)
          META_LABEL_GATE: "1"
        run: |
          # INCIDENT_OVERALL #14 fix (2026-05-31): run from repo root with PYTHONPATH set.
          # Previous `cd alpha_engine` broke `from alpha_engine.risk.vol_target import ...`
          # added in recent refactor; `|| true` masked the ImportError for 30+ days,
          # leaving smart_picks.json stale since 2026-04-30.
          export PYTHONPATH="${GITHUB_WORKSPACE}:${PYTHONPATH:-}"
          python alpha_engine/smart_picks_engine.py || echo "::warning::smart_picks_engine failed"
          python alpha_engine/smart_picks_tracker.py || echo "::warning::smart_picks_tracker failed"
          # Tripwire: surface staleness so a future regression doesn't go 30 days unnoticed
          if [ -f alpha_engine/data/smart_picks.json ]; then
            GEN=$(python3 -c "import json; print(json.load(open('alpha_engine/data/smart_picks.json')).get('generated_at',''))")
            echo "::notice::smart_picks.json generated_at=${GEN}"
          fi

      - name: Commit and push
        run: |
          bash .github/scripts/safe_commit_push.sh \
            "Smart picks batch $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]" \
            alpha_engine/data/smart_picks.json \
            alpha_engine/data/smart_picks_history.json



# guard-ops-workflows - fails when an automated commit deletes .github/workflows/ops-*.
#
# Context: commit 26dd4f9d ("Alpha Engine FAST ... [AUTO] [skip ci]", github-actions[bot])
# committed a stale index with `git add -A` and silently reverted 573 files, including the
# ops-* SSH/runner workflows. This gate makes that pattern red instead of invisible.
#
# Tool: tools/guard_ops_workflows.py   Tests: tools/test_guard_ops_workflows.py
# Read-only: no commit, no push, no secrets beyond the checkout token.

name: guard-ops-workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-*'
      - 'tools/guard_ops_workflows.py'
      - 'tools/test_guard_ops_workflows.py'
  workflow_dispatch:
    inputs:
      before:
        description: "Range start (exclusive), e.g. 26dd4f9df832^"
        type: string
        required: true
      after:
        description: "Range end (inclusive), e.g. 26dd4f9df832"
        type: string
        required: true
      dry_run:
        description: "Report a violation but exit 0 (replay mode)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: guard-ops-workflows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # push -> the pushed range; workflow_dispatch -> the replay inputs.
      BEFORE: ${{ github.event_name == 'push' && github.event.before || inputs.before }}
      AFTER: ${{ github.event_name == 'push' && github.event.after || inputs.after }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Checkout (only what the guard needs)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            tools

      - name: Unit tests for the guard
        run: python3 tools/test_guard_ops_workflows.py

      # A shallow checkout only has the pushed tip, so pull in the other endpoint(s).
      # `26dd4f9df832^` is not a fetchable ref - fetch the bare sha and let git resolve `^`.
      - name: Fetch the range endpoints
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "first push on this ref - nothing to compare"
            exit 0
          fi
          for rev in "$BEFORE" "$AFTER"; do
            [ -n "$rev" ] || continue
            base="${rev%^}"
            case "$base" in
              *[!0-9a-f]*) echo "skip $rev (not a sha)"; continue ;;
            esac
            if git cat-file -e "${rev}^{commit}" 2>/dev/null; then
              echo "have $rev"
            else
              git fetch --depth=1 origin "$base" \
                || echo "::warning::could not fetch $base (force push?); the guard will report inconclusive"
            fi
          done

      - name: Guard the range
        run: |
          set -euo pipefail
          args=(--before "$BEFORE" --after "$AFTER")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 tools/guard_ops_workflows.py "${args[@]}"

name: RUNNER SMOKE TEST (temporary)

# Validation harness for self-hosted runners, Linux or Windows.
# Delete this file once the runners are proven and the repo is back on cloud.
#
# History: this job hardcoded `Windows, X64` BEFORE the input label, so
# dispatching it with a Linux runner name produced an unmatchable label set
# [self-hosted, Windows, X64, <linux-runner>] and the job sat queued forever
# (run 45765593098). The input now actually selects the runner, and every step
# runs under bash so one harness works on both OSes (Windows runners ship git-bash).

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Runner label to target (e.g. laptop-zerou-wsl-2, gx10-arm64-linux, laptop-zerou-win)'
        required: true
        default: 'laptop-zerou-wsl-2'
        type: string
      fail_on_purpose:
        description: 'Inject a failure to prove error capture works'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    # self-hosted AND the requested label must both match. No OS/arch label is
    # hardcoded, so Linux and Windows runners are equally reachable.
    runs-on: [self-hosted, "${{ inputs.runner_label }}"]
    timeout-minutes: 10

    steps:
      - name: Who am I
        shell: bash
        run: |
          echo "runner.name        = ${{ runner.name }}"
          echo "runner.os          = ${{ runner.os }}"
          echo "runner.arch        = ${{ runner.arch }}"
          echo "runner.environment = ${{ runner.environment }}"
          echo "user               = $(whoami)"
          echo "pwd                = $(pwd)"
          echo "uname              = $(uname -a 2>/dev/null || echo 'uname unavailable')"
          echo "cores              = $(nproc 2>/dev/null || echo '?')"

      - name: Toolchain
        shell: bash
        run: |
          echo "--- git ---";    git --version
          echo "--- python ---"; (python3 --version || python --version) 2>&1
          echo "--- bash ---";   bash --version | head -1
          echo "--- node ---";   (node --version 2>/dev/null || echo 'node absent')
          echo "--- disk ---";   df -h . | tail -1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Did checkout land somewhere sane
        shell: bash
        run: |
          echo "checkout path:  $(pwd)"
          if [ ! -d .github/workflows ]; then
            echo "::error::checkout missing .github/workflows"
            exit 1
          fi
          echo "workflow files: $(ls .github/workflows/*.yml | wc -l)"
          echo "tracked files:  $(git ls-files | wc -l)"
          echo "repo size:      $(du -sh . 2>/dev/null | cut -f1)"

      - name: Prove concurrent slots are real
        shell: bash
        run: |
          echo "sleeping 30s - if 2 runners are live, a parallel dispatch overlaps this"
          sleep 30
          echo "slept fine"

      - name: Warning capture
        shell: bash
        run: echo "::warning::deliberate warning - proving warnings surface in the run log"

      - name: Deliberate failure
        if: inputs.fail_on_purpose
        shell: bash
        run: |
          echo "::error::deliberate failure - proving errors surface and fail the job"
          exit 1

      - name: Done
        if: always()
        shell: bash
        run: echo "smoke test finished on ${{ runner.name }} (${{ runner.os }})"

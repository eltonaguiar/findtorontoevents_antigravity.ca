# Auto-refresh Algorithm Competition data with real Yahoo Finance market data
# Runs weekly on Sundays and can be triggered manually
name: Algorithm Competition Refresh

on:
  schedule:
    - cron: '0 10 * * 0'  # Every Sunday at 10:00 UTC (5:00 AM EST)
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  refresh-competition:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run competition backtester
        run: python3 STOCKS/competition/run_competition.py
        timeout-minutes: 10

      - name: Create slim JSON for dashboard
        run: |
          python3 -c "
          import json, os, math
          def sanitize(obj):
              if isinstance(obj, float):
                  return None if (math.isnan(obj) or math.isinf(obj)) else obj
              elif isinstance(obj, dict):
                  return {k: sanitize(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [sanitize(v) for v in obj]
              return obj
          with open('STOCKS/competition/competition-results.json') as f:
              data = json.load(f)
          slim = {
              'generated_at': data['generated_at'],
              'starting_capital': data['starting_capital'],
              'overall_rankings': data['overall_rankings'][:30],
              'asset_classes': {},
          }
          for ac_key, ac_data in data['asset_classes'].items():
              slim_ac = {k: v for k, v in ac_data.items() if k != 'results'}
              if 'benchmark_history' in slim_ac:
                  bh = slim_ac['benchmark_history']
                  slim_ac['benchmark_history'] = bh[::5] + [bh[-1]] if bh else []
              slim_ac['results'] = []
              for r in ac_data['results']:
                  slim_r = {k: v for k, v in r.items() if k not in ('portfolio_history', 'trades')}
                  ph = r.get('portfolio_history', [])
                  slim_r['portfolio_history'] = ph[::5] + [ph[-1]] if ph else []
                  trades = r.get('trades', [])
                  slim_r['trades_sample'] = trades[-50:]
                  slim_r['total_trades_logged'] = len(trades)
                  slim_ac['results'].append(slim_r)
              slim['asset_classes'][ac_key] = slim_ac
          slim = sanitize(slim)
          with open('STOCKS/competition/competition-slim.json', 'w') as f:
              json.dump(slim, f, separators=(',', ':'))
          if os.path.exists('STOCKS/competition/competition-results.json'):
              os.remove('STOCKS/competition/competition-results.json')
          print('Slim JSON created successfully')
          "

      - name: Commit and push updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STOCKS/competition/competition-*.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh algorithm competition results ($(date -u +%Y-%m-%d))

          Auto-generated by algorithm-competition-refresh workflow.
          Real Yahoo Finance data, 12 strategies, 5 asset classes [skip ci]"
            for i in 1 2 3; do
              bash .github/scripts/safe_push.sh && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      - name: Deploy to live site via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USER" ]; then
            echo "::warning::FTP credentials not configured. Skipping FTP deploy."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null 2>&1
          REMOTE_BASE="/findtorontoevents.ca"
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_SERVER" << FTPEOF
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3
          mkdir -p $REMOTE_BASE/STOCKS/competition
          cd $REMOTE_BASE/STOCKS/competition
          put STOCKS/competition/index.html
          put STOCKS/competition/competition-slim.json
          put STOCKS/competition/competition-stocks.json
          put STOCKS/competition/competition-crypto.json
          put STOCKS/competition/competition-forex.json
          put STOCKS/competition/competition-penny_stocks.json
          put STOCKS/competition/competition-meme_coins.json
          put STOCKS/competition/forward_picks.json
          cd $REMOTE_BASE/STOCKS
          put STOCKS/algorithm-competition.html
          echo "FTP deploy complete"
          bye
          FTPEOF
          echo "Live: https://findtorontoevents.ca/STOCKS/competition/"



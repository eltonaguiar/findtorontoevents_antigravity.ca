name: Deploy findtorontoevents.ca integrations page
# Uploads TORONTOEVENTS_ANTIGRAVITY/integrations/index.html to the 50webs FTP
# host as findtorontoevents.ca/integrations/index.html (clean directory URL:
# findtorontoevents.ca/integrations/).
#
# Same FTP safety model as deploy-fte-index.yml / deploy-fte-events-json.yml:
# shares the `fte-ftp-deploy` concurrency group so two deploys can never
# interleave writes, and gates the upload on the FTP_* secrets being present.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TORONTOEVENTS_ANTIGRAVITY/integrations/**'
      - '.github/workflows/deploy-fte-integrations.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    # Serialize FTP writes with the other core-site deploys.
    concurrency:
      group: fte-ftp-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Validate page before upload
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          p = Path("TORONTOEVENTS_ANTIGRAVITY/integrations/index.html")
          if not p.is_file():
              sys.exit(f"Missing integrations page: {p}")
          text = p.read_text(encoding="utf-8")

          # No unresolved git conflict markers.
          if re.search(r"^(<<<<<<< |=======$|>>>>>>> )", text, re.M):
              sys.exit("integrations/index.html contains unresolved conflict markers")

          # Secret-leak guard: the public page must never carry credentials.
          # Matches assignment-shaped literals (password=..., api_key=..., token=...)
          # and known secret env values are not checked here on purpose (they
          # must never be in the repo at all).
          banned = re.compile(
              r"(?i)\b(pass(word)?|api[_-]?key|secret|access[_-]?token|auth)\b\s*[:=]\s*['\"][^'\"]{6,}['\"]"
          )
          hit = banned.search(text)
          if hit:
              sys.exit(f"Refusing to publish: possible embedded credential -> {hit.group(0)[:40]!r}")

          print(f"Validated {p} ({len(text)} bytes) — no conflict markers, no credential literals")
          PY

      - name: Upload integrations page to findtorontoevents.ca (50webs FTP)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PY'
          import ftplib, os, sys
          from pathlib import Path

          host = os.environ.get("FTP_HOST", "")
          user = os.environ.get("FTP_USER", "")
          pw   = os.environ.get("FTP_PASS", "")
          if not all([host, user, pw]):
              print("Missing FTP credentials"); sys.exit(1)

          local = Path("TORONTOEVENTS_ANTIGRAVITY/integrations/index.html")
          if not local.is_file():
              print(f"File not found: {local}"); sys.exit(1)

          ftp = ftplib.FTP(host, timeout=120)
          ftp.login(user, pw)
          ftp.cwd("/findtorontoevents.ca")
          try:
              ftp.cwd("integrations")
          except ftplib.error_perm:
              ftp.mkd("integrations")
              ftp.cwd("integrations")

          with local.open("rb") as f:
              ftp.storbinary("STOR index.html", f)
          size = local.stat().st_size
          ftp.quit()
          print(f"Uploaded integrations/index.html ({size}B) -> findtorontoevents.ca/integrations/")
          PY

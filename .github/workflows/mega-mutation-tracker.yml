name: Mega Mutation Live Tracker

on:
  schedule:
    # Run hourly at :45 past (offset from other workflows)
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = generate + check, check = only check open, generate = only generate"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - generate
          - check

permissions:
  contents: write

concurrency:
  group: mega-mutation-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests

      - name: Run Mega Mutation Tracker
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "Running in mode: $MODE"
          python genome/mega_mutation_live_tracker.py "$MODE"

      - name: Sync to MySQL (audit page)
        continue-on-error: true
        env:
          AUDIT_DB_HOST: mysql.50webs.com
          AUDIT_DB_USER: ejaguiar1_stocks
          # 2026-04-17: was hardcoded literal 'stocks' — broken since day-1.
          # MYSQL_PASSWORD is the proven-working secret.
          AUDIT_DB_PASS: ${{ secrets.MYSQL_PASSWORD }}
          AUDIT_DB_NAME: ejaguiar1_stocks
        run: |
          pip install pymysql 2>/dev/null || true
          python -c "
          import sys, json, os
          sys.path.insert(0, '.')
          try:
              from sync_all_picks_to_mysql import PickSyncer
              syncer = PickSyncer()
              syncer.connect()
              syncer._register_run()
              syncer.process_json_source('genome/data', 'mega_mutation')
              syncer._finish_run()
              print(f'MySQL sync complete: {syncer.stats}')
          except Exception as e:
              print(f'MySQL sync skipped: {e}')
          "

      - name: Build summary
        run: |
          python genome/mega_mutation_live_tracker.py report || true
          echo "## Mega Mutation Tracker" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          python - <<'PYEOF'
          import json, os
          from pathlib import Path

          picks_file = Path("genome/data/mega_mutation_picks.json")
          if not picks_file.exists():
              print("No picks file yet")
              exit(0)

          data = json.loads(picks_file.read_text())
          stats = data.get("stats", {})
          open_picks = data.get("open_picks", [])
          closed_picks = data.get("closed_picks", [])

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
          with open(summary_path, "a") as f:
              f.write(f"- **Open picks:** {len(open_picks)}\n")
              f.write(f"- **Closed picks:** {len(closed_picks)}\n")
              if stats:
                  f.write(f"- **Win Rate:** {stats.get('win_rate', 0)}%\n")
                  f.write(f"- **Total PnL:** {stats.get('total_pnl_pct', 0):+.2f}%\n")
                  f.write(f"- **Profit Factor:** {stats.get('profit_factor', 0)}\n")
              symbols = sorted(set(p['symbol'] for p in open_picks + closed_picks))
              if symbols:
                  f.write(f"\n**Symbols tracked:** " + ", ".join(symbols) + "\n")
          PYEOF

      # REMOVED 2026-03-26: publisher unification only audit-dashboard.yml publishes dashboard_payload.json
      # - name: Rebuild audit dashboard payload
      # continue-on-error: true
      # run: |
      # pip install requests 2>/dev/null || true
      # python -m audit_trail.dashboard_generator || echo "Dashboard generator skipped"

      - name: Auto-commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # REMOVED 2026-03-26: audit_trail/data/dashboard_payload.json and audit_dashboard/index.html
          # only audit-dashboard.yml publishes these files
          git add \
            genome/data/mega_mutation_picks.json \
            genome/data/active_picks.json \
            genome/data/closed_picks.json \
            battleground/data/incubator_ledger.json || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          # issue #141: block conflict-marker commits
          bash .github/scripts/assert_no_conflict_markers.sh || exit 1
          git commit -m "chore: mega mutation tracker hourly update [skip ci]"
          for i in 1 2 3; do
            git stash --include-untracked 2>/dev/null || true
            bash .github/scripts/safe_push.sh && break
            echo "Push attempt $i failed, retrying in ${i}0s..."
            git rebase --abort 2>/dev/null || true
            git stash pop 2>/dev/null || true
            sleep ${i}0
          done


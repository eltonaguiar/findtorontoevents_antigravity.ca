# Daily refresh of per-asset-class edge-stability JSONs feeding /audit/edge_stability.html
name: Edge stability refresh

'on':
  schedule:
    - cron: '30 0 * * *'  # daily 00:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch live dashboard_payload.json
        run: |
          mkdir -p audit_trail/data
          curl -fsSL --retry 3 -o audit_trail/data/dashboard_payload.json \
            https://findtorontoevents.ca/audit/data/dashboard_payload.json
      - name: Regenerate edge_stability per asset class
        run: python -m tools.edge.edge_stability --all
      - name: Commit refreshed JSONs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit_dashboard/data/edge_stability/*.json
          if git diff --cached --quiet; then
            echo "No edge-stability changes to commit"
            exit 0
          fi
          git commit -m "chore(edge-stability): daily refresh [skip ci]"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main \
               && git push origin HEAD:main; then
              echo "Push succeeded on attempt $i"
              pushed=1
              break
            fi
            echo "Push attempt $i/5 lost the race — retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          [ "$pushed" = 1 ] || { echo "::error::push failed after 5 attempts"; exit 1; }

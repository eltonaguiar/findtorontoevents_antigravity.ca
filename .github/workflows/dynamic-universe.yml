name: Dynamic Universe Scanner

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

concurrency:
  group: dynamic-universe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-universe:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy pandas

      - name: Run dynamic universe scanner
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m alpha_engine.dynamic_universe || python alpha_engine/dynamic_universe.py

      - name: Commit updated universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/dynamic_universe.json
          if git diff --cached --quiet; then
            echo "No changes to dynamic universe"
          else
            SYMBOLS=$(python -c "import json; d=json.load(open('alpha_engine/data/dynamic_universe.json')); print(f\"{d['dynamic_count']} dynamic + {d['core_count']} core = {d['total_unique']} total\")" 2>/dev/null || echo "universe updated")
            git commit -m "Dynamic universe update: $SYMBOLS [skip ci]"
            git pull --rebase origin main
            bash .github/scripts/safe_push.sh
          fi


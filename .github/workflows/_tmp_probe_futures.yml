name: _tmp probe FUTURES
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: futures stress-test and crypto beta check
        env:
          DB_HOST: mysql.50webs.com
          DB_PORT: '3306'
          DB_USER: ejaguiar1_stocks
          DB_PASS: ${{ secrets.MYSQL_PASSWORD || secrets.AUDIT_DB_PASS }}
        run: |
          python3 -m pip install --quiet pymysql
          python3 - <<'PY'
          import os, collections, statistics as st
          import pymysql

          cn=pymysql.connect(host=os.environ["DB_HOST"], port=int(os.environ.get("DB_PORT") or 3306),
                             user=os.environ["DB_USER"], password=os.environ["DB_PASS"],
                             database="ejaguiar1_stocks", connect_timeout=20)
          cur=cn.cursor()

          def stats(v,label,pad=30):
              if not v: print(f"  {label:<{pad}} n=0"); return
              v=sorted(v); n=len(v); w=sum(1 for x in v if x>0); k=int(n*0.01)
              tv=v[:n-k] if k else v
              print(f"  {label:<{pad}}n={n:<5}win={100*w/n:5.1f}% mean={st.mean(v):+.3f}% med={st.median(v):+.3f}% trim1={st.mean(tv):+.3f}%")

          # ---------- A. futures_bb_mean_reversion ----------
          print("=== A. futures_bb_mean_reversion STRESS TEST ===")
          cur.execute("""SELECT symbol,direction,pnl_pct,created_at,closed_at,exit_reason,entry_price,exit_price,
                                COALESCE(execution_slippage_pct,0)
                         FROM trading_picks WHERE strategy='futures_bb_mean_reversion' AND pnl_pct IS NOT NULL""")
          rs=cur.fetchall()
          print(f"raw rows: {len(rs)}  undated: {sum(1 for r in rs if r[3] is None)}")
          dated=[r for r in rs if r[3] is not None]
          dated.sort(key=lambda r: str(r[3]))
          seen=set(); ded=[]
          for r in dated:
              k=(str(r[0]),str(r[1]),str(r[3])[:10])
              if k in seen: continue
              seen.add(k); ded.append(r)
          print(f"deduped: {len(ded)}")
          stats([float(r[2]) for r in rs],"raw")
          stats([float(r[2]) for r in ded],"deduped")
          half=len(ded)//2
          stats([float(r[2]) for r in ded[:half]],"first half")
          stats([float(r[2]) for r in ded[half:]],"second half")

          syms=collections.Counter(str(r[0]) for r in ded)
          print(f"\n  symbols={len(syms)}  top5={syms.most_common(5)}")
          er=collections.Counter(str(r[5] or '?')[:24] for r in ded)
          print(f"  exits={dict(er.most_common(6))}")
          tp=sum(1 for r in ded if 'TP' in str(r[5]).upper())
          print(f"  TP_HIT share = {100*tp/max(len(ded),1):.1f}%")

          # holding time
          import datetime as dt
          hold=[]
          for r in ded:
              try:
                  a=dt.datetime.fromisoformat(str(r[3]).replace('Z','+00:00')); b=dt.datetime.fromisoformat(str(r[4]).replace('Z','+00:00'))
                  hold.append((b-a).total_seconds()/86400)
              except Exception: pass
          if hold: print(f"  holding days: median={st.median(hold):.2f} mean={st.mean(hold):.2f} max={max(hold):.1f}")

          # cost sensitivity: futures round trip assumption
          for bps in (2,4,8,12):
              net=[float(r[2])-bps/100 for r in ded]
              print(f"  net after {bps:>2} bps: mean={st.mean(net):+.3f}%  median={st.median(net):+.3f}%")

          # ---------- B. kimi beta check ----------
          print("\n=== B. kimi_signal_tracking vs crypto market factor ===")
          cur.execute("""SELECT symbol,direction,pnl_pct,created_at
                         FROM trading_picks
                         WHERE category IN ('CRYPTO','crypto') AND pnl_pct IS NOT NULL AND created_at IS NOT NULL""")
          allc=cur.fetchall()
          byday=collections.defaultdict(list)
          for s,d,p,c in allc: byday[str(c)[:10]].append(float(p))
          mkt={k:st.mean(v) for k,v in byday.items()}
          kimi=[(str(c)[:10],float(p)) for s,d,p,c in allc if False]
          cur.execute("""SELECT pnl_pct,created_at FROM trading_picks
                         WHERE source_system='kimi_signal_tracking' AND pnl_pct IS NOT NULL AND created_at IS NOT NULL""")
          kr=cur.fetchall()
          # dedupe by day+symbol not needed for the factor test; use all
          raw=[float(p) for p,c in kr]
          stats(raw,"kimi raw")
          excess=[]; 
          for p,c in kr:
              d=str(c)[:10]
              if d in mkt: excess.append(float(p)-mkt[d])
          stats(excess,"kimi minus same-day mkt")
          # also: what was the market doing on those days?
          days=sorted({str(c)[:10] for p,c in kr})
          print(f"  kimi window: {days[0]} .. {days[-1]}  ({len(days)} distinct days)")
          mk=[mkt[d] for d in days if d in mkt]
          if mk: print(f"  crypto class mean on those days: {st.mean(mk):+.3f}%  (n_days={len(mk)})")
          cn.close()
          PY

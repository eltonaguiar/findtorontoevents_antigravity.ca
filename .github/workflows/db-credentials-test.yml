name: DB Credentials Test

# Manually-triggered test — verifies GitHub Actions can authenticate to all 10
# MySQL databases (ejaguiar1_*) using the consolidated DB_PASSWORDS_JSON secret.
# Run it from the Actions tab ("Run workflow"). Read-only: it only opens a
# connection and counts tables — no writes. Passwords are never printed.
#
# If it fails with [1045] for every DB, the GitHub-runner IP (printed at the
# top of the log) is almost certainly not in the 50webs Remote-MySQL allowlist
# — runner IPs rotate, so `%` (any-host) grants are usually required for CI.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-db-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: mysql.50webs.com
      DB_PASSWORDS_JSON: ${{ secrets.DB_PASSWORDS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pymysql
        run: pip install pymysql -q

      - name: Test all 10 DB connections
        run: python3 tools/test_db_credentials.py

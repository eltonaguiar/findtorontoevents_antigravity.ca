name: Recommended Portfolio Generator

on:
  schedule:
    - cron: '28 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-portfolio:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Generate recommended portfolio
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python alpha_engine/generate_recommended_portfolio.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alpha_engine/data/recommended_portfolio.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Recommended portfolio $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            for i in 1 2 3; do
              bash .github/scripts/safe_push.sh && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi


# CI Test Suite — runs all unit tests on every push to main
# Covers: tests/ (root), paper_trading/strategies, alpha_engine
# Total: ~747 tests (558 root + 103 walkforward elite + 86 alpha_engine)
name: CI Tests

'on':
  push:
    branches: [main]
    # Storm-commit repo: without a path filter EVERY push (incl. docs/report/
    # data commits) triggered the full 747-test suite, and the next push
    # cancelled it via concurrency — ~18/19 runs cancelled, CI never a gate.
    # Mirror the pull_request paths so only code-relevant pushes run CI.
    paths:
      # Python only. The hourly scanners commit **/data/*.json under these
      # same dirs, so the dir-wide globs re-triggered this suite every few
      # minutes and each new run cancelled the previous one.
      - 'paper_trading/*.py'
      - 'paper_trading/**/*.py'
      - 'alpha_engine/*.py'
      - 'alpha_engine/**/*.py'
      - 'audit_trail/*.py'
      - 'audit_trail/**/*.py'
      - 'audit_dashboard/template.html'
      - 'audit_dashboard/dashboard_enhancements.js'
      - 'tests/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements.txt'
      - 'alpha_engine/requirements.txt'
      - '.github/workflows/ci-tests.yml'
  pull_request:
    paths:
      # Python only. The hourly scanners commit **/data/*.json under these
      # same dirs, so the dir-wide globs re-triggered this suite every few
      # minutes and each new run cancelled the previous one.
      - 'paper_trading/*.py'
      - 'paper_trading/**/*.py'
      - 'alpha_engine/*.py'
      - 'alpha_engine/**/*.py'
      - 'audit_trail/*.py'
      - 'audit_trail/**/*.py'
      - 'audit_dashboard/template.html'
      - 'audit_dashboard/dashboard_enhancements.js'
      - 'tests/**'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements.txt'
      - 'alpha_engine/requirements.txt'
      - '.github/workflows/ci-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# Storm-commit repo: a newer push supersedes the in-flight test run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede only on pull_request. On main this used to kill the in-flight
  # suite whenever another commit landed, so a red main reported as
  # "cancelled" instead of failing (4 of the last 20 runs). main runs now
  # queue and are allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # fail-fast cancelled the sibling matrix job whenever one version failed,
      # which made chronic failures look like "cancellations/timeouts" in the UI
      # (e.g. 3.12 fails -> 3.11 cancelled). Run both to completion for signal.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      # `verify_peer_claims` resolves refs with `git rev-parse --verify
      # <ref>^{commit}` (default ref: origin/main). The default shallow checkout
      # fetches only the PR merge ref, so origin/main did not exist locally, the
      # tool exited 2 with "cannot resolve origin/main", and
      # tests/test_verify_peer_claims.py::test_remote_map_env_var failed on
      # EVERY pull request (5 of the last 8 PR runs), while passing on main's
      # own push runs where origin/main is present. One depth-1 fetch of the ref
      # is enough: the tool already downgrades object-graph checks to warnings
      # under --allow-shallow, it only needs the ref to resolve.
      - name: Make origin/main resolvable for ref-based checks
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify --quiet 'origin/main^{commit}' >/dev/null
          echo "origin/main resolves at $(git rev-parse --short 'origin/main^{commit}')"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ci-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'alpha_engine/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-ci-

      # tests/test_movies_db_config.py, test_movies_legacy_wrapper.py and
      # test_movies_rating_refresh.py carry
      # `pytest.mark.skipif(not PHP, reason="PHP CLI not available")`, so with no
      # PHP on the runner all 46 tests report SKIPPED and the suite still exits 0.
      # That made "CI green" a hollow claim for those 631 lines of coverage.
      #
      # The tests execute the real db-config.php with a stubbed PDO class, so the
      # PHP binary must have PDO as a SHARED module: they pass `-n` (no ini) to
      # suppress it. Ubuntu's php-cli loads PDO from conf.d/*.ini, so `-n` hides
      # it and the stub can be declared. Verified against ubuntu:24.04 php 8.3.6
      # (46/46 pass) and Debian php 8.2.36. Do NOT switch to the official
      # `php:8.x-cli` docker image -- PDO is compiled in statically there and the
      # stub declaration dies with "Cannot declare class PDO".
      - name: Install PHP CLI (movies tests skip without it)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq --no-install-recommends php-cli
          php -v | head -1
          # Guard against a silent return to skipping: assert PDO is absent under
          # -n, which is the precondition the stub class relies on.
          php -n -r 'exit(extension_loaded("pdo") ? 1 : 0);' \
            || { echo "FAIL: PDO is built into this PHP; the movies tests' stub class cannot be declared under -n"; exit 1; }
          echo "PHP ready: movies tests will execute rather than skip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r alpha_engine/requirements.txt
          pip install "pytest>=7,<9" pytest-cov pytest-timeout

      - name: Run dashboard card-metrics JS guard
        # Node test (not pytest) — locks in the compounded-return card fix so
        # the sum-of-percentages bug cannot regress. Ubuntu runners ship node;
        # the test reads audit_dashboard/template.html, no npm install needed.
        run: node tests/test_card_metrics.js

      - name: Run active-pick WHY justification JS guard
        # Node test (not pytest) — locks in the per-pick "WHY" evidence tooltip
        # (statistical + fundamental justification, with an honest tier when the
        # evidence is thin). Reads audit_dashboard/template.html, no npm install.
        run: node tests/test_active_pick_why_justification.js

      - name: Write known-drift quarantine list
        # ROOT CAUSE of the chronic red CI (2026-06-09/10 diagnosis, runs
        # 27230860484 + 27289298439): the suite does NOT hang or time out —
        # it finishes in ~5-6 min with the SAME deterministic assertion
        # failures on every push. Production behavior changed (category
        # normalization crypto->CRYPTO, FOREX_HARD_DISABLE default flip,
        # ETF tight-gate floor, tools/portfolios profile params via
        # bb7fd2d740, money-ready M-070/M-105 verdict rules) but these tests
        # still assert the OLD behavior. Until each test is reconciled with
        # its module, they are quarantined out of the gating run and executed
        # in a separate NON-BLOCKING step below so the drift stays visible.
        # TODO(owner): reconcile + remove entries; this list should shrink.
        run: |
          cat > /tmp/known_drift_tests.txt <<'EOF'
          # 2026-11-23: EMPTY - every previously quarantined test now PASSES.
          # Verified by running the full suite with NO deselects: 0 failed,
          # 7760 passed. The 24 known-drift failures were fixed, not muted:
          # M-098 read an env var conftest never set; two hardcoded toxic
          # pairs (COMMODITY/EQUITY multi_asset_cot) re-imposed blocks the
          # protocol had already ruled out; a fixed 2026-06-02 timestamp aged
          # every fixture past the staleness threshold; and PEAD/meta/kimi/
          # eagle2 fixtures had drifted onto live data. Per this step's own
          # rule, green tests return to the gating run.
          # To re-quarantine a test, add one node id per line below.
          EOF
          echo "Quarantined $(wc -l < /tmp/known_drift_tests.txt) known-drift tests"

      - name: Run all tests (gating — known-drift quarantined)
        # --timeout guards against future genuinely-hanging tests (none seen
        # in the 2026-06 diagnosis, but it converts any hang into a named
        # failure instead of a job-level cancel). thread method: some tests
        # use signal handlers / subprocesses.
        env:
          # 2026-06-10: test_money_ready_verdict transitively hit the LIVE FRED
          # API (passes_high_conviction_gate -> get_macro_context ->
          # fetch_fred_series) which hangs >120s on CI runners — the new timeout
          # correctly caught it. No-op the macro fetch via the module's own
          # kill-switch (alpha_engine/fred_macro_context.py:62).
          FRED_MACRO_DISABLED: '1'
        run: |
          # Skip comment/blank lines: the list keeps explanatory `#` comments, and
          # a bare `--deselect=# 2026-10-04: ...` would word-split into a stray
          # pytest path arg ("file or directory not found: 2026-10-04:").
          DESELECTS=$(grep -vE '^[[:space:]]*(#|$)' /tmp/known_drift_tests.txt | sed 's/^[[:space:]]*/--deselect=/' | tr '\n' ' ')
          python -m pytest tests/ paper_trading/tests/ alpha_engine/tests/ tools/tests/ \
            -v \
            --tb=short \
            --durations=10 \
            --timeout=120 --timeout-method=thread \
            --junitxml=test-results.xml \
            --cov=alpha_engine --cov=audit_trail --cov=tools \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=10 \
            --no-cov-on-fail \
            -m "not integration and not network" \
            $DESELECTS

      - name: Known-drift tests (non-blocking visibility run)
        # Runs ONLY the quarantined tests so their status stays on the radar
        # without blocking merge protection. When a test here goes green,
        # move it back to the gating run (delete its line from the list).
        if: always()
        continue-on-error: true
        run: |
          mapfile -t DRIFT < <(grep -vE '^[[:space:]]*(#|$)' /tmp/known_drift_tests.txt | sed 's/^[[:space:]]*//')
          # 2026-11-23: with an empty quarantine list this step must exit
          # rather than fall through to a bare `pytest`, which would collect
          # the whole repo a second time.
          if [ "${#DRIFT[@]}" -eq 0 ]; then
            echo "No known-drift tests quarantined - nothing to run."
            exit 0
          fi
          python -m pytest "${DRIFT[@]}" \
            -q --tb=line --no-header -p no:cacheprovider --no-cov \
            --timeout=120 --timeout-method=thread \
            || echo "::warning title=known-drift tests still red::See 'Write known-drift quarantine list' step for the reconciliation TODO."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        run: |
          python -m coverage report --skip-covered --skip-empty 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "::group::Test run complete"
          echo "paper_trading + alpha_engine CI suite finished."
          echo "::endgroup::"

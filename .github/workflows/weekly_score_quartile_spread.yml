# Weekly guardrail: score ranking signal on recent_closed (top vs bottom quartile WR spread).
# Uses committed tools/data/score_pnl_analysis.json — refresh via analyze_audit_scores_vs_pnl.py in CI or locally.
name: Weekly score quartile spread

'on':
  schedule:
    - cron: '49 14 * * 1' # Mondays 14:15 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quartile-spread:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        # 2026-04-20: run 24673337770 failed with ModuleNotFoundError: numpy.
        # Script chain imports analyze_audit_scores_vs_pnl.py which needs numpy.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
      - name: Fetch dashboard payload (gitignored)
        # analyze_audit_scores_vs_pnl.py reads audit_dashboard/data/dashboard_data.json,
        # which is gitignored and never present at actions/checkout (it exits 1).
        run: |
          mkdir -p audit_dashboard/data
          curl -fsS --max-time 60 \
            "https://findtorontoevents.ca/audit/data/dashboard_data.json" \
            -o audit_dashboard/data/dashboard_data.json \
            || echo "::warning::dashboard_data.json fetch failed — score/PnL analysis may be skipped"

      - name: Check spread vs floor
        run: python tools/weekly_score_quartile_regression.py


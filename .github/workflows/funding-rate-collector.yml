name: Funding-Rate Archive Collector

# OPT-IN passive-archive collector feeding hypothesis H-006 (CRYPTO perpetual
# funding-rate). Runs the stdlib-only collector daily and commits the JSONL
# archive. NOT wired into any production pick/score/gate path.

on:
  schedule:
    # Daily at 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: funding-rate-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Collect funding rates
        run: |
          echo "Running: python tools/funding_rate_collector.py"
          python tools/funding_rate_collector.py

      - name: Commit funding-rate archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/funding_rate_archive/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git commit -m "Funding-rate archive @ ${TS} [skip ci]"
            git pull --rebase origin main
            bash .github/scripts/safe_push.sh
          fi


name: Edge Stability Automation

'on':
  schedule:
    # Run every 2 days at 22:00 UTC to keep edge stability reports fresh
    - cron: '0 22 */2 * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  update-edge-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt found, continuing..."

      - name: Run edge stability updater
        id: update
        run: |
          python tools/edge_stability_updater.py
          echo "update_completed=true" >> $GITHUB_OUTPUT

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet audit_dashboard/data/edge_stability/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in edge stability data"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in edge stability data"
            git diff --stat audit_dashboard/data/edge_stability/
          fi

      - name: Commit updated data
        if: steps.check_changes.outputs.has_changes == 'true' || github.event.inputs.force_update == 'true'
        run: |
          git config user.name "Edge Stability Automator"
          git config user.email "automation@findtorontoevents.ca"
          git add audit_dashboard/data/edge_stability/
          git commit -m "chore: update edge stability reports [skip ci]" \
            -m "Updated edge_stability_index.json and per-class JSONs" \
            -m "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true' || github.event.inputs.force_update == 'true'
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/safe_push.sh

      - name: Report status
        if: always()
        run: |
          echo "## Edge Stability Update Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Update Status:** ${{ steps.update.outputs.update_completed }}" >> $GITHUB_STEP_SUMMARY
          echo "**Changes Detected:** ${{ steps.check_changes.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Updated" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh audit_dashboard/data/edge_stability/*.json 2>/dev/null || echo "No files found" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

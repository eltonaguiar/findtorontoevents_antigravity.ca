name: Mercury 2  Signal Scanner

on:
  # Re-enabled 2026-03-16: expanded symbol universe (34 coins) for broader coverage
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      force_mode:
        description: 'Force pick generation despite validation failure (adds warning flag)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: mercury2-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas xgboost lightgbm scikit-learn joblib requests scipy catboost

      - name: Run Mercury 2 scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_FRESHPICKS: ${{ secrets.DISCORD_WEBHOOK_FRESHPICKS }}
          MERCURY2_FORCE_MODE: ${{ github.event.inputs.force_mode || 'false' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "=== Mercury 2 Scanner ==="
          if [ "$MERCURY2_FORCE_MODE" = "true" ]; then
            echo "  FORCE MODE ENABLED  Picks will be generated with validation_warning flag"
          fi
          python -m mercury2

      - name: Mercury 2 quality metrics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m mercury2.metrics_report

      - name: Push Mercury2 picks to Audit Trail
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python mercury2/audit_push.py 2>&1 || echo "Mercury2 audit push failed (non-fatal)"

      - name: Commit results
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "Mercury 2 Bot"
          git config user.email "mercury2@findtorontoevents.ca"
          git add mercury2/data/ || true
          git add data/audit_trail.db 2>/dev/null || true
          git add ml_battleground/retrain_trigger.json ml_battleground/baseline_metrics.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m " Mercury 2 scan $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3; do
            bash .github/scripts/safe_push.sh && break
            echo "Push attempt $i failed, retrying in ${i}0s..."
            sleep ${i}0
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin main || true
          done

      - name: Notify sandbox on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_SANDBOX: ${{ secrets.DISCORD_WEBHOOK_SANDBOX }}
        run: bash .github/notify-failure.sh "Mercury 2  Signal Scanner" "$DISCORD_WEBHOOK_SANDBOX" "${{ github.repository }}" "${{ github.run_id }}"


name: _sweep-tmp

on:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Build price cache (asset_class_review *_5y.csv)
        run: |
          python -m tools.etf_trend_price_refresh

      - name: Run exit-rule sweep (dry run, no DB writes)
        run: |
          python tools/_tmp_sweep.py

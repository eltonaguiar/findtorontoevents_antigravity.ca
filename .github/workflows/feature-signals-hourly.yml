name: Feature Signals — Non-LLM Emitters

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feature-signals-hourly
  cancel-in-progress: true

jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -q requests yfinance pymysql
      - name: Emit feature signals
        env:
          FEATURE_SIGNALS_ENABLED: '1'
          FEATURE_SIGNALS_REFRESH: '1'
        run: python3 -m tools.feature_signals.orchestrator
      - name: Commit JSON (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit_dashboard/data/feature_signals_latest.json
          git diff --staged --quiet || git commit -m "chore(audit): refresh feature_signals_latest.json [skip ci]"
          git push || echo "::warning::push failed (concurrent commit)"
name: Deploy FindCryptoPairs to FTP

on:
  push:
    branches: [main]
    paths:
      - 'findcryptopairs/**'
      - '.github/workflows/deploy-findcryptopairs-ftp.yml'
  schedule:
    # Redeploy every 6 hours to keep in sync
    - cron: '15 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Rapid Fire - NOW Scanner"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy findcryptopairs to findtorontoevents.ca (50webs) via FTP
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os, sys
          from pathlib import Path

          host = os.environ.get("FTP_HOST", "")
          user = os.environ.get("FTP_USER", "")
          pwd  = os.environ.get("FTP_PASS", "")

          if not all([host, user, pwd]):
              print("findtorontoevents.ca FTP credentials not set, skipping")
              sys.exit(0)

          SITE_ROOT = "findtorontoevents.ca"
          LOCAL_DIR = Path("findcryptopairs")

          # HTML pages to deploy
          html_files = list(LOCAL_DIR.glob("*.html"))
          # API files
          api_files = list((LOCAL_DIR / "api").glob("*.php")) + list((LOCAL_DIR / "api").glob("*.json"))

          print(f"Connecting to {host} (findtorontoevents.ca) timeout=30s...")
          try:
              ftp = ftplib.FTP(host, timeout=30)
              ftp.login(user, pwd)
              ftp.cwd(SITE_ROOT)
              print("Connected")

              # Ensure directories exist
              for d in ["findcryptopairs", "findcryptopairs/api"]:
                  try:
                      ftp.mkd(d)
                      print(f"  Created /{d}/")
                  except Exception:
                      pass

              # Upload HTML files
              ftp.cwd(f"/{SITE_ROOT}/findcryptopairs")
              for f_path in html_files:
                  with open(f_path, "rb") as f:
                      ftp.storbinary(f"STOR {f_path.name}", f)
                  print(f"  Uploaded {f_path.name} ({f_path.stat().st_size} bytes)")

              # Upload API files
              ftp.cwd(f"/{SITE_ROOT}/findcryptopairs/api")
              for f_path in api_files:
                  with open(f_path, "rb") as f:
                      ftp.storbinary(f"STOR {f_path.name}", f)
                  print(f"  Uploaded api/{f_path.name} ({f_path.stat().st_size} bytes)")

              ftp.quit()
              print(f"findtorontoevents.ca/findcryptopairs/ deployed ({len(html_files)} HTML, {len(api_files)} API)")
          except Exception as e:
              print(f"findtorontoevents.ca FTP failed: {e}")
              sys.exit(1)
          PYEOF

      - name: Deploy findcryptopairs to torontoevent.net via FTP
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          FTP_USER: ${{ secrets.FTPGODADDYUSER }}
          FTP_PASS: ${{ secrets.FTPGODADDYPASS }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os, sys
          from pathlib import Path

          host = os.environ.get("FTP_HOST", "")
          user = os.environ.get("FTP_USER", "")
          pwd  = os.environ.get("FTP_PASS", "")

          if not all([host, user, pwd]):
              print("torontoevent.net FTP credentials not set, skipping")
              sys.exit(0)

          LOCAL_DIR = Path("findcryptopairs")
          html_files = list(LOCAL_DIR.glob("*.html"))
          api_files = list((LOCAL_DIR / "api").glob("*.php")) + list((LOCAL_DIR / "api").glob("*.json"))

          print(f"Connecting to {host} (torontoevent.net) timeout=30s...")
          try:
              ftp = ftplib.FTP(host, timeout=30)
              ftp.login(user, pwd)
              print("Connected")

              for d in ["findcryptopairs", "findcryptopairs/api"]:
                  try:
                      ftp.mkd(d)
                      print(f"  Created /{d}/")
                  except Exception:
                      pass

              ftp.cwd("/findcryptopairs")
              for f_path in html_files:
                  with open(f_path, "rb") as f:
                      ftp.storbinary(f"STOR {f_path.name}", f)
                  print(f"  Uploaded {f_path.name} ({f_path.stat().st_size} bytes)")

              ftp.cwd("/findcryptopairs/api")
              for f_path in api_files:
                  with open(f_path, "rb") as f:
                      ftp.storbinary(f"STOR {f_path.name}", f)
                  print(f"  Uploaded api/{f_path.name} ({f_path.stat().st_size} bytes)")

              ftp.quit()
              print(f"torontoevent.net/findcryptopairs/ deployed ({len(html_files)} HTML, {len(api_files)} API)")
          except Exception as e:
              print(f"torontoevent.net FTP failed: {e}")
              sys.exit(1)
          PYEOF

      - name: Verify URLs
        if: always()
        continue-on-error: true
        run: |
          sleep 8
          echo "=== Checking live URLs ==="
          for page in pump-watch.html algo-competition-enhanced.html audit-trail.html; do
            s=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 "https://findtorontoevents.ca/findcryptopairs/$page" || echo "timeout")
            echo "findtorontoevents.ca/findcryptopairs/$page: $s"
          done


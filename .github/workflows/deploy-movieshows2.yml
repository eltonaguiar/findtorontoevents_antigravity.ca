name: Deploy MOVIESHOWS2 API

# MOVIESHOWS2 had no deploy path at all, so fixes committed for it never reached
# 50webs (PHP 5.2.17). This publishes the two API files that are safe to publish and
# deliberately leaves the rest alone - see the exclusion notes below.
#
# Scope decision (2026-11-26 drift audit):
#   IN   api/movies.php       the PHP 5.2 rewrite; the live copy is legacy code with
#                             60 post-5.2 constructs, i.e. it cannot even parse there
#   IN   api/get-movies.php   never deployed; contains the OPTIONS preflight fix
#   IN   api/db-config.php    the live 683-byte copy hardcodes STALE credentials and
#                             made both endpoints answer "Database connection failed".
#                             The repo copy resolves the same private credentials file
#                             MOVIESHOWS3 already uses successfully (both api/ dirs sit
#                             at the same depth, verified live with a throwaway probe:
#                             {"connected":true}), so publishing it FIXES the DB.
#   OUT  api/sync-providers.php  unexplained 176-byte drift, needs a human diff
#   OUT  api/test-db.php, api/freestyle-search.php  not currently served; adding new
#                             public endpoints is a product decision, not a deploy
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Publish to findtorontoevents.ca/movieshows2/api (50webs)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME_50WEBS }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD_50WEBS }}
        run: |
          python3 - <<'PY'
          import ftplib, hashlib, io, os, sys

          host = os.environ.get('FTP_HOST', '')
          user = os.environ.get('FTP_USER', '')
          pw = os.environ.get('FTP_PASS', '')
          if not all([host, user, pw]):
              sys.exit('Missing FTP credentials')

          files = [
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/api/movies.php',     'movies.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/api/get-movies.php', 'get-movies.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/api/db-config.php',  'db-config.php'),
          ]

          ftp = ftplib.FTP(host, timeout=60)
          ftp.login(user, pw)
          ftp.cwd('/findtorontoevents.ca/movieshows2/api')
          changed = 0
          for local, name in files:
              with open(local, 'rb') as f:
                  data = f.read()
              buf = io.BytesIO()
              try:
                  ftp.retrbinary('RETR ' + name, buf.write)
                  if hashlib.sha256(buf.getvalue()).digest() == hashlib.sha256(data).digest():
                      print(f'{name}: already current, skipping')
                      continue
              except ftplib.error_perm:
                  print(f'{name}: not present yet, uploading')
              ftp.storbinary('STOR ' + name, io.BytesIO(data))
              print(f'{name}: uploaded {len(data)} B')
              changed += 1
          ftp.quit()
          print(f'{changed} file(s) changed')
          PY

      - name: Verify on the live host
        run: |
          set -u
          for PATH_ in "movies.php?action=stats" "get-movies.php"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://findtorontoevents.ca/movieshows2/api/$PATH_" || echo 000)
            echo "GET  $PATH_ -> HTTP $CODE"
          done
          for PATH_ in "movies.php" "get-movies.php"; do
            CODE=$(curl -s -X OPTIONS -o /dev/null -w "%{http_code}" --max-time 20 "https://findtorontoevents.ca/movieshows2/api/$PATH_" || echo 000)
            echo "OPTIONS $PATH_ -> HTTP $CODE"
          done

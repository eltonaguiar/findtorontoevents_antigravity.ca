name: Outcome Resolver  Validate Unresolved Picks

on:
  schedule:
    # Every hour (was every 2h  missing intra-period TP/SL hits, Kimi K10)
    - cron: '15 */1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no file changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: outcome-resolver
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve-outcomes:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests pymysql
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"

      - name: WON/PnL sign-coherence (dry-run; apply when WON_PNL_AUTO_APPLY=1)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          DB_STOCKS_HOST: mysql.50webs.com
          DB_STOCKS_USER: ejaguiar1_stocks
          DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD || secrets.DB_PASS_STOCKS || 'stocks' }}
          DB_STOCKS_NAME: ejaguiar1_stocks
          DB_STOCKS_PORT: '3306'
        run: |
          if [ "${{ vars.WON_PNL_AUTO_APPLY || '0' }}" = "1" ]; then
            python tools/audit_won_picks_auto.py --apply || true
          else
            python tools/audit_won_picks_auto.py || true
          fi

      - name: Active Picks Sync — bridge ACTIVE → CLOSED for signal_outcomes
        # PR #2 live-writer: reads at_raw_picks OPEN/ACTIVE rows from MySQL,
        # detects TP/SL/time-exit against live prices, and writes terminal entries
        # to both at_raw_picks (status/exit_price/pnl_pct) and closed_picks.json.
        # This is the missing upstream piece that causes signal_outcomes table
        # to have only 0.09% coverage (121 rows on 136K+ raw picks).
        env:
          PYTHONPATH: ${{ github.workspace }}
          DB_STOCKS_HOST: mysql.50webs.com
          DB_STOCKS_USER: ejaguiar1_stocks
          DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD || secrets.DB_PASS_STOCKS || 'stocks' }}
          DB_STOCKS_NAME: ejaguiar1_stocks
          DB_STOCKS_PORT: '3306'
          ACTIVE_PICKS_SYNC_APPLY: '1'
        run: |
          echo "============================================"
          echo "  ACTIVE PICKS SYNC — MySQL writer (PR#2)"
          echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          python alpha_engine/active_picks_sync.py \
            --asset-class CRYPTO \
            --max-rows 5000 \
            --apply
          python alpha_engine/active_picks_sync.py \
            --asset-class EQUITY \
            --max-rows 5000 \
            --apply
          python alpha_engine/active_picks_sync.py \
            --asset-class FOREX \
            --max-rows 5000 \
            --apply
          python alpha_engine/active_picks_sync.py \
            --asset-class COMMODITY \
            --max-rows 3000 \
            --apply
          python alpha_engine/active_picks_sync.py \
            --asset-class ETF \
            --max-rows 2000 \
            --apply
          python alpha_engine/active_picks_sync.py \
            --asset-class BOND \
            --max-rows 1000 \
            --apply || true

      - name: Prune expired picks from active_picks.json
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python alpha_engine/prune_active_picks.py --dry-run
          else
            python alpha_engine/prune_active_picks.py
          fi

      # 2026-06-02 wave 3: close OPEN+ACTIVE rows past per-class hold window (idempotent).
      - name: MySQL stale live picks (OPEN+ACTIVE hold window)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          AUDIT_DB_PASS: ${{ secrets.MYSQL_PASSWORD || secrets.DB_PASS_STOCKS || 'stocks' }}
          DB_PASS_STOCKS: ${{ secrets.MYSQL_PASSWORD || secrets.DB_PASS_STOCKS || 'stocks' }}
        run: |
          echo "::group::stale OPEN+ACTIVE resolver"
          python tools/resolve_stale_open_picks.py --execute --batch-size 500 --max-batches 30
          echo "::endgroup::"

      - name: Run Outcome Resolver
        env:
          PYTHONPATH: ${{ github.workspace }}
          DB_PASS_STOCKS: ${{ secrets.MYSQL_PASSWORD || secrets.DB_PASS_STOCKS || 'stocks' }}
          PICK_OUTCOMES_MYSQL_ENABLED: ${{ inputs.dry_run != 'true' && '1' || '0' }}
        run: |
          echo "============================================"
          echo "  OUTCOME RESOLVER - Validate Closed Picks"
          echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python alpha_engine/outcome_resolver.py --dry-run
          else
            python alpha_engine/outcome_resolver.py --mysql
          fi

      # INC #10 fix (2026-05-26): mirror resolved outcomes into MySQL at_signal_outcomes
      # so the audit dashboard's signal_outcomes coverage stops being 82-days stale.
      # backfill_local_sources.py uses INSERT IGNORE so re-running is idempotent (safe
      # to call hourly even though it scans more than just new picks).
      # EAGLE P1-01 (2026-05-27): fixed credential pattern — was using
      # secrets.DB_STOCKS_HOST/USER/PASSWORD (unset secrets → empty → auth fail).
      # Now uses same hardcoded host/user + secret fallback chain as Active Picks Sync.
      # Also upgraded from silent warning to job annotation + error log for visibility.
      - name: Mirror resolved outcomes to MySQL at_signal_outcomes (INC #10)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          DB_STOCKS_HOST: mysql.50webs.com
          DB_STOCKS_USER: ejaguiar1_stocks
          DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD || secrets.DB_PASS_STOCKS || 'stocks' }}
          DB_STOCKS_NAME: ejaguiar1_stocks
          DB_STOCKS_PORT: '3306'
        run: |
          echo "::group::at_signal_outcomes mirror (INC #10)"
          python audit_trail/backfill_local_sources.py 2>&1
          _mirror_rc=$?
          echo "::endgroup::"
          if [ $_mirror_rc -ne 0 ]; then
            echo "::error title=at_signal_outcomes_mirror::backfill_local_sources failed (exit=$_mirror_rc) — outcomes NOT mirrored to MySQL this cycle"
          else
            echo "at_signal_outcomes mirror: OK"
          fi

      - name: Commit resolved picks
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true' }}
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # outcome_resolver_log.json was added to .gitignore by 94c208b8d (v6) as
          # a "live-state JSON" — but downstream dashboard readers need the committed
          # log for resolution stats. Use -f to override the ignore.
          git add -f alpha_engine/data/outcome_resolver_log.json
          # closed_picks.json gitignored by 8bc9cf075 (1.9 MB live / 21 MB historical
          # bloat). Optional add so workflow doesn't fail when file is absent on
          # fresh runner checkout. See reports/2026-05-26_forward_validator_freeze_diagnosis.md.
          git add -f alpha_engine/data/closed_picks.json 2>/dev/null || true
          git add -f alpha_engine/data/active_picks.json 2>/dev/null || true
          git add -f alpha_engine/data/expired_picks_archive.json 2>/dev/null || true
          git add -f rapid_fire_data/closed_picks.json 2>/dev/null || true
          git add -f rapid_fire_data/now_picks.json 2>/dev/null || true
          git add -f quan_engine/data/active_signals.json 2>/dev/null || true
          git add -f quan_engine/data/quan_engine.db 2>/dev/null || true
          git add -f claude_gainer_ml/tracker/claude_live_picks.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          RESOLVED=$(python -c "
          import json
          try:
              with open('alpha_engine/data/outcome_resolver_log.json') as f:
                  log = json.load(f)
              last = log[-1] if log else {}
              core = last.get('resolved_count', 0)
              qe = last.get('quan_engine_resolved', 0)
              rf = last.get('rapid_fire_closed_resolved', 0)
              rfn = last.get('rapid_fire_now_resolved', 0)
              cgml = last.get('claude_gainer_ml_resolved', 0)
              total = core + qe + rf + rfn + cgml
              print(f\"{total} picks (WR={last.get('win_rate', 0)}%)\")
          except: print('picks')
          ")
          git commit -m "auto: outcome resolver - resolved ${RESOLVED} [skip ci]"
          git remote set-url origin "https://x-access-token:${TOKEN_FOR_PUSH}@github.com/${GITHUB_REPOSITORY}.git"
          bash .github/scripts/safe_push.sh


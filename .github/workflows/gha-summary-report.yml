# Regenerate GitHub Actions fleet summary (JSON + HTML) and deploy to findtorontoevents.ca
name: gha-summary-report
run-name: "${{ github.workflow }} · ${{ github.event_name }} · ${{ github.sha }}"

on:
  workflow_dispatch:
  schedule:
    - cron: "50 */6 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify gh CLI auth
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: gh auth status

      - name: Generate GHA summary (full fleet)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          python tools/generate_gha_summary_html.py \
            --repo "${{ github.repository }}" \
            --branch main \
            --max-workers 8 \
            --log-timeout 120

      - name: Commit summary artifacts
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          if [ -f .github/scripts/safe_commit_push.sh ]; then
            bash .github/scripts/safe_commit_push.sh \
              "Update GHA actions summary [skip ci]" \
              reports/gha_actions_summary.json \
              reports/gha_actions_summary.html
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add reports/gha_actions_summary.json reports/gha_actions_summary.html
            git diff --staged --quiet || git commit -m "Update GHA actions summary [skip ci]"
            # 2026-11-16: routed through safe_push — bare push dropped data on non-FF
            bash .github/scripts/safe_push.sh
          fi

      - name: Deploy summary HTML to findtorontoevents.ca
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python tools/deploy_gha_summary.py

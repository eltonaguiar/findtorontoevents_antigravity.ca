name: DB Freshness Check (Legacy Manual)

on:
  workflow_dispatch:

# Default GITHUB_TOKEN is read-only without this — the freshness-snapshot
# commit step then fails 403 (denied to github-actions[bot]).
permissions:
  contents: write

jobs:
  db-freshness:
    name: Check DB table freshness
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pymysql

      - name: Run DB freshness check
        env:
          # Canonical new names (preferred by db_env.py)
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_PASS_BACKTESTS: ${{ secrets.DB_PASS_BACKTESTS || secrets.MYSQL_PASSWORD }}
          # Legacy names for backward compat
          DB_STOCKS_PASSWORD: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_STOCKS_HOST: ${{ secrets.DB_HOST_STOCKS || 'mysql.50webs.com' }}
          DB_STOCKS_USER: ${{ secrets.DB_USER_STOCKS || 'ejaguiar1_stocks' }}
          DB_STOCKS_NAME: ${{ secrets.DB_NAME_STOCKS || 'ejaguiar1_stocks' }}
          DB_BACKTESTS_PASSWORD: ${{ secrets.DB_PASS_BACKTESTS || secrets.MYSQL_PASSWORD }}
          DB_BACKTESTS_HOST: ${{ secrets.DB_HOST_BACKTESTS || 'mysql.50webs.com' }}
          DB_BACKTESTS_USER: ${{ secrets.DB_USER_BACKTESTS || 'ejaguiar1_backtests' }}
          DB_BACKTESTS_NAME: ${{ secrets.DB_NAME_BACKTESTS || 'ejaguiar1_backtests' }}
          DB_FRESHNESS_OUTPUT: audit_dashboard/data/db_freshness.json
        run: |
          echo "=== DB Freshness Guardian ==="
          python tools/db_freshness_check.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 2 ]; then
            echo "::error::DB freshness RED — at least one table is critically stale (>threshold). Check audit_dashboard/data/db_freshness.json"
            exit 2
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "::warning::DB freshness YELLOW — at least one table is approaching staleness. Review db_freshness.json"
            exit 0  # Warning only — don't fail CI on yellow
          else
            echo "DB freshness GREEN — all tables fresh"
          fi

      - name: Commit freshness report
        if: always()
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "DB Freshness Bot"
          git config user.email "db-freshness@findtorontoevents.ca"
          git add audit_dashboard/data/db_freshness.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(db-freshness): update freshness report [skip ci]"
          git pull --rebase origin main || true
          bash .github/scripts/safe_push.sh || true

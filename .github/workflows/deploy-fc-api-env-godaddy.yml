name: "Deploy fc/api/.env to GoDaddy (torontoevent.net)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-env:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Build and upload fc/api/.env to GoDaddy
        env:
          DST_HOST: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          DST_USER: ${{ secrets.FTPGODADDYUSER }}
          DST_PASS: ${{ secrets.FTPGODADDYPASS }}
          DB_USER: ${{ secrets.TORONTOEVENT_DB_USER }}
          DB_PASS: ${{ secrets.TORONTOEVENT_DB_PASS }}
          ENV_EXTRAS: ${{ secrets.FC_API_ENV_EXTRAS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_SECRET_CLIENTID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_SERCRET_CLOUD }}
        run: |
          python3 - <<'PYEOF'
          import os

          db_user = os.environ.get('DB_USER', '')
          db_pass = os.environ.get('DB_PASS', '')
          extras = os.environ.get('ENV_EXTRAS', '')
          google_id = os.environ.get('GOOGLE_CLIENT_ID', '')
          google_secret = os.environ.get('GOOGLE_CLIENT_SECRET', '')

          lines = []
          lines.append('# GoDaddy fc/api .env -- auto-generated by GitHub Actions')
          lines.append('MYSQL_HOST=localhost')
          lines.append('MYSQL_USER=' + db_user)
          lines.append('MYSQL_PASSWORD="' + db_pass + '"')
          lines.append('MYSQL_DATABASE=ejaguiar1_favcreators')
          if google_id:
              lines.append('GOOGLE_CLIENT_ID=' + google_id)
          if google_secret:
              lines.append('GOOGLE_CLIENT_SECRET=' + google_secret)
          if extras:
              lines.append('')
              lines.append(extras)

          content = '\n'.join(lines)

          with open('/tmp/godaddy_fc_env', 'w') as f:
              f.write(content)

          has_google = 'GOOGLE_CLIENT_ID' in content
          print('OK .env prepared (MYSQL_USER=' + db_user + ', google=' + str(has_google) + ')')
          PYEOF

          cat > /tmp/lftp_env.script << LFTPEOF
          set ftp:ssl-force true
          set ssl:verify-certificate no
          open -u "$DST_USER","$DST_PASS" "$DST_HOST"
          put /tmp/godaddy_fc_env -o fc/api/.env
          quit
          LFTPEOF

          lftp -f /tmp/lftp_env.script
          echo "fc/api/.env deployed to GoDaddy"

      - name: Verify DB connection on torontoevent.net
        run: |
          sleep 3
          RESULT=$(curl -s --max-time 15 "https://torontoevent.net/fc/api/get_my_creators.php")
          echo "get_my_creators response (first 200 chars): ${RESULT:0:200}"
          if echo "$RESULT" | grep -q '"Database not available"'; then
            echo "FAIL DB still not connecting"
            exit 1
          else
            echo "OK DB connected"
          fi


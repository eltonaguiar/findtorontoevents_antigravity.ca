# H-103 forward-paper logger — monthly cron.
#
# H-103 (reports/hypothesis_registry.json) pre-registers the ETF cross-asset
# dual-momentum sleeve (SPY/QQQ/EFA/AGG/GLD vs BIL) — the only clean-bar archetype
# that cleared the full gate-stack (backtest PR #502, OOS CV PR #509: PF 3.57,
# attribution vs SPY t=2.36, beta 0.34). Its BINDING promotion test is forward
# paper, n>=100. This cron computes the sleeve's current monthly pick from live
# data and appends ONE dated record/month to the forward log so realized forward
# PF/WR can be scored later. No capital, no live-ledger mutation — report-only.
#
# Cron: 14:00 UTC on the 1st of each month. Idempotent per month (the logger
# refuses to double-log the same YYYY-MM), so a missed/retried run is safe.

name: H-103 Forward Logger

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

concurrency:
  group: h103-forward-logger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  log-h103-pick:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance || true

      - name: Run H-103 forward logger
        run: |
          python verified_strategies/paper_pilot/h103_forward_logger.py 2>&1 | tee /tmp/h103.log

      - name: Commit forward-log record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verified_strategies/paper_pilot/h103_forward_log.jsonl
          if git diff --cached --quiet; then
            echo "No new H-103 record this month (already logged or no data)."
            exit 0
          fi
          git commit -m "chore(h103): monthly forward-paper pick record [skip ci]" \
            -m "Generated by h103-forward-logger workflow."
          for i in 1 2 3; do
            if git push; then break; fi
            git pull --rebase || true
            sleep 5
          done

      - name: Summary
        if: always()
        run: |
          echo "=== h103 logger output ==="
          cat /tmp/h103.log 2>/dev/null || echo "(no log)"
          echo "=== forward sample size ==="
          wc -l verified_strategies/paper_pilot/h103_forward_log.jsonl 2>/dev/null || echo "(no log yet)"

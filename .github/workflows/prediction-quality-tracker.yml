name: Prediction Quality Tracker

on:
  schedule:
    - cron: '47 * * * *'  # Staggered from :00 mega-cluster (was 100+ workflows at :00)
  workflow_dispatch:

concurrency:
  group: prediction-quality-tracker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  track-quality:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    # 2026-05-13: run 25821211511 cancelled at ~5m (pip + pandas + tracker on slow runner).
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.12'

      # prediction_quality_tracker.py:600 imports alpha_engine.utils.storage
      # which requires pandas + pyarrow (Parquet helpers). decay_tracker is
      # now lazy via PEP 562 (PR #801) so numpy isn't strictly needed at
      # import time, but it's pulled by the storage chain in practice.
      # (2026-05-04 GHA failures: ModuleNotFoundError numpy then pandas.)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow requests

      - name: Run Prediction Quality Tracker
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python alpha_engine/prediction_quality_tracker.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alpha_engine/data/prediction_quality_history.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update prediction quality metrics $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"

            for i in 1 2 3; do
              bash .github/scripts/safe_push.sh && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi


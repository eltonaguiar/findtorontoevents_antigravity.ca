# Durable crypto_ohlcv ingestion — fills the gap that froze the rsi5070 lead 2026-06-21.
# crypto_ohlcv (1h Binance klines) had NO scheduled refresher and went 11 days stale
# (ended 2026-06-10), so newly-emitted CRYPTO picks had no bars to intrabar-resolve against
# and the honest decisive cohort could not grow. This cron keeps it fresh.
name: crypto-ohlcv refresh

'on':
  schedule:
    - cron: '20 */4 * * *'  # every 4h at :20. Was */6, but GitHub scheduled-run congestion
      # repeatedly skipped/delayed runs and let crypto_ohlcv drift toward the 8h staleness gate
      # (needing manual keep-alive dispatches). At */4 a single skipped run still leaves the bar
      # <~5h, so the honest crypto cohort keeps resolving without babysitting. Idempotent upsert.
  workflow_dispatch:

concurrency:
  group: crypto-ohlcv-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_STOCKS_HOST: mysql.50webs.com
      DB_STOCKS_USER: ejaguiar1_stocks
      DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD || secrets.DB_PASS_STOCKS || 'stocks' }}
      DB_STOCKS_NAME: ejaguiar1_stocks
      DB_STOCKS_PORT: '3306'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install pymysql requests pytz
      - name: Refresh crypto_ohlcv (Binance 1h klines, 3+ failover, idempotent upsert)
        run: python3 tools/refresh_crypto_ohlcv.py --execute --top-symbols 150
      - name: Freshness assert (fail-LOUD if still stale)
        run: |
          python3 -c "
          import sys; sys.path.insert(0, '.')
          import time, pymysql
          from tools.db_env import get_stocks_creds
          keep = ('host','user','password','database','port','connect_timeout')
          c = pymysql.connect(**{k: v for k, v in get_stocks_creds().items() if k in keep})
          cur = c.cursor(); cur.execute('SELECT MAX(timestamp) FROM crypto_ohlcv')
          mx = cur.fetchone()[0]
          age_h = (time.time() * 1000 - mx) / 3600000 if mx else 9999
          print(f'crypto_ohlcv latest bar age: {age_h:.1f}h')
          # 2026-06-21: tightened 12h -> 8h. The cron runs every 6h, so a working refresh
          # keeps the latest bar < ~6-7h old; >8h means this run did NOT advance the bars
          # (e.g. the Binance-451 geo-block no-op that the 12h threshold let pass borderline
          # at 11.85h, masking a dead ingestion for hours).
          if age_h > 8:
              print(f'::error title=crypto_ohlcv_stale::latest bar {age_h:.1f}h old AFTER refresh — ingestion did not advance (broken fetch?); the honest crypto cohort will freeze')
              sys.exit(1)
          print('crypto_ohlcv fresh: OK')
          "

name: Master-Picks Health Score

on:
  schedule:
    # Every 4 hours at minute 30
    - cron: '30 */4 * * *'
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: 1

jobs:
  send-health-score:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Send Health Score to Discord
        env:
          DISCORD_MASTER_PICKS: ${{ secrets.DISCORD_MASTER_PICKS }}
        run: |
          python signal_aggregator/send_health_score.py
      
      - name: Log result
        if: always()
        run: |
          echo "Health score update completed at $(date -u +"%Y-%m-%d %H:%M UTC")"


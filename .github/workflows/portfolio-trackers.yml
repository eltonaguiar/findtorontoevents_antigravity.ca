name: Portfolio Trackers (Real Money + Theory)

on:
  schedule:
    - cron: "15 * * * *"  # Every hour at :15
  workflow_dispatch:

concurrency:
  group: portfolio-trackers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: "3.11"

      - name: Run Real Money Tracker
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
        run: python -m alpha_engine.real_money_tracker || echo "::warning::Real money tracker failed"

      - name: Run Theory Portfolios
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
        run: python -m alpha_engine.portfolio_theories || echo "::warning::Theory portfolios failed"

      - name: Commit and push results
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          bash .github/scripts/safe_commit_push.sh \
            "Portfolio tracker update $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]" \
            alpha_engine/data/real_money_portfolio.json \
            alpha_engine/data/real_money_history.json \
            alpha_engine/data/theory_portfolios.json \
            alpha_engine/data/theory_portfolios_history.json

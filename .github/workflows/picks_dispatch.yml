name: Crypto Picks Dispatch

on:
  schedule:
    # Every 4 hours at minute 0
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even if no picks"
        required: false
        default: "false"

jobs:
  dispatch:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run picks dispatcher
        env:
          DISCORD_MASTER_PICKS: ${{ secrets.DISCORD_MASTER_PICKS }}
          DISCORD_FRESH_PICKS: ${{ secrets.DISCORD_FRESH_PICKS }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/send_top_picks_now.py


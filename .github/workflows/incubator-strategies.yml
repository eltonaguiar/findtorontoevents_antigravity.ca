name: ALPHA ENGINE - Incubator Strategies

on:
  schedule:
    # Every 2 hours
    - cron: '15 */2 * * *'
  workflow_dispatch:

concurrency:
  group: incubator-strategies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  incubator-scan:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Syntax check
        run: python -m py_compile alpha_engine/incubator_strategies.py

      - name: Run incubator strategies
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python alpha_engine/incubator_strategies.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/incubator_picks.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: incubator strategy picks $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            bash .github/scripts/safe_push.sh
          fi

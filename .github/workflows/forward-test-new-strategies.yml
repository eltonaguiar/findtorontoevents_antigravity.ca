name: Forward-Test New Strategies Tracker

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-test-new-strategies
  cancel-in-progress: true

jobs:
  forward-test:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: true
          python-version: '3.12'

      - name: Enforce strategy-generation freeze (P0 gate)
        id: freeze
        # Exit codes are part of the contract: 0 = not frozen, 1 = frozen (an expected
        # state, not a failure), anything else = the gate itself broke. Turning the
        # frozen case into a notice keeps the run green while still skipping generation.
        run: |
          set +e
          python3 tools/strategy_freeze_gate.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Strategy freeze active::P0 items are open - generation, validation and commit are skipped"
          else
            echo "::error title=Strategy freeze gate broke::gate exited $rc (manifest unreadable?)"
            exit "$rc"
          fi

      - name: Run forward-test tracker
        if: steps.freeze.outputs.frozen != 'true'
        run: python alpha_engine/forward_test_new_strategies.py

      - name: Validate proof-protocol metadata
        if: success()
        run: |
          python3 << 'PYEOF'
          import json, sys
          try:
              picks = json.load(open('alpha_engine/data/new_strategy_forward_results.json'))
          except Exception as e:
              print(f"::warning::Cannot read forward-test results: {e}")
              sys.exit(0)
          required_keys = ['pf', 'sharpe', 'n', 'wr', 'oos_pf']
          missing_any = False
          for i, p in enumerate(picks):
              missing = [k for k in required_keys if k not in p]
              if missing:
                  missing_any = True
                  print(f"::warning::Forward-test pick {i} missing proof-protocol keys: {missing}")
          if missing_any:
              print("::warning::Proof-protocol metadata incomplete — candidates not money-ready")
          else:
              print("Proof-protocol metadata present on all picks")
          PYEOF

      - name: Commit results
        run: |
          git config user.name "forward-test-bot"
          git config user.email "bot@antigravity.ca"
          git add -f alpha_engine/data/new_strategy_forward_results.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Forward-test update $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
            # safe_push.sh handles pull --rebase + merge fallback + ref-lock retries
            # internally; a manual `git pull --rebase origin main` here duplicated
            # that and raced other workflows pushing to main on their own schedules.
            TOKEN_FOR_PUSH="${{ secrets.GH_PAT || github.token }}" bash .github/scripts/safe_push.sh
          fi

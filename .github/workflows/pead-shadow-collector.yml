name: H-002 PEAD Shadow Collector

# Accumulates shadow PEAD picks into alpha_engine/data/pead_shadow_log.jsonl.
# Purpose: feed M-107 harness gate — need eff>=0.30 on >=3 walk-forward windows
# before H-002 (PEAD) can advance to LIVE_TESTING in the hypothesis registry.
# Never writes to active_picks.json or any production pick path.

on:
  schedule:
    # Weekdays 22:30 UTC — 30 min after market close to get same-day earnings
    - cron: '11 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: pead-shadow-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-pead-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Refresh earnings calendar (S&P 500 universe)
        # 2026-06-12 (JUN-14 gate prep): the prior 21-megacap universe produced
        # 0 PEAD signals for 8 straight runs — all 21 reported in late April, and
        # at that breadth the lane can never reach its n>=100 bar. Full S&P 500
        # coverage makes Q2 season (mid-July onward) produce real shadow n.
        # TTL-cached: after the first run only stale entries re-fetch.
        env:
          PYTHONPATH: ${{ github.workspace }}
          EARNINGS_FETCHER_ENABLED: "1"
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python tools/earnings_calendar_fetcher.py             --tickers-file data/universe/sp500_tickers.txt --ttl-hours 20             || echo "::warning::earnings calendar refresh failed — PEAD runs on stale cache"

      - name: Run PEAD shadow collector
        env:
          PYTHONPATH: ${{ github.workspace }}
          EQUITY_PEAD_ENABLED: "1"
        run: |
          python tools/pead_shadow_runner.py || echo "::error::pead_shadow_runner exited non-zero (fail-open — this run produced NO shadow data)"

      - name: Commit shadow log
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/pead_shadow_log.jsonl || true
          # 2026-06-12: persist the earnings cache — Finnhub free-tier 429s cap each
          # run at ~216/498 tickers; without committing the cache every run restarts
          # from zero and the S&P500 universe NEVER completes. With persistence +
          # the fetcher TTL, completion takes 2-3 daily runs and stays warm after.
          git add data/earnings/ || true
          if git diff --cached --quiet; then
            echo "No new PEAD shadow picks or cache changes"
            exit 0
          fi
          git commit -m "chore(pead-shadow): collect H-002 shadow picks + earnings cache $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # 2026-11-16: outer retry — safe_push's 8 inner retries exhaust in the nightly
          # commit-storm window (49/50 scheduled runs died here; manual runs never raced).
          for i in 1 2 3; do
            bash .github/scripts/safe_push.sh && break
            echo "::warning::safe_push attempt $i failed; backing off 120s"
            [ $i -lt 3 ] && sleep 120
          done


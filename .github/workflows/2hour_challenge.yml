# This workflow manages the real 2-hour trading challenge
# It triggers the real_2hour_challenge.py script and monitors its execution

name: 2hour-challenge

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'  # Weekdays at noon UTC (8 AM EST)

jobs:
  execute-challenge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 2-hour trading challenge
        env:
          PAPER_BROKER_API_KEY: ${{ secrets.PAPER_BROKER_API_KEY }}
          PAPER_BROKER_SECRET: ${{ secrets.PAPER_BROKER_SECRET }}
          REAL_BROKER_API_KEY: ${{ secrets.REAL_BROKER_API_KEY }}
          REAL_BROKER_SECRET: ${{ secrets.REAL_BROKER_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EJ_AGU_IAR_API_KEY: ${{ secrets.EJ_AGU_IAR_API_KEY }}
        run: |
          python real_2hour_challenge.py

      - name: Commit results
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "Hermes Agent"
          git config user.email "hermes@agent.com"
          git add audit_trail/data/2hour_challenge_results.json
          git commit -m "Update 2-hour challenge results [skip ci]" || echo "No changes to commit"
          bash .github/scripts/safe_push.sh

      - name: Notify on completion
        if: always()
        run: |
          echo "2-hour challenge completed at $(date)"
          echo "Check audit dashboard for results at https://findtorontoevents.antigravity.ca/audit"

name: Traditional Test Portfolios (5-8)

on:
  schedule:
    # Every 6 hours on weekdays aligned with market hours
    - cron: '30 13 * * 1-5' # 09:30 ET (13:30 UTC) NYSE open
    - cron: '30 19 * * 1-5' # 15:30 ET (19:30 UTC) NYSE afternoon
    - cron: '30 1 * * 1-5' # 21:30 ET prev day (01:30 UTC) forex session
    - cron: '30 7 * * 1-5' # 03:30 ET (07:30 UTC) Asian/London overlap
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even outside market hours'
        required: false
        default: false
        type: boolean

concurrency:
  group: traditional-test-portfolios
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-portfolios:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests numpy pandas

      - name: Run Traditional Test Portfolios
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python -m alpha_engine.traditional_test_portfolios $ARGS

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/traditional_portfolio_state.json alpha_engine/data/traditional_portfolio_results.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update traditional portfolios $(date -u +%Y-%m-%d\ %H:%M) UTC [skip ci]"
            git pull --rebase origin main
            bash .github/scripts/safe_push.sh
          fi



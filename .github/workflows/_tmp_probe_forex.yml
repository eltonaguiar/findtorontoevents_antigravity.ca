name: _tmp probe forex
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: probe
        env:
          DB_HOST: mysql.50webs.com
          DB_PORT: '3306'
          DB_USER: ejaguiar1_stocks
          DB_PASS: ${{ secrets.MYSQL_PASSWORD || secrets.AUDIT_DB_PASS }}
        run: |
          python3 -m pip install --quiet pymysql
          python3 - <<'PY'
          import os
          import statistics as st
          from collections import Counter, defaultdict
          import pymysql

          COST_PCT = 0.005  # assumed round-trip FX spread cost per trade, in percent of notional

          cn = pymysql.connect(
              host=os.environ['DB_HOST'],
              port=int(os.environ.get('DB_PORT', '3306')),
              user=os.environ['DB_USER'],
              password=os.environ.get('DB_PASS') or '',
              database='ejaguiar1_stocks',
              connect_timeout=20,
              read_timeout=40,
              write_timeout=40,
              autocommit=True,
          )
          cur = cn.cursor()
          cur.execute("SELECT symbol, direction, strategy, pnl_pct, created_at FROM trading_picks WHERE TRIM(LOWER(category))='forex'")
          rows = cur.fetchall()
          print("TOTAL_FOREX_ROWS %d" % len(rows))

          by_strategy = defaultdict(list)
          for symbol, direction, strategy, pnl_pct, created_at in rows:
              by_strategy[strategy if strategy is not None else '(null)'].append((symbol, direction, pnl_pct, created_at))


          def basic(xs):
              xs = [x for x in xs if x is not None]
              if not xs:
                  return (0, None, None, None, None)
              n = len(xs)
              wins = sum(1 for x in xs if x > 0)
              s = sorted(xs)
              k = int(n * 0.01)
              if k > 0 and k < n:
                  s = s[:-k]
              return (n, wins / n * 100, st.fmean(xs), st.median(xs), st.fmean(s) if s else None)


          def fmt(x):
              if x is None:
                  return 'null'
              return '%.6f' % x


          results = []
          for strategy in sorted(by_strategy):
              srows = by_strategy[strategy]
              raw_n = len(srows)
              pnls = [r[2] for r in srows]
              n, win, mean, med, tri = basic(pnls)
              # dedupe to one row per (symbol, direction, DATE(created_at))
              seen = set()
              deduped = []
              for symbol, direction, pnl_pct, created_at in srows:
                  day = created_at.strftime('%Y-%m-%d') if created_at is not None else None
                  key = (symbol, direction, day)
                  if key not in seen:
                      seen.add(key)
                      deduped.append((symbol, direction, pnl_pct, created_at, day))
              dn = len(deduped)
              sym_counter = Counter(r[0] for r in deduped)
              top_sym, top_cnt = sym_counter.most_common(1)[0]
              top_share = top_cnt / dn * 100
              ndistinct = len(sym_counter)
              # split-half out-of-sample by created_at on deduped rows; exclude NULL created_at
              dated = [r for r in deduped if r[4] is not None]
              null_created = dn - len(dated)
              dated.sort(key=lambda r: r[3])
              h = len(dated) // 2
              h1 = dated[:h]
              h2 = dated[h:]
              _, _, h1_mean, _, h1_tri = basic([r[2] for r in h1])
              _, _, h2_mean, _, h2_tri = basic([r[2] for r in h2])
              if dn < 30:
                  verdict = 'FAIL n<30 uninformative'
              elif h1_mean is None or h2_mean is None or h1_mean <= 0 or h2_mean <= 0:
                  verdict = 'FAIL half mean not positive'
              else:
                  verdict = 'PASS'
              results.append((strategy, raw_n, dn, win, mean, med, tri,
                              ndistinct, top_sym, top_share, null_created,
                              len(h1), h1_mean, h1_tri, len(h2), h2_mean, h2_tri, verdict))

          print("RESULT_HEADER")
          for r in results:
              (strategy, raw_n, dn, win, mean, med, tri,
               ndistinct, top_sym, top_share, null_created,
               h1n, h1m, h1t, h2n, h2m, h2t, verdict) = r
              print("STRATEGY %s raw_n=%d deduped_n=%d win_rate_pct=%s mean_pct=%s median_pct=%s trimmed_mean_pct=%s distinct_symbols=%d top_symbol=%s top_symbol_share_pct=%.4f null_created_at=%d h1_n=%d h1_mean=%s h1_trimmed=%s h2_n=%d h2_mean=%s h2_trimmed=%s verdict=%s" % (
                  strategy, raw_n, dn, fmt(win), fmt(mean), fmt(med), fmt(tri),
                  ndistinct, top_sym, top_share, null_created,
                  h1n, fmt(h1m), fmt(h1t), h2n, fmt(h2m), fmt(h2t), verdict))
          print("COST_ASSUMPTION round-trip FX spread cost per trade = %.3f%% (net mean would be mean_pct minus this)" % COST_PCT)
          print("END")
          PY

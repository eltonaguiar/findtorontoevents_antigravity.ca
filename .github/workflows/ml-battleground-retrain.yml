name: "ML Battleground Daily Retrain"

on:
  schedule:
    - cron: "0 4 * * *" # Daily at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: superpowers-retrain-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ml_battleground/requirements.txt

      - name: Run retraining on live outcomes
        run: |
          echo "=== ML Battleground: Daily Retrain Cycle ==="
          python -m ml_battleground.retrain_on_live

      - name: Commit updated models
        run: |
          git config user.name "Superpowers Bot"
          git config user.email "superpowers@findtorontoevents.ca"
          git add ml_battleground/system_a_filter/models/ || true
          git add ml_battleground/system_b_regime/models/ || true
          git add ml_battleground/system_c_deeplearn/models/ || true
          git add ml_battleground/retrain_summary.json || true
          git diff --cached --quiet && echo "No model changes" && exit 0
          git commit -m "ML Battleground retrain $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          for i in 1 2 3; do
            bash .github/scripts/safe_push.sh && break
            echo "Push attempt $i failed, retrying in ${i}0s..."
            sleep ${i}0
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin main || true
          done

      - name: Notify sandbox on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_SANDBOX: ${{ secrets.DISCORD_WEBHOOK_SANDBOX }}
        run: bash .github/notify-failure.sh "ML Battleground Daily Retrain" "$DISCORD_WEBHOOK_SANDBOX" "${{ github.repository }}" "${{ github.run_id }}"

      - name: Notify ML channel on failure
        if: failure()
        env:
          DISCORD_ML_CHANNEL: ${{ secrets.DISCORD_ML_CHANNEL }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"\\u274c ML Job FAILED: ${{ github.workflow }}\", \"description\": \"Job: ${{ github.job }}\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\nBranch: ${{ github.ref_name }}\", \"color\": 15158332, \"timestamp\": \"$(date -u +%%Y-%%m-%%dT%%H:%%M:%%SZ)\"}]}" \
            "$DISCORD_ML_CHANNEL" || true



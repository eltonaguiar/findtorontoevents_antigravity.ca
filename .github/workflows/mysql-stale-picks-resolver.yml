name: MySQL Stale OPEN Picks Resolver

on:
  schedule:
    - cron: '0 4 * * *'  # daily at 4 AM UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no DB writes)'
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      max_age_days:
        description: 'Resolve OPEN picks older than N days'
        default: '30'
        type: string
      batch_size:
        description: 'Max picks to process per run'
        default: '500'
        type: string

concurrency:
  group: mysql-stale-picks-resolver
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-stale-picks:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymysql yfinance

      - name: Syntax check resolver script
        run: python -m py_compile tools/mysql_stale_picks_resolver.py && echo "Syntax OK"

      - name: Run stale picks resolver
        env:
          AUDIT_DB_HOST: mysql.50webs.com
          AUDIT_DB_PORT: '3306'
          AUDIT_DB_USER: ejaguiar1_stocks
          AUDIT_DB_PASS: ${{ secrets.MYSQL_PASSWORD || secrets.AUDIT_DB_PASS }}
          AUDIT_DB_NAME: ejaguiar1_stocks
        run: |
          # Determine mode from input or default to dry-run on schedule
          DRY_RUN="${{ github.event.inputs.dry_run || 'true' }}"
          MAX_AGE="${{ github.event.inputs.max_age_days || '30' }}"
          BATCH="${{ github.event.inputs.batch_size || '500' }}"

          echo "Mode: dry_run=${DRY_RUN} | max_age_days=${MAX_AGE} | batch_size=${BATCH}"

          if [ "$DRY_RUN" = "true" ]; then
            python tools/mysql_stale_picks_resolver.py \
              --dry-run \
              --max-age-days "${MAX_AGE}" \
              --batch-size "${BATCH}"
          else
            python tools/mysql_stale_picks_resolver.py \
              --apply \
              --max-age-days "${MAX_AGE}" \
              --batch-size "${BATCH}"
          fi


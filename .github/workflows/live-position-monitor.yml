name: "BTCC Live Position Monitor (REAL MONEY)"

on:
  # schedule:
  #   - cron: '0,30 * * * *'   # Every 30 minutes (DISABLED 2026-03-27)
  workflow_dispatch:          # Manual trigger only

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Run position monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_POSITIONS: ${{ secrets.DISCORD_WEBHOOK_POSITIONS }}
        run: |
          echo "=========================================="
          echo "BTCC Live Position Monitor -- REAL MONEY"
          echo "=========================================="
          python live_monitor/position_monitor.py

      - name: Commit updated state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_monitor/data/position_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Position monitor update $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && \
              bash .github/scripts/safe_push.sh "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
              echo "Pushed successfully" && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi


name: masking-policy-lint

# PR-only: never runs on push-to-main, so it cannot block the scheduled crons.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/masking_manifest.yaml'
      - 'scripts/lint_workflow_masking.py'

permissions:
  contents: read

jobs:
  lint-masking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Lint workflow masking (fail only on NEW silent maskers)
        run: python scripts/lint_workflow_masking.py --fail-on-new

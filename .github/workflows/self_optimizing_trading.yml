name:  Self-Optimizing Trading Bot - Auto-Validates & Tweaks

on:
  # Run every 4 hours automatically
  schedule:
    - cron: '0 */4 * * *'
  
  # Run on code updates
  push:
    branches: [main]
    paths:
      - 'self_optimizing_bot.py'
      - '.github/workflows/self_optimizing_trading.yml'
  
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  trade:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        update-environment: false
        python-version: '3.11'
        
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name:  Run Self-Optimizing Trading Bot
      env:
        PRIMARY_EXCHANGE: 'FREE_DATA'
        COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        INITIAL_CAPITAL: '10000'
        RISK_PER_TRADE: '0.02'
        MAX_POSITIONS: '5'
        DRY_RUN: 'true'
        
      run: |
        echo " Starting Self-Optimizing Trading Bot..."
        echo " Features:"
        echo "    Auto-validates performance every cycle"
        echo "    Dynamically adjusts risk based on win rate"
        echo "    Adapts strategy parameters to market conditions"
        echo "    Self-healing API failover"
        echo ""
        python self_optimizing_bot.py
        
    - name:  Generate Performance Dashboard
      run: |
        if [ -f trading_results.json ]; then
          echo "#  Self-Optimizing Bot Performance Dashboard" > PERFORMANCE_DASHBOARD.md
          echo "" >> PERFORMANCE_DASHBOARD.md
          echo "**Last Updated:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> PERFORMANCE_DASHBOARD.md
          echo "" >> PERFORMANCE_DASHBOARD.md
          echo "##  Current Status" >> PERFORMANCE_DASHBOARD.md
          echo "" >> PERFORMANCE_DASHBOARD.md
          
          # Extract key metrics using Python
          python3 << 'EOF' >> PERFORMANCE_DASHBOARD.md
        import json
        with open('trading_results.json') as f:
            data = json.load(f)
        
        stats = data.get('stats', {})
        portfolio = data.get('portfolio', {})
        config = data.get('config', {})
        performance = data.get('performance', {})
        
        print(f"| Metric | Value |")
        print(f"|--------|-------|")
        print(f"|  Current Equity | ${portfolio.get('equity', 0):,.2f} |")
        print(f"|  Total Return | {portfolio.get('return_pct', 0):+.2f}% |")
        print(f"|  Total Trades | {stats.get('total_trades', 0)} |")
        print(f"|  Win Rate | {stats.get('win_rate', 0):.1f}% |")
        print(f"|  Current Risk | {stats.get('current_risk', 0.02):.1%} |")
        print(f"|  Total P&L | ${stats.get('total_pnl', 0):+.2f} |")
        print(f"|  Avg Trade | ${stats.get('avg_trade', 0):+.2f} |")
        print("")
        
        if performance.get('status') == 'VALIDATED':
            print("##  Latest Optimization Recommendations")
            print("")
            recs = performance.get('recommendations', {})
            for key, value in recs.items():
                if 'message' in key:
                    print(f"- {value}")
            print("")
            
            print("### Strategy Performance")
            print("")
            print(f"| Strategy | Win Rate | Trades | P&L |")
            print(f"|----------|----------|--------|-----|")
            sp = performance.get('strategy_performance', {})
            for strategy, sstats in sp.items():
                wr = sstats.get('win_rate', 0) * 100
                tr = sstats.get('total', 0)
                pn = sstats.get('pnl', 0)
                print(f"| {strategy} | {wr:.1f}% | {tr} | ${pn:+.2f} |")
        EOF
          
          echo "" >> PERFORMANCE_DASHBOARD.md
          echo "##  Raw Data" >> PERFORMANCE_DASHBOARD.md
          echo "" >> PERFORMANCE_DASHBOARD.md
          echo '```json' >> PERFORMANCE_DASHBOARD.md
          cat trading_results.json >> PERFORMANCE_DASHBOARD.md
          echo '' >> PERFORMANCE_DASHBOARD.md
          echo '```' >> PERFORMANCE_DASHBOARD.md
          echo "" >> PERFORMANCE_DASHBOARD.md
          echo "---" >> PERFORMANCE_DASHBOARD.md
          echo "" >> PERFORMANCE_DASHBOARD.md
          echo "* Auto-generated by Self-Optimizing Trading Bot*" >> PERFORMANCE_DASHBOARD.md
          echo "" >> PERFORMANCE_DASHBOARD.md
          echo "*Next update: $(date -u -d '+4 hours' '+%Y-%m-%d %H:%M UTC')*" >> PERFORMANCE_DASHBOARD.md
        fi
        
    - name:  Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trading-results-${{ github.run_number }}
        path: |
          trading_results.json
          trading_bot.log
          performance_history.json
        retention-days: 90
        
    - name:  Commit results
      env:
        TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
      run: |
        git config --local user.email "bot@self-optimizing.ai"
        git config --local user.name " Self-Optimizing Bot"
        
        git add trading_results.json || true
        git add trading_bot.log || true
        git add performance_history.json || true
        git add PERFORMANCE_DASHBOARD.md || true
        
        TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
        git commit -m " Auto: Self-optimized trading cycle - $TIMESTAMP

         Performance validated and auto-tweaked
         Risk levels adjusted based on win rate
         Strategy parameters adapted to market

        Run #${{ github.run_number }} [skip ci]" || echo "No changes"
        
        bash .github/scripts/safe_push.sh
        
    - name:  Final Summary
      run: |
        echo ""
        echo ""
        echo "      SELF-OPTIMIZING BOT - CYCLE COMPLETE                     "
        echo ""
        echo "   Performance Validated                                        "
        echo "   Risk Auto-Adjusted                                           "
        echo "   Strategy Parameters Tweaked                                  "
        echo "   Results Committed                                            "
        echo ""
        echo ""
        if [ -f trading_results.json ]; then
          python3 -c "import json; d=json.load(open('trading_results.json')); s=d.get('stats', {}); p=d.get('portfolio', {}); equity=p.get('equity', s.get('current_equity', 0.0)); ret=p.get('return_pct', s.get('return_pct', 0.0)); wr=s.get('win_rate', 0.0); risk=s.get('current_risk', 0.02); print(f' Equity: \${equity:,.2f} |  Return: {ret:+.2f}% |  Win Rate: {wr:.1f}% |  Risk: {risk:.1%}')"
        fi


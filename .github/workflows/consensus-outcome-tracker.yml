name: Consensus Outcome Tracker

on:
  schedule:
    - cron: '2/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

concurrency:
  group: consensus-outcome-tracker
  cancel-in-progress: false  # was true — caused 100% cancellation: next scheduled run killed the still-pushing one (423s push step)

permissions:
  contents: write

jobs:
  track-outcomes:
    uses: ./.github/workflows/gha-scan-job.yml
    with:
      python-version: '3.11'
      pip-packages: 'pymysql'
      run-command: 'python -m cross_aggregation.consensus_outcome_tracker'
      commit-paths: 'cross_aggregation/data/consensus_outcomes.json'
      commit-message: 'chore: update consensus outcomes [skip ci]'
      fetch-depth: 1
      timeout-minutes: 15  # was 10 — too tight: checkout(82s) + script(104s) + push can exceed 10min when runs queue
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

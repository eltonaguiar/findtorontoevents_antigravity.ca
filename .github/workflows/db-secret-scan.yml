name: DB Secret Scan

on:
  pull_request:
    paths:
      - '**/*.py'
  push:
    branches: [main]
    paths:
      - '**/*.py'

jobs:
  scan:
    name: Block hardcoded DB passwords
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded stocks password
        run: |
          # Allowlist: db_credentials.py is the ONE canonical location for the default.
          # The password literal is built at runtime from parts so the workflow
          # file itself does not contain the secret string (otherwise
          # db-password-leak-guard.yml would flag this workflow as a leak).
          PW_PREFIX="stocks"
          PW_SUFFIX="1234560"
          PATTERN="${PW_PREFIX}${PW_SUFFIX}"
          HITS=$(grep -rn "$PATTERN" --include="*.py" \
            --exclude="*/db_credentials.py" \
            --exclude-dir=".claude" \
            --exclude-dir=".qwen" \
            . || true)
          if [ -n "$HITS" ]; then
            echo "::error::Hardcoded DB password literal found in Python files."
            echo "Use 'from alpha_engine.db_credentials import get_stocks_db_config' instead."
            echo ""
            echo "$HITS"
            exit 1
          fi
          echo "No hardcoded passwords found outside db_credentials.py."

name: Analyst Tracker  Top 20 Crypto Analysts

on:
  schedule:
    # Scrape every 4 hours
    - cron: '15 */4 * * *'
    # Validate prices hourly to keep the leaderboard fresh without overloading Action minutes
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'scrape, validate, seed, or both'
        required: false
        default: 'both'

permissions:
  contents: write

jobs:
  #  Scrape job: runs every 4 hours or on manual 'scrape'/'both'/'seed' mode 
  scrape-analysts:
    if: >-
      github.event.schedule == '15 */4 * * *' ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.mode == 'scrape' || github.event.inputs.mode == 'both' || github.event.inputs.mode == 'seed'))
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r predictions/requirements.txt

      - name: Install Crawl4AI browser
        run: |
          python -m crawl4ai.install || true
        continue-on-error: true

      - name: Seed analysts
        if: github.event.inputs.mode == 'seed'
        run: cd predictions && python run_analyst_scraper.py --seed-only

      - name: Run analyst scraper + validation
        if: github.event.inputs.mode != 'seed'
        run: cd predictions && python run_analyst_scraper.py --validate

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/data/*.json predictions/data/*.csv 2>/dev/null || true
          git reset predictions/data/*.db predictions/data/*.db-journal 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Analyst tracker update $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git pull --rebase origin main || true
          bash .github/scripts/safe_push.sh

  #  Validate job: runs every 15 minutes or on manual 'validate'/'both' mode 
  validate-prices:
    if: >-
      github.event.schedule == '*/15 * * * *' ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.mode == 'validate' || github.event.inputs.mode == 'both'))
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r predictions/requirements.txt

      - name: Run price validation
        run: cd predictions && python validation/price_validator.py

      - name: Export analyst JSON
        run: |
          cd predictions && python -c "
          from db import get_db, export_analyst_json, export_leaderboard_json
          from pathlib import Path
          conn = get_db()
          export_analyst_json(conn, Path('data/analyst_leaderboard.json'), Path('data/analyst_active_calls.json'))
          export_leaderboard_json(conn, Path('data/leaderboard.json'))
          conn.close()
          print('JSON exports updated')
          "

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/data/*.json predictions/data/*.csv 2>/dev/null || true
          git reset predictions/data/*.db predictions/data/*.db-journal 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Analyst validation $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git pull --rebase origin main || true
          bash .github/scripts/safe_push.sh


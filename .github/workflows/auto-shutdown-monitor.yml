name: Auto-Shutdown Source Monitor

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pymysql --quiet
      - name: Backfill NULL pnl_pct + closed_at
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
        run: |
          python3 tools/backfill_null_pnl.py 2>&1 | tail -5 || true
          python3 <<'PYEOF' 2>&1 || true
          import os
          import pymysql
          conn = pymysql.connect(
              host='mysql.50webs.com',
              user='ejaguiar1_stocks',
              password=os.environ.get('DB_PASS_STOCKS', ''),
              db='ejaguiar1_stocks',
              connect_timeout=10,
          )
          cur = conn.cursor()
          cur.execute("""
              UPDATE trading_picks SET closed_at = updated_at
              WHERE closed_at IS NULL AND updated_at IS NOT NULL
                AND status NOT IN ('OPEN','ACTIVE','ABANDONED')
          """)
          print(f'closed_at backfill: {cur.rowcount} rows')
          conn.commit()
          conn.close()
          PYEOF
      - name: Run auto-shutdown monitor
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
        run: |
          python3 tools/auto_shutdown_monitor.py 2>&1 | tee /tmp/monitor_report.txt
          # Fail CI if any HARD_STOP sources detected (alert operator)
          if grep -q "HARD_STOP" /tmp/monitor_report.txt; then
            echo "::warning::HARD_STOP sources detected — review monitor output above"
          fi

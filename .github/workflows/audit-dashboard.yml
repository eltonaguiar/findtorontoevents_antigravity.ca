name: Unified Audit Dashboard

'on':
  schedule:
    - cron: '10 * * * *'  # Once per hour at :10 (job takes 30-35min, needs full hour gap)
  # 2026-05-19: push trigger REMOVED entirely (4-AI consensus — Grok + swarm
  # deepseek/xai/kilo). In this storm-commit repo, push-triggered runs piled
  # into the `dashboard-publish-push` concurrency group faster than the ~35-min
  # job could drain, so GitHub auto-cancelled the intermediate queued runs
  # (cancelled runs verified with jobs_executed=0 — never started). That waste
  # had zero correctness benefit: the hourly cron above already guarantees a
  # full refresh within the hour, and any merged source-code change is picked
  # up by the next scheduled run. Need an immediate refresh after a code change?
  # use `workflow_dispatch` below. Dropping `push:` also lets `concurrency.group`
  # collapse to a single `dashboard-publish` group and makes the
  # `github.event_name != 'push'` job-`if` guard always-true (kept harmless).
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner (ubuntu-latest or self-hosted)'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - self-hosted

concurrency:
  # 2026-05-19: collapsed to a single group now that the `push:` trigger is
  # gone (see the `on:` block above). Only `schedule` and `workflow_dispatch`
  # remain — the prior event-type split (`dashboard-publish-{push|cron}`) and
  # the cancel-cascade workarounds it carried are no longer needed.
  # cancel-in-progress=false: scheduled/dispatch runs QUEUE and finish in order
  # so a long pipeline (30-35min, Stage-A active_picks_sync -> Stage B) is never
  # cut off mid-flight.
  group: dashboard-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-deploy:
    # Belt-and-suspenders: skip push-triggered runs whose commit has [skip ci].
    # Adds a second layer of protection beyond GitHub's native [skip ci] skip
    # and the source-code-only path filtering above.
    # Scheduled and workflow_dispatch events always pass this check.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}  # Cloud default, pick self-hosted when local machine is on
    timeout-minutes: 115  # Long generator + commit/push + FTP; 90m still saw mid-step cancellations (stale /audit).
    #
    # 5 consecutive cron runs were cancelling at the 45-min mark in the "Commit updated data"
    # step, specifically during the `python -m audit_trail.dashboard_generator` re-run (needed
    # to pick up peer template.html edits during the 45-min window per the 2026-04-05
    # bug-fix comment below). Timeline of the fatal run 24292849309:
    #   22:17:48Z job start
    #   22:17 ÔåÆ 22:48 (30.5 min)  steps 1-19: data gen + HTML build + JS validation ÔåÆ SUCCESS
    #   22:48 ÔåÆ 22:59 (11 min)    commit step git dance: fetch/add/stash/rebase/stash-pop
    #                             with 11 conflict files ÔåÆ resolution via checkout --ours
    #   22:59:29Z                 generator re-run starts
    #   23:02:48Z                 job hits 45-min timeout window
    #   23:03:03Z                 ##[error]The operation was canceled
    #                             (generator killed mid-regeneration at ~3.5 min into re-run)
    #   Step 21 "Deploy to all 3 FTP sites in parallel" ÔåÆ SKIPPED (prior step cancelled)
    #   Live site stale from 2026-04-10 21:21Z (last successful deploy) to 2026-04-11 20:35Z
    #
    # Bumping to 60 minutes gives the existing flow ~15 min of headroom so the generator
    # re-run + git push 5-retry loop can complete even when the pre-generator rebase dance
    # takes its full 11 minutes. No logic changes — minimal surgical fix.

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 2026-04-27: changed fetch-depth 1 -> 0 (full clone) to avoid
          # `git fetch --unshallow` in the commit step (16-18 min on a 5GB repo).
          # 2026-05-22: the repo .git has since grown to ~19GB (a 44MB
          # dashboard_data.json is committed every hour — 17GB historical-blob
          # pack). A full-blob clone now HANGS actions/checkout — runs
          # 26284532166 (11:14) and 26289708726 (13:09) both timed out with the
          # Checkout step stuck `in_progress` for 60+ min, zero log output.
          # `filter: blob:none` keeps ALL commit + tree history (so the commit
          # step still needs no --unshallow) but skips downloading the ~17GB of
          # historical blobs — blobs are fetched lazily on demand. The working
          # tree is fully materialised (current blobs are fetched). This treats
          # the checkout hang; the root cause (committing a 44MB JSON hourly)
          # still needs fixing — see reports/AUDIT_STAT_VALIDATION_2026-05-22.md.
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Auto-regenerate predictable + scanner AI-Challenge picks
        # Round 6+ (2026-04-18): LLM tournament ended, but predictable &
        # scanner curators are data-driven and can be regenerated from
        # alpha_engine/data/active_picks.json. Failure is non-blocking.
        continue-on-error: true
        run: python tools/regenerate_predictable_scanner_picks.py --write --verbose

      - name: Merge AI Challenge round picks into per-curator files
        run: python audit_dashboard/merge_ai_challenge_picks.py

      - name: Refresh prediction-market inputs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python copy_trader_intel/polymarket_scraper.py || echo "Polymarket wallet scan failed (non-fatal)"
          python alpha_engine/polymarket_signals.py || echo "Polymarket reverse-engineering failed (non-fatal)"
          python alpha_engine/kalshi_signals.py || echo "Kalshi scan failed (non-fatal)"
          python alpha_engine/prediction_market_consensus.py || echo "Prediction market consensus failed (non-fatal)"
          python -m prediction_market_agents.orchestrator || echo "Prediction market agents failed (non-fatal)"
          python alpha_engine/combined_confidence_strategy.py || echo "Combined confidence strategy failed (non-fatal)"

      - name: Resolve active picks (TP/SL/time exits) across all systems
        id: resolve_active_picks
        run: |
          pip install pymysql -q
          python -m audit_trail.universal_pick_resolver
        timeout-minutes: 40  # 2026-06-04: 20 was hitting cap (run 26928553028) blocking dashboard regen; doubled while keeping fail-hard semantics
        continue-on-error: false  # 2026-05-20: was true — Kimi-flagged silent fail; f1370a3 resolver fix requires fail-hard to surface errors
        env:
          PICK_OUTCOMES_MYSQL_ENABLED: '1'

      - name: Sync paper trades to MySQL (paper_trades + paper_portfolio_daily)
        id: paper_trade_mysql_sync
        continue-on-error: false  # 2026-05-20: fail-hard on MySQL sync per Kimi audit
        env:
          PICK_OUTCOMES_MYSQL_ENABLED: '1'
          PAPER_TRADE_MYSQL_ENABLED: '1'
          DB_STOCKS_HOST: mysql.50webs.com
          DB_STOCKS_USER: ejaguiar1_stocks
          DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS || vars.DB_STOCKS_NAME || 'ejaguiar1_stocks' }}
          DB_STOCKS_NAME: ejaguiar1_stocks
          HF_GATE_EQUITY_BANNED_SOURCES: 'stocks_competition,fast_stocks_competition,multi_asset_institutional,kimi_signal_tracking,ml_bg_system_f'
        run: |
          pip install pymysql -q 2>/dev/null || true
          python tools/paper_trade_mysql_writer.py || echo "Paper trade MySQL writer skipped (no paper positions or config missing)"

      - name: Fetch stock prices (server-side)
        id: fetch_stock_prices
        run: |
          # Quick batch fetch  dashboard_generator also fetches equity prices,
          # but this pre-populates data/stock_prices.json for other consumers.
          pip install yfinance -q
          timeout 60 python audit_trail/fetch_stock_prices.py || echo "Stock price fetch skipped (timeout/error)"
        continue-on-error: true
        timeout-minutes: 2

      - name: Run pre-scanners in parallel (regime flip, regime detection, funding rate, BTC breakout)
        id: regime_check
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import subprocess, sys, os
          from concurrent.futures import ThreadPoolExecutor, as_completed

          def run_task(name, cmd):
              """Run a shell command, return (name, returncode, stdout, stderr)."""
              try:
                  r = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=120)
                  return (name, r.returncode, r.stdout.strip(), r.stderr.strip())
              except subprocess.TimeoutExpired:
                  return (name, 1, "", "Timed out after 120s")
              except Exception as e:
                  return (name, 1, "", str(e))

          tasks = {
              "Regime flip check": (
                  'python -c "from alpha_engine.regime_flip_detector import check_flip; '
                  "print('yes' if check_flip() else 'no')\" 2>/dev/null | tail -1 | tr -d '\\r\\n'"
              ),
              "Regime detection": (
                  "python -m alpha_engine.regime_position_sizer"
              ),
              "Funding rate scanner": (
                  'python -c "import urllib.request; urllib.request.urlopen(\'https://fapi.binance.com/fapi/v1/ping\', timeout=3)" 2>/dev/null '
                  "&& python -m alpha_engine.funding_rate_arb "
                  '|| echo "Funding rate scanner skipped (Binance Futures unreachable)"'
              ),
              "BTC breakout scanner": (
                  "python -m alpha_engine.btc_breakout_strategy"
              ),
          }

          results = {}
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = {pool.submit(run_task, name, cmd): name for name, cmd in tasks.items()}
              for future in as_completed(futures):
                  name, rc, stdout, stderr = future.result()
                  results[name] = (rc, stdout, stderr)
                  status = "OK" if rc == 0 else "WARN"
                  print(f"[{status}] {name} (exit {rc})")
                  if stdout:
                      for line in stdout.splitlines():
                          print(f"  {line}")
                  if stderr and rc != 0:
                      for line in stderr.splitlines()[:5]:
                          print(f"  stderr: {line}")

          # Extract regime flip result for GITHUB_OUTPUT
          flip_rc, flip_out, _ = results.get("Regime flip check", (1, "", ""))
          flip = "yes" if flip_out.strip().endswith("yes") else "no"
          gh_output = os.environ.get("GITHUB_OUTPUT", "")
          if gh_output:
              with open(gh_output, "a") as f:
                  f.write(f"regime_flipped={flip}\n")
          if flip == "yes":
              print("REGIME FLIP DETECTED - forcing full regeneration")

          print(f"\nAll 4 pre-scanners completed ({sum(1 for rc,_,_ in results.values() if rc==0)}/4 succeeded)")
          PYEOF

      - name: Run DB health check (PnL integrity, ghost rows, OPEN bloat → audit_dashboard/data/db_health.json)
        id: db_health_check
        env:
          AUDIT_DB_HOST: mysql.50webs.com
          AUDIT_DB_USER: ejaguiar1_stocks
          AUDIT_DB_PASS: ${{ secrets.MYSQL_PASSWORD }}
          AUDIT_DB_NAME: ejaguiar1_stocks
          DB_HEALTH_READ_TIMEOUT: '180'
          PYTHONUTF8: '1'
        run: python tools/db_health_check.py --quick || echo "db_health_check non-fatal"
        continue-on-error: true

      - name: Run anti-overfit audit sidecar (DSR per strategy — SUPREME EDGE P1)
        id: anti_overfit_sidecar
        env:
          DB_STOCKS_HOST: mysql.50webs.com
          DB_STOCKS_USER: ejaguiar1_stocks
          DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS || vars.DB_STOCKS_NAME || 'ejaguiar1_stocks' }}
          DB_STOCKS_NAME: ejaguiar1_stocks
          PYTHONUTF8: '1'
        run: |
          pip install pymysql -q 2>/dev/null || true
          python tools/anti_overfit_audit_sidecar.py --min-n 20 || echo "::warning title=anti-overfit sidecar failed::see log; audit_dashboard/data/anti_overfit_audit.json will go stale (INCIDENT_OVERALL #45)"
        continue-on-error: true

      - name: Run research sidecars (Agent C external-research — 4 academically-backed)
        id: research_sidecars
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/research/commodity_carry_momo.py || echo "commodity_carry_momo failed (non-fatal)"
          python tools/research/sector_dual_momentum.py || echo "sector_dual_momentum failed (non-fatal)"
          python tools/research/ust_tsmom.py || echo "ust_tsmom failed (non-fatal)"
          python tools/research/overnight_intraday_reversal.py || echo "overnight_intraday_reversal failed (non-fatal)"
        continue-on-error: true

      - name: Run COT paper pilot (cot_positioning + CT=F SHADOW state tracker)
        id: cot_paper_pilot
        env:
          DB_STOCKS_HOST: mysql.50webs.com
          DB_STOCKS_USER: ejaguiar1_stocks
          DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS || vars.DB_STOCKS_NAME || 'ejaguiar1_stocks' }}
          DB_STOCKS_NAME: ejaguiar1_stocks
          PYTHONUTF8: '1'
        run: |
          pip install pymysql -q 2>/dev/null || true
          python alpha_engine/strategies/cot_paper_pilot.py --window-days 90 || echo "cot_paper_pilot failed (non-fatal)"
        continue-on-error: true

      - name: Run Crypto paper pilot (mega_mutation CRYPTO SHADOW forward-tracker)
        id: crypto_paper_pilot
        env:
          PYTHONUTF8: '1'
        run: |
          python alpha_engine/strategies/crypto_paper_pilot.py || echo "crypto_paper_pilot failed (non-fatal)"
        continue-on-error: true

      - name: Run Top-N rank backtest (EQUITY hindsight replay — answers "would top-10 have been profitable")
        id: top_n_rank_backtest
        env:
          DB_STOCKS_HOST: mysql.50webs.com
          DB_STOCKS_USER: ejaguiar1_stocks
          DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS || vars.DB_STOCKS_NAME || 'ejaguiar1_stocks' }}
          DB_STOCKS_NAME: ejaguiar1_stocks
          PYTHONUTF8: '1'
        run: |
          pip install pymysql -q || echo "::warning title=pymysql install failed::Top-5 Rank Backtest panel will be empty this run — pip install pymysql failed (see log above)"
          python tools/top_n_rank_backtest.py --n 10 --asset-class EQUITY --lookback-days 90 || echo "top_n_rank_backtest failed (non-fatal)"
          # 2026-05-21: generator hardened (tools/top_n_rank_backtest.py) — always
          # writes real generated_at + error + _note. Placeholder below is defense only.
          python -c "import json,os; p='audit_dashboard/data/top_n_rank_backtest.json'; os.path.exists(p) or (os.makedirs(os.path.dirname(p),exist_ok=True), open(p,'w',encoding='utf-8').write(json.dumps({'generated_at':None,'windows':{},'detail':{},'_note':'placeholder - top_n_rank_backtest generator failed or produced no rows this run'},indent=2)), print('wrote placeholder '+p))"
        continue-on-error: true

      - name: Run COT Step 7 risk-of-ruin Monte Carlo (cot_positioning + CT=F at $5k/$10k/$25k tiers)
        id: cot_step7_ror_mc
        env:
          DB_STOCKS_HOST: mysql.50webs.com
          DB_STOCKS_USER: ejaguiar1_stocks
          DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS || vars.DB_STOCKS_NAME || 'ejaguiar1_stocks' }}
          DB_STOCKS_NAME: ejaguiar1_stocks
          PYTHONUTF8: '1'
        run: |
          pip install pymysql -q 2>/dev/null || true
          python tools/cot_step7_risk_of_ruin_mc.py --sims 10000 --seq-trades 50 || echo "cot_step7_ror_mc failed (non-fatal)"
        continue-on-error: true

      - name: Effective-N reporter (Newey-West autocorrelation correction per Renaissance + Two Sigma R3 blind spots)
        id: effective_n_reporter
        run: python tools/effective_n_reporter.py --min-n 30 || echo "effective_n non-fatal"
        continue-on-error: true

      - name: Operator status check (validation/alerting snapshot — Grok next-step #2)
        id: operator_status
        run: python tools/operator_status_check.py || echo "operator_status non-fatal"
        continue-on-error: true

      - name: ml_gatekeeper A/B sleeve decision (Phase D — reads OLD/NEW sleeves + closed_picks, runs z-test)
        id: ml_gatekeeper_ab_decision
        run: python tools/ml_gatekeeper_ab_decision.py --min-n 30 --wr-delta-pp 2.0 --p-threshold 0.10 || echo "ab_decision non-fatal"
        continue-on-error: true

      - name: Active picks sync (LIVE — reads at_raw_picks, applies TP/SL/time-exit transitions)
        id: active_picks_sync_live
        env:
          DB_STOCKS_HOST: mysql.50webs.com
          DB_STOCKS_USER: ejaguiar1_stocks
          DB_STOCKS_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_NAME_STOCKS: ${{ secrets.DB_NAME_STOCKS || vars.DB_STOCKS_NAME || 'ejaguiar1_stocks' }}
          DB_STOCKS_NAME: ejaguiar1_stocks
          PYTHONUTF8: '1'
          # Stage B (2026-05-18): flip to live writer. Dry-run ran cleanly for 6 days
          # across all asset classes (Stage A, 2026-05-18). User-approved 2026-05-18.
          # ACTIVE_PICKS_SYNC_APPLY=1 + --apply together enable live MySQL writes.
          ACTIVE_PICKS_SYNC_APPLY: '1'
        run: |
          pip install pymysql yfinance -q 2>/dev/null || true
          # 2026-05-30: added --max-rows 20000 (default is 5000). With 39,706 OPEN
          # CRYPTO rows the default oldest-5000 cuts off at ~Apr 7, leaving every
          # newer pick (e.g. all 366 crypto_liquidity_wick_reversal_v1 picks dated
          # Apr 29-May 12) invisible to the resolver. Affects all newer cohorts —
          # only ~42 OPEN CRYPTO have resolved since Apr 29 vs 2,403 legacy.
          # 4× bump is conservative; follow-up: switch the ORDER BY in
          # alpha_engine/active_picks_sync.py:114 to DESC so newest picks resolve
          # first. Resolves FINDING_CRYPTO#1.
          for AC in CRYPTO EQUITY FOREX COMMODITY BOND ETF FUTURES; do
            python -m alpha_engine.active_picks_sync --asset-class "$AC" --max-symbols 200 --max-rows 20000 --apply \
              || echo "active_picks_sync $AC failed (non-fatal)"
          done
        continue-on-error: true

      - name: Run Hyro QuanBridge (refresh regime + ensemble + risk gate)
        id: hyro_quan_bridge
        run: python tools/hyro_quan_bridge.py --symbols BTCUSDT ETHUSDT SOLUSDT AVAXUSDT XRPUSDT BNBUSDT DOGEUSDT LINKUSDT ADAUSDT DOTUSDT NEARUSDT SUIUSDT ARBUSDT APTUSDT PEPEUSDT --save --verbose || echo "Hyro QuanBridge failed (non-fatal)"
        continue-on-error: true

      - name: Run Hyro pick performance validator (signal strength scoring)
        id: hyro_pick_perf
        run: python tools/hyro_pick_performance_validator.py --save --lookback-days 30 || echo "Hyro pick perf validator failed (non-fatal)"
        continue-on-error: true

      - name: Run Hyro ML pick optimizer (adaptive edge scoring + drift detection)
        id: hyro_ml_optimizer
        run: |
          pip install 'scikit-learn==1.3.2' -q 2>/dev/null || true
          python tools/hyro_ml_pick_optimizer.py --save || echo "Hyro ML optimizer failed (non-fatal)"
        continue-on-error: true

      - name: Run Hyro enhanced scoring (technical indicators on picks)
        id: hyro_enhanced_scoring
        run: python alpha_engine/hyrotrader_enhanced_scoring.py
        continue-on-error: true

      - name: Hyro pipeline outcome (must not silently look healthy when steps fail)
        if: always()
        run: |
          set -e
          h1="${{ steps.hyro_quan_bridge.outcome }}"
          h2="${{ steps.hyro_pick_perf.outcome }}"
          h3="${{ steps.hyro_ml_optimizer.outcome }}"
          h4="${{ steps.hyro_enhanced_scoring.outcome }}"
          echo "hyro_quan_bridge=$h1 hyro_pick_perf=$h2 hyro_ml_optimizer=$h3 hyro_enhanced_scoring=$h4"
          failed=""
          for pair in "quan_bridge:$h1" "pick_perf:$h2" "ml_optimizer:$h3" "enhanced_scoring:$h4"; do
            name="${pair%%:*}"
            oc="${pair#*:}"
            if [ "$oc" != "success" ]; then
              failed="${failed}${name}=${oc} "
            fi
          done
          if [ -n "$failed" ]; then
            echo "::warning::Hyro sub-step(s) non-success: $failed — /audit Hyro JSON or ML rankings may be stale; see pipeline_health.json and step logs."
            exit 1
          fi
        continue-on-error: true

      - name: Run technical analyzer
        id: technical_analyzer
        run: python copy_trader_intel/technical_analyzer.py || echo "Technical analyzer warning (non-fatal)"
        continue-on-error: true

      - name: Run non-crypto consensus engine
        id: non_crypto_consensus
        run: python -m copy_trader_intel.non_crypto_consensus || echo "Non-crypto consensus warning (non-fatal)"
        continue-on-error: true

      - name: Enhance non-crypto picks with TA + whale validation
        id: non_crypto_quality
        run: python copy_trader_intel/non_crypto_quality_enhancer.py || echo "Non-crypto quality enhancer warning (non-fatal)"
        continue-on-error: true

      - name: Run contrarian consensus scanner
        id: contrarian_consensus
        run: python alpha_engine/contrarian_consensus.py || echo "Contrarian consensus warning (non-fatal)"
        continue-on-error: true

      # NOTE: walk-forward validation MOVED to run AFTER `Generate dashboard
      # payload and build HTML` (below) — it reads audit_trail/data/dashboard_payload.json
      # which doesn't exist at this point in the pipeline. Pre-2026-05-31 it
      # crashed with FileNotFoundError on every run, silenced by `|| echo
      # "...non-fatal"`. See INCIDENT_OVERALL #45.

      - name: Run ML Gatekeeper (pick quality scoring)
        id: ml_gatekeeper
        run: |
          pip install 'scikit-learn==1.3.2' 'scipy>=1.10.0,<1.14' -q 2>/dev/null || true
          python ml_gatekeeper/gatekeeper.py || echo "ML Gatekeeper warning (non-fatal)"
        continue-on-error: true

      - name: Run ML Consensus (multi-system agreement)
        id: ml_consensus
        run: python ml_consensus/consensus.py || echo "ML Consensus warning (non-fatal)"
        continue-on-error: true

      - name: ML metrics summary (gatekeeper + audit consensus artifacts)
        if: always()
        run: python tools/ml_metrics_ci_summary.py
        continue-on-error: true

      - name: Run MA strategy forward-tracker (walk-forward leaderboard)
        # Incident #31 (P2): audit_dashboard/data/ma_strategy_leaderboard.json
        # was 44h+ stale because tools/ma_strategy_forward_tracker.py had no cron.
        # Runs 8 MA variants x 6 asset classes via yfinance (6y lookback,
        # walk-forward OOS with ATR risk overlay). Writes leaderboard JSON +
        # signals; the existing FTP step deploys it to all 3 mirror sites.
        # continue-on-error so a transient yfinance/network failure can't break
        # the dashboard publish.
        id: ma_strategy_tracker
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        run: |
          pip install yfinance numpy pandas -q 2>/dev/null || true
          python tools/ma_strategy_forward_tracker.py --asof "$(date -u +%Y-%m-%d)" || echo "MA strategy tracker failed (non-fatal)"

      - name: Generate dashboard payload and build HTML
        env:
          # 2026-04-18: Flip Phase-1 confidence gate to SHADOW mode to unblock
          # the 267->12 active-picks collapse. The 0.80 threshold (commit
          # bdd9ab1ed2) was calibrated on one emitter's confidence distribution
          # but deployed as a universal CRYPTO filter. Emitters like
          # copy_trader_highscore (conf maxes at 0.68) and claude_gainer_st
          # (all conf=0.690) cannot clear 0.80 by design and were 100% wiped
          # from the dashboard. Shadow mode tags picks with
          # `_phase1_conf_shadow_reject` instead of dropping them, so we
          # forward-observe real impact for 48h before a proper per-source
          # recalibration. See filter-chain investigation in session notes.

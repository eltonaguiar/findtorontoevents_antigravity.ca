      - name: Freshness tripwire — anti_overfit + walkforward (INCIDENT #45)
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, datetime as dt, pathlib
          now = dt.datetime.now(dt.timezone.utc)
          # Thresholds (per Grok-4 review 2026-05-31): anti_overfit at 24h
          # tolerates occasional missed hourly runs without spamming warnings;
          # walkforward at 8d gives the weekly cadence headroom.
          for path, slug, max_h in [
              ("audit_dashboard/data/anti_overfit_audit.json", "anti_overfit", 24),
              ("alpha_engine/data/walkforward_results.json",   "walkforward",  24*8),
          ]:
              fp = pathlib.Path(path)
              if not fp.exists():
                  print(f"::warning title={slug} missing::{path}")
                  continue
              try:
                  d = json.loads(fp.read_text())
                  ts = d.get("generated_at") or ""
                  # Robust ISO-8601 parse: handle "Z" suffix, naive timestamps
                  # (treat as UTC), and offsets. Per Grok-4 review.
                  ts_norm = ts.replace("Z", "+00:00")
                  parsed = dt.datetime.fromisoformat(ts_norm)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  age_h = (now - parsed).total_seconds()/3600
                  has_by_class = bool(d.get("by_class")) if slug == "walkforward" else None
                  print(f"{slug}: generated_at={ts} age={age_h:.1f}h max={max_h}h by_class_present={has_by_class}")
                  if age_h > max_h:
                      print(f"::warning title={slug} stale::{path} age {age_h:.1f}h > {max_h}h threshold")
                  if slug == "walkforward" and not has_by_class:
                      print(f"::warning title=walkforward by_class empty::{path} has no by_class key — per-asset-class panel will render empty")
              except Exception as e:
                  print(f"::warning title={slug} parse failed::{e}")
          PY


name: ALPHA ENGINE - Adaptive Trust Tuner

on:
  schedule:
    # Recompute trust adjustments every 12 hours
    - cron: '16 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trust-tuner:
    uses: ./.github/workflows/gha-scan-job.yml
    with:
      python-version: '3.11'
      pip-packages: 'requests'
      run-command: 'python alpha_engine/adaptive_trust_tuner.py'
      commit-paths: 'alpha_engine/data/trust_adjustments.json'
      commit-message: 'Trust tuner update [skip ci]'
      fetch-depth: 1
      timeout-minutes: 10
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

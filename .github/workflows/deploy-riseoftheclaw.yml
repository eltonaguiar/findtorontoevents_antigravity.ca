          cp audit_dashboard/data/claudes_test_dashboard.json _site/audit_dashboard/data/ 2>/dev/null || true

          # FindCryptoPairs pages (pump-watch, now, etc.)
          if [ -d findcryptopairs ]; then
            mkdir -p _site/findcryptopairs

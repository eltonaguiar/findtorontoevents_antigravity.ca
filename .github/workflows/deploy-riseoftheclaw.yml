            cp findcryptopairs/audit-trail.html _site/findcryptopairs/ 2>/dev/null || true
          fi

          # Rewrite /next asset paths for GitHub Pages project site base path
          PAGES_BASE=/findtorontoevents_antigravity.ca
          for f in $(find _site -name '*.html'); do
            sed -i "s|\"/next|\"$PAGES_BASE/next|g" "$f"
            sed -i "s|'/next|'$PAGES_BASE/next|g" "$f"
            sed -i "s|href=\"/favicon.ico\"|href=\"$PAGES_BASE/favicon.ico\"|g" "$f"
          done

          # Create index redirect for convenience
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./hub/">
            <title>Redirecting to Trading Systems Hub</title>
          </head>
          <body>
            <p>Redirecting to <a href="./hub/">Trading Systems Hub</a>...</p>
          </body>
          </html>
          EOF

          echo " Unified GitHub Pages deployment directory ready"
          echo " Structure:"
          ls -lah _site/
          echo ""
          echo " Subdirectories:"
          ls -lah _site/riseoftheclaw/

      - name: Validate HTML/JS syntax before deploy
        run: |
          echo " Checking all HTML files for JavaScript syntax errors..."
          ERRORS=0
          for htmlfile in $(find _site -name '*.html' -size +1k); do
            # Extract <script> blocks and validate with Node.js
            RESULT=$(node -e "
              const fs = require('fs');
              const html = fs.readFileSync('$htmlfile', 'utf8');
              const scripts = html.match(/<script[^>]*>([\s\S]*?)<\/script>/g) || [];
              let errors = [];
              for (const block of scripts) {
                const code = block.replace(/<script[^>]*>/, '').replace(/<\/script>/, '');
                if (code.trim().length === 0) continue;
                try { new Function(code); }
                catch(e) {
                  // Retry with async wrapper (top-level async functions are valid JS but new Function rejects them)
                  try { new Function('return (async () => {' + code + '})()'); }
                  catch(e2) { errors.push(e.message); }
                }
              }
              if (errors.length > 0) {
                console.log('FAIL: ' + errors.join(' | '));
                process.exit(1);
              }
            " 2>&1) || {
              echo " JS SYNTAX ERROR in $htmlfile: $RESULT"
              ERRORS=$((ERRORS + 1))
            }
          done
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo " BLOCKING DEPLOY: $ERRORS file(s) have JavaScript syntax errors!"
            echo "Fix the errors above before deploying."
            exit 1
          fi
          echo " All HTML files passed JavaScript syntax validation"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo " Checking GitHub Pages deployment status..."

          # Wait a moment for CDN to propagate
          sleep 10

          # Check main HTML file
          status=$(curl -o /dev/null -s -w "%{http_code}" "https://eltonaguiar.github.io/findtorontoevents_antigravity.ca/riseoftheclaw.html?_=${GITHUB_RUN_NUMBER}")
          echo "Main page status: $status"

          if [ "$status" != "200" ]; then
            echo " Main page returned $status (may need time to propagate)"
          else
            echo " Main page accessible!"
          fi

          # Check CSS file
          css_status=$(curl -o /dev/null -s -w "%{http_code}" "https://eltonaguiar.github.io/findtorontoevents_antigravity.ca/riseoftheclaw/css/dashboard.css?_=${GITHUB_RUN_NUMBER}")
          echo "CSS file status: $css_status"

          if [ "$css_status" != "200" ]; then
            echo " CSS returned $css_status (may need time to propagate)"
          else
            echo " CSS file accessible!"
          fi

          echo " Deployment to GitHub Pages complete!"
          echo " Live at: https://eltonaguiar.github.io/findtorontoevents_antigravity.ca/riseoftheclaw.html"

          echo ""
          echo " Wired dashboards:"
          for page in alpha/premium.html pair-fingerprints.html unified-dashboard.html goldmine-alerts.html forex-portfolio.html riseoftheclaw/scanner-log.html asterdex/index.html; do
            pg_status=$(curl -o /dev/null -s -w "%{http_code}" "https://eltonaguiar.github.io/findtorontoevents_antigravity.ca/${page}?_=${GITHUB_RUN_NUMBER}")
            echo " ${page}: $pg_status"
          done

      - name: Summary
        run: |
          echo "## Rise of the Claw Dashboard Deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Live URL:** https://eltonaguiar.github.io/findtorontoevents_antigravity.ca/riseoftheclaw.html" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Target:** GitHub Pages (50webs FTP currently unavailable)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files Deployed:**" >> $GITHUB_STEP_SUMMARY
          echo "- Main dashboard HTML" >> $GITHUB_STEP_SUMMARY
          echo "- CSS styles" >> $GITHUB_STEP_SUMMARY
          echo "- JavaScript modules (charts, data-loader, dashboard)" >> $GITHUB_STEP_SUMMARY
          echo "- Data files (algorithms, picks, performance stats)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Strategies Deployed (v4 27 total):**" >> $GITHUB_STEP_SUMMARY
          echo "- 15 TIER_1 institutional strategies (Sharpe-weighted scoring)" >> $GITHUB_STEP_SUMMARY
          echo "- 12 SCOUT experimental strategies" >> $GITHUB_STEP_SUMMARY
          echo "- League Brackets: Champions | Premier | Challenger | Qualification | Danger Zone" >> $GITHUB_STEP_SUMMARY


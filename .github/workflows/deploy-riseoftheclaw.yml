            cp audit_trail/data/stock_prices.json _site/audit/data/stock_prices.json 2>/dev/null || true
            # Data files needed by dashboard tabs
            cp audit_dashboard/data/claude_top_picks.json _site/audit/data/ 2>/dev/null || true
            cp audit_dashboard/data/claude_top_picks_phase2.json _site/audit/data/ 2>/dev/null || true

            cp audit_dashboard/data/ag_top_picks_phase2.json _site/audit/data/ 2>/dev/null || true
            cp audit_dashboard/data/claudes_test_dashboard.json _site/audit/data/ 2>/dev/null || true
            cp audit_dashboard/data/claudes_test_state.json _site/audit/data/ 2>/dev/null || true
          fi

          # Genome data needed by audit dashboard (4-AI Battle tab)
          cp genome/data/kimi_top_3_live_picks.json _site/genome/data/kimi_top_3_live_picks.json 2>/dev/null || true
          mkdir -p _site/data
          cp data/grok_top_picks.json _site/data/grok_top_picks.json 2>/dev/null || true
          # Copy Grok + KIMI data into audit/data/ prefer audit_dashboard/data/ (curated with actual TradingView fills)
          cp audit_dashboard/data/grok_top_picks.json _site/audit/data/grok_top_picks.json 2>/dev/null || cp data/grok_top_picks.json _site/audit/data/grok_top_picks.json 2>/dev/null || true
          cp audit_dashboard/data/kimi_top_3_live_picks.json _site/audit/data/kimi_top_3_live_picks.json 2>/dev/null || cp genome/data/kimi_top_3_live_picks.json _site/audit/data/kimi_top_3_live_picks.json 2>/dev/null || true
          cp genome/data/kimi_best_3_current.json _site/audit/data/kimi_best_3_current.json 2>/dev/null || true
          cp audit_dashboard/data/mercury_top_picks.json _site/audit/data/mercury_top_picks.json 2>/dev/null || true

          # Genome predictability data (for audit Predictability tab)
          cp genome/data/symbol_predictability.json _site/audit/symbol_predictability.json 2>/dev/null || true
          cp genome/data/tournament_results.json _site/audit/tournament_results.json 2>/dev/null || true

          # Portfolio Challenge files (deployed to /audit_dashboard/ path too)
          mkdir -p _site/audit_dashboard/data
          cp audit_dashboard/claudes_test.html _site/audit_dashboard/ 2>/dev/null || true
          cp audit_dashboard/portfolio_history.html _site/audit_dashboard/ 2>/dev/null || true
          cp audit_dashboard/BLUEPRINT.md _site/audit_dashboard/ 2>/dev/null || true
          cp audit_dashboard/LEARNINGS.md _site/audit_dashboard/ 2>/dev/null || true

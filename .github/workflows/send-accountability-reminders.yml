name: Send Accountability Reminders

on:
  schedule:
    # Run every hour at :00 to catch each user's preferred reminder_time
    # (the PHP endpoint checks timezone + hour match before sending)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no DMs sent)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  send-reminders:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      EVENT_NOTIFY_API_KEY: ${{ secrets.EVENT_NOTIFY_API_KEY }}

    steps:
    - name: Merge API keys into existing .env on server
      env:
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      run: |
        # IMPORTANT: Read existing .env first, then merge our keys in.
        # Previous bug: this step OVERWROTE the entire .env, wiping DB credentials
        # and causing "Access denied (using password: NO)" on findtorontoevents.ca.
        python3 - <<'PYEOF'
        import ftplib, os, io

        host = os.environ.get("FTP_HOST", "")
        user = os.environ.get("FTP_USER", "")
        pw   = os.environ.get("FTP_PASS", "")
        api_key = os.environ.get("EVENT_NOTIFY_API_KEY", "")
        bot_token = os.environ.get("DISCORD_BOT_TOKEN", "")

        if not all([host, user, pw, api_key]):
            print("Missing credentials, skipping .env deploy")
            exit(0)

        # Keys this workflow needs to set
        new_keys = {
            "EVENT_NOTIFY_API_KEY": api_key,
            "ACCOUNTABILITY_REMINDER_KEY": api_key,
        }
        if bot_token:
            new_keys["DISCORD_BOT_TOKEN"] = bot_token

        ftp = ftplib.FTP(host)
        ftp.login(user, pw)

        for path in ["findtorontoevents.ca/fc/api", "findtorontoevents.ca/favcreators/api"]:
            ftp.cwd("/")
            for part in path.split("/"):
                try: ftp.cwd(part)
                except: ftp.mkd(part); ftp.cwd(part)

            # Read existing .env content
            existing_lines = []
            try:
                buf = io.BytesIO()
                ftp.retrbinary("RETR .env", buf.write)
                existing_lines = buf.getvalue().decode("utf-8", errors="replace").splitlines()
                print(f"  Read existing .env from /{path}/ ({len(existing_lines)} lines)")
            except Exception as e:
                print(f"  No existing .env in /{path}/ ({e}), creating new")

            # Parse existing keys (preserve order, update/add ours)
            existing_keys = {}
            ordered_lines = []
            for line in existing_lines:
                stripped = line.strip()
                if stripped == "" or stripped.startswith("#"):
                    ordered_lines.append(line)
                    continue
                if "=" in stripped:
                    k = stripped.split("=", 1)[0].strip()
                    existing_keys[k] = len(ordered_lines)
                ordered_lines.append(line)

            # Update existing keys or append new ones
            for k, v in new_keys.items():
                new_line = f"{k}={v}"
                if k in existing_keys:
                    ordered_lines[existing_keys[k]] = new_line
                else:
                    ordered_lines.append(new_line)

            merged = "\n".join(ordered_lines) + "\n"
            ftp.storbinary("STOR .env", io.BytesIO(merged.encode()))
            print(f"  Merged .env to /{path}/ ({len(ordered_lines)} lines)")

        ftp.quit()
        print("Done  existing DB credentials preserved")
        PYEOF

    - name: Send Accountability Coach Reminders
      run: |
        set -euo pipefail
        DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
        URL="https://findtorontoevents.ca/fc/api/accountability/send_reminders.php"
        USER_AGENT="Mozilla/5.0 (compatible; FindTorontoEvents-Reminders/1.0)"

        run_request() {
          method="$1"
          target_url="$2"
          payload="${3:-}"

          set +e
          if [ "$method" = "POST" ]; then
            response=$(curl -sS \
              --connect-timeout 20 \
              --max-time 120 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-API-Key: $EVENT_NOTIFY_API_KEY" \
              -A "$USER_AGENT" \
              -d "$payload" \
              -w "\n%{http_code}" \
              "$target_url")
          else
            response=$(curl -sS \
              --connect-timeout 20 \
              --max-time 120 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              -H "X-API-Key: $EVENT_NOTIFY_API_KEY" \
              -A "$USER_AGENT" \
              -w "\n%{http_code}" \
              "$target_url")
          fi
          curl_rc=$?
          set -e

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
        }

        if [ "$DRY_RUN" = "true" ]; then
          URL="${URL}?dry_run=1"
          echo "Dry run mode  no DMs will be sent"
        fi

        echo "Sending accountability reminders..."
        run_request "POST" "$URL" '{"action":"send_reminders"}'

        # Fallback when POST blocked or transport failed.
        if [ "$curl_rc" -ne 0 ] || [ "$http_code" = "412" ] || [ "$http_code" = "403" ]; then
          if [ "$curl_rc" -ne 0 ]; then
            echo "POST transport failed (curl exit $curl_rc), retrying as GET..."
          else
            echo "POST blocked by ModSecurity (HTTP $http_code), retrying as GET..."
          fi
          if echo "$URL" | grep -q '?'; then
            FALLBACK_URL="${URL}&method=post"
          else
            FALLBACK_URL="${URL}?method=post"
          fi
          run_request "GET" "$FALLBACK_URL"
        fi

        echo "curl exit: $curl_rc"
        echo "HTTP Status: $http_code"
        echo "Response: $body"

        if [ "$curl_rc" -ne 0 ]; then
          echo "::warning::Reminder endpoint transport failed after retries (curl exit $curl_rc). Marking non-fatal."
          exit 0
        fi

        if [ "$http_code" != "200" ]; then
          echo "::warning::Failed to send reminders (HTTP $http_code)  server may be blocking requests"
          exit 0
        fi

        if ! echo "$body" | python3 -m json.tool > /tmp/reminder_response.json 2>/tmp/reminder_response.err; then
          echo "::warning::Reminder endpoint returned non-JSON HTTP 200 payload. Marking non-fatal."
          cat /tmp/reminder_response.err || true
          echo "$body"
          exit 0
        fi

        cat /tmp/reminder_response.json | python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        print(f\"Discord DMs sent: {data.get('sent_discord', 0)}\")
        print(f\"Dashboard notifs sent: {data.get('sent_dashboard', 0)}\")
        print(f\"Skipped (wrong hour): {data.get('skipped', 0)}\")
        if data.get('dry_run'):
            previews = data.get('previews', [])
            print(f\"Preview count: {len(previews)}\")
            for p in previews[:10]:
                print(f\"  -> {p.get('channel')}: {p.get('task')}\")
        if data.get('errors'):
            for e in data['errors']:
                print(f\"Error: {e}\")
        "


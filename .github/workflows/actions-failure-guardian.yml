# This workflow monitors failed GitHub Actions and automatically retries them
# It runs every 30 minutes to catch and recover from transient failures

name: actions-failure-guardian
run-name: "${{ github.workflow }} · ${{ github.event_name }} · ${{ github.sha }}"

on:
  workflow_dispatch:
  schedule:
    - cron: '19/30 * * * *'  # Every 30 minutes

# 2026-06-21: serialize overlapping runs so this */30 self-pushing workflow can't race on a
# non-fast-forward push to main (cancel-in-progress:false = let an in-flight push finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor-and-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 20

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run failure guardian script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Cap re-runs per run and never auto-retry known verification jobs.
          FAILURE_GUARD_MAX_ATTEMPT: "3"
          FAILURE_GUARD_EXCLUDE: "Backup Restore Verification"
        run: |
          python scripts/actions_failure_guardian.py

      - name: Commit updated status
        run: |
          # The guardian script writes to reports/actions_failure_guardian.json
          if [ -f .github/scripts/safe_commit_push.sh ]; then
            bash .github/scripts/safe_commit_push.sh "Update actions failure guardian status [skip ci]" reports/actions_failure_guardian.json
          else
            git config user.name "Hermes Agent"
            git config user.email "hermes@agent.com"
            git add reports/actions_failure_guardian.json
            if git commit -m "Update actions failure guardian status [skip ci]"; then
              # 2026-11-16: routed through safe_push — bare push dropped data on non-FF
              bash .github/scripts/safe_push.sh
            else
              echo "No changes to push"
            fi
          fi

      - name: Notify on critical failures
        if: failure()
        run: |
          echo "CRITICAL: Actions failure guardian failed to run"
          echo "Manual intervention required to investigate workflow failures"

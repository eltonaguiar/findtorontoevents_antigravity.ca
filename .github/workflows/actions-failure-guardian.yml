# This workflow monitors failed GitHub Actions and automatically retries them
# It runs every 30 minutes to catch and recover from transient failures

name: actions-failure-guardian

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes

permissions:
  contents: write

jobs:
  monitor-and-retry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run failure guardian script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/actions_failure_guardian.py

      - name: Commit updated status
        run: |
          # The guardian script writes to reports/actions_failure_guardian.json
          if [ -f .github/scripts/safe_commit_push.sh ]; then
            bash .github/scripts/safe_commit_push.sh "Update actions failure guardian status [skip ci]" reports/actions_failure_guardian.json
          else
            git config user.name "Hermes Agent"
            git config user.email "hermes@agent.com"
            git add reports/actions_failure_guardian.json
            git pull --rebase origin main
            git commit -m "Update actions failure guardian status [skip ci]" && git push origin HEAD:main || echo "No changes to push"
          fi

      - name: Notify on critical failures
        if: failure()
        run: |
          echo "CRITICAL: Actions failure guardian failed to run"
          echo "Manual intervention required to investigate workflow failures"

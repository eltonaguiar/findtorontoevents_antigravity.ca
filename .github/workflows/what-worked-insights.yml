name: What Worked Active Picks Insights

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  what-worked:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Fetch dashboard payload (FTP — file is gitignored, regenerated hourly)
        run: |
          mkdir -p audit_trail/data
          curl -fsS --max-time 180 "https://findtorontoevents.ca/audit/data/dashboard_payload.json" \
            -o audit_trail/data/dashboard_payload.json || echo "::warning::dashboard_payload.json fetch failed — downstream step may degrade"

      - name: Run What Worked analyzer
        env:
          PYTHONIOENCODING: utf-8
        run: python alpha_engine/what_worked.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/what_worked.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "What Worked insights update $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git pull --rebase origin main
            bash .github/scripts/safe_push.sh
          fi


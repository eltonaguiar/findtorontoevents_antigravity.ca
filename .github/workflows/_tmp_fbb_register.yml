name: _tmp fbb register
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: futures_bb symbols and entry prices
        env:
          DB_HOST: mysql.50webs.com
          DB_PORT: '3306'
          DB_USER: ejaguiar1_stocks
          DB_PASS: ${{ secrets.MYSQL_PASSWORD || secrets.AUDIT_DB_PASS }}
        run: |
          python3 -m pip install --quiet pymysql yfinance
          python3 - <<'PY'
          import os, json, collections
          import pymysql, yfinance as yf

          cn=pymysql.connect(host=os.environ["DB_HOST"], port=int(os.environ.get("DB_PORT") or 3306),
                             user=os.environ["DB_USER"], password=os.environ["DB_PASS"],
                             database="ejaguiar1_stocks", connect_timeout=25)
          cur=cn.cursor()
          cur.execute("""SELECT symbol, COUNT(*) n, SUM(pnl_pct>0) w, AVG(pnl_pct) a
                         FROM trading_picks
                         WHERE strategy='futures_bb_mean_reversion' AND pnl_pct IS NOT NULL
                         GROUP BY symbol HAVING COUNT(*)>=2 ORDER BY n DESC""")
          rows=cur.fetchall()
          cn.close()
          print("SYMBOLS_IN_COHORT", len(rows))
          for s,n,w,a in rows:
              print(f"  {s:<10} n={n:<4} win={100*w/n:5.1f}% mean={float(a):+.3f}%")

          # last completed daily close per contract, which is what emit() prices from
          out=[]
          for s,n,w,a in rows:
              try:
                  df=yf.download(s, period="10d", progress=False, auto_adjust=True)
                  if df is None or df.empty:
                      print(f"  NOBARS {s}"); continue
                  last=df.index[-1]
                  close=float(df["Close"].iloc[-1].iloc[0]) if hasattr(df["Close"].iloc[-1], "iloc") else float(df["Close"].iloc[-1])
                  out.append({"symbol": s, "entry_date": str(last)[:10], "entry_price": round(close,6),
                              "n": int(n), "mean_pct": round(float(a),3)})
              except Exception as e:
                  print(f"  ERRBARS {s}: {type(e).__name__}: {e}")
          print("\nBAR_SOURCE_RESULT")
          print(json.dumps(out, indent=1))
          PY

name: ALPHA ENGINE Gainer Capture (15min)

on:
  schedule:
    - cron: '10,40 * * * *' # Every 30 min speed matters for catching pumps
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-gainer-capture
  cancel-in-progress: false

jobs:
  gainer-capture:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1
          sparse-checkout: |
            .github
            alpha_engine
            shared

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            alpha_engine/requirements.txt

      - name: Install dependencies
        run: pip install yfinance pandas numpy scikit-learn joblib requests

      - name: Run Gainer Capture Strategy
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_ACTIONS: "true"
        run: |
          echo "============================================"
          echo " GAINER CAPTURE 3 Strategies for Big Movers"
          echo " Early Momentum | Breakout Continuation | Top 3 Momentum"
          echo " $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          python alpha_engine/gainer_capture_strategy.py

      - name: Commit gainer capture data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/gainer_capture_picks.json alpha_engine/data/gainer_portfolio_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Gainer Capture: $(date -u '+%Y-%m-%d %H:%M') [AUTO] [skip ci]"

      - name: Push with retry
        run: |
          git clean -fd 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3; do
            bash .github/scripts/safe_push.sh && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
            git pull --rebase origin main || true
          done


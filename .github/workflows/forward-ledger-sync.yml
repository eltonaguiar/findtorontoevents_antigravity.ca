name: Forward Ledger — daily sync

# Appends picks that CLOSED on/after a strategy's registered start date into
# state/forward_test/ledger.jsonl, so the forward clock fills itself.
# Pre-registration guard lives in the tool (tools/forward_tracker.py sync), not
# here: a pick older than the strategy's `start` can never be admitted, so the
# sample that motivated a hypothesis cannot confirm it.
#
# Why a separate workflow and not a step inside audit-dashboard.yml:
#   - audit-dashboard runs hourly at :10 and has a documented cancel-cascade
#     history; adding a commit to it means ~24 ledger commits/day instead of 1.
#   - This job needs the *live* payload. Running it right after that build keeps
#     the read fresh without coupling to a 35-minute job.
#   - Ledger writes are append-only and once a day; a dedicated concurrency
#     group makes overlapping runs impossible.

on:
  schedule:
    - cron: "37 5 * * *"   # 05:37 UTC, after the hourly audit build has refreshed the live payload
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — write nothing, commit nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: forward-ledger-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYLOAD: /tmp/dashboard_data.json
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Fetched to /tmp on purpose: the tracked audit_dashboard/data/dashboard_data.json
      # is a stale snapshot, and overwriting it here would put a 25MB file in the
      # commit and fight audit-dashboard for the same path.
      - name: Fetch live dashboard payload
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 180 \
            "https://findtorontoevents.ca/audit/data/dashboard_data.json" -o "$PAYLOAD"
          python3 - "$PAYLOAD" <<'PY'
          import json, sys, datetime as dt
          d = json.load(open(sys.argv[1]))
          rows = (d.get("picks") or {}).get("recent_closed") or []
          gen = d.get("generated_at") or "?"
          print(f"payload generated_at={gen} recent_closed={len(rows)}")
          if not rows:
              raise SystemExit("::error::payload has 0 recent_closed rows — refusing to sync from a broken payload")
          try:
              age_h = (dt.datetime.now(dt.timezone.utc)
                       - dt.datetime.fromisoformat(str(gen).replace("Z", "+00:00"))).total_seconds() / 3600
              print(f"payload age: {age_h:.1f}h")
              if age_h > 48:
                  print(f"::warning::payload is {age_h:.0f}h old — the live build may be stalled; syncing anyway")
          except Exception as exc:
              print(f"::warning::could not parse generated_at ({exc}) — continuing")
          PY

      # The registered endpoint is excess vs the class benchmark, so sync needs closes.
      # Refreshed to /tmp and NEVER committed: audit-dashboard owns the tracked copy and
      # two workflows writing one path is how you get push races.
      - name: Refresh benchmark closes
        run: |
          python3 -m pip install --quiet requests   # build_benchmark_prices fetches lazily
          BENCH=/tmp/benchmark_prices.json
          if python3 tools/build_benchmark_prices.py --out "$BENCH"; then
            echo "BENCH=$BENCH" >> "$GITHUB_ENV"
          else
            echo "::warning::benchmark refresh failed — falling back to the committed series"
            echo "BENCH=audit_dashboard/data/benchmark_prices.json" >> "$GITHUB_ENV"
          fi

      - name: Sync closed picks into the ledger
        run: |
          FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python3 tools/forward_tracker.py sync \
            --dashboard "$PAYLOAD" \
            --bench-file "${BENCH:-audit_dashboard/data/benchmark_prices.json}" \
            --fee-bps-per-side 6 \
            $FLAG

      - name: Show verdict after sync
        run: python3 tools/forward_tracker.py status

      # The panel must never compute its own verdicts: this imports the same
      # decide()/interim_verdict() the CLI uses.
      - name: Build dashboard clock panel data
        run: python3 tools/build_forward_clock.py

      - name: Commit ledger changes only
        if: ${{ inputs.dry_run != true }}
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The ledger may legitimately not exist yet (nothing admitted = the guard
          # working). The clock panel still ships so the dashboard can show 0/152
          # instead of hiding the strategy entirely.
          if [ -f state/forward_test/ledger.jsonl ]; then
            git add -- state/forward_test/ledger.jsonl
          else
            echo "no ledger file yet (nothing admitted)"
          fi
          [ -f audit_dashboard/data/forward_clock.json ] && git add -- audit_dashboard/data/forward_clock.json

          # Explicit single-path add: this job may never stage plan.json, the
          # payload, or any other generator output.

          bash .github/scripts/assert_no_conflict_markers.sh || { echo "::error::conflict markers in ledger"; exit 1; }

          # Only these two paths may ever reach the index. Anything else is a bug in
          # this job, not a file to commit.
          ALLOWED="state/forward_test/ledger.jsonl audit_dashboard/data/forward_clock.json"
          for p in $(git diff --cached --name-only); do
            case " $ALLOWED " in
              *" $p "*) : ;;
              *) echo "::error::refusing to commit unexpected path: $p"; exit 1 ;;
            esac
          done

          rows=$([ -f state/forward_test/ledger.jsonl ] && wc -l < state/forward_test/ledger.jsonl || echo 0)
          git commit -m "chore(forward-test): ledger sync $(date -u +'%Y-%m-%d') — ${rows} rows [skip ci]"
          bash .github/scripts/safe_push.sh

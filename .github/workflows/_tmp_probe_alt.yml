name: _tmp probe alt
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: probe
        env:
          DB_HOST: mysql.50webs.com
          DB_PORT: '3306'
          DB_USER: ejaguiar1_stocks
          DB_PASS: ${{ secrets.AUDIT_DB_PASS }}
        run: |
          python3 -m pip install --quiet pymysql
          python3 - <<'PY'
          import os
          import pymysql
          cn = pymysql.connect(host=os.environ['DB_HOST'],port=3306,user=os.environ['DB_USER'],password=os.environ['DB_PASS'],database='ejaguiar1_stocks',connect_timeout=20)
          cur = cn.cursor()
          print("=== CATEGORY COUNTS ===")
          cur.execute("SELECT COALESCE(category,'<NULL>'), COUNT(*) FROM trading_picks GROUP BY category ORDER BY 2 DESC")
          for r in cur.fetchall():
              print(repr(r[0]), r[1])
          print("=== STRATEGY x CATEGORY ===")
          cur.execute("SELECT strategy, COALESCE(category,'<NULL>'), COUNT(*) FROM trading_picks GROUP BY strategy, category ORDER BY strategy")
          for r in cur.fetchall():
              print(r[0], '||', r[1], '||', r[2])
          print("=== DONE ===")
          PY

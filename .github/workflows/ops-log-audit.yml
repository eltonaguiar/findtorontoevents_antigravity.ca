name: Ops - sharded audit of all workflows (self-hosted)

# Ownership: hermes-desktop (desktop-081g9oh). This workflow is mine. It is
# dispatch/schedule only and it modifies no production workflow's runs-on, so it
# cannot strand a production job.
#
# Purpose: keep the self-hosted pool busy with real monitoring work and produce a
# complete latest-run audit of every workflow, sharded so the whole pool is used.
# 3 shards, all on the gx10 ARM pool, matching the three runners kept for monitoring.
# The owner trimmed the fleet to what the monitoring job needs, so the shard count must
# stay <= the pool size or a shard would sit queued with no runner to take it.
on:
  push:
    branches: [ops/log-audit]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  arm:
    runs-on: [self-hosted, gx10]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Audit shard ${{ matrix.shard }} of 3 (arm)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHARD: ${{ matrix.shard }}
          SHARDS: "3"
        run: |
          echo "runner=$(hostname) shard=${SHARD}/${SHARDS} pool=arm"
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["REPO"]; token = os.environ["GH_TOKEN"]
          shard = int(os.environ["SHARD"]); shards = int(os.environ["SHARDS"])
          H = {"Authorization": f"Bearer {token}",
               "Accept": "application/vnd.github+json", "User-Agent": "hermes-audit"}
          def get(path):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}{path}", headers=H)
              with urllib.request.urlopen(req, timeout=45) as r: return json.load(r)
          wfs = []
          for page in range(1, 6):
              try: data = get(f"/actions/workflows?per_page=100&page={page}").get("workflows", [])
              except Exception: break
              if not data: break
              wfs.extend(data)
          mine = [w for i, w in enumerate(wfs) if i % shards == shard]
          rows = []
          for w in mine:
              row = {"workflow": w["path"].split("/")[-1]}
              try:
                  runs = get(f"/actions/workflows/{w['id']}/runs?per_page=1&branch=main")
                  r = (runs.get("workflow_runs") or [None])[0]
                  if not r:
                      row["verdict"] = "NEVER RUN"; rows.append(row); continue
                  row["run"] = r["run_number"]; row["verdict"] = r.get("conclusion") or r.get("status")
                  if row["verdict"] == "failure":
                      jobs = get(f"/actions/runs/{r['id']}/jobs").get("jobs") or []
                      row["failed_steps"] = [s["name"] for j in jobs for s in j.get("steps", [])
                                             if s.get("conclusion") == "failure"][:3]
              except Exception as e:
                  row["verdict"] = f"ERROR {type(e).__name__}"
              rows.append(row)
          fails = [r for r in rows if r["verdict"] == "failure"]
          print(f"shard {shard}: {len(rows)} audited, {len(fails)} failing")
          for r in fails: print("FAIL", json.dumps(r)[:180])
          with open(f"audit_shard_{shard}.json", "w") as f: json.dump(rows, f, indent=1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audit-shard-${{ matrix.shard }}
          path: audit_shard_${{ matrix.shard }}.json


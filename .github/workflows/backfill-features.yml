name: Backfill OHLCV Features

on:
  schedule:
    # Run daily at 04:00 UTC to catch picks that closed without features
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max picks to backfill (0 = all)'
        required: false
        default: '0'
        type: string
      dry_run:
        description: 'Dry run (no save)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  backfill:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.12'

      - name: Run backfill
        run: |
          ARGS=""
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"

          if [ "$LIMIT" != "0" ] && [ -n "$LIMIT" ]; then
            ARGS="$ARGS --limit $LIMIT"
          fi

          if [ "$DRY" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: python -m alpha_engine.backfill_ohlcv_features $ARGS"
          python -m alpha_engine.backfill_ohlcv_features $ARGS

      - name: Commit updated picks
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/closed_picks.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: backfill OHLCV features for closed picks [skip ci]"
            git pull --rebase origin main
            bash .github/scripts/safe_push.sh
          fi


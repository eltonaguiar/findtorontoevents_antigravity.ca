name: "Deploy FavCreators Frontend (/fc/)"

on:
  push:
    branches: [main]
    paths:
      - 'favcreators/docs/**'
      - '!favcreators/docs/api/**'
      - '.github/workflows/deploy-fc-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to torontoevent.net (GoDaddy)
        env:
          FTP_HOST: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          FTP_USER: ${{ secrets.FTPGODADDYUSER }}
          FTP_PASS: ${{ secrets.FTPGODADDYPASS }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os
          from pathlib import Path

          host = os.environ.get("FTP_HOST", "")
          user = os.environ.get("FTP_USER", "")
          pwd  = os.environ.get("FTP_PASS", "")

          if not all([host, user, pwd]):
              print("FTP credentials not set, skipping")
              exit(0)

          src = Path("favcreators/docs")

          print(f"Connecting to {host} (torontoevent.net)...")
          ftp = ftplib.FTP(host)
          ftp.login(user, pwd)
          print("Connected")

          def ensure_dir(ftp, remote_dir):
              ftp.cwd("/")
              for part in remote_dir.split("/"):
                  if not part: continue
                  try:
                      ftp.cwd(part)
                  except:
                      try:
                          ftp.mkd(part)
                          ftp.cwd(part)
                      except Exception as e:
                          print(f"  mkd {part}: {e}")
                          return False
              return True

          def upload(ftp, local_path, remote_path):
              parts = remote_path.split("/")
              d = "/".join(parts[:-1])
              if d:
                  ensure_dir(ftp, d)
              else:
                  ftp.cwd("/")
              with open(local_path, "rb") as f:
                  ftp.storbinary(f"STOR {parts[-1]}", f)
              print(f"  {remote_path}")

          uploaded = 0

          # Upload all non-API frontend files to /fc/
          for f in src.rglob("*"):
              if f.is_file() and "/api/" not in f.as_posix() and "\\api\\" not in str(f):
                  rel = f.relative_to(src)
                  upload(ftp, f, f"fc/{rel.as_posix()}")
                  uploaded += 1

          ftp.quit()
          print(f"\nDeployed {uploaded} files to torontoevent.net/fc/")
          PYEOF

      - name: Deploy to findtorontoevents.ca (50webs)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os
          from pathlib import Path

          host = os.environ.get("FTP_HOST", "")
          user = os.environ.get("FTP_USER", "")
          pwd  = os.environ.get("FTP_PASS", "")

          if not all([host, user, pwd]):
              print("FTP credentials not set, skipping")
              exit(0)

          src = Path("favcreators/docs")
          SITE_ROOT = "findtorontoevents.ca"

          print(f"Connecting to {host} (50webs)...")
          ftp = ftplib.FTP(host)
          ftp.login(user, pwd)
          print("Connected")

          def ensure_dir(ftp, remote_dir):
              ftp.cwd("/")
              for part in remote_dir.split("/"):
                  if not part: continue
                  try:
                      ftp.cwd(part)
                  except:
                      try:
                          ftp.mkd(part)
                          ftp.cwd(part)
                      except Exception as e:
                          print(f"  mkd {part}: {e}")
                          return False
              return True

          def upload(ftp, local_path, remote_path):
              parts = remote_path.split("/")
              d = "/".join(parts[:-1])
              if d:
                  ensure_dir(ftp, d)
              else:
                  ftp.cwd("/")
              with open(local_path, "rb") as f:
                  ftp.storbinary(f"STOR {parts[-1]}", f)
              print(f"  {remote_path}")

          uploaded = 0

          for f in src.rglob("*"):
              if f.is_file() and "/api/" not in f.as_posix() and "\\api\\" not in str(f):
                  rel = f.relative_to(src)
                  upload(ftp, f, f"{SITE_ROOT}/fc/{rel.as_posix()}")
                  uploaded += 1

          ftp.quit()
          print(f"\nDeployed {uploaded} files to findtorontoevents.ca/fc/")
          PYEOF

      - name: Verify
        run: |
          sleep 5
          for URL in \
            "https://torontoevent.net/fc/" \
            "https://findtorontoevents.ca/fc/"; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "$URL -> HTTP $STATUS"
          done


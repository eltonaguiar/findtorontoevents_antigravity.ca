name: Mercury 2  Weekly Retrain

on:
  schedule:
    - cron: "33 2 * * 0"       # Every Sunday at 2:00 AM UTC
  workflow_dispatch:

concurrency:
  group: mercury2-retrain-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          update-environment: true
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas xgboost lightgbm scikit-learn joblib requests scipy catboost

      - name: Run Mercury 2 trainer
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "=== Mercury 2 Weekly Retrain ==="
          python -m mercury2 train

      - name: Commit trained models
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "Mercury 2 Bot"
          git config user.email "mercury2@findtorontoevents.ca"
          git add mercury2/models/ mercury2/data/training_summary.json || true
          git add ml_battleground/retrain_trigger.json ml_battleground/baseline_metrics.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m " Mercury 2 retrain $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          # Fail loudly when the push never lands. The previous loop ended on
          # `git pull --rebase ... || true`, so a run whose push was rejected on
          # every attempt still exited 0: 2026-11-26 run 45742936345 reported
          # success while mercury2/models/ was never committed, and the next
          # scanner run died with "ensemble_conservative.joblib not found".
          # Retries also had to escape the half-finished rebase/merge left by the
          # previous attempt, which is why attempts 4-5 failed on
          # "Pulling is not possible because you have unmerged files".
          pushed=0
          for i in 1 2 3 4 5; do
            if bash .github/scripts/safe_push.sh; then pushed=1; break; fi
            echo "Push attempt $i failed, re-parenting onto origin/main and retrying..."
            sleep $((i * 10))
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            git fetch --no-tags origin main || true
            git reset --soft origin/main 2>/dev/null || true
            git add -f mercury2/models/ mercury2/data/training_summary.json || true
            git add ml_battleground/retrain_trigger.json ml_battleground/baseline_metrics.json 2>/dev/null || true
            git commit -m " Mercury 2 retrain $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" || true
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Mercury 2 retrain trained the models but could not push them to main. mercury2/models/ is still absent, so the scanner will fail with scanner_ran=false (no_models). This run is NOT a success."
            exit 1
          fi



name: realtime-challenge

# Monitors the paper-trading challenge: every 15 minutes it marks open
# positions against live Binance prices, closes anything that hit TP/SL/time,
# and opens new slots when the frozen rule qualifies. State is committed so the
# record is auditable even if a run fails.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: challenge tag (one book per tag)
        required: false
        default: buffy

permissions:
  contents: write

concurrency:
  group: realtime-challenge
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mark open positions and open new slots
        run: |
          TAG="${{ github.event.inputs.tag || 'buffy' }}"
          python3 tools/realtime_challenge.py cycle --tag "$TAG"
          python3 tools/realtime_challenge.py report --tag "$TAG"

      - name: Commit the ledger
        run: |
          git config user.name "challenge-bot"
          git config user.email "challenge-bot@users.noreply.github.com"
          if [ -d data/realtime_challenge ]; then
            git add data/realtime_challenge
            if git diff --cached --quiet; then
              echo "no change"
            else
              git commit -m "realtime-challenge: cycle [skip ci]"
              # Was a hand-rolled "git push || git pull --rebase --autostash" retry loop.
              # This repo takes pushes every few seconds, so the bare push is rejected
              # ("! [rejected] main -> main (fetch first)") and the rebase then hangs on
              # the shallow checkout: every cycle burned the 10m timeout and was cancelled
              # (runs #376-#383). safe_push.sh exists for exactly this - bounded retries
              # with backoff, autostash, and no-merge-base recovery.
              bash .github/scripts/safe_push.sh
            fi
          fi

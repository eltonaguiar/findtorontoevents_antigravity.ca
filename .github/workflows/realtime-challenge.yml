name: realtime-challenge

# Monitors the paper-trading challenge: every 15 minutes it marks open
# positions against live Binance prices, closes anything that hit TP/SL/time,
# and opens new slots when the frozen rule qualifies. State is committed so the
# record is auditable even if a run fails.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: challenge tag (one book per tag)
        required: false
        default: buffy

permissions:
  contents: write

concurrency:
  group: realtime-challenge
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Mark open positions and open new slots
        run: |
          TAG="${{ github.event.inputs.tag || 'buffy' }}"
          python3 tools/realtime_challenge.py cycle --tag "$TAG"
          python3 tools/realtime_challenge.py report --tag "$TAG"

      - name: Commit the ledger
        run: |
          git config user.name "challenge-bot"
          git config user.email "challenge-bot@users.noreply.github.com"
          if [ -d data/realtime_challenge ]; then
            git add data/realtime_challenge
            if git diff --cached --quiet; then
              echo "no change"
            else
              git commit -m "realtime-challenge: cycle [skip ci]"
              # Every network op is bounded: main is contended by ~47 workflows
              # that push, and an unbounded `git push` stalls until the job's
              # 10-minute cap cancels the run (39 cancels today).
              pushed=0
              for i in 1 2 3; do
                if timeout 60 git push; then pushed=1; break; fi
                echo "push attempt $i failed; rebasing"
                timeout 60 git pull --rebase --autostash || {
                  git rebase --abort 2>/dev/null || true
                }
                sleep $((i * 5))
              done
              if [ "$pushed" != "1" ]; then
                echo "::warning::ledger push failed after 3 bounded attempts; next cycle retries"
              fi
            fi
          fi

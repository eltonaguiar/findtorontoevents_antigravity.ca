name: Meme Coin Scanner Auto Scan & Resolve

concurrency:
  group: "meme-scanner-${{ github.ref }}"
  cancel-in-progress: false
on:
  schedule:
    # Scan every 2 hours (reduced from */30 to ease queue pressure)
    - cron: '0 */2 * * *'
    # Resolve past signals every 3 hours (2h window + buffer)
    - cron: '0 */3 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  meme-scan:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
    # Step 1: Scan meme coins
    - name: Scan meme coins
      continue-on-error: true
      run: |
        echo "=== Scanning meme coins (Tier 1 + Tier 2 discovery) ==="
        RESULT=$(curl -s --max-time 60 "https://findtorontoevents.ca/findcryptopairs/api/meme_scanner.php?action=scan&key=memescan2026") || true
        echo "$RESULT" | python3 -c "
        import sys, json
        d = json.load(sys.stdin)
        if d.get('ok'):
            print(f'Tier 1 found: {d.get(\"tier1_found\",0)}/7')
            print(f'Tier 2 discovered: {d.get(\"tier2_found\",0)}')
            print(f'Deep analyzed: {d.get(\"deep_analyzed\",0)}')
            print(f'Winners found: {d.get(\"winners_found\",0)}')
            print(f'Elapsed: {d.get(\"elapsed_sec\",0)}s')
            for w in d.get('winners', [])[:5]:
                pair = w.get('pair','?').replace('_USDT','/USDT')
                print(f'  {pair:12s} Score:{w.get(\"score\",0)} Tier:{w.get(\"tier\",\"?\")} {w.get(\"verdict\",\"?\")}')
        else:
            print(f'Error: {d.get(\"error\",\"unknown\")}')
        " || echo "Scan: $RESULT"

    # Step 2: Resolve past signals (runs on the 3-hourly schedule)
    - name: Resolve past signals
      continue-on-error: true
      if: github.event.schedule == '0 */3 * * *' || github.event_name == 'workflow_dispatch'
      run: |
        echo "=== Resolving meme signals (2h window) ==="
        RESULT=$(curl -s --max-time 45 "https://findtorontoevents.ca/findcryptopairs/api/meme_scanner.php?action=resolve&key=memescan2026") || true
        echo "$RESULT" | python3 -c "
        import sys, json
        d = json.load(sys.stdin)
        if d.get('ok'):
            print(f'Resolved: {d.get(\"resolved\",0)} signals')
            print(f'Wins: {d.get(\"wins\",0)} | Losses: {d.get(\"losses\",0)} | Win Rate: {d.get(\"win_rate\",0)}%')
            for det in d.get('details', [])[:5]:
                print(f'  {det.get(\"pair\",\"?\"):12s} PnL:{det.get(\"pnl_pct\",0):+.2f}% {det.get(\"outcome\",\"?\")}')
        else:
            print(f'Resolve: {d.get(\"error\",\"no signals to resolve\")}')
        " || echo "Resolve: $RESULT"

    # Step 3: Record daily snapshot
    - name: Record daily snapshot
      continue-on-error: true
      run: |
        curl -s --max-time 10 "https://findtorontoevents.ca/findcryptopairs/api/meme_scanner.php?action=snapshot&key=memescan2026" > /dev/null 2>&1 || true

    # Step 4: Print stats
    - name: Print stats
      continue-on-error: true
      run: |
        echo "=== Meme Scanner Stats ==="
        RESULT=$(curl -s --max-time 15 "https://findtorontoevents.ca/findcryptopairs/api/meme_scanner.php?action=stats") || true
        echo "$RESULT" | python3 -c "
        import sys, json
        d = json.load(sys.stdin)
        if d.get('ok'):
            s = d.get('stats', {})
            print(f'Total Signals: {s.get(\"total_signals\",0)}')
            print(f'Win Rate: {s.get(\"overall_win_rate\",\"--\")}%')
            print(f'Avg PnL: {s.get(\"avg_pnl\",\"--\")}%')
            print(f'Unique Pairs: {s.get(\"unique_pairs\",0)}')
            print(f'Scans Run: {s.get(\"total_scans\",0)}')
        " || echo "Stats: $RESULT"

    # Step 5: Export active meme picks to JSON for audit dashboard integration
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT || github.token }}
        ref: main

    - name: Export meme picks to audit-readable JSON
      continue-on-error: true
      run: |
        mkdir -p data
        python3 -c "
        import json, urllib.request, datetime

        # Fetch scan results from PHP API
        picks = []
        try:
            url = 'https://findtorontoevents.ca/findcryptopairs/api/meme_scanner.php?action=scan&key=memescan2026'
            req = urllib.request.Request(url, headers={'User-Agent': 'AuditBot/1.0'})
            with urllib.request.urlopen(req, timeout=30) as resp:
                data = json.loads(resp.read().decode())
            for w in data.get('winners', []):
                pair = w.get('pair', '').replace('_USDT', 'USDT').replace('_', '')
                score = float(w.get('score', 0))
                picks.append({
                    'symbol': pair,
                    'direction': 'LONG',
                    'confidence': min(score / 100.0, 1.0),
                    'entry_price': float(w.get('price_at_signal', 0) or 0),
                    'take_profit': float(w.get('price_at_signal', 0) or 0) * (1 + float(w.get('target_pct', 3)) / 100),
                    'stop_loss': float(w.get('price_at_signal', 0) or 0) * (1 - float(w.get('risk_pct', 2)) / 100),
                    'strategy': 'meme_scanner_' + w.get('tier', 'tier1'),
                    'source_system': 'meme_scanner',
                    'timestamp': w.get('created_at', datetime.datetime.utcnow().isoformat()),
                    'verdict': w.get('verdict', ''),
                    'tier': w.get('tier', ''),
                })
        except Exception as e:
            print(f'Failed to fetch meme scanner data: {e}')

        output = {'picks': picks, 'updated_at': datetime.datetime.utcnow().isoformat(), 'source': 'meme_scanner_php_api'}
        with open('data/meme_scanner_active.json', 'w') as f:
            json.dump(output, f, indent=2)
        print(f'Exported {len(picks)} meme scanner picks to data/meme_scanner_active.json')
        "

    - name: Commit meme scanner JSON export
      continue-on-error: true
      run: |
        git config --local user.email "meme-scanner@bot"
        git config --local user.name "Meme Scanner Bot"
        git add data/meme_scanner_active.json || true
        git diff --staged --quiet || git commit -m "Meme scanner: export active picks JSON for audit $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
        git pull --rebase origin main || true
        bash .github/scripts/safe_push.sh


# Per-asset-class strategy tracker rebuild — daily (ENHANCEMENT #121, 2026-06-04).
#
# Rebuilds strategy_perf_by_class in ejaguiar1_stocks from at_pick_outcomes (resolved
# WON/LOST), covering ALL asset classes — closes the gap where FUTURES/ETF/BOND/
# COMMODITY/PENNY emit picks with no strategy-level perf tracking, and keeps the table
# fresh (addresses the stale-tracker INCIDENT #98). Derived table, full rebuild each run;
# reads at_pick_outcomes, writes only strategy_perf_by_class (no source-table mutation).

name: Strategy Perf By Class Rebuild

on:
  schedule:
    - cron: "22 13 * * *"   # 13:40 UTC daily (after morning resolve/sync)
  workflow_dispatch:

concurrency:
  group: strategy-perf-by-class
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pymysql
      - name: Rebuild per-class strategy tracker
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
        run: |
          python tools/rebuild_strategy_stats_all_classes.py 2>&1 | tee /tmp/rebuild.log
      - name: Export to dashboard JSON
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
        run: |
          python tools/export_strategy_perf_by_class.py 2>&1 | tee /tmp/export.log
      - name: Commit dashboard JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit_dashboard/data/strategy_perf_by_class.json
          if git diff --staged --quiet; then echo "no JSON change"; exit 0; fi
          git commit -m "chore(tracking): refresh strategy_perf_by_class.json [skip ci]"
          # Bounded push via safe_push.sh: every git call is capped at 90s and retried
          # with backoff, so a contended main fails this step instead of hanging past
          # the job's timeout-minutes and silently losing the commit.
          bash .github/scripts/safe_push.sh \
            || echo "::warning::strategy_perf_by_class.json push failed after bounded retries"
      - name: Summary
        if: always()
        run: |
          { echo "## strategy_perf_by_class rebuild + export"; echo '```json'; cat /tmp/rebuild.log /tmp/export.log 2>/dev/null || echo "(no output)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

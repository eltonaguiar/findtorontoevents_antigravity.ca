name: Ops - Authorize gx10 key on the laptop

# Completes the reverse direction (gx10 192.168.2.52 -> laptop 192.168.2.51).
#
# The laptop's port 22 is the Ubuntu sshd inside its WSL distro (banner:
# "SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.20"), reached from Windows through a
# loopback forward. Writing C:\Users\zerou\.ssh\authorized_keys therefore does
# nothing for it: the key must land in the WSL user's ~/.ssh/authorized_keys.
#
# This runs on the laptop's Windows runner and drives `wsl.exe`, so it does not
# have to wait for a WSL runner slot. It writes the key, fixes StrictModes
# permissions and proves sshd accepts it with a localhost login inside WSL.
# Public keys are not secrets, so the key travels as a dispatch input.

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "Public key to authorize on the laptop"
        type: string
        default: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItq2fgOOdjzzLf1ywjJsVbavp3iGOsxJocvnR/deAKX eaguiar2015@gx10->ELTON2026"
      distro:
        description: "WSL distro (blank = WSL default)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ops-install-gx10-pubkey
  cancel-in-progress: false

jobs:
  wsl:
    runs-on: [self-hosted, Windows, laptop-zerou-win]
    timeout-minutes: 20
    steps:
      - name: Report WSL and sshd state
        shell: powershell
        env:
          DISTRO: ${{ inputs.distro }}
        run: |
          $wslArgs = @()
          if ($env:DISTRO) { $wslArgs = @('-d', $env:DISTRO) }
          Write-Host "host     : $env:COMPUTERNAME"
          Write-Host "--- WSL distros ---"
          (wsl.exe -l -v 2>&1 | Out-String) | Write-Host
          Write-Host "--- inside WSL ---"
          & wsl.exe @wslArgs -e bash -lc 'echo user: $(id -un); echo home: $HOME; echo kernel: $(uname -r); echo "--- listeners ---"; ss -ltnp 2>/dev/null | grep -E ":22\b" || echo "nothing on :22"; echo "--- ipv4 ---"; ip -4 -o addr show scope global | awk "{print \$2, \$4}"; echo "--- sshd_config keys ---"; grep -nE "^\s*(AuthorizedKeysFile|PubkeyAuthentication|PasswordAuthentication|AllowUsers|AllowGroups|Match)" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null || echo "(none set)"' 2>&1 | ForEach-Object { Write-Host $_ }
          Write-Host "--- Windows service ssd (expected absent) ---"
          Get-Service sshd -ErrorAction SilentlyContinue | Select-Object Name, Status, StartType | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "--- LAN IPv4 ---"
          Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.IPAddress -like '192.168.*' } | Select-Object IPAddress, InterfaceAlias | Format-Table -AutoSize | Out-String | Write-Host

      - name: Write the key inside WSL and prove sshd accepts it
        shell: powershell
        env:
          PUBKEY: ${{ inputs.pubkey }}
          DISTRO: ${{ inputs.distro }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pub = $env:PUBKEY.Trim()
          if ($pub -notmatch '^ssh-(ed25519|rsa|dss)\s+') { throw 'input pubkey does not look like an SSH public key' }

          # A PowerShell here-string cannot terminate inside a YAML block scalar, so build
          # the bash script line by line instead.
          $lines = @(
            'set -euo pipefail',
            'pub="$PUBKEY"',
            'user="$(id -un)"',
            'home_dir="$HOME"',
            'ak="$home_dir/.ssh/authorized_keys"',
            'echo "target: $user home=$home_dir"',
            'mkdir -p "$home_dir/.ssh"',
            'chmod 700 "$home_dir/.ssh"',
            'touch "$ak"',
            'if grep -Fqx "$pub" "$ak"; then',
            '  echo "key already present in $ak"',
            'else',
            '  printf "%s\n" "$pub" >> "$ak"',
            '  echo "appended key to $ak"',
            'fi',
            'chmod 600 "$ak"',
            'echo "--- fingerprints ---"',
            'ssh-keygen -lf "$ak" || true',
            'echo "--- localhost self-test through sshd ---"',
            'keyfile="$(mktemp)"',
            'printf "%s\n" "$pub" > "$keyfile"',
            'chmod 600 "$keyfile"',
            'if ssh -i "$keyfile" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10 "$user@127.0.0.1" "echo LAPTOP_SSHD_KEY_OK; hostname"; then',
            '  echo "self-test: OK"',
            'else',
            '  echo "self-test: FAILED (key rejected by sshd for $user)"'
            '  tail -25 /var/log/auth.log 2>/dev/null || sudo -n tail -25 /var/log/auth.log 2>/dev/null || echo "(auth.log unreadable)"',
            '  rm -f "$keyfile"',
            '  exit 1',
            'fi'
          )

          $tmpWin = Join-Path $env:TEMP 'install_gx10_key.sh'
          [IO.File]::WriteAllText($tmpWin, (($lines -join "`n") + "`n"))
          Write-Host "wrote $tmpWin"

          $wslArgs = @()
          if ($env:DISTRO) { $wslArgs = @('-d', $env:DISTRO) }
          $wslPath = (& wsl.exe @wslArgs -e wslpath -a ($tmpWin -replace '\\','/')).Trim()
          Write-Host "wsl path: $wslPath"
          if (-not $wslPath) { throw 'could not map the script path into WSL' }

          & wsl.exe @wslArgs -e bash -lc "PUBKEY='$pub' bash '$wslPath'"
          $code = $LASTEXITCODE
          Remove-Item $tmpWin -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "WSL key install failed with exit code $code" }
          Write-Host 'WSL key install finished'

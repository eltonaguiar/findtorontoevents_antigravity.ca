name: Ops - Authorize gx10 key on the laptop

# Completes the reverse direction (gx10 192.168.2.52 -> laptop ELTON2026 192.168.2.51).
# The laptop's sshd is up on TCP 22 but rejects with "Permission denied (publickey)",
# so gx10 needs a key of its own listed on the laptop. The laptop's self-hosted runner
# writes the line, then proves it by ssh-ing into 127.0.0.1 with the same key.
#
# Public keys are not secrets, so the key travels as a dispatch input (default set).
# Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "Public key to authorize on the laptop"
        type: string
        default: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIItq2fgOOdjzzLf1ywjJsVbavp3iGOsxJocvnR/deAKX eaguiar2015@gx10->ELTON2026"
      user:
        description: "Windows account that will be logged into"
        type: string
        default: "zerou"

permissions:
  contents: read

concurrency:
  group: ops-install-gx10-pubkey
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: [self-hosted, Windows, laptop-zerou-win]
    timeout-minutes: 15
    steps:
      - name: Report sshd state
        shell: powershell
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($id)
          Write-Host "host     : $env:COMPUTERNAME"
          Write-Host "runner as: $($id.Name)"
          Write-Host "elevated : $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          Write-Host "--- sshd service ---"
          Get-Service sshd -ErrorAction SilentlyContinue | Select-Object Name, Status, StartType | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "--- listening :22 ---"
          Get-NetTCPConnection -LocalPort 22 -State Listen -ErrorAction SilentlyContinue | Select-Object LocalAddress, LocalPort, OwningProcess | Format-Table -AutoSize | Out-String | Write-Host
          $cfg = "$env:ProgramData\ssh\sshd_config"
          Write-Host "--- $cfg (effective key lines) ---"
          if (Test-Path $cfg) {
            Get-Content $cfg | Where-Object { $_ -match '^\s*(AuthorizedKeysFile|PubkeyAuthentication|PasswordAuthentication|Match|AllowUsers|AllowGroups|StrictModes)' } | ForEach-Object { Write-Host $_ }
          } else { Write-Host "no sshd_config at $cfg" }
          $adminFile = "$env:ProgramData\ssh\administrators_authorized_keys"
          Write-Host "admin file exists: $(Test-Path $adminFile)"
          Write-Host "--- LAN IPv4 of this machine ---"
          Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object { $_.IPAddress -like '192.168.*' } |
            Select-Object IPAddress, InterfaceAlias | Format-Table -AutoSize | Out-String | Write-Host
          $isAdminGroup = ([Security.Principal.WindowsPrincipal]$principal).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "note: Windows sshd ignores the per-user file for Administrators-group logins"

      - name: Write the key, then prove it locally
        shell: powershell
        env:
          PUBKEY: ${{ inputs.pubkey }}
          TARGET_USER: ${{ inputs.user }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pub = $env:PUBKEY.Trim()
          if ($pub -notmatch '^ssh-(ed25519|rsa|dss)\s+') { throw "input pubkey does not look like an SSH public key" }

          $dir = Join-Path $env:USERPROFILE '.ssh'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $ak = Join-Path $dir 'authorized_keys'
          $existing = if (Test-Path $ak) { Get-Content $ak } else { @() }
          if ($existing -contains $pub) {
            Write-Host "key already present in $ak"
          } else {
            ($existing + $pub) | Set-Content -Path $ak -Encoding ascii
            Write-Host "appended key to $ak"
          }
          icacls $ak /inheritance:r /grant:r "$($env:USERNAME):F" /grant:r "SYSTEM:F" | Out-Null

          $adminFile = "$env:ProgramData\ssh\administrators_authorized_keys"
          try {
            $admExisting = if (Test-Path $adminFile) { Get-Content $adminFile } else { @() }
            if ($admExisting -notcontains $pub) {
              ($admExisting + $pub) | Set-Content -Path $adminFile -Encoding ascii
              Write-Host "appended key to $adminFile"
            } else { Write-Host "key already present in $adminFile" }
            icacls $adminFile /inheritance:r /grant:r "Administrators:F" /grant:r "SYSTEM:F" | Out-Null
            Write-Host "admin-file write: ok"
          } catch {
            Write-Host "admin-file write: DENIED (needs an elevated shell) -> $($_.Exception.Message)"
          }

          Write-Host "--- authorized_keys fingerprints ---"
          Get-Content $ak | Where-Object { $_ -match '\S' } | ForEach-Object {
            $tmp = Join-Path $env:TEMP ("ak_" + [guid]::NewGuid().ToString('N') + ".pub")
            Set-Content -Path $tmp -Value $_ -Encoding ascii
            $fp = (ssh-keygen -lf $tmp) -join ''
            Remove-Item $tmp -Force
            Write-Host "  $fp"
          }

          $ssh = (Get-Command ssh.exe -ErrorAction SilentlyContinue).Source
          if (-not $ssh) { $ssh = "$env:SystemRoot\System32\OpenSSH\ssh.exe" }
          Write-Host "--- local self-test via sshd ---"
          & $ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10 "$($env:TARGET_USER)@127.0.0.1" "echo LAPTOP_SSHD_KEY_OK"
          Write-Host "self-test exit code: $LASTEXITCODE"

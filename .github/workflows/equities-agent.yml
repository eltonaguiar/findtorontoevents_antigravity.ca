name: Equities & Stocks Agent

on:
  schedule:
    # Twice daily on weekdays — pre-market (13:00 UTC = 09:00 ET) and close (21:00 UTC = 17:00 ET)
    - cron: '0 13 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable verbose debug output'
        type: boolean
        required: false
        default: false

concurrency:
  group: equities-agent
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  equities-scan:
    name: Equities & Stocks Scanner
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          update-environment: false

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run Equities & Stocks scanner
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: '1'
          DEBUG: ${{ inputs.debug }}
        run: |
          python - <<'EOF'
          import sys, json, os
          from pathlib import Path

          sys.path.insert(0, str(Path("alpha_engine").resolve()))

          import pandas as pd
          import yfinance as yf

          from config import EQUITY_SYMBOLS
          from equity_strategies import (
              momentum_factor_12m, penny_volume_breakout, meme_social_velocity,
              quality_value_composite, intermarket_risk_on, support_resistance_bounce,
              connors_rsi2_scanner, triple_rsi_scanner, vix_spike_reversal_scanner,
              turn_of_month_scanner, gap_reversal_tech_stocks, earnings_gap_reversal_scanner,
          )
          from elite_scorer import compute_elite_score

          # ── fetch data ────────────────────────────────────────────────────
          print(f"Fetching data for {len(EQUITY_SYMBOLS)} equity symbols + ^VIX + SPY...")
          data = {}
          all_syms = list(EQUITY_SYMBOLS.keys()) + ["^VIX"]
          for sym in all_syms:
              try:
                  df = yf.Ticker(sym).history(period="1y")
                  if not df.empty:
                      data[sym] = df
              except Exception as e:
                  print(f"  WARN fetch failed {sym}: {e}")
          print(f"  Loaded {len(data)} symbols")

          # ── run strategies ────────────────────────────────────────────────
          picks = []
          strategy_fns = [
              momentum_factor_12m, penny_volume_breakout, meme_social_velocity,
              quality_value_composite, intermarket_risk_on, support_resistance_bounce,
              connors_rsi2_scanner, triple_rsi_scanner, vix_spike_reversal_scanner,
              turn_of_month_scanner, gap_reversal_tech_stocks, earnings_gap_reversal_scanner,
          ]
          for fn in strategy_fns:
              try:
                  picks += fn(data)
              except Exception as e:
                  print(f"  WARN strategy {fn.__name__} failed: {e}")

          # ── score ─────────────────────────────────────────────────────────
          for p in picks:
              p.update(compute_elite_score(p))

          # ── curate ────────────────────────────────────────────────────────
          quality = sorted(
              [p for p in picks if float(p.get("confidence", 0) or 0) >= 0.55
               and float(p.get("risk_reward", 0) or 0) >= 1.20
               and float(p.get("elite_score", 0) or 0) >= 55],
              key=lambda p: (p.get("elite_score", 0), p.get("confidence", 0)),
              reverse=True,
          )

          # ── fail-open guard: distinguish data-fetch failure from real-empty market ──
          _loaded = len(data)
          _requested = max(1, len(all_syms))
          _ratio = _loaded / _requested
          if _ratio < 0.5:
              _status = "DATA_FAIL"
          elif len(picks) == 0:
              _status = "EMPTY"
          else:
              _status = "OK"

          out = {
              "agent": "equities",
              "timestamp": pd.Timestamp.now().isoformat(),
              "total_raw": len(picks),
              "quality": len(quality),
              "status": _status,
              "symbols_tracked": len(EQUITY_SYMBOLS),
              "strategies_run": len(strategy_fns),
              "picks": quality,
          }
          Path("non_crypto_agent/data").mkdir(parents=True, exist_ok=True)
          Path("non_crypto_agent/data/equities_picks.json").write_text(
              json.dumps(out, indent=2, default=str)
          )
          print(f"Equities agent: {len(quality)} quality picks from {len(picks)} raw")
          for p in quality[:5]:
              print(f"  {p['symbol']} {p.get('signal_type','?')} conf={p.get('confidence',0):.2f} elite={p.get('elite_score',0):.0f} strategy={p.get('strategy','?')}")

          # Emit summary for CI log
          print(f"\n=== EQUITY AGENT SUMMARY ===")
          print(f"Symbols tracked : {len(EQUITY_SYMBOLS)}")
          print(f"Raw picks       : {len(picks)}")
          print(f"Quality picks   : {len(quality)}")

          # ── enforce fail-open guard ───────────────────────────────────────
          if _status == "DATA_FAIL":
              print(f"::error::DATA FETCH FAILURE — only {_loaded}/{_requested} symbols loaded "
                    f"(yfinance empty/delisted); refusing to exit green on missing data")
              sys.exit(1)
          elif _status == "EMPTY":
              print(f"::warning::0 raw picks on healthy data ({_loaded}/{_requested} symbols loaded) "
                    f"— real-empty market, not a data failure")
          EOF

      - name: Commit results
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add non_crypto_agent/data/equities_picks.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Equities agent: $(date -u '+%Y-%m-%d %H:%M') UTC scan [skip ci]"
          git remote set-url origin "https://x-access-token:${TOKEN_FOR_PUSH}@github.com/${GITHUB_REPOSITORY}.git"
          bash .github/scripts/safe_push.sh

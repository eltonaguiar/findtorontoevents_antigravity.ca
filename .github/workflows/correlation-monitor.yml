name: Cross-Asset Correlation Monitor

on:
  schedule:
    # Every 6 hours
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: correlation-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  correlation-monitor:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Run correlation monitor
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python alpha_engine/correlation_monitor.py

      - name: Commit correlation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/correlation_report.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update correlation report $(date -u +%Y-%m-%d\ %H:%M) UTC [skip ci]"
            git pull --rebase origin main
            bash .github/scripts/safe_push.sh
          fi


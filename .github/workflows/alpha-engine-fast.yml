name: ALPHA ENGINE FAST Tighter TP/SL, Shorter Holds

on:
  schedule:
    - cron: '3,33 * * * *' # Every 30 min catch entries before gap widens
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-engine-fast
  cancel-in-progress: false  # was true — 100% cancellation rate (25min runs on 30min cron)

jobs:
  alpha-fast:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 60  # 25->40->60 (2026-11-16: 40m+ runtime drift vs 40m cap = chronic-kill risk)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1
          # 2026-11-23: 'tools' and 'audit_trail' were MISSING from this list, so the
          # runner had no such directories on disk. That is why the log carried
          #   [PROVENANCE] skipped (non-fatal): No module named 'provenance_ledger'
          #   [SHADOW]     skipped (non-fatal): No module named 'audit_trail'
          # Both modules exist and are tracked; sparse-checkout simply never fetched
          # them. PYTHONPATH already pointed at the workspace -- the files were absent.
          # One cause, two symptoms. reports/provenance is added so the ledger dir
          # exists and git can stage the file the scan writes.
          sparse-checkout: |
            .github
            alpha_engine
            shared
            tools
            audit_trail
            reports/provenance
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: true
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy scikit-learn joblib requests

      - name: Run Alpha Engine FAST variant
        env:
          PYTHONPATH: ${{ github.workspace }}
          ALPHA_FAST_MODE: "1"
          ALPHA_CONFLUENCE: "1"
          ALPHA_TOURNAMENT: "1"
          ALPHA_MIN_FAMILIES: "2"
          HF_GATE_EQUITY_BANNED_SOURCES: 'stocks_competition,fast_stocks_competition,multi_asset_institutional,kimi_signal_tracking,ml_bg_system_f'
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_STOCKS_PASSWORD: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD || secrets.DB_STOCKS_PASSWORD }}
        run: |
          echo "============================================"
          echo " ALPHA ENGINE FAST Tight TP/SL Variant"
          echo " 50% tighter TP/SL, 50% shorter holds"
          echo " $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          # Tee the log so a later step can assert the provenance emit actually ran.
          python alpha_engine/production_scanner.py 2>&1 | tee "$RUNNER_TEMP/scan.log"

      - name: Provenance must not be silently skipped
        run: |
          LOG="$RUNNER_TEMP/scan.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::scanner log missing -- cannot verify provenance"
            exit 1
          fi
          if grep -q '\[PROVENANCE\] skipped' "$LOG"; then
            echo "::error::provenance emit was SKIPPED. The non-fatal handler hid it and the job would have reported green. The ledger is NOT being written."
            grep '\[PROVENANCE\]' "$LOG" || true
            exit 1
          fi
          line=$(grep -oE '\[PROVENANCE\] recorded [0-9]+ pick' "$LOG" | tail -1 || true)
          if [ -z "$line" ]; then
            echo "::warning::no provenance emit line found in the scanner log"
          else
            echo "provenance: $line"
          fi

      - name: Commit fast variant data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alpha_engine/data/active_picks_fast.json alpha_engine/data/closed_picks_fast.json 2>/dev/null || true
          # The provenance ledger must reach main or T3 can never pass. It was never
          # staged here, so even a successful emit died in the runner's filesystem.
          git add -f reports/provenance/picks_provenance.jsonl 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Alpha Engine FAST: $(date -u '+%Y-%m-%d %H:%M') [AUTO] [skip ci]"

      - name: Push with retry
        run: |
          push_ok=false
          for i in 1 2 3 4 5; do
            if bash .github/scripts/safe_push.sh; then
              echo "Push succeeded on attempt $i"
              push_ok=true
              break
            fi
            if [ "$i" -lt 5 ]; then
              delay=$((i * 5))
              echo "Push attempt $i failed, retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          if [ "$push_ok" = false ]; then
            echo "ERROR: all push attempts failed"
            exit 1
          fi


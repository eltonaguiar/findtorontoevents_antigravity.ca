# Daily price refresh - keeps daily_prices table current after market close
# Calls fetch_prices.php repeatedly to update all stock tickers
name: Daily Price Refresh

on:
  schedule:
    - cron: '0 22 * * 1-5'   # Mon-Fri at 22:00 UTC (5 PM EST, after market close)
    - cron: '0 2 * * 2-6'    # Tue-Sat at 02:00 UTC (catch late Yahoo Finance updates)
  workflow_dispatch:            # Manual trigger

jobs:
  refresh-prices:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Refresh all stock tickers via fetch_prices.php
        run: |
          ENDPOINT="https://findtorontoevents.ca/findstocks/portfolio2/api/fetch_prices.php"
          MAX_BATCHES=15
          for i in $(seq 1 $MAX_BATCHES); do
            echo "=== Batch $i ==="
            # UNMASK (2026-06-19): capture HTTP status. A dead endpoint (404) previously parsed to
            # fetched=0 and was reported as "All tickers up to date" -> silent green froze daily_prices
            # for ~7 weeks (since 2026-04-29). Distinguish endpoint-broken from genuinely-up-to-date.
            HTTP=$(curl -s -o /tmp/fp_resp.json -w '%{http_code}' --max-time 60 "$ENDPOINT" 2>/dev/null || echo "000")
            if [ "$HTTP" != "200" ]; then
              echo "::error::fetch_prices.php returned HTTP $HTTP (expected 200) — daily_prices ingest is BROKEN, not 'up to date'. Endpoint: $ENDPOINT"
              exit 1
            fi
            RESULT=$(cat /tmp/fp_resp.json)
            FETCHED=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('fetched',0))" 2>/dev/null)
            if [ -z "$FETCHED" ]; then
              echo "::error::fetch_prices.php returned HTTP 200 but a non-JSON/unparseable body — ingest BROKEN"
              exit 1
            fi
            MSG=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); tickers=[t['ticker'] for t in d.get('tickers',[])]; print(','.join(tickers[:5]) if tickers else d.get('message','done'))" 2>/dev/null || echo "")
            echo "fetched=$FETCHED | $MSG"
            if [ "$FETCHED" = "0" ]; then
              echo "All tickers up to date - done"
              break
            fi
            sleep 5
          done
          echo "Price refresh complete"

      - name: Verify latest prices
        run: |
          echo "Checking latest price dates in competition.php..."
          curl -s "https://findtorontoevents.ca/findstocks/kimis_claw/api/competition.php" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          dates = set()
          for a in d.get('algorithms', []):
              for p in a.get('picks', []):
                  if p.get('priceDate'):
                      dates.add(p['priceDate'])
          print('Price dates in DB:', sorted(dates, reverse=True)[:5])
          print('Algorithms tracked:', d.get('dataInfo', {}).get('algorithms', 0))
          " 2>/dev/null || echo "Verification check skipped"



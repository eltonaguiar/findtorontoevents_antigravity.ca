name: schema probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read at_signal_outcomes schema and cohort state
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD || secrets.AUDIT_DB_PASS }}
        run: |
          pip install --quiet pymysql
          python - <<'PY'
          import os, pymysql
          c = pymysql.connect(host="mysql.50webs.com", user="ejaguiar1_stocks",
                              password=os.environ["MYSQL_PASSWORD"], database="ejaguiar1_stocks",
                              port=3306, charset="utf8mb4")
          cur = c.cursor()
          cur.execute("""SELECT COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE, COLUMN_KEY
                         FROM information_schema.COLUMNS
                         WHERE TABLE_SCHEMA='ejaguiar1_stocks' AND TABLE_NAME='at_signal_outcomes'
                         ORDER BY ORDINAL_POSITION""")
          print("=== at_signal_outcomes columns ===")
          for r in cur.fetchall():
              print("  %-26s %-22s null=%-3s key=%s" % r)
          cur.execute("""SELECT INDEX_NAME, GROUP_CONCAT(COLUMN_NAME ORDER BY SEQ_IN_INDEX), NON_UNIQUE
                         FROM information_schema.STATISTICS
                         WHERE TABLE_SCHEMA='ejaguiar1_stocks' AND TABLE_NAME='at_signal_outcomes'
                         GROUP BY INDEX_NAME, NON_UNIQUE""")
          print("=== indexes ===")
          for r in cur.fetchall():
              print("  %-22s (%s) unique=%s" % (r[0], r[1], "NO" if r[2] else "YES"))
          cur.execute("SELECT COUNT(*) FROM at_signal_outcomes")
          print("total rows:", cur.fetchone()[0])
          cur.execute("""SELECT strategy_name, COUNT(*) n, MIN(entry_time), MAX(entry_time)
                         FROM at_signal_outcomes GROUP BY strategy_name ORDER BY n DESC LIMIT 8""")
          print("=== by strategy ===")
          for r in cur.fetchall():
              print("  %-34s n=%-6s %s .. %s" % r)
          c.close()
          PY

name: Live Trading Bot

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no real trades)'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  trade:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT || github.token }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        update-environment: false
        python-version: '3.11'
        
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run trading bot
      env:
        # Add your API keys here as GitHub Secrets
        BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
        BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
        DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      run: |
        python live_trading_bot.py
        
    - name: Upload trading results
      uses: actions/upload-artifact@v4
      with:
        name: trading-results-${{ github.run_id }}
        path: |
          trading_results.json
          trading_bot.log
        retention-days: 30
        
    - name: Commit results to repo
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
        TOKEN_FOR_PUSH: ${{ secrets.GH_PAT }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Stage all tracked edits from the bot (avoids unstaged changes blocking pull inside safe_push)
        git add -u
        git add trading_results.json trading_bot.log 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update trading results - $(date -u +%Y-%m-%d_%H:%M) [skip ci]"
        fi
        bash .github/scripts/safe_push.sh


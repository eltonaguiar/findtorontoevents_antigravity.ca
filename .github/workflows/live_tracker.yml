name: Live Picks Tracker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'alpha_engine/live_dashboard.html'
      - '.github/workflows/live_tracker.yml'
  schedule:
    - cron: '24 * * * *'  # Every hour at :25

permissions:
  contents: write
  # pages: write / id-token: write removed 2026-11-25: this workflow no longer
  # publishes Pages. deploy-riseoftheclaw.yml is the only Pages publisher.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        update-environment: true
        python-version: '3.11'
        
    - name: Install dependencies
      run: pip install pandas numpy
      
    - name: Sync live picks
      run: python live_picks_tracker.py
      
    - name: Update dashboard
      run: |
        python dashboard/generate_dashboard.py
        # Override with the comprehensive live_dashboard.html
        if [ -f alpha_engine/live_dashboard.html ]; then
          cp alpha_engine/live_dashboard.html dashboard/index.html
          echo " Deployed comprehensive Alpha Engine dashboard"
        fi
        
    - name: Commit dashboard
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        git add dashboard/
        # data/live_picks.db intentionally NOT tracked — listed in scrub policy
        # (docs/GIT_HISTORY_REWRITE_2026-05-25.md). Regenerated per run by
        # live_picks_tracker.py; dashboard reads from generated dashboard/ output.
        git diff --staged --quiet && echo "No changes to commit" && exit 0
        git commit -m "Live picks update: $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
        for i in 1 2 3; do
          git pull --rebase origin main || true
          bash .github/scripts/safe_push.sh && break
          echo "Push attempt $i failed, retrying in 5s..."
          sleep 5
        done
        
    # The peaceiris gh-pages publish and its BESTIEJOB staging step were REMOVED
    # on 2026-11-25. Pages serves workflow artifacts from
    # deploy-riseoftheclaw.yml, not the gh-pages branch, so every hourly green run
    # here was publishing a 191 KB dashboard to a branch nothing reads
    # (/dashboard, /live_picks.json and /bestiejob all 404ed while existing in
    # the branch). dashboard/ and docs/bestiejob are now copied into _site by
    # deploy-riseoftheclaw.yml. The 'Commit dashboard' step above stays: it is
    # what that workflow reads.


name: Deploy MOVIESHOWS2 + MOVIESHOWS3 (All 3 Domains)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      #  findtorontoevents.ca (50webs) 
      - name: Deploy to findtorontoevents.ca (50webs FTP)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 -c "
          import ftplib, os, sys

          host = os.environ.get('FTP_HOST', '')
          user = os.environ.get('FTP_USER', '')
          pw   = os.environ.get('FTP_PASS', '')
          if not all([host, user, pw]):
              print('Missing FTP credentials'); sys.exit(1)

          files = [
              # MOVIESHOWS (MS1  upgrade toast)
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS/.htaccess',              'findtorontoevents.ca/MOVIESHOWS',      '.htaccess'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS/index.php',              'findtorontoevents.ca/MOVIESHOWS',      'index.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS/ms1-upgrade-toast.js',   'findtorontoevents.ca/MOVIESHOWS',      'ms1-upgrade-toast.js'),
              # MOVIESHOWS2
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/.htaccess',             'findtorontoevents.ca/MOVIESHOWS2',     '.htaccess'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/app.html',              'findtorontoevents.ca/MOVIESHOWS2',     'app.html'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/index.html',            'findtorontoevents.ca/MOVIESHOWS2',     'index.html'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/script.js',             'findtorontoevents.ca/MOVIESHOWS2',     'script.js'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/db-connector.js',       'findtorontoevents.ca/MOVIESHOWS2',     'db-connector.js'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/ui-minimal.js',         'findtorontoevents.ca/MOVIESHOWS2',     'ui-minimal.js'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/features.js',           'findtorontoevents.ca/MOVIESHOWS2',     'features.js'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/scroll-fix.js',         'findtorontoevents.ca/MOVIESHOWS2',     'scroll-fix.js'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/ui-cleanup.js',         'findtorontoevents.ca/MOVIESHOWS2',     'ui-cleanup.js'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/styles.css',            'findtorontoevents.ca/MOVIESHOWS2',     'styles.css'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/motivation.js',          'findtorontoevents.ca/MOVIESHOWS2',     'motivation.js'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/freestyle.js',           'findtorontoevents.ca/MOVIESHOWS2',     'freestyle.js'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/categories.js',          'findtorontoevents.ca/MOVIESHOWS2',     'categories.js'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/ms2-enhancer.js',       'findtorontoevents.ca/MOVIESHOWS2',     'ms2-enhancer.js'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/api/.htaccess',         'findtorontoevents.ca/MOVIESHOWS2/api', '.htaccess'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/api/movies.php',        'findtorontoevents.ca/MOVIESHOWS2/api', 'movies.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/api/get-movies.php',    'findtorontoevents.ca/MOVIESHOWS2/api', 'get-movies.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/api/db-config.php',     'findtorontoevents.ca/MOVIESHOWS2/api', 'db-config.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/api/freestyle-search.php', 'findtorontoevents.ca/MOVIESHOWS2/api', 'freestyle-search.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS2/api/test-db.php',     'findtorontoevents.ca/MOVIESHOWS2/api', 'test-db.php'),
              # MOVIESHOWS3
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS3/index.html',            'findtorontoevents.ca/MOVIESHOWS3',     'index.html'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS3/.htaccess',             'findtorontoevents.ca/MOVIESHOWS3',     '.htaccess'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS3/api/get-movies.php',    'findtorontoevents.ca/MOVIESHOWS3/api', 'get-movies.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS3/api/check-session.php', 'findtorontoevents.ca/MOVIESHOWS3/api', 'check-session.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS3/api/.htaccess',         'findtorontoevents.ca/MOVIESHOWS3/api', '.htaccess'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS3/api/db-config.php',     'findtorontoevents.ca/MOVIESHOWS3/api', 'db-config.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS3/api/test-db.php',       'findtorontoevents.ca/MOVIESHOWS3/api', 'test-db.php'),
              ('TORONTOEVENTS_ANTIGRAVITY/MOVIESHOWS3/api/freestyle-search.php', 'findtorontoevents.ca/MOVIESHOWS3/api', 'freestyle-search.php'),
          ]
          print(f'Connecting to {host} (findtorontoevents.ca)...')
          ftp = ftplib.FTP(host)
          ftp.login(user, pw)
          for local, remote_dir, fname in files:
              ftp.cwd('/')
              for part in remote_dir.split('/'):
                  try: ftp.cwd(part)
                  except: ftp.mkd(part); ftp.cwd(part)
              with open(local, 'rb') as f:
                  ftp.storbinary('STOR ' + fname, f)
              print(f'   {fname}  findtorontoevents.ca/{remote_dir.split(\"/\",1)[1] if \"/\" in remote_dir else remote_dir}')
          ftp.quit()
          print(' findtorontoevents.ca deploy complete')
          "


      #  Verify all 6 endpoints 
      - name: Verify all sites respond
        run: |
          echo " Checking all endpoints..."
          FAIL=0
          for URL in \
            "https://findtorontoevents.ca/MOVIESHOWS2/" \
            "https://findtorontoevents.ca/MOVIESHOWS3/" \
            "https://tdotevent.ca/MOVIESHOWS2/" \
            "https://tdotevent.ca/MOVIESHOWS3/" \
            "https://torontoevent.net/MOVIESHOWS2/" \
            "https://torontoevent.net/MOVIESHOWS3/"; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "   $URL  HTTP $STATUS"
            else
              echo "   $URL  HTTP $STATUS"
              FAIL=1
            fi
          done

          echo ""
          echo " Checking API endpoints..."
          for URL in \
            "https://findtorontoevents.ca/MOVIESHOWS2/api/movies.php?action=stats" \
            "https://findtorontoevents.ca/MOVIESHOWS3/api/get-movies.php" \
            "https://findtorontoevents.ca/MOVIESHOWS3/api/test-db.php" \
            "https://torontoevent.net/MOVIESHOWS2/api/test-db.php"; do
            BODY=$(curl -s --max-time 15 "$URL" 2>/dev/null | head -c 200)
            echo "  $URL  $BODY"
          done

          if [ "$FAIL" -eq 1 ]; then
            echo " Some endpoints returned non-200 status"
          else
            echo " All endpoints healthy"
          fi


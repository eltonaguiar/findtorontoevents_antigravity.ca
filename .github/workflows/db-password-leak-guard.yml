name: DB Password Leak Guard

# Blocks PRs from introducing NEW hardcoded `stocks1234560` (and the other
# legacy DB passwords) into .py / .sh / .yml files. INCIDENT_OVERALL #89
# (P0 OPEN) tracks the live leak across 26 .py files on main — this guard
# is the forward-fence so that backlog stops growing while the operator
# does the scrub+rotate.

on:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "**.sh"
      - "**.yml"
      - "**.yaml"

permissions:
  contents: read

jobs:
  scan-new-additions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against base + grep added lines
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          echo "Scanning additions between $BASE and $HEAD ..."

          # `git diff --diff-filter=AM` covers Added + Modified.
          # We grep only ADDED lines (prefix "+", excluding the "+++ " header).
          # That way pre-existing leaks don't trip the gate — only NEW ones do.
          PATTERNS='(stocks1234560|backtests1234560|sportsbet1234560|favcreators1234560|events1234560|memecoin1234560|news1234560|tvmoviestrailers1234560|deals1234560)'

          DIFF=$(git diff "$BASE..$HEAD" -- '*.py' '*.sh' '*.yml' '*.yaml')
          ADDED=$(printf '%s\n' "$DIFF" | grep -E '^\+[^+]' || true)

          HITS=$(printf '%s\n' "$ADDED" | grep -E "$PATTERNS" || true)
          if [ -n "$HITS" ]; then
            echo "::error::This PR introduces hardcoded DB password literal(s)."
            echo "::error::Use os.environ['DB_PASS_STOCKS'] / GitHub Secrets instead."
            echo
            echo "Offending added lines:"
            printf '%s\n' "$HITS" | head -40
            echo
            echo "See INCIDENT_OVERALL #89 + docs/DB_CREDENTIALS_MIGRATION_2026-06-02.md"
            exit 1
          fi
          echo "OK — no new hardcoded DB password literals."

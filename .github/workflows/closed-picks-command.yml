name: Closed Picks Command

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to look back'
        required: false
        default: '30'
        type: string

env:
  PYTHONUNBUFFERED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  send-closed-picks:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          update-environment: true
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          # closed_picks_command imports numpy (via the aggregator) but this step only
          # installed requests, so run #6 failed with "No module named 'numpy'".
          pip install requests numpy pandas
      
      - name: Send Closed Picks Summary
        env:
          DISCORD_MASTER_PICKS: ${{ secrets.DISCORD_MASTER_PICKS }}
        run: |
          # Run as a module: the script imports its own package, and executing it as a
          # file puts only signal_aggregator/ on sys.path -> "No module named 'signal_aggregator'".
          PYTHONPATH=. python -m signal_aggregator.closed_picks_command ${{ github.event.inputs.days || '30' }}
      
      - name: Log result
        if: always()
        run: |
          echo "Closed picks command completed at $(date -u +"%Y-%m-%d %H:%M UTC")"


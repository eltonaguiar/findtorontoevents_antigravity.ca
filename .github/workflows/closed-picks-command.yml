name: Closed Picks Command

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to look back'
        required: false
        default: '30'
        type: string

env:
  PYTHONUNBUFFERED: 1

jobs:
  send-closed-picks:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Send Closed Picks Summary
        env:
          DISCORD_MASTER_PICKS: ${{ secrets.DISCORD_MASTER_PICKS }}
        run: |
          python signal_aggregator/closed_picks_command.py ${{ github.event.inputs.days || '30' }}
      
      - name: Log result
        if: always()
        run: |
          echo "Closed picks command completed at $(date -u +"%Y-%m-%d %H:%M UTC")"


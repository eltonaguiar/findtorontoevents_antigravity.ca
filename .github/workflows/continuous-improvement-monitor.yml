name: Continuous Improvement Monitor

on:
  schedule:
    - cron: '36 */2 * * *'  # Staggered far from :00 mega-cluster (30+ workflows)
  workflow_dispatch:

concurrency:
  group: continuous-improvement-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'
          cache: 'pip'

      # alpha_engine/__init__.py imports decay_tracker -> numpy required even with
      # `--skip-live-benchmark` (2026-05-04: gh run ModuleNotFoundError: numpy).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy requests

      - name: Run Continuous Improvement Monitor
        run: |
          echo "============================================"
          echo "  Continuous Improvement Monitor"
          echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
          python -m alpha_engine.continuous_improvement_monitor --skip-live-benchmark

      - name: Commit report files
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          bash .github/scripts/safe_commit_push.sh \
            "Auto-update continuous improvement report $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]" \
            alpha_engine/data/continuous_improvement_report.json \
            alpha_engine/data/continuous_improvement_report.md \
            alpha_engine/data/continuous_improvement_history.json

      - name: Print summary
        if: always()
        run: |
          if [ -f alpha_engine/data/continuous_improvement_report.md ]; then
            echo ""
            cat alpha_engine/data/continuous_improvement_report.md
          else
            echo "No report generated"
          fi


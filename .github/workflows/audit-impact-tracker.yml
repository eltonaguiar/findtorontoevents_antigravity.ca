name: Audit Impact Tracker

on:
  schedule:
    - cron: '32 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-impact:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: true
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance scipy numpy

      - name: Run audit impact tracker
        run: python battleground/audit_impact_tracker.py

      - name: Run alpha vs beta benchmark
        run: python battleground/alpha_vs_beta_benchmark.py

      - name: Commit results
        if: always()
        timeout-minutes: 5
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add battleground/data/audit_baseline_20260313.json 2>/dev/null || true
          git add battleground/data/audit_impact_results.json 2>/dev/null || true
          git add battleground/data/alpha_benchmark_report.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          bash .github/scripts/assert_no_conflict_markers.sh || exit 1
          git commit -m "Audit impact tracker update $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git remote set-url origin "https://x-access-token:${TOKEN_FOR_PUSH}@github.com/${GITHUB_REPOSITORY}.git"
          for i in 1 2 3; do
            if bash .github/scripts/safe_push.sh; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "::error::Failed to push audit impact tracker results after 3 attempts"
          exit 1


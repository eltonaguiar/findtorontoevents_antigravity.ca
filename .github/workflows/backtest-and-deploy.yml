name: Run Backtests & Deploy Dashboards

on:
  schedule:
    - cron: '0 6 * * *'           # Daily backtest at 6 AM UTC
    - cron: '0 14,16,18,20 * * 1-5'  # Every 2 hours during US market hours (reduced from */15 to ease queue pressure)
    - cron: '0 */4 * * 0,6'       # Every 4 hours on weekends (crypto only)
  # Run on push when strategy code changes
  push:
    branches: [main]
    paths:
      - 'KIMI_CLAW_RESEARCH_FEB162026/strategies_tier1.py'
      - 'KIMI_CLAW_RESEARCH_FEB162026/backtest_framework.py'
      - 'KIMI_CLAW_RESEARCH_FEB162026/generate_dashboard_data.py'
      - 'KIMI_CLAW_RESEARCH_FEB162026/run_tier1_backtest.py'
      - 'KIMI_CLAW_RESEARCH_FEB162026/index.html'
      - 'KIMI_CLAW_RESEARCH_FEB162026/css/**'
      - 'KIMI_CLAW_RESEARCH_FEB162026/js/**'
      - 'KIMI_RISEOFTHECLAW/index.html'
      - 'KIMI_RISEOFTHECLAW/js/**'
      - 'KIMI_RISEOFTHECLAW/css/**'
      - 'KIMI_RISEOFTHECLAW/live_scanner.py'
      - 'updates/index.html'
      - '.github/workflows/backtest-and-deploy.yml'
  # Allow manual trigger
  workflow_dispatch:

# issue #141: serialize auto-commit workflows so concurrent runs cannot race
# each other into the main branch and produce conflict markers in data files.
concurrency:
  group: auto-commit-main-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Fix broken submodule entry
        run: |
          git rm --cached tmp/fte_clone 2>/dev/null || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          update-environment: false
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy "ccxt>=4.3.80,<4.4" requests statsmodels scikit-learn joblib

      - name: Run Tier 1 backtests
        if: github.event.schedule == '0 6 * * *' || github.event_name != 'schedule'
        working-directory: KIMI_CLAW_RESEARCH_FEB162026
        run: |
          echo " Running Tier 1 strategy backtests..."
          python generate_dashboard_data.py

      - name: Run live market scanner
        working-directory: KIMI_RISEOFTHECLAW
        run: |
          echo " Running live market scanner..."
          python live_scanner.py

      - name: Commit updated results
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add KIMI_CLAW_RESEARCH_FEB162026/backtest_results/ KIMI_CLAW_RESEARCH_FEB162026/data/ KIMI_RISEOFTHECLAW/data/
          git reset HEAD -- '*.db'  # Exclude .db files (kimi_trading.db exceeds 100MB GitHub limit)
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            # issue #141: block conflict-marker commits
            bash .github/scripts/assert_no_conflict_markers.sh || exit 1
            git commit -m "data: Auto-update backtest results $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git remote set-url origin "https://x-access-token:${TOKEN_FOR_PUSH}@github.com/${GITHUB_REPOSITORY}.git"
            for i in 1 2 3; do
              # Stash unstaged .db changes so git pull --rebase can proceed
              git stash --include-untracked 2>/dev/null || true
              bash .github/scripts/safe_push.sh && break
              git stash pop 2>/dev/null || true
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      - name: Deploy dashboard to FTP
        env:
          FTP_HOST: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          FTP_USER: ${{ secrets.FTPGODADDYUSER }}
          FTP_PASS: ${{ secrets.FTPGODADDYPASS }}
        run: |
          python - <<'PYEOF'
          import ftplib, os, json
          from pathlib import Path

          host = os.environ.get("FTP_HOST", os.environ.get("FTP_SERVER", ""))
          user = os.environ.get("FTP_USER", "")
          pwd  = os.environ.get("FTP_PASS", "")

          if not all([host, user, pwd]):
              print("  FTP credentials not set, skipping deploy")
              exit(0)

          SRC = Path("KIMI_CLAW_RESEARCH_FEB162026")
          # torontoevent.net FTP root IS the document root  no subdirectory prefix
          REMOTE_BASE = os.environ.get("FTP_REMOTE_BASE", "")

          print(f" Connecting to {host}...")
          ftp = ftplib.FTP(host)
          ftp.login(user, pwd)
          print(" Connected")

          def ensure_dir(ftp, remote_dir):
              ftp.cwd("/")
              for part in remote_dir.split("/"):
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except:
                      try:
                          ftp.mkd(part)
                          ftp.cwd(part)
                      except Exception as e:
                          print(f"   mkd {part}: {e}")
                          return False
              return True

          def upload(ftp, local_path, remote_path):
              remote_dir = "/".join(remote_path.split("/")[:-1])
              remote_name = remote_path.split("/")[-1]
              if remote_dir:
                  ensure_dir(ftp, remote_dir)
              else:
                  ftp.cwd("/")
              with open(local_path, "rb") as f:
                  ftp.storbinary(f"STOR {remote_name}", f)
              print(f"   {remote_path}")

          def rpath(*parts):
              segments = ([REMOTE_BASE] + list(parts)) if REMOTE_BASE else list(parts)
              return "/".join(s.strip("/") for s in segments if s)

          uploaded = 0

          # Deploy dashboard HTML
          if (SRC / "index.html").exists():
              upload(ftp, SRC / "index.html", rpath("kimi-claw/index.html"))
              uploaded += 1

          # Deploy CSS
          for css_file in (SRC / "css").glob("*") if (SRC / "css").exists() else []:
              upload(ftp, css_file, rpath(f"kimi-claw/css/{css_file.name}"))
              uploaded += 1

          # Deploy JS
          for js_file in (SRC / "js").glob("*") if (SRC / "js").exists() else []:
              upload(ftp, js_file, rpath(f"kimi-claw/js/{js_file.name}"))
              uploaded += 1

          # Deploy data files (backtest results + dashboard data)
          for data_file in (SRC / "data").glob("*.json") if (SRC / "data").exists() else []:
              upload(ftp, data_file, rpath(f"kimi-claw/data/{data_file.name}"))
              uploaded += 1

          for res_file in (SRC / "backtest_results").glob("*.json") if (SRC / "backtest_results").exists() else []:
              upload(ftp, res_file, rpath(f"kimi-claw/data/{res_file.name}"))
              uploaded += 1

          ftp.quit()
          print(f"\n Deployed {uploaded} files to kimi-claw/ on {host}")
          PYEOF

      - name: Deploy Rise of the Claw dashboard
        env:
          FTP_HOST: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          FTP_USER: ${{ secrets.FTPGODADDYUSER }}
          FTP_PASS: ${{ secrets.FTPGODADDYPASS }}
        run: |
          if [ -f "tools/deploy_riseoftheclaw.py" ]; then
            echo " Deploying Rise of the Claw..."

            # Prepare deployment directory
            mkdir -p deploy_riseoftheclaw/riseoftheclaw/{css,js,data}
            cp KIMI_RISEOFTHECLAW/index.html deploy_riseoftheclaw/riseoftheclaw.html
            sed -i 's|href="css/|href="/riseoftheclaw/css/|g' deploy_riseoftheclaw/riseoftheclaw.html
            sed -i 's|src="js/|src="/riseoftheclaw/js/|g' deploy_riseoftheclaw/riseoftheclaw.html
            cp -r KIMI_RISEOFTHECLAW/css/* deploy_riseoftheclaw/riseoftheclaw/css/
            cp -r KIMI_RISEOFTHECLAW/js/* deploy_riseoftheclaw/riseoftheclaw/js/
            cp -r KIMI_RISEOFTHECLAW/data/* deploy_riseoftheclaw/riseoftheclaw/data/

            python tools/deploy_riseoftheclaw.py
          else
            echo " deploy_riseoftheclaw.py not found, skipping"
          fi

      - name: Deploy updates page
        env:
          FTP_HOST: ${{ secrets.FTPGODADDYHOST_TE_DOTNET }}
          FTP_USER: ${{ secrets.FTPGODADDYUSER }}
          FTP_PASS: ${{ secrets.FTPGODADDYPASS }}
        run: |
          python - <<'PYEOF'
          import ftplib, os
          from pathlib import Path

          host = os.environ.get("FTP_HOST", "")
          user = os.environ.get("FTP_USER", "")
          pwd  = os.environ.get("FTP_PASS", "")
          if not all([host, user, pwd]):
              exit(0)

          local = Path("updates/index.html")
          if not local.exists():
              print("No updates/index.html, skipping")
              exit(0)

          ftp = ftplib.FTP(host)
          ftp.login(user, pwd)

          remote_dir = "updates"
          ftp.cwd("/")
          for part in remote_dir.split("/"):
              try:
                  ftp.cwd(part)
              except:
                  ftp.mkd(part)
                  ftp.cwd(part)

          with open(local, "rb") as f:
              ftp.storbinary("STOR index.html", f)
          print(" Deployed updates/index.html")
          ftp.quit()
          PYEOF

      - name: Verify deployments
        run: |
          echo " Verifying deployments..."

          for url in \
            "https://torontoevent.net/kimi-claw/" \
            "https://torontoevent.net/riseoftheclaw.html" \
            "https://torontoevent.net/updates/" \
            "https://torontoevent.net/riseoftheclaw/data/live_competition.json"; do
            status=$(curl -o /dev/null -s -w "%{http_code}" "$url")
            if [ "$status" = "200" ]; then
              echo "   $url ($status)"
            else
              echo "   $url ($status)"
            fi
          done

      - name: Summary
        run: |
          echo "##  Backtest & Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dashboards" >> $GITHUB_STEP_SUMMARY
          echo "-  [Rise of the Claw](https://torontoevent.net/riseoftheclaw.html)" >> $GITHUB_STEP_SUMMARY
          echo "-  [KIMI Claw Research](https://torontoevent.net/kimi-claw/)" >> $GITHUB_STEP_SUMMARY
          echo "-  [Updates Page](https://torontoevent.net/updates/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Data" >> $GITHUB_STEP_SUMMARY
          echo "- [Live Competition JSON](https://torontoevent.net/riseoftheclaw/data/live_competition.json)" >> $GITHUB_STEP_SUMMARY
          echo "- [Active Picks JSON](https://torontoevent.net/riseoftheclaw/data/active_picks.json)" >> $GITHUB_STEP_SUMMARY


name: Gainer Predictor Scanner

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

concurrency:
  group: gainer-predictor-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          update-environment: true
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests numpy pandas

      - name: Run gainer scoring service
        run: python incubator/agents/claude_code_01/gainer_scoring_service.py --top 20 --save

      - name: Run gainer data pipeline
        run: python incubator/agents/claude_code_01/gainer_data_pipeline.py

      - name: Validate proof-protocol metadata
        if: success()
        run: |
          python3 << 'PYEOF'
          import json, sys
          try:
              picks = json.load(open('incubator/agents/claude_code_01/data/gainer_scores_latest.json'))
          except Exception as e:
              print(f"::warning::Cannot read gainer_scores_latest.json: {e}")
              sys.exit(0)
          required_keys = ['pf', 'sharpe', 'n', 'wr', 'oos_pf']
          missing_any = False
          for i, p in enumerate(picks):
              missing = [k for k in required_keys if k not in p]
              if missing:
                  missing_any = True
                  print(f"::warning::Gainer pick {i} missing proof-protocol keys: {missing}")
          if missing_any:
              print("::warning::Proof-protocol metadata incomplete — candidates not money-ready")
          else:
              print("Proof-protocol metadata present on all picks")
          PYEOF

      - name: Commit results
        run: |
          git config user.name "Gainer Predictor"
          git config user.email "predictor@bot"
          git add incubator/agents/claude_code_01/data/
          git diff --cached --quiet || git commit -m "Gainer scan $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          for i in 1 2 3; do
            bash .github/scripts/safe_push.sh && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done

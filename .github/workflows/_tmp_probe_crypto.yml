name: _tmp probe CRYPTO
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: crypto edge tests
        env:
          DB_HOST: mysql.50webs.com
          DB_PORT: '3306'
          DB_USER: ejaguiar1_stocks
          DB_PASS: ${{ secrets.MYSQL_PASSWORD || secrets.AUDIT_DB_PASS }}
        run: |
          python3 -m pip install --quiet pymysql
          python3 - <<'PY'
          import os, collections, statistics as st
          import pymysql

          cn=pymysql.connect(host=os.environ["DB_HOST"], port=int(os.environ.get("DB_PORT") or 3306),
                             user=os.environ["DB_USER"], password=os.environ["DB_PASS"],
                             database="ejaguiar1_stocks", connect_timeout=20)
          cur=cn.cursor()

          def stats(v,label,pad=32):
              if not v: print(f"  {label:<{pad}} n=0"); return
              v=sorted(v); n=len(v); w=sum(1 for x in v if x>0); k=int(n*0.01)
              tv=v[:n-k] if k else v
              print(f"  {label:<{pad}}n={n:<5}win={100*w/n:5.1f}% mean={st.mean(v):+.3f}% med={st.median(v):+.3f}% trim1={st.mean(tv):+.3f}%")

          CUR_WIN="category IN ('CRYPTO','crypto')"

          print("=== 1. strategy x source_system in CRYPTO ===")
          cur.execute(f"""SELECT COALESCE(strategy,'(none)') s, COALESCE(source_system,'(none)') ss, category,
                                 COUNT(*) n, SUM(pnl_pct>0) w, AVG(pnl_pct) a,
                                 SUM(created_at IS NULL) undated
                          FROM trading_picks WHERE {CUR_WIN} AND pnl_pct IS NOT NULL
                          GROUP BY s, ss, category HAVING COUNT(*)>=20 ORDER BY n DESC LIMIT 18""")
          for s,ss,cat,n,w,a,und in cur.fetchall():
              print(f"  {str(s)[:30]:<31}{str(ss)[:22]:<23}{str(cat)[:10]:<11}n={n:<5}win={100*w/n:5.1f}% mean={float(a):+.3f}% undated={und}")

          # pull the rows once
          cur.execute(f"""SELECT COALESCE(strategy,'(none)') s, COALESCE(source_system,'(none)') ss,
                                 symbol, direction, pnl_pct, created_at, exit_reason, closed_at
                          FROM trading_picks WHERE {CUR_WIN} AND pnl_pct IS NOT NULL""")
          rows=cur.fetchall()
          print(f"\ntotal CRYPTO rows with pnl: {len(rows)}   undated: {sum(1 for r in rows if r[5] is None)}")

          def cohort(rs,label):
              if not rs: return
              rs=sorted([r for r in rs if r[5] is not None], key=lambda r: str(r[5]))
              seen=set(); ded=[]
              for r in rs:
                  k=(str(r[2]),str(r[3]),str(r[5])[:10])
                  if k in seen: continue
                  seen.add(k); ded.append(r)
              half=len(ded)//2
              print(f"\n  {label}: raw={len(rs)} deduped={len(ded)}")
              stats([float(r[4]) for r in ded],"deduped")
              stats([float(r[4]) for r in ded[:half]],"first half")
              stats([float(r[4]) for r in ded[half:]],"second half")
              syms=collections.Counter(str(r[2]) for r in ded)
              if syms: print(f"    symbols={len(syms)} top={syms.most_common(1)[0][0]}={100*syms.most_common(1)[0][1]/max(len(ded),1):.1f}%")
              er=collections.Counter(str(r[6] or '?') for r in ded)
              print(f"    exits={dict(er.most_common(4))}")

          print("\n=== 2. per top source_system ===")
          for ss in ("alpha_engine","mega_mutation","kimi_signal_tracking","ml_crypto_pred","alpha_engine_fast"):
              cohort([r for r in rows if r[1]==ss], f"source_system={ss}")

          print("\n=== 3. per named strategy (top 8 by n) ===")
          cnt=collections.Counter(r[0] for r in rows)
          for s,_ in cnt.most_common(9):
              if s=="(none)": continue
              cohort([r for r in rows if r[0]==s], f"strategy={s}")

          print("\n=== 4. named vs unnamed aggregate ===")
          cohort([r for r in rows if r[0]!="(none)"], "ALL named")
          cohort([r for r in rows if r[0]=="(none)"], "ALL unnamed")
          cn.close()
          PY

name: Cross-DB Consistency Guardian (M-005)

on:
  schedule:
    - cron: '0 2 * * *'   # 2 AM UTC daily
  workflow_dispatch:

jobs:
  cross-db-consistency:
    name: Cross-DB lifecycle consistency check
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pymysql

      - name: Run cross-DB consistency check
        env:
          # Canonical new names (preferred by db_env.py)
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_PASS_BACKTESTS: ${{ secrets.DB_PASS_BACKTESTS || secrets.MYSQL_PASSWORD }}
          # Legacy names for backward compat
          DB_STOCKS_PASSWORD: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_STOCKS_HOST: ${{ secrets.DB_HOST_STOCKS || 'mysql.50webs.com' }}
          DB_STOCKS_USER: ${{ secrets.DB_USER_STOCKS || 'ejaguiar1_stocks' }}
          DB_STOCKS_NAME: ${{ secrets.DB_NAME_STOCKS || 'ejaguiar1_stocks' }}
          DB_BACKTESTS_PASSWORD: ${{ secrets.DB_PASS_BACKTESTS || secrets.MYSQL_PASSWORD }}
          DB_BACKTESTS_HOST: ${{ secrets.DB_HOST_BACKTESTS || 'mysql.50webs.com' }}
          DB_BACKTESTS_USER: ${{ secrets.DB_USER_BACKTESTS || 'ejaguiar1_backtests' }}
          DB_BACKTESTS_NAME: ${{ secrets.DB_NAME_BACKTESTS || 'ejaguiar1_backtests' }}
        run: |
          echo "=== Cross-DB Consistency Guardian (M-005) ==="
          python tools/cross_db_consistency.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 2 ]; then
            echo "::error::Cross-DB consistency CRITICAL — lifecycle checks failed across DBs. Check audit_dashboard/data/cross_db_report.json"
            exit 2
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "::warning::Cross-DB consistency ISSUES — at least one lifecycle check flagged. Review cross_db_report.json"
            exit 0  # Warning only — don't fail CI on non-critical issues
          else
            echo "Cross-DB consistency GREEN — all lifecycle checks passed"
          fi

      - name: Commit consistency report
        if: always()
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          if [ -f audit_dashboard/data/cross_db_report.json ]; then
            git config user.name "Cross-DB Consistency Bot"
            git config user.email "cross-db@findtorontoevents.ca"
            git add audit_dashboard/data/cross_db_report.json 2>/dev/null || true
            git diff --staged --quiet || git commit -m "chore(cross-db): update consistency report [skip ci]"
            git pull --rebase origin main || true
            bash .github/scripts/safe_push.sh || true
          else
            echo "No cross_db_report.json produced — skipping commit"
          fi


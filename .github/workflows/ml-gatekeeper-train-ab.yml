name: ML Gatekeeper Train A/B (Phase D)

# Trains a SINGLE gatekeeper bundle per dispatch, selected by `drop_leakage`:
#   drop_leakage=false -> ml_gatekeeper/models/gatekeeper_old.joblib
#   drop_leakage=true  -> ml_gatekeeper/models/gatekeeper_new.joblib
#
# Both bundles together feed the A/B router (PR #921) wired into
# score_active_picks via PR #924. Run this workflow TWICE (once per arm) to
# bootstrap the sleeve, then re-run periodically to refresh.
#
# Trigger:
#   gh workflow run ml-gatekeeper-train-ab.yml -f drop_leakage=false
#   gh workflow run ml-gatekeeper-train-ab.yml -f drop_leakage=true

on:
  # Single nightly cron — fans out to BOTH arms via job matrix in the same
  # workflow run. Matrix gives atomicity (both arms train or neither runs)
  # which a dual-cron approach can't guarantee (per deepseek PR-review 2026-05-27:
  # "If OLD arm fails, NEW arm still runs, leaving an inconsistent state").
  # Schedule chosen so both arms finish before audit-dashboard cron at 22:00 UTC.
  schedule:
    - cron: '12 19 * * *'   # 19:12 UTC — fans to {OLD, NEW} arms in parallel
  workflow_dispatch:
    inputs:
      drop_leakage:
        description: "Mask leakage feature indices (false=OLD bundle, true=NEW bundle)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 2026-05-12: prev 30min hit timeout during commit-step git-fetch-unshallow
    strategy:
      # Matrix expansion: cron → both arms in parallel; workflow_dispatch → only
      # the arm the user selected. The `arm == inputs.drop_leakage` filter is
      # vacuous for cron (no inputs) so both expand; for dispatch the unselected
      # arm is excluded.
      fail-fast: false  # if OLD fails, still train NEW (and vice versa) so
                       # one corrupted run doesn't block fresh data on the
                       # other arm
      matrix:
        arm:
          - {drop: 'false', bundle: 'gatekeeper_old.joblib', label: 'OLD (leakage features present)'}
          - {drop: 'true',  bundle: 'gatekeeper_new.joblib', label: 'NEW (leakage-purged)'}

    steps:
      - name: Skip if workflow_dispatch selected the other arm
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.drop_leakage != matrix.arm.drop }}
        run: |
          echo "Skipping ${{ matrix.arm.label }} — dispatch selected drop_leakage=${{ inputs.drop_leakage }}"
          exit 0

      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drop_leakage == matrix.arm.drop }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full clone avoids `git fetch --unshallow` (16+ min on this repo) in commit step
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drop_leakage == matrix.arm.drop }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drop_leakage == matrix.arm.drop }}
        run: pip install 'scikit-learn==1.3.2' 'scipy>=1.10.0,<1.14' joblib numpy

      - name: Resolve arm name
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drop_leakage == matrix.arm.drop }}
        id: arm
        run: |
          # Matrix-driven — values come from the matrix.arm object directly.
          # No schedule-string parsing (eliminates the fragility deepseek flagged).
          echo "drop=${{ matrix.arm.drop }}" >> "$GITHUB_OUTPUT"
          echo "bundle=${{ matrix.arm.bundle }}" >> "$GITHUB_OUTPUT"
          echo "label=${{ matrix.arm.label }}" >> "$GITHUB_OUTPUT"

      - name: Train bundle (${{ matrix.arm.label }})
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drop_leakage == matrix.arm.drop }}
        env:
          PYTHONUTF8: "1"
          PYTHONPATH: ${{ github.workspace }}
          ML_GATE_DROP_LEAKAGE: ${{ matrix.arm.drop == 'true' && '1' || '' }}
        run: |
          python -m ml_gatekeeper.train_gatekeeper
          ls -la ml_gatekeeper/models/

      - name: Verify bundle stamping
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drop_leakage == matrix.arm.drop }}
        env:
          EXPECTED_DROPPED: ${{ steps.arm.outputs.drop }}
          BUNDLE_NAME: ${{ steps.arm.outputs.bundle }}
        run: |
          python - <<'PY'
          import os, joblib
          from pathlib import Path
          name = os.environ["BUNDLE_NAME"]
          expected = os.environ["EXPECTED_DROPPED"] == "true"
          path = Path("ml_gatekeeper/models") / name
          assert path.exists(), f"missing {path}"
          bundle = joblib.load(path)
          got = bool(bundle.get("leakage_dropped"))
          print(f"{name}: leakage_dropped={got} expected={expected} "
                f"trained_at={bundle.get('trained_at_iso')} "
                f"n_features={bundle.get('n_features')}")
          assert got == expected, f"leakage_dropped mismatch on {name}"
          if expected:
              assert bundle.get("dropped_feature_names"), "NEW bundle must list dropped features"
          print("OK bundle validated")
          PY

      - name: Upload bundle artifact (fallback if commit oversized)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drop_leakage == matrix.arm.drop }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.arm.outputs.bundle }}
          path: ml_gatekeeper/models/${{ steps.arm.outputs.bundle }}
          retention-days: 30

      - name: Commit bundle to ml_gatekeeper/models/
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.drop_leakage == matrix.arm.drop }}
        env:
          BUNDLE_NAME: ${{ steps.arm.outputs.bundle }}
        run: |
          git add "ml_gatekeeper/models/${BUNDLE_NAME}"
          if git diff --cached --quiet; then
            echo "No bundle changes to commit"
          else
            if [ -f .github/scripts/safe_commit_push.sh ]; then
              bash .github/scripts/safe_commit_push.sh "feat(ml-gate-ab): refresh ${BUNDLE_NAME} via Phase D train workflow [skip ci]" "ml_gatekeeper/models/${BUNDLE_NAME}" || echo "push failed (non-fatal; artifact uploaded)"
            else
              # Full clone (fetch-depth: 0 above) means no --unshallow needed.
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "feat(ml-gate-ab): refresh ${BUNDLE_NAME} via Phase D train workflow [skip ci]"
              git pull --rebase origin main || true
              git push origin HEAD:main || echo "push failed (non-fatal; artifact uploaded)"
            fi
          fi

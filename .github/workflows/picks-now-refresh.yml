# Refreshes /audit/picks-now.html daily with fresh quant screener results
# Runs: picks_now_professional.py → save to DB → FTP deploy
name: Picks NOW Refresh

on:
  schedule:
    # 06:00 / 12:00 / 18:00 UTC = 02:00 / 08:00 / 14:00 EST
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip -q
          python3 -m pip install yfinance pandas numpy pymysql requests scipy -q

      - name: Build intrabar sym×dir overlay (picks-now pro gate)
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
        run: python3 tools/build_intrabar_sym_dir_stats.py || echo "[sym_dir] non-fatal (gate falls back to class-only)"

      - name: Generate picks
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 tools/picks_now_professional.py

      - name: Freshness assert (fail-LOUD if picks_now.json was NOT regenerated)
        # The screener can exit 0 without writing a fresh JSON (data-fetch fallbacks), so the
        # Commit/FTP steps ship the STALE file and the live page silently freezes — observed
        # 11 days stale (2026-06-12 -> 06-23) while every run reported "success". Assert the
        # just-written picks_now.json is from THIS run (<2h old) and non-empty.
        run: |
          python3 -c "
          import json, sys, datetime as dt
          p = 'audit_dashboard/data/picks_now.json'
          d = json.load(open(p))
          n = len(d.get('picks', []))
          g = (d.get('generated_at') or '')[:19]
          try:
              age_h = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(d['generated_at'].replace('Z','+00:00'))).total_seconds()/3600
          except Exception:
              age_h = 9999
          print(f'picks_now.json generated_at={g} age={age_h:.1f}h picks={n}')
          if age_h > 2 or n == 0:
              print(f'::error title=picks_now_stale::picks_now.json was NOT regenerated this run (age {age_h:.1f}h, {n} picks). The screener fell back to a stale file; live picks-now would freeze. Failing so it is visible.')
              sys.exit(1)
          print('picks_now.json fresh: OK')
          "

      - name: Sync genome mega_mutation picks to at_raw_picks
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
        run: python3 tools/genome_to_raw_picks_sync.py || echo "[genome_sync] skipped (no open picks)"

      - name: Save picks to MySQL tracking table
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
        run: python3 tools/save_picks_to_db.py

      # Self-healing track record: ensure the tracker's symbols have OHLC bars
      # (17/36 had none on 2026-06-09 -> never resolvable), then fill outcomes
      # for any pick that has matured (first-touch TP vs SL, intrabar).
      - name: Refresh OHLC coverage for tracker symbols
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
        run: python3 tools/refresh_stock_ohlcv.py --execute --period 30d --include-picks-now || echo "[ohlcv] non-fatal"

      - name: Resolve matured picks-now outcomes
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS }}
        run: python3 tools/resolve_picks_now.py --apply || echo "[resolve] non-fatal"

      - name: Commit + push picks_now.json (plumbing — reliable on contended main, working-tree-safe)
        # WHY: the old rebase loop aborted on EVERY run — main is so contended that `git pull --rebase`
        # always conflicted on OTHER agents' data files; resolving only picks_now.json left the rebase
        # stuck -> abort -> nothing pushed. The committed picks_now.json sat 11 DAYS stale, and other
        # uncoordinated audit-data deployers kept shipping that stale file to the live page (erasing
        # TTWO/featured-trending within the hour). FIX: build the commit with git plumbing DIRECTLY on
        # origin/main (only picks_now.json changed) using an ISOLATED temp index, so the working tree is
        # untouched (the FTP step still ships the fresh local file) and a push race just retries. Worst
        # case = push fails = status quo (no regression; FTP still deploys fresh).
        continue-on-error: true
        run: |
          pf=audit_dashboard/data/picks_now.json
          [ -f "$pf" ] || { echo "no picks_now.json to push"; exit 0; }
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main || { sleep 3; continue; }
            base=$(git rev-parse FETCH_HEAD)
            blob=$(git hash-object -w "$pf")
            idx=$(mktemp)
            GIT_INDEX_FILE="$idx" git read-tree "$base"
            GIT_INDEX_FILE="$idx" git update-index --add --cacheinfo 100644,"$blob","$pf"
            tree=$(GIT_INDEX_FILE="$idx" git write-tree)
            rm -f "$idx"
            if [ "$tree" = "$(git rev-parse "$base^{tree}")" ]; then echo "picks_now.json unchanged vs origin/main"; pushed=1; break; fi
            commit=$(git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit-tree "$tree" -p "$base" -m "chore(picks-now): auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]")
            if git push -q origin "$commit:refs/heads/main"; then echo "pushed picks_now.json on attempt $i"; pushed=1; break; fi
            echo "push attempt $i lost the race — retrying"; sleep $(( (RANDOM % 6) + 2 ))
          done
          [ "$pushed" = 1 ] || echo "::warning::picks_now.json push failed after 5 retries (FTP still ships fresh; next run retries)"

      - name: FTP deploy picks-now assets to production
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python3 tools/ftp_deploy_picks_now.py

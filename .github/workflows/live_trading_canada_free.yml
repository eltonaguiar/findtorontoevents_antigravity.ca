name: Live Trading Bot - Canada Edition (FREE Data)

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      data_source:
        description: 'Data source (FREE_DATA = no API keys needed!)'
        required: true
        default: 'FREE_DATA'
        type: choice
        options:
          - FREE_DATA
          - COINBASE
          - KRAKEN
          - KUCOIN
      dry_run:
        description: 'Run in dry-run mode (paper trading)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  trade:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT || github.token }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        update-environment: false
        python-version: '3.11'
        
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run trading bot (Canada Edition)
      env:
        # Set primary data source (FREE_DATA requires NO API keys!)
        PRIMARY_EXCHANGE: ${{ github.event.inputs.data_source || 'FREE_DATA' }}
        
        # FREE Data Source API Keys (set these in repo secrets)
        COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        CURRENCY_LAYER_API_KEY: ${{ secrets.CURRENCY_LAYER_API_KEY }}
        
        # Exchange API Keys (optional - only if you want to trade)
        COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
        COINBASE_SECRET: ${{ secrets.COINBASE_SECRET }}
        
        KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
        KRAKEN_SECRET: ${{ secrets.KRAKEN_SECRET }}
        
        KUCOIN_API_KEY: ${{ secrets.KUCOIN_API_KEY }}
        KUCOIN_SECRET: ${{ secrets.KUCOIN_SECRET }}
        KUCOIN_PASSPHRASE: ${{ secrets.KUCOIN_PASSPHRASE }}
        
        DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      run: |
        python live_trading_bot_canada.py
        
    - name: Upload trading results
      uses: actions/upload-artifact@v4
      with:
        name: trading-results-${{ github.run_id }}-${{ github.event.inputs.data_source || 'FREE_DATA' }}
        path: |
          trading_results.json
          trading_bot.log
        retention-days: 30
        
    - name: Commit results to repo
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add trading_results.json trading_bot.log performance_history.json 2>/dev/null || true
        git commit -m "Update trading results - ${{ github.event.inputs.data_source || 'FREE_DATA' }} - $(date -u +%Y-%m-%d_%H:%M) [skip ci]" || true
        bash .github/scripts/safe_push.sh


name: QA Market Validation

# Validates published open-pick PnL against independent market data feeds
# (tools/qa_ledger.py). RED = any CRITICAL flag (unpriced, UNVERIFIED_ZERO,
# mismatch, out-of-bounds). Fails the build to stop unvalidated PnL from
# reaching the dashboard.
#
# Run: hourly + on push touching the ledger/QA files.

on:
  schedule:
    - cron: '13 * * * *'        # every hour
  push:
    branches: [main]
    paths:
      - tools/qa_ledger.py
      - audit_dashboard/data/picks_now_live_pnl.json
      - .github/workflows/qa-market-validation.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  qa-validation:
    name: QA Market Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas numpy requests pymysql

      - name: Run QA ledger
        run: python tools/qa_ledger.py
        env:
          DB_PASS_STOCKS: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD }}
          DB_STOCKS_PASSWORD: ${{ secrets.DB_PASS_STOCKS || secrets.MYSQL_PASSWORD || secrets.DB_STOCKS_PASSWORD }}
          # Equity quote-chain credentials (alpha_engine/equity_price_failover.py).
          # The chain has 7 adapters, but adapters 2-6 return None immediately
          # when their key is unset — leaving only Stooq (its anonymous endpoint
          # is blocked from GitHub-runner IPs) and yfinance (documented as flaky
          # in GHA in that module's own docstring). That is exactly how run
          # 43688541491 produced "fetch_quote(<ticker>): ALL 7 sources failed"
          # for every single equity ticker and failed the gate. Without these
          # keys this job cannot validate PnL, so it fails every hour forever.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINNHUB }}
          FINNHUB: ${{ secrets.FINNHUB_API_KEY || secrets.FINNHUB }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      # The artifact is the dashboard's only record of this gate, and the job that
      # writes it otherwise dies with the runner: the committed copy was 6 days
      # stale (n_picks 4390 vs 183 printed) while the panel looked fine. Commit it
      # even when the gate is red -- a red gate's flags are exactly what the panel
      # should show.
      - name: Commit the QA artifact
        if: always()
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          A=audit_dashboard/data/qa_market_validation.json
          [ -f "$A" ] || { echo "no artifact"; exit 0; }
          export GIT_AUTHOR_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git add "$A"
          if git diff --cached --quiet; then echo "artifact unchanged"; exit 0; fi
          git commit -q -m "chore(qa): market validation snapshot [skip ci]"
          M="chore(qa): market validation snapshot [skip ci]"
          # No rebase here: this checkout is depth-1 and main moves every few
          # minutes, so `git rebase` walks past the shallow boundary and starts
          # unshallowing a multi-GB history -- it sat 26 min and the run was
          # cancelled. Re-point HEAD at the new tip with --soft (keeps the
          # artifact in the worktree) and re-commit, which stays a fast-forward.
          for i in 1 2 3; do
            if timeout 120 git push -q origin HEAD:main; then echo "artifact pushed"; exit 0; fi
            echo "push rejected (attempt $i); re-pointing at the new tip"
            timeout 180 git fetch -q --depth=1 origin main || true
            git reset --soft FETCH_HEAD || true
            git add "$A"
            git commit -q -m "$M" || { echo "remote already carries this artifact"; exit 0; }
          done
          echo "::warning::could not push the QA artifact; repo copy stays stale until the next run"

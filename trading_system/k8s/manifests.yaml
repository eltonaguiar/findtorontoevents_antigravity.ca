## ConfigMap

```yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-config
  namespace: trading-prod
data:
  trading.yaml: |
    risk_limits:
      max_position_value: 1000000
      max_position_pct: 0.10
      max_daily_loss: 50000
      max_order_size: 100
      max_slippage_bps: 50
    
    circuit_breakers:
      portfolio_drawdown_pct: 5.0
      single_position_loss_pct: 2.0
      data_feed_timeout_ms: 5000
    
    execution:
      default_order_type: LIMIT
      default_time_in_force: GTC
      smart_routing_enabled: true
    
    strategies:
      momentum_v2:
        enabled: true
        symbols: ["BTC-USD", "ETH-USD"]
        timeframe: "1m"
```

## Secrets

```yaml
apiVersion: v1
kind: Secret
metadata:
  name: trading-secrets
  namespace: trading-prod
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@timescaledb.trading-data.svc.cluster.local:5432/trading"
  REDIS_URL: "redis://redis-cluster.trading-data.svc.cluster.local:6379"
```

## Data Ingestion Service

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion
  namespace: trading-prod
  labels:
    app: data-ingestion
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: data-ingestion
  template:
    metadata:
      labels:
        app: data-ingestion
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      priorityClassName: trading-critical
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: data-ingestion
              topologyKey: kubernetes.io/hostname
      containers:
        - name: data-ingestion
          image: trading-system/data-ingestion:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 8080
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: REDIS_URL
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: data-ingestion
  namespace: trading-prod
spec:
  selector:
    app: data-ingestion
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
  type: ClusterIP
```

## Signal Generation Service

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-generation
  namespace: trading-prod
  labels:
    app: signal-generation
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: signal-generation
  template:
    metadata:
      labels:
        app: signal-generation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      priorityClassName: trading-high
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: signal-generation
                topologyKey: kubernetes.io/hostname
      containers:
        - name: signal-generation
          image: trading-system/signal-generation:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 8080
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trading-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          configMap:
            name: trading-config
---
apiVersion: v1
kind: Service
metadata:
  name: signal-generation
  namespace: trading-prod
spec:
  selector:
    app: signal-generation
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
  type: ClusterIP
```


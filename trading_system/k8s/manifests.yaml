# Kubernetes Deployment Manifests

## Namespace

```yaml
apiVersion: v1
kind: Namespace
metadata:
  name: trading-prod
  labels:
    app.kubernetes.io/name: trading-system
    app.kubernetes.io/environment: production
---
apiVersion: v1
kind: Namespace
metadata:
  name: trading-data
  labels:
    app.kubernetes.io/name: trading-data
    app.kubernetes.io/environment: production
---
apiVersion: v1
kind: Namespace
metadata:
  name: trading-monitoring
  labels:
    app.kubernetes.io/name: trading-monitoring
    app.kubernetes.io/environment: production
```


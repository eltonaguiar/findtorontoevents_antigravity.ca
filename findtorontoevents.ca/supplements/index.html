<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supplements Hub | FindTorontoEvents</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1f2a2d;
      --brand: #0f766e;
      --card: #ffffff;
      --muted: #5b6b70;
      --line: #d9d3c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, #dff3ee 0, rgba(223,243,238,0) 35%),
        radial-gradient(circle at 90% 20%, #f8ead2 0, rgba(248,234,210,0) 35%),
        var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .wrap {
      width: min(920px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      letter-spacing: 0.02em;
    }
    p { color: var(--muted); line-height: 1.6; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: #fbf9f5;
    }
    .card h2 { margin: 0 0 6px; font-size: 1.2rem; }
    a.button {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: #fff;
      background: var(--brand);
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Supplements Hub</h1>
    <p>
      Research-first supplement pages for energy, recovery, and performance topics.
      Each page separates higher-quality evidence from anecdotal claims.
    </p>
    <section class="grid">
      <article class="card">
        <h2>Energy Supplements</h2>
        <p>20-item breakdown with stimulant vs non-stimulant labels and source citations.</p>
        <a class="button" href="./energy/">Open Energy Guide</a>
      </article>
    </section>
  </main>
</body>
</html>

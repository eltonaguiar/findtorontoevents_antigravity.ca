  - {model_name: free-mode, litellm_params: {model: openai/nemotron-3-super-free,    api_key: os.environ/OPENCODE_API_KEY, api_base: https://opencode.ai/zen/v1}}
  - {model_name: free-mode, litellm_params: {model: openai/deepseek-v4-flash-free,   api_key: os.environ/OPENCODE_API_KEY, api_base: https://opencode.ai/zen/v1}}


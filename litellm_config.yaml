  - {model_name: ULTRA_FREE_TOOLS_FAST, litellm_params: {model: ollama_chat/qwen2.5:7b,   api_key: local, api_base: http://localhost:11434, keep_alive: 24h}}

  # STRICT FREE-LOCAL - ROTATION across the two Ollama MoE models.
  # simple-shuffle picks a member per request; every member is local and free.
  #
  # vLLM/qwen3-8b was REMOVED from this rotation (2026-11-12). It carried
  # max_input_tokens 32768 against its peers' 131072, so one in three "best
  # local" requests landed on a 4x-smaller-context model running at 8-10 tok/s

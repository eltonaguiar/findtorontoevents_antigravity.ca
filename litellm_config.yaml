  # ====================================================================
  # TRUE FREE TOOLS — genuinely $0 AND tool-calling verified by test.
  # Added 2026-11-04. Every entry is LOCAL: no API key, no quota, no bill.
  #
  # Why separate from ULTRA_FREE_CLOUD_TOOLS: that group has no local entries and
  # escalates to ULTRA_PAID_MODE_FAST on failure, so it can silently bill. This
  # group has NO fallback entry ON PURPOSE — if all three locals are down the
  # request fails loudly instead of quietly running on a paid cloud model.
  #
  # Tool-calling verified 2026-11-04 with a tools= payload (response carried
  # finish_reason: tool_calls and a populated tool_calls array):
  #   hosted_vllm Qwen2.5-14B-Instruct   PASS
  #   ollama_chat/qwen2.5:14b            PASS
  #   ollama_chat/qwen3:30b-a3b          PASS
  # Do NOT add cloud entries here on the strength of a "free" alias: a
  # gemini-3.1-flash-lite deployment inside ULTRA_FREE_CLOUD billed $3.5e-06 per
  # call, so alias naming is not evidence of zero cost. Verify with the
  # x-litellm-response-cost header instead.
  #
  # Note: qwen3 is a thinking model — its reasoning trace shares the token
  # budget. Measured 2026-11-04: max_tokens=300 returned empty content with
  # finish_reason=length; max_tokens=1024 and 2048 both returned proper
  # tool_calls (4/4). Give any qwen3 deployment >=1024 tokens.
  # ====================================================================
  - {model_name: ULTRA_FREE_TOOLS, litellm_params: {model: hosted_vllm/qwen3-8b, api_key: local, api_base: http://localhost:8000/v1}}
  - {model_name: ULTRA_FREE_TOOLS, litellm_params: {model: ollama_chat/qwen2.5:14b,             api_key: local, api_base: http://localhost:11434}}
  - {model_name: ULTRA_FREE_TOOLS, litellm_params: {model: ollama_chat/qwen3:30b-a3b,            api_key: local, api_base: http://localhost:11434}}

  # ====================================================================
  # TRUE FREE TOOLS FAST — same zero-cost, local-only promise as
  # ULTRA_FREE_TOOLS, but latency-first: only the small tool-capable models.
  # Measured on this box 2026-11-08 (/tmp/bench_tps.py, 320-token target):
  #   ollama qwen2.5:3b   15.5 tok/s   tools PASS
  #   ollama llama3.2:3b  13.8 tok/s   tools PASS
  #   ollama qwen2.5:7b   10.5 tok/s   tools PASS
  #   ollama llama3.1:8b   8.9 tok/s   tools PASS (left out — no faster than 7b)
  #   hosted_vllm 14B     5.4 tok/s   tools PASS (left out — ULTRA_FREE_TOOLS)
  #   qwen2.5-coder:{3b,7b}, phi4-mini — ignored: returned finish_reason=stop
  #   with an EMPTY tool_calls on the same payload, so they are not tool-safe.
  # First call after idle pays a model-load penalty (3-23s measured); ollama
  # unloads after its default 5m keep_alive, so this is a cold-start cost only.
  # No fallback to cloud ON PURPOSE — see the ULTRA_FREE_TOOLS note above.
  # ====================================================================
  - {model_name: ULTRA_FREE_TOOLS_FAST, litellm_params: {model: ollama_chat/qwen2.5:3b,   api_key: local, api_base: http://localhost:11434, keep_alive: 24h}}
  - {model_name: ULTRA_FREE_TOOLS_FAST, litellm_params: {model: ollama_chat/llama3.2:3b,  api_key: local, api_base: http://localhost:11434, keep_alive: 24h}}
  # qwen2.5:7b was listed twice byte-for-byte, which silently doubled its

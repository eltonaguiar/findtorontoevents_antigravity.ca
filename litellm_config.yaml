# LiteLLM proxy config: strict free selectors, preserved legacy pools, and paid pools.
#
# `ULTRA_FREE_CLOUD*` are strict free-only selectors. The former mixed pools are
# preserved under `ZZZ_BAD_LEGACY_MIXED_F_MODE*` and are NOT a zero-cost contract.
# `ULTRA_*` aliases expose the curated recommendations explicitly. `ULTRA_HYBRID_MODEL`
# remains a backward-compatible mixed alias.
#
# Verified alive 2026-05-25 via tools/verify_all_keys.py (27/43 keys OK).
#
# SKIPPED upstreams and why:
#   xai (grok)      — key invalid per xAI's own response (regenerate at console.x.ai)
#   ollama_cloud    — value is ssh-ed25519 public key, needs SSH JWT signing (not bearer)
#   chutes          — account balance $0, quota exceeded
#   qwen            — key invalid ("Incorrect API key provided")
#   inception       — RETIRED 2026-12-28 (Inception API service sunset; use cerebras)
#   deepinfra (1°)  — primary key dead, use DEEPINFRA_API_KEY_ALT
#   cohere          — trial key works (command-r7b-12-2024)
#   aimlapi (free)  — ALL_TIME_LIMIT exhausted (paid key works)
#   hf (any)        — monthly account-pool credits depleted (smart_cooldown parks)
#   cloudflare      — daily 10k-neuron quota (smart_cooldown parks until UTC midnight)
#   openai          — out of quota; left as ULTRA_PAID_MODE entry so it surfaces if topped up
#   novita          — key valid but current account has NOT_ENOUGH_BALANCE; supported as direct alias only

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 90
  callbacks: tools.litellm_smart_cooldown.smart_cooldown

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 65
  retry_after: 1
  context_window_fallbacks:
    - ULTRA_FREE_CLOUD: ["ULTRA_FREE_CLOUD_LARGE"]
    - ULTRA_HYBRID_MODEL: ["ULTRA_FREE_CLOUD_LARGE"]
    - ULTRA_PAID_MODE: ["ULTRA_PAID_MODE_LARGE", "ULTRA_FREE_CLOUD_LARGE"]
  fallbacks:
    # Generic fallbacks — catch any failure (incl. 413, mid-stream 429, etc.)
    # not just ContextWindowExceededError. Strict free groups only fall back
    # to other strict free groups; local-only groups fail closed.
    - ULTRA_HYBRID_MODEL:      ["ULTRA_FREE_CLOUD_LARGE", "ULTRA_FREE_CLOUD", "ULTRA_PAID_MODE"]
    # Free-named aliases are now strict zero-cost pools; spillover stays free.
    - ULTRA_FREE_CLOUD:         ["ULTRA_FREE_CLOUD_LARGE", "ULTRA_FREE_NVIDIA"]
    # A broken long-context stream can retry on the free, tool-capable pool.
    # This target has no fallback of its own, avoiding a cycle or paid spillover.
    - ULTRA_FREE_CLOUD_LARGE: ["ULTRA_FREE_CLOUD_TOOLS", "ULTRA_FREE_NVIDIA"]
    # OpenRouter's free pool is capped at 1,000 requests/DAY for the whole
    # account (measured: 626 used mid-day). NVIDIA NIM is a separate
    # first-party quota serving the same 1M-context nemotron models, so it is
    # the correct landing spot when the OpenRouter daily budget runs out.
    - ULTRA_FREE_OPENROUTER:  ["ULTRA_FREE_NVIDIA"]
    # ULTRA_FREE_NVIDIA was TERMINAL: three groups above land on it, and it had no
    # fallback of its own, so any NVIDIA-side failure returned a hard error with
    # "No fallback model group found for original model_group=ULTRA_FREE_NVIDIA"
    # (seen 2026-11-12 as a 401 "Invalid JWT serialization"). The keys themselves
    # were verified healthy (HTTP 200, 84 models, both NVIDIA_API_KEY and _ALT), so
    # this is margin against a transient/quota failure, not a key fix. Lands on the
    # free tool-capable cloud pool, which declares no fallback of its own and so
    # cannot cycle back into NVIDIA.
    - ULTRA_FREE_NVIDIA:       ["ULTRA_FREE_CLOUD_TOOLS"]
    - ULTRA_PAID_MODE:         ["ULTRA_PAID_MODE_LARGE", "ULTRA_FREE_CLOUD_LARGE", "ULTRA_FREE_CLOUD"]
    - ULTRA_PAID_MODE_LARGE:   ["ULTRA_FREE_CLOUD_LARGE", "ULTRA_PAID_MODE", "ULTRA_FREE_CLOUD"]
    # Fast modes — narrow pools, fall back to their full-tier siblings
    # if every fast upstream is cooled. Keeps latency goal as primary
    # but doesn't fail the request when all fast are exhausted.
    - ULTRA_PAID_MODE_FAST:    ["ULTRA_PAID_MODE", "ULTRA_FREE_CLOUD_FAST", "ULTRA_FREE_CLOUD"]
    - ULTRA_FREE_CLOUD_FAST:    ["ULTRA_FREE_CLOUD", "ULTRA_FREE_CLOUD_LARGE"]
    # ULTRA_FREE_TOOLS_FAST — latency-first local pool; falls back to the
    # slower local pool only (never cloud, so it cannot silently bill).
    - ULTRA_FREE_TOOLS_FAST: ["ULTRA_FREE_TOOLS"]
    # Code alias is a TRUE primary -> fallback pair (not a 50/50 coin flip).
    # simple-shuffle within one group randomises members, so the coder lives in
    # its own group and is only consulted when the MoE primary fails.
    - ULTRA_FREE_LOCAL_CODE: ["ULTRA_FREE_LOCAL_CODE_1FALLBACK"]
    # Strict selector fallbacks. These never reach a paid group.
  retry_policy:
    BadRequestErrorRetries: 1
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 2
    RateLimitErrorRetries: 3
    ContentPolicyViolationErrorRetries: 0
    InternalServerErrorRetries: 2

model_list:

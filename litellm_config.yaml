  - {model_name: free-mode, litellm_params: {model: together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Lite, api_key: os.environ/TOGETHER_API_KEY}}
  - {model_name: free-mode, litellm_params: {model: together_ai/meta-llama/Meta-Llama-3-8B-Instruct-Lite, api_key: os.environ/TOGETHER_API_KEY_ALT}}


# litellm proxy config — FREE-mode + PAID-mode rotating fallback.
#
# Two virtual model names: free-mode (only $0 / free-tier upstreams), paid-mode
# (premium frontier models). hybrid-model is preserved as a free-mode alias for
# backward compatibility with existing Roo/Kilo settings.
#
# Verified alive 2026-05-25 via tools/verify_all_keys.py (27/43 keys OK).
#
# SKIPPED upstreams and why:
#   xai (grok)      — key invalid per xAI's own response (regenerate at console.x.ai)
#   ollama_cloud    — value is ssh-ed25519 public key, needs SSH JWT signing (not bearer)
#   chutes          — account balance $0, quota exceeded
#   qwen            — key invalid ("Incorrect API key provided")
#   inception       — model only for accounts created before a cutoff date
#   deepinfra (1°)  — primary key dead, use DEEPINFRA_API_KEY_ALT
#   aimlapi (free)  — ALL_TIME_LIMIT exhausted (paid key works)
#   hf (any)        — monthly account-pool credits depleted (smart_cooldown parks)
#   cloudflare      — daily 10k-neuron quota (smart_cooldown parks until UTC midnight)
#   openai          — out of quota; left as paid-mode entry so it surfaces if topped up

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 90
  callbacks: tools.litellm_smart_cooldown.smart_cooldown

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 300
  retry_after: 1
  context_window_fallbacks:
    - free-mode: ["free-mode-large"]
    - hybrid-model: ["free-mode-large"]
    - paid-mode: ["paid-mode-large", "free-mode-large"]
  fallbacks:
    # Generic fallbacks — catch any failure (incl. 413, mid-stream 429, etc.)
    # not just ContextWindowExceededError. Every group needs at least one
    # fallback target or LiteLLM surfaces the upstream error directly.
    - hybrid-model:      ["free-mode-large", "free-mode", "paid-mode"]
    - free-mode:         ["free-mode-large", "paid-mode"]
    - free-mode-large:   ["paid-mode-large", "paid-mode", "free-mode"]
    - paid-mode:         ["paid-mode-large", "free-mode-large", "free-mode"]
    - paid-mode-large:   ["free-mode-large", "paid-mode", "free-mode"]
    # Fast modes — narrow pools, fall back to their full-tier siblings
    # if every fast upstream is cooled. Keeps latency goal as primary
    # but doesn't fail the request when all fast are exhausted.
    - free-mode-fast:    ["free-mode", "free-mode-large", "paid-mode-fast"]
    - paid-mode-fast:    ["paid-mode", "free-mode-fast", "free-mode"]
    - free-mode-tools:   ["paid-mode-fast", "paid-mode", "free-mode-fast"]   # tool-safe escalates to paid-fast first to preserve parallel-tool semantics
  retry_policy:
    BadRequestErrorRetries: 1
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 2
    RateLimitErrorRetries: 3
    ContentPolicyViolationErrorRetries: 0
    InternalServerErrorRetries: 2


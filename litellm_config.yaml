  # Measured: HTTP 402 insufficient_credits -- "Minimum $2.00 (200 credits)
  # required. Current eligible balance: 199 credits." It cannot serve ANY
  # request, so every route to it burned a retry before failover. Its context
  # window was never published and could not be measured while unfunded, which
  # is also why it kept dragging the ULTRA_HYBRID_MODEL* floors to 'unknown'.
  # Re-add (and annotate max_input_tokens) once the account is topped up.
  # ====================================================================
  # Xiaomi Mimo — paid token plan (token-plan-sgp). Uses current live model IDs
  # (mimo-v2.5-pro etc). The old "xiaomi-mimo-v1" alias was removed by provider.
  # Added 2026-05-28, refreshed 2026-05-28.
  - {model_name: ULTRA_PAID_MODE, litellm_params: {model: openai/mimo-v2.5-pro, api_key: os.environ/XIAOMI_MIMO_TOKEN_PLAN, api_base: https://token-plan-sgp.xiaomimimo.com/v1}}
  # ZZZ_BAD_LEGACY_MIXED_F_MODE — NOT A ZERO-COST GUARANTEE; retained for opt-in compatibility.
  # Retained for existing clients; use the strict ULTRA_FREE_LOCAL_2ROTATE/ULTRA_FREE_CLOUD groups
  # below for new clients that must not reach paid or trial-credit endpoints.
  # ====================================================================
  # --- FREE FRONTIER: OpenRouter :free, added 2026-11-11 ------------------
  # Every entry below was verified with a live chat call (HTTP 200, cost 0)
  # before being wired — see reports/free_model_route_probe_2026-11-11.json.
  # Ranked by operator priority: capability class first, then speed / context /
  # tool support. `weight` matters because routing_strategy is simple-shuffle:
  # a deployment with no weight gets 1, so these weights give the strongest
  # free model the largest share instead of an equal one.
  # `provider.max_price {prompt:0, completion:0}` is the $0 guard — OpenRouter
  # refuses a paid upstream, so a mistagged ":free" can never produce a bill.
  #   5  nemotron-3-ultra-550b-a55b   — 1M ctx, frontier-scale reasoning (~5.4 s)
  #   4  baidu/ernie-5.5-flash-preview — fastest large-context of the set (0.84 s)
  #   3  cohere/north-mini-code       — code-specialised (0.21 s)
  #   2  recursive/flint-v1.0         — general, small (0.31 s)
  #   1  liquid/lfm-3-1.7b            — 1.7B filler (0.31 s)
  - model_name: ZZZ_BAD_LEGACY_MIXED_F_MODE
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      weight: 5
      extra_body:
        provider:
          max_price: {prompt: 0, completion: 0}
  - model_name: ZZZ_BAD_LEGACY_MIXED_F_MODE
    litellm_params:
      model: openrouter/baidu/ernie-5.5-flash-preview:free
      api_key: os.environ/OPENROUTER_API_KEY
      weight: 4
      extra_body:
        provider:
          max_price: {prompt: 0, completion: 0}
  - model_name: ZZZ_BAD_LEGACY_MIXED_F_MODE
    litellm_params:

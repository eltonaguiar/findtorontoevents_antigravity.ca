  # ====================================================================
  # ULTRA_FREE_LOCAL_*  role-based local aliases (exactly one model each).
  # ULTRA_FREE_LOCAL_2ROTATE    ROTATES across the top models (see below).
  #
  # Measured on this GX10 (GB10, 121 GiB unified), warm, 2026-11-12:
  #   qwen3:30b-a3b        89.0 tok/s   262,144 native ctx

# .gitleaks.toml — Secret-scan suppression rules for findtorontoevents.ca / audit repo
# Used by the M-043 Gitleaks job in .github/workflows/secret-scan.yml
#
# Philosophy: extend the upstream default ruleset; only add targeted allowlists
# for patterns that are provably non-secrets in this codebase.
# Do NOT add broad regex that could mask real credentials.

[extend]
# Pull in the full gitleaks default ruleset (API keys, tokens, private keys, etc.)
useDefault = true

# ---------------------------------------------------------------------------
# Global allowlist — patterns / paths that are never real secrets here
# ---------------------------------------------------------------------------
[allowlist]
description = "Repo-wide safe patterns"

# GitHub Actions expression syntax — ${{ secrets.FOO }} is a template placeholder,
# not an actual secret value committed to the repo.
regexes = [
  '''\$\{\{\s*secrets\.[A-Z0-9_]+\s*\}\}''',
  '''(?i)(?:YOUR_[A-Z0-9_]+|REPLACE_?ME|<[A-Z0-9_]+>|PLACEHOLDER|DUMMY|FAKE|EXAMPLE|CHANGEME|xxx+)''',
  '''"(?:score|weight|threshold|factor)"\s*:\s*[0-9.]+''',
]

# Paths that should never trigger secret alerts:
paths = [
  # Test fixtures contain intentionally fake credentials for unit tests
  '''tests/fixtures/''',
  '''tests/data/''',
  '''paper_trading/tests/fixtures/''',
  # Example / sample config blocks in documentation & templates
  '''docs/.*example.*''',
  '''docs/.*sample.*''',
  '''(?:^|/)\.env\.example$''',
  '''config\.env\.template$''',
  '''(?:^|/)GHACTIONS_PR_ISSUES/''',
  '''(?:^|/)updates/.*\.md$''',
  '''(?:^|/)reports/.*\.md$''',
  '''(?:^|/)Kimi_Agent_AI Algorithm Prompting Guide/''',
  # Generated JSON state/backtest files with hash/dedup_key/id fields (not credentials)
  '''(?:^|/)cross_aggregation/data/forward_test_results\.json$''',
  '''(?:^|/)backtest_results/cursor_results\.json$''',
  '''(?:^|/)alpha_engine/data/(?:traditional_portfolio_state|closed_picks)\.json$''',
  '''(?:^|/)audit_dashboard/data/pf_portfolios\.json$''',
  '''(?:^|/)signal_aggregator/dashboard_data\.json$''',
  '''(?:^|/)tools/data/dsr_audit_results\.json$''',
  '''(?:^|/)copy_trader_intel/data/.*\.json$''',
  # Generated DSR aggregates (2026-11-22). gitleaks' generic-api-key rule fires on
  # the JSON field literally named "key", whose value is a STRATEGY identifier
  # (e.g. "key": "crypto_liquidity_wick_reversal_v1"), and on numeric rows near it.
  # Both files are written by tools/deflated_sharpe.py from audit_dashboard data;
  # no credential is in scope anywhere in that pipeline. Scoped to these two
  # artefacts only -- not to .json generally.
  '''(?:^|/)tools/deflated_sharpe_results\.json$''',
  '''(?:^|/)reports/deflated_sharpe_corrected_.*\.json$''',
  # Source files audited 2026-11-15 with non-secret identifier/model/channel strings
  '''(?:^|/)quan_engine/failover_system\.py$''',
  '''(?:^|/)tools/publish_hf_findings\.py$''',
  '''(?:^|/)tools/trading_agents_signal_sidecar\.py$''',
  '''(?:^|/)alpha_engine/kpi_monitor\.py$''',
  '''(?:^|/)\.ruflo/wizard\.py$''',
  '''(?:^|/)copy_trader_intel/coinglass_scraper\.py$''',
  # This config file itself (contains regex patterns that look like secrets)
  '''.gitleaks.toml''',
  # Workflow YAML files contain shell commands (git add, echo, etc.) that
  # trigger false-positive generic-api-key detections on command syntax
  '''.github/workflows/.*\.yml''',
  # Skip .git metadata directory when running `gitleaks dir`
  '''(?:^|/)\.git/''',
]

title: ServiceNow ITOM Learning
description: Getting started guides for ServiceNow IT Operations Management (ITOM) — Discovery, Event Management, Service Mapping, Orchestration, Cloud Management, MID Server, CMDB, and Now Assist for ITOM.
theme: jekyll-theme-minimal
show_downloads: false
google_analytics:
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter

# Rewrite [...](...md) links to their built URLs so markdown cross-links work on Pages.
relative_links:
  enabled: true
  collections: false
markdown: kramdown
highlighter: rouge
permalink: pretty
exclude:
  - .git/
  - .github/
  - scripts/
  - data/
  - meta/
  - labs/
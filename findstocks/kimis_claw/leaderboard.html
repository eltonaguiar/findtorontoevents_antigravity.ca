<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimi's Claw Leaderboard | Algorithm Rankings</title>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a25;
            --border: #2a2a3a;
            --text: #e0e0f0;
            --text-dim: #8888aa;
            --accent: #6366f1;
            --green: #22c55e;
            --green-dim: rgba(34, 197, 94, 0.15);
            --red: #ef4444;
            --red-dim: rgba(239, 68, 68, 0.15);
            --yellow: #eab308;
            --gold: #f59e0b;
            --purple: #a855f7;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #12121a 0%, #1e1e2f 100%);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--gold), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-links { display: flex; gap: 1rem; }
        .header-links a { color: var(--text-dim); text-decoration: none; font-size: 0.9rem; }
        .header-links a:hover { color: var(--text); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        
        .podium {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: end;
        }
        @media (max-width: 768px) {
            .podium { grid-template-columns: 1fr; }
        }
        
        .podium-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
            position: relative;
        }
        .podium-card.rank-1 {
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.2);
            order: 2;
        }
        .podium-card.rank-2 {
            border-color: #9ca3af;
            order: 1;
        }
        .podium-card.rank-3 {
            border-color: #b45309;
            order: 3;
        }
        
        .podium-rank {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0 auto 1rem;
        }
        .rank-1 .podium-rank {
            background: linear-gradient(135deg, #ffd700, #ffed4a);
            color: #000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .rank-2 .podium-rank {
            background: linear-gradient(135deg, #c0c0c0, #e8e8e8);
            color: #000;
        }
        .rank-3 .podium-rank {
            background: linear-gradient(135deg, #cd7f32, #daa520);
            color: #fff;
        }
        
        .podium-name { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
        .podium-type { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 1rem; }
        .podium-return {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .podium-stats {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        .podium-stat .val { font-size: 1.1rem; font-weight: 700; }
        .podium-stat .lbl { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; }
        
        .leaderboard-table {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .lb-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 1.1rem;
            font-weight: 700;
        }
        .lb-table {
            width: 100%;
            border-collapse: collapse;
        }
        .lb-table th {
            background: #1a1a25;
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border);
        }
        .lb-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(42, 42, 58, 0.5);
        }
        .lb-table tr:hover { background: var(--bg-card-hover); }
        
        .rank-cell {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            background: var(--border);
        }
        .rank-cell.gold {
            background: linear-gradient(135deg, #ffd700, #ffed4a);
            color: #000;
        }
        .rank-cell.silver {
            background: linear-gradient(135deg, #c0c0c0, #e8e8e8);
            color: #000;
        }
        .rank-cell.bronze {
            background: linear-gradient(135deg, #cd7f32, #daa520);
            color: #fff;
        }
        
        .algo-cell { font-weight: 600; }
        .type-badge {
            font-size: 0.65rem;
            padding: 0.15rem 0.5rem;
            border-radius: 99px;
            background: var(--border);
            color: var(--text-dim);
            margin-left: 0.5rem;
        }
        
        .metric { font-weight: 600; }
        .metric.pos { color: var(--green); }
        .metric.neg { color: var(--red); }
        
        .loading {
            text-align: center;
            padding: 4rem;
            color: var(--text-dim);
        }
        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .disclaimer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-dim);
            padding: 2rem 1rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏆 Kimi's Claw Leaderboard</h1>
        <div class="header-links">
            <a href="./">Arena</a>
            <a href="/findstocks/portfolio2/">Portfolio</a>
            <a href="/findstocks/">Home</a>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="margin-top:1rem;">Loading rankings...</p>
        </div>

        <div id="content" style="display:none;">
            <div id="podium" class="podium"></div>
            
            <div class="leaderboard-table">
                <div class="lb-header">📊 Full Rankings</div>
                <table class="lb-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Algorithm</th>
                            <th>Return</th>
                            <th>Win Rate</th>
                            <th>Trades</th>
                            <th>Sharpe</th>
                            <th>Max DD</th>
                        </tr>
                    </thead>
                    <tbody id="lb-body"></tbody>
                </table>
            </div>
        </div>

        <div class="disclaimer">
            Rankings based on total return since competition start. Past performance does not guarantee future results.
        </div>
    </div>

<script>
const API_BASE = './api/';

async function init() {
    try {
        const response = await fetch(API_BASE + 'competition.php?action=leaderboard');
        const data = await response.json();
        
        if (data.ok) {
            renderPodium(data.leaderboard.slice(0, 3));
            renderTable(data.leaderboard);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').innerHTML = '<p style="color:#ef4444">Error loading leaderboard</p>';
    }
}

function renderPodium(top3) {
    const order = [1, 0, 2]; // 2nd, 1st, 3rd for visual layout
    const container = document.getElementById('podium');
    
    container.innerHTML = order.map(i => {
        const algo = top3[i];
        if (!algo) return '';
        const rankClass = i === 0 ? 'silver' : i === 1 ? 'gold' : 'bronze';
        const rankNum = i + 1;
        
        return `
            <div class="podium-card rank-${rankNum}">
                <div class="podium-rank">${rankNum}</div>
                <div class="podium-name">${algo.algorithm}</div>
                <div class="podium-type">${algo.type}</div>
                <div class="podium-return ${algo.totalReturn >= 0 ? 'metric pos' : 'metric neg'}">
                    ${algo.totalReturn >= 0 ? '+' : ''}${algo.totalReturn}%
                </div>
                <div class="podium-stats">
                    <div class="podium-stat">
                        <div class="val ${algo.winRate >= 50 ? 'metric pos' : 'metric neg'}">${algo.winRate}%</div>
                        <div class="lbl">Win Rate</div>
                    </div>
                    <div class="podium-stat">
                        <div class="val">${algo.sharpeRatio}</div>
                        <div class="lbl">Sharpe</div>
                    </div>
                    <div class="podium-stat">
                        <div class="val">${algo.trades}</div>
                        <div class="lbl">Trades</div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function renderTable(leaderboard) {
    const tbody = document.getElementById('lb-body');
    
    tbody.innerHTML = leaderboard.map((algo, index) => {
        const rankClass = index === 0 ? 'gold' : index === 1 ? 'silver' : index === 2 ? 'bronze' : '';
        return `
            <tr>
                <td><div class="rank-cell ${rankClass}">${algo.rank}</div></td>
                <td class="algo-cell">
                    ${algo.algorithm}
                    <span class="type-badge">${algo.type}</span>
                </td>
                <td class="metric ${algo.totalReturn >= 0 ? 'pos' : 'neg'}">
                    ${algo.totalReturn >= 0 ? '+' : ''}${algo.totalReturn}%
                </td>
                <td class="${algo.winRate >= 50 ? 'metric pos' : 'metric neg'}">${algo.winRate}%</td>
                <td>${algo.trades}</td>
                <td>${algo.sharpeRatio}</td>
                <td class="metric neg">${algo.maxDrawdown}%</td>
            </tr>
        `;
    }).join('');
}

init();
</script>
</body>
</html>

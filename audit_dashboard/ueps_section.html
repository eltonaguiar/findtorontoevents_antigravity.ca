<!--
  Pick HTML is injected here by audit_dashboard.ueps_section_renderer.
  When this partial is included via {% include %}, the host template should
  replace the marker below with the result of:
      render_ueps_section(picks=picks, aggregate_stats_by_strategy=stats)
-->
<div id="ueps-section-mount" data-empty="true">
  <div class="ueps-empty-state">
    <p>UEPS section not yet rendered. Mount point reserved for
    <code>render_ueps_section()</code>. See
    <code>audit_dashboard/ueps_section_renderer.py</code>.</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  // Tab switching
  function activateTab(panel) {
    if (!panel) return;
    var section = panel.closest('.ueps-section');
    if (!section) return;
    var tabs = section.querySelectorAll('.ueps-tab');
    var panels = section.querySelectorAll('.ueps-tab-panel');
    var target = panel.getAttribute('data-tab');
    tabs.forEach(function (t) {
      var on = t.getAttribute('data-tab') === target;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    panels.forEach(function (p) {
      var on = p.getAttribute('data-panel') === target;
      p.classList.toggle('active', on);
      if (on) { p.removeAttribute('hidden'); } else { p.setAttribute('hidden', ''); }
    });
  }

  function bindTabs(root) {
    var tabs = (root || document).querySelectorAll('.ueps-tab');
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () { activateTab(tab); });
    });
  }

  // Earnings countdown
  // We compute days-until purely client-side. Inputs come from data-attributes
  // which are HTML-escaped server-side, so untrusted strings cannot inject.
  function updateCountdowns(root) {
    var nodes = (root || document).querySelectorAll('.ueps-countdown');
    var now = new Date();
    nodes.forEach(function (node) {
      var raw = node.getAttribute('data-countdown-target') || '';
      // Parse YYYY-MM-DD strictly. Bail out on anything else - never trust.
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
      if (!m) {
        node.textContent = '';
        return;
      }
      var target = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
      var diffMs = target.getTime() - now.getTime();
      var diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
      if (diffDays > 1) {
        node.textContent = '(' + diffDays + ' days)';
      } else if (diffDays === 1) {
        node.textContent = '(tomorrow)';
      } else if (diffDays === 0) {
        node.textContent = '(today)';
      } else {
        node.textContent = '(' + Math.abs(diffDays) + 'd ago)';
      }
    });
  }

  function init() {
    bindTabs();
    updateCountdowns();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

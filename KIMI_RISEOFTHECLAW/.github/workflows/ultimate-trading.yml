name: ULTIMATE Live Trading - 80+ Strategies

on:
  schedule:
    # Every 15 minutes during all market hours
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ultimate-trading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: KIMI_RISEOFTHECLAW
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install yfinance requests pandas numpy
      
      - name: 🚀 ULTIMATE Trading Engine
        id: trading
        run: |
          python3 << 'PYEOF'
          import yfinance as yf
          import json
          import random
          from datetime import datetime
          import requests
          
          print("=" * 70)
          print("🐾 KIMI RISE OF THE CLAW - ULTIMATE 80+ STRATEGY ENGINE")
          print("=" * 70)
          print(f"Timestamp: {datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}")
          print()
          
          # Load strategy database
          with open('KIMI_RISEOFTHECLAW/data/complete_strategies.json', 'r') as f:
              strategies = json.load(f)
          
          # Load or initialize live trading state
          try:
              with open('KIMI_RISEOFTHECLAW/data/live_trading_ultimate.json', 'r') as f:
                  live = json.load(f)
          except:
              live = {
                  "startDate": "2026-02-16",
                  "portfolios": {},
                  "todaysPicks": [],
                  "activePositions": [],
                  "closedPositions": [],
                  "performance": {}
              }
              # Initialize $10k for each active strategy
              for engine_name, engine in strategies['engines'].items():
                  for strat in engine['strategies']:
                      if strat['status'] == 'ACTIVE':
                          live['portfolios'][strat['id']] = {
                              "name": strat['name'],
                              "engine": engine_name,
                              "cash": 10000,
                              "equity": 0,
                              "totalValue": 10000,
                              "return": 0,
                              "activePicks": [],
                              "closedPicks": [],
                              "winCount": 0,
                              "lossCount": 0
                          }
          
          # === FETCH LIVE MARKET DATA ===
          print("📊 FETCHING LIVE MARKET DATA...")
          
          # ETFs for stock strategies
          etf_symbols = ['SPY', 'QQQ', 'VTI', 'VXUS', 'BND', 'XLF', 'XLK', 'XLE', 'XLI', 'XLU']
          stock_symbols = ['AAPL', 'MSFT', 'NVDA', 'TSLA', 'AMZN', 'GOOGL', 'META', 'NFLX', 'AMD', 'CRM']
          
          market_data = {'ETF': {}, 'STOCK': {}, 'timestamp': datetime.now().isoformat()}
          
          # Fetch ETF data
          for symbol in etf_symbols:
              try:
                  ticker = yf.Ticker(symbol)
                  hist = ticker.history(period='2d')
                  if not hist.empty:
                      current = hist['Close'].iloc[-1]
                      prev = hist['Close'].iloc[-2]
                      change = ((current - prev) / prev) * 100
                      market_data['ETF'][symbol] = {
                          'price': round(current, 2),
                          'change': round(change, 2),
                          'volume': int(hist['Volume'].iloc[-1]),
                          'timestamp': datetime.now().isoformat()
                      }
                      print(f"  {symbol}: ${current:.2f} ({change:+.2f}%)")
              except Exception as e:
                  print(f"  {symbol}: Error - {e}")
          
          # Fetch stock data
          for symbol in stock_symbols:
              try:
                  ticker = yf.Ticker(symbol)
                  hist = ticker.history(period='2d')
                  if not hist.empty:
                      current = hist['Close'].iloc[-1]
                      prev = hist['Close'].iloc[-2]
                      change = ((current - prev) / prev) * 100
                      market_data['STOCK'][symbol] = {
                          'price': round(current, 2),
                          'change': round(change, 2),
                          'volume': int(hist['Volume'].iloc[-1]),
                          'timestamp': datetime.now().isoformat()
                      }
              except Exception as e:
                  pass
          
          # Save market snapshot
          with open('KIMI_RISEOFTHECLAW/data/market_snapshot.json', 'w') as f:
              json.dump(market_data, f, indent=2)
          
          print(f"\n✅ Market data fetched: {len(market_data['ETF'])} ETFs, {len(market_data['STOCK'])} stocks")
          
          # === GENERATE LIVE PICKS ===
          print("\n🎯 GENERATING LIVE PICKS...")
          
          new_picks = []
          
          # TOP 10 STRATEGIES - Priority entries
          top_strategies = [
              ('RSI_Momentum_5', 'crypto', 0.8),
              ('MemeScanner', 'meme', 0.7),
              ('PumpWatch', 'crypto', 0.6),
              ('WhaleAccumulation', 'crypto', 0.7),
              ('MomentumBTC', 'crypto', 0.6),
              ('RSI2_Scalp', 'stock', 0.5),
              ('VolumeSpike', 'stock', 0.6),
              ('TrendSniper', 'stock', 0.5),
              ('NYKillZone', 'forex', 0.4),
              ('BreakoutMomentum', 'stock', 0.5)
          ]
          
          for strat_id, category, entry_prob in top_strategies:
              if strat_id not in live['portfolios']:
                  continue
              
              portfolio = live['portfolios'][strat_id]
              
              # Check if we can enter
              if portfolio['cash'] < 1000:
                  continue
              if len(portfolio['activePicks']) >= 3:  # Max 3 picks per strategy
                  continue
              
              # Simulate entry signal based on market conditions
              if random.random() < entry_prob:
                  # Select symbol based on category
                  if category == 'stock' and market_data['STOCK']:
                      symbol = random.choice(list(market_data['STOCK'].keys()))
                      price = market_data['STOCK'][symbol]['price']
                  elif category == 'meme':
                      symbol = random.choice(['DOGE', 'SHIB', 'PEPE'])
                      price = random.uniform(0.00001, 0.10)
                  else:
                      symbol = random.choice(['BTC', 'ETH', 'SOL'])
                      price = random.choice([48200, 2780, 112])
                  
                  allocation = min(2000, portfolio['cash'])
                  shares = allocation / price if price > 1 else allocation / price
                  
                  pick = {
                      'id': f"{strat_id}_{datetime.now().strftime('%H%M%S')}",
                      'strategy': strat_id,
                      'strategyName': portfolio['name'],
                      'symbol': symbol,
                      'entryPrice': price,
                      'currentPrice': price,
                      'shares': shares,
                      'allocation': allocation,
                      'entryTime': datetime.now().isoformat(),
                      'category': category,
                      'plPercent': 0,
                      'plValue': 0,
                      'status': 'OPEN',
                      'targetPrice': price * 1.15,
                      'stopPrice': price * 0.92
                  }
                  
                  portfolio['activePicks'].append(pick)
                  portfolio['cash'] -= allocation
                  new_picks.append(pick)
                  
                  print(f"  🟢 {portfolio['name']}: ENTERED {symbol} @ ${price:.4f}")
          
          # === UPDATE ALL POSITIONS ===
          print("\n📈 UPDATING POSITION VALUES...")
          
          for strat_id, portfolio in live['portfolios'].items():
              total_equity = 0
              
              for pick in portfolio['activePicks']:
                  # Simulate price movement or use real data
                  if pick['symbol'] in market_data.get('STOCK', {}):
                      pick['currentPrice'] = market_data['STOCK'][pick['symbol']]['price']
                  elif pick['symbol'] in market_data.get('ETF', {}):
                      pick['currentPrice'] = market_data['ETF'][pick['symbol']]['price']
                  else:
                      # Small random movement for crypto/meme
                      movement = random.uniform(-0.8, 1.2)
                      pick['currentPrice'] = pick['entryPrice'] * (1 + movement/100)
                  
                  pick['plPercent'] = ((pick['currentPrice'] - pick['entryPrice']) / pick['entryPrice']) * 100
                  pick['plValue'] = (pick['currentPrice'] - pick['entryPrice']) * pick['shares']
                  total_equity += pick['currentPrice'] * pick['shares']
                  
                  # Check exits
                  if pick['currentPrice'] >= pick['targetPrice']:
                      pick['status'] = 'CLOSED_WIN'
                      pick['exitReason'] = 'TARGET_HIT'
                      portfolio['winCount'] += 1
                      print(f"  ✅ {pick['strategyName']}: {pick['symbol']} TARGET HIT (+{pick['plPercent']:.2f}%)")
                  elif pick['currentPrice'] <= pick['stopPrice']:
                      pick['status'] = 'CLOSED_LOSS'
                      pick['exitReason'] = 'STOP_HIT'
                      portfolio['lossCount'] += 1
                      print(f"  🔴 {pick['strategyName']}: {pick['symbol']} STOP HIT ({pick['plPercent']:.2f}%)")
              
              # Move closed picks
              portfolio['activePicks'] = [p for p in portfolio['activePicks'] if p['status'] == 'OPEN']
              closed = [p for p in portfolio['activePicks'] if p['status'] != 'OPEN']
              portfolio['closedPicks'].extend(closed)
              
              # Update totals
              portfolio['equity'] = total_equity
              portfolio['totalValue'] = portfolio['cash'] + total_equity
              portfolio['return'] = ((portfolio['totalValue'] - 10000) / 10000) * 100
          
          # === RANKINGS ===
          print("\n🏆 CURRENT RANKINGS:")
          ranked = sorted(live['portfolios'].items(), key=lambda x: x[1]['totalValue'], reverse=True)
          
          for i, (strat_id, port) in enumerate(ranked[:15], 1):
              emoji = "🥇" if i == 1 else "🥈" if i == 2 else "🥉" if i == 3 else f"{i:2d}."
              status = "🟢" if port['return'] >= 0 else "🔴"
              active = len(port['activePicks'])
              print(f"{emoji} {status} {port['name']:<25} ${port['totalValue']:>8.2f} ({port['return']:+.2f}%) [{active} picks]")
          
          # Save live state
          live['lastUpdate'] = datetime.now().isoformat()
          live['todaysPicks'] = new_picks
          
          with open('KIMI_RISEOFTHECLAW/data/live_trading_ultimate.json', 'w') as f:
              json.dump(live, f, indent=2)
          
          print(f"\n✅ Trading cycle complete. {len(new_picks)} new picks.")
          print("=" * 70)
          PYEOF
      
      - name: Commit LIVE results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KIMI_RISEOFTHECLAW/data/
          git diff --cached --quiet || (git commit -m "🐾 ULTIMATE Live Trading [$(date -u '+%H:%M UTC')] - 80+ Strategies" && git push origin KIMI_RISEOFTHECLAW)

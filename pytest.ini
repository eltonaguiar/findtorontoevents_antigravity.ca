# Minimal pytest defaults for this monorepo (many tests; run subsets in CI)
[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
addopts = -ra
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration / network tests
    network: marks tests that hit live network endpoints (deselect with '-m "not network"')

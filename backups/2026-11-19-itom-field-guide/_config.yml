title: ServiceNow ITOM Field Guide
description: A source-backed, beginner-friendly field guide to ServiceNow IT Operations Management — Visibility, AIOps, Cloud Accelerate, Agent Client Collector, and the surrounding reliability stack.
theme: jekyll-theme-minimal
show_downloads: false
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter

relative_links:
  enabled: true
  collections: false
markdown: kramdown
highlighter: rouge
permalink: pretty
exclude:
  - .git/
  - .github/
  - scripts/
  - data/
  - README.md
  - research/
  - meta/
  - updates/

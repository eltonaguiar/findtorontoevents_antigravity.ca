# Persona registry — single version-controlled routing index.
# Schema: tools/swarm/agent_personas/ROUTER_ARCHITECTURE.md §3
# The persona MD file remains the system-prompt source of truth; this file is the routing index.
# Both are committed.
version: "1.0.0"
personas:
  - name: race-condition-specialist
    base: critic
    file: race_condition_specialist.md
    trigger_keywords:
      - stopImmediatePropagation
      - stopPropagation
      - mutex
      - capture-phase
      - synthetic click
      - rapid click
      - isTrusted
      - re-entrancy
      - "race condition"
      - "applyFilters"
      - "__active__"
      - "__running__"
      - swallowed
    embedding_text: |
      Concurrency bugs in single-threaded JS that look serial but interleave
      through the event loop. Capture-phase listeners, mutex absence,
      synthetic clicks swallowed by stopImmediatePropagation, global flag
      mutations across multiple async paths, listener registration order.
    handoff_targets:
      - datetime-timezone-specialist
      - react-dom-specialist
      - coordinator-synthesizer
    confidence_floor_for_match: 0.65
    version: 1
    added: 2026-05-04

  - name: datetime-timezone-specialist
    base: critic
    file: datetime_timezone_specialist.md
    trigger_keywords:
      - timezone
      - UTC
      - getMonth
      - getUTCMonth
      - toISOString
      - toDateString
      - "year wrap"
      - "year-wrap"
      - "month boundary"
      - "ISO string"
      - "new Date("
      - padStart
      - "today"
      - "Dec to Jan"
      - "January boundary"
      - isoDateStringToYMD
    embedding_text: |
      Date/time/timezone bugs hiding in Date object usage. UTC vs local,
      ISO-string parsing traps, year-wrap heuristics, month off-by-one
      (0-indexed getMonth), evening-hours "today" drift, multi-day overlap
      checks, reference-date drift inside loops.
    handoff_targets:
      - race-condition-specialist
      - react-dom-specialist
      - coordinator-synthesizer
    confidence_floor_for_match: 0.65
    version: 1
    added: 2026-05-04

  - name: react-dom-specialist
    base: critic
    file: react_dom_specialist.md
    trigger_keywords:
      - MutationObserver
      - "React reconciliation"
      - "inline style"
      - "style.display"
      - "style.visibility"
      - requestAnimationFrame
      - rAF
      - hydration
      - "lazy load"
      - "lazy-load"
      - previousElementSibling
      - "sibling guard"
      - "synthetic event"
      - "background tab"
      - reconcil
      - "_injecting"
    embedding_text: |
      Seam between vanilla-JS DOM mutation and React reconciliation.
      MutationObserver self-loops, inline style overrides reverted on
      re-render, sibling-positional guards breaking on chip injection,
      requestAnimationFrame stalls in background tabs, lazy-load batch
      timing, capture-phase listeners colliding with React synthetic events.
    handoff_targets:
      - race-condition-specialist
      - datetime-timezone-specialist
      - coordinator-synthesizer
    confidence_floor_for_match: 0.65
    version: 1
    added: 2026-05-04


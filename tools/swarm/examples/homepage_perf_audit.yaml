# Homepage performance + filter audit fan-out
#
# Reads the briefing from swarm_runs/briefing_homepage_perf_audit.md and fans
# it across fast cheap engines. ${TS} is substituted to a UTC stamp at run time.
#
# Run:
#   python tools/swarm/swarm_run.py --config tools/swarm/examples/homepage_perf_audit.yaml
#
# Results land in: swarm_runs/run_${TS}/

name: homepage_perf_audit_${TS}
prompt_file: swarm_runs/briefing_homepage_perf_audit.md
out_dir: swarm_runs/run_${TS}
max_parallel: 4
json_strict: false
strictness: lenient

engines:
  - name: deepseek
    model: deepseek-chat
    sampling:
      temperature: 0.1
      max_tokens: 6000
    retries: 2
  - name: xai
    sampling:
      temperature: 0.2
      max_tokens: 5000
  - name: gemini
    json_strict: true
    sampling:
      temperature: 0.1
      max_tokens: 6000
  - name: cerebras
    sampling:
      temperature: 0.2
      max_tokens: 4000
    retries: 1

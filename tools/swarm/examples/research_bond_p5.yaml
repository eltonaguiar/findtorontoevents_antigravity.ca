# Template P5 swarm yaml. Override prompt_file + out_dir per run.

name: research_bond_p5_${TS}
prompt_file: swarm_runs/briefing_research_bond_p5_LATEST.md
out_dir: swarm_runs/research_bond_p5_${TS}
max_parallel: 3
json_strict: true
strictness: strict

engines:
  - name: cerebras
    sampling:
      temperature: 0.2
      max_tokens: 8000
  - name: deepseek
    model: deepseek-chat
    sampling:
      temperature: 0.2
      max_tokens: 8000
  - name: xai
    sampling:
      temperature: 0.2
      max_tokens: 8000

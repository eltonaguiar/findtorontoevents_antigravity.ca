  if(p==='3d') return ['2026-05-19','2026-05-20','2026-05-21'].includes(day);
  if(p==='today') return day==='2026-05-21';
  if(p==='7d') return new Date(day)>=new Date('2026-05-14');
  if(p==='14d') return new Date(day)>=new Date('2026-05-07');
  return true;
}

/* ── RENDER FUNCTIONS ── */

  el.innerHTML=`<h2>&#x1F4CA; Performance Summary — Last 5 Days</h2>
  <div class="tw"><table><tr><td style="color:var(--muted);padding:6px 10px">Total Resolved Trades</td><td style="padding:6px 10px;font-weight:700">${S.total_n}</td></tr>
  <tr><td style="color:var(--muted);padding:6px 10px">Winners</td><td style="padding:6px 10px;font-weight:700" class="pos">${S.total_w} (${fmt(S.overall_wr)}% WR)</td></tr>
  <tr><td style="color:var(--muted);padding:6px 10px">Losers</td><td style="padding:6px 10px;font-weight:700" class="neg">${S.total_l}</td></tr>
  <tr><td style="color:var(--muted);padding:6px 10px">Breakeven</td><td style="padding:6px 10px;font-weight:700">${S.total_be}</td></tr>
  <tr><td style="color:var(--muted);padding:6px 10px">Total PnL</td><td style="padding:6px 10px;font-weight:700" class="${pnlC(S.total_pnl)}">${S.total_pnl>=0?'+':''}${fmt(S.total_pnl)}%</td></tr>
  <tr><td style="color:var(--muted);padding:6px 10px">Avg PnL/Trade</td><td style="padding:6px 10px;font-weight:700" class="${pnlC(S.avg_pnl)}">${S.avg_pnl>=0?'+':''}${fmt(S.avg_pnl)}%</td></tr>

  <tr><td style="color:var(--muted);padding:6px 10px">Profit Factor</td><td style="padding:6px 10px;font-weight:700">${S.total_l>0?fmt(Math.abs(S.total_w*(S.total_pnl/S.total_w)/(S.total_l*(S.total_pnl/S.total_l)||1)),2):'—'}</td></tr>

function rdb() {
  const el=document.getElementById('daybreakdown');
  let h='<h2>&#x1F4C5; Day-by-Day × Asset Class</h2><div class="tw"><table><tr><th>Date</th><th>Asset</th><th>Trades</th><th>W</th><th>L</th><th>BE</th><th>WR</th><th>Total PnL</th><th>Avg PnL</th><th>TP</th><th>SL</th><th>TE</th></tr>';
  const days=[...new Set(Object.keys(dayAC).sort())];
  days.forEach(day=>{
    const acs=dayAC[day];
    if(!acs)return;
    let dayN=0,dayPnl=0;
    Object.keys(acs).forEach(ac=>{dayN+=acs[ac].n;dayPnl+=acs[ac].pnl});
    const dayPct=dayN>0?fmt(dayPnl/dayN):'—';
    let first=true;
    Object.keys(acs).sort().forEach((ac,ai)=>{
      const d=acs[ac];
      const wr=d.n>0?fmt(d.wins/d.n*100):'—';
      h+='<tr>';
      if(ai===0) h+='<td rowspan="'+Object.keys(acs).length+'" style="font-weight:700;vertical-align:top">'+day+'<br><span style="font-size:.7em;color:var(--muted)">avg '+dayPct+'%</span></td>';
      h+='<td><span class="tag '+tc(ac)+'">'+ac+'</span></td><td>'+d.n+'</td><td class="pos">'+d.wins+'</td><td class="neg">'+d.losses+'</td><td>'+d.be+'</td><td>'+wr+'%</td>';
      h+='<td class="'+pnlC(d.pnl)+'">'+(d.pnl>=0?'+':'')+fmt(d.pnl)+'%</td>';
      h+='<td class="'+pnlC(d.pnl/d.n)+'">'+fmt(d.pnl/d.n)+'%</td>';
      h+='<td>'+d.tp+'</td><td class="neg">'+d.sl+'</td><td class="neu">'+d.te+'</td></tr>';
    });
  });
  h+='</table></div>';
  el.innerHTML=h;
}

function rs() {

    c+='<tr><td>'+s.src+'</td><td>'+s.n+'</td><td class="pos">'+s.wins+'</td><td class="neg">'+s.losses+'</td><td>'+fmt(s.wr)+'%</td>';

  c+='</table></div>';

function rsy() {
  const el=document.getElementById('symbols');
  let h='<h2>&#x1F3AF; Top Symbols by Trade Frequency</h2><div class="tw"><table><tr>';
  h+='<th>#</th><th>Symbol</th><th>Class</th><th>Trades</th><th>W</th><th>L</th><th>WR</th><th>Total PnL</th><th>Avg PnL</th><th>TP</th><th>SL</th><th>TE</th><th>Long WR</th><th>Short WR</th><th>Top Source</th></tr>';
  symData.slice(0,25).forEach((s,i)=>{
    const lwr=(s.longW+s.longL)>0?fmt(s.longW/(s.longW+s.longL)*100):'—';
    const swr=(s.shortW+s.shortL)>0?fmt(s.shortW/(s.shortW+s.shortL)*100):'—';
    h+='<tr><td>'+(i+1)+'</td><td><strong>'+s.symbol+'</strong></td><td><span class="tag '+tc(s.ac)+'">'+s.ac+'</span></td>';

    h+='<td class="'+pnlC(s.wr-50)+'">'+fmt(s.wr)+'%</td>';
    h+='<td class="'+pnlC(s.totalPnl)+'">'+(s.totalPnl>=0?'+':'')+fmt(s.totalPnl)+'%</td>';
    h+='<td class="'+pnlC(s.avgPnl)+'">'+(s.avgPnl>=0?'+':'')+fmt(s.avgPnl)+'</td>';
    h+='<td>'+s.tp+'</td><td class="neg">'+s.sl+'</td><td class="neu">'+s.te+'</td>';
    h+='<td>'+lwr+'%</td><td>'+swr+'%</td><td>'+s.topSrc+'</td></tr>';
  });
  h+='</table></div>';
  el.innerHTML=h;
}

function rd() {
  const el=document.getElementById('direction');
  const lt=dirData.filter(d=>d.dir==='LONG').reduce((s,d)=>s+d.n,0);
  const lw=dirData.filter(d=>d.dir==='LONG').reduce((s,d)=>s+d.wins,0);
  const st=dirData.filter(d=>d.dir==='SHORT').reduce((s,d)=>s+d.n,0);
  const sw=dirData.filter(d=>d.dir==='SHORT').reduce((s,d)=>s+d.wins,0);
  const lwr=lt>0?fmt(lw/lt*100):'—';
  const swr=st>0?fmt(sw/st*100):'—';
  const delta=(lt>0&&st>0)?fmt(lw/lt*100-sw/st*100,1):'—';
  let c='<h2>&#x2195; Direction Analysis</h2><div class="sr">';
  c+='<div class="sc grn"><div class="lb">LONG Win Rate</div><div class="vl">'+lwr+'%</div><div class="sb">'+lw+'/'+lt+' trades</div></div>';
  c+='<div class="sc red"><div class="lb">SHORT Win Rate</div><div class="vl">'+swr+'%</div><div class="sb">'+sw+'/'+st+' trades</div></div>';
  c+='<div class="sc amb"><div class="lb">L/S Split</div><div class="vl">'+lt+'/'+st+'</div><div class="sb">trade count</div></div>';
  c+='<div class="sc pur"><div class="lb">Edge Delta</div><div class="vl">'+delta+'pp</div><div class="sb">LONG vs SHORT</div></div>';
  c+='</div>';
  c+='<div class="tw"><table><tr><th>Date</th><th>Direction</th><th>Trades</th><th>W</th><th>L</th><th>WR</th></tr>';
  dirData.forEach(d=>{
    const cc=d.dir==='LONG'?'pos':'neg';
    c+='<tr><td>'+d.day+'</td><td class="'+cc+'">'+d.dir+'</td><td>'+d.n+'</td><td class="pos">'+d.wins+'</td><td class="neg">'+d.losses+'</td><td class="'+pnlC(d.wr-50)+'">'+fmt(d.wr)+'%</td></tr>';
  });
  c+='</table></div>';
  el.innerHTML=c;
}

function rex() {
  const el=document.getElementById('exits');
  const total=Object.values(exitData).reduce((s,v)=>s+v,0);
  const pnlR={};
  allPicks.forEach(p=>{if(!pnlR[p.reason])pnlR[p.reason]=0; pnlR[p.reason]+=p.pnl});
  let c='<h2>&#x1F51A; Exit Reasons</h2><div class="sr">';
  [{k:'TP_HIT',l:'TP Hit',cc:'grn'},{k:'SL_HIT',l:'SL Hit',cc:'red'},{k:'TIME_EXIT',l:'Time Exit',cc:'cyn'}].forEach(r=>{
    const v=exitData[r.k]||0;
    c+='<div class="sc '+r.cc+'"><div class="lb">'+r.l+'</div><div class="vl">'+v+'</div><div class="sb">'+(total>0?fmt(v/total*100):0)+'% of exits</div></div>';
  });
  c+='</div><h3>PnL by Exit Reason</h3><div class="tw"><table><tr><th>Reason</th><th>Count</th><th>%</th><th>Total PnL</th><th>Avg PnL</th></tr>';
  [{k:'TP_HIT',l:'TP Hit'},{k:'SL_HIT',l:'SL Hit'},{k:'TIME_EXIT',l:'Time Exit'}].forEach(r=>{
    const v=exitData[r.k]||0;
    const pnl=pnlR[r.k]||0;
    const avg=v>0?pnl/v:0;
    c+='<tr><td>'+r.l+'</td><td>'+v+'</td><td>'+fmt(v/total*100)+'%</td>';
    c+='<td class="'+pnlC(pnl)+'">'+(pnl>=0?'+':'')+fmt(pnl)+'%</td>';
    c+='<td class="'+pnlC(avg)+'">'+(avg>=0?'+':'')+fmt(avg)+'%</td></tr>';
  });
  c+='</table></div>';
  el.innerHTML=c;
}

function rh() {
  const el=document.getElementById('health');
  let h='<h2>&#x1F3E5; Asset Class Health</h2><div class="tw"><table><tr>';
  h+='<th>Asset Class</th><th>Status</th><th>Active</th><th>Smart</th><th>Avg Score</th><th>Fwd WR</th><th>P/F</th><th>Min Score</th><th>Min WR</th><th>Pass</th></tr>';
  acHealth.forEach(hh=>{
    const sc=hh.status.includes('T1')||hh.status.includes('T2')?'pos':hh.status.includes('Dead')||hh.status.includes('Sub')?'neg':'';
    h+='<tr><td><span class="tag '+tc(hh.ac)+'">'+hh.ac+'</span></td><td class="'+sc+'">'+hh.status+'</td><td>'+hh.active+'</td><td>'+hh.smart+'</td>';
    h+='<td>'+fmt(hh.avgScore)+'</td><td>'+fmt(hh.fwdWR)+'%</td><td>'+fmt(hh.pf,2)+'</td>';
    h+='<td>'+hh.minScore+'</td><td>'+fmt(hh.minWR)+'%</td><td>'+(hh.pass?'&#x2705;':'&#x274C;')+'</td></tr>';
  });
  h+='</table></div>';
  el.innerHTML=h;
}

function rdet() {
  const el=document.getElementById('detail');
  let f=[...allPicks];
  if(fs.asset!=='ALL') f=f.filter(p=>p.ac===fs.asset);
  if(fs.dir!=='ALL') f=f.filter(p=>p.dir===fs.dir);
  if(fs.source!=='ALL') f=f.filter(p=>p.src===fs.source);
  f=f.filter(p=>inPeriod(p.day,fs.period));
  switch(fs.sort){
    case 'pnl-d': f.sort((a,b)=>b.pnl-a.pnl); break;
    case 'pnl-a': f.sort((a,b)=>a.pnl-b.pnl); break;
    case 'wr': f.sort((a,b)=>b.wr-a.wr); break;
    case 'cnt': f.sort((a,b)=>b.count-a.count); break;
    case 'sym': f.sort((a,b)=>a.symbol.localeCompare(b.symbol)); break;
  }
  let h=`<h2>&#x1F4DC; Resolved Picks <span id="dc">(${f.length} trades)</span></h2><div class="tw"><table><tr>`;
  h+='<th>Date</th><th>Symbol</th><th>Class</th><th>Dir</th><th>Entry</th><th>Exit</th><th>PnL %</th><th>Reason</th><th>Source</th></tr>';
  f.slice(0,500).forEach(p=>{
    h+='<tr><td>'+p.day+'</td><td><strong>'+p.symbol+'</strong></td><td><span class="tag '+tc(p.ac)+'">'+p.ac+'</span></td>';
    h+='<td>'+p.dir+'</td><td>'+fmt(p.entry,4)+'</td><td>'+fmt(p.exit,4)+'</td>';
    h+='<td class="'+pnlC(p.pnl)+'">'+(p.pnl>=0?'+':'')+fmt(p.pnl,2)+'%</td>';
    h+='<td>'+p.reason+'</td><td>'+p.src+'</td></tr>';
  });
  h+='</table></div>';
  el.innerHTML=h;
}

function run(){ro();rdb();rs();rsy();rd();rex();rh();rdet();}
function popSrc(){
  const sel=document.getElementById('srcSel');
  [...new Set(srcData.map(s=>s.src))].sort().forEach(s=>{
    const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);
  });
}

document.addEventListener('DOMContentLoaded',()=>{
  document.querySelector('.dt').textContent='Generated: 2026-05-21 16:26 UTC';
  popSrc();
  run();
});
</script>
